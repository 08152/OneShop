name: Build MSI

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App Name"
        required: true
        default: "Meine Website"

      website_url:
        description: "Website URL"
        required: true
        default: "https://example.com"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Electron-Projekt erstellen
        shell: pwsh
        env:
          APP_NAME: ${{ inputs.app_name }}
          WEBSITE_URL: ${{ inputs.website_url }}
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path build | Out-Null

          $safeName = $env:APP_NAME.Trim()

          if ([string]::IsNullOrWhiteSpace($safeName)) {
            $safeName = "Meine Website"
          }

          $targetUrl = $env:WEBSITE_URL.Trim()

          try {
            $uri = [System.Uri]$targetUrl
          }
          catch {
            throw "Ungültige Website-URL."
          }

          if ($uri.Scheme -ne "https" -and $uri.Scheme -ne "http") {
            throw "Nur http:// und https:// URLs sind erlaubt."
          }

          if (-not (Test-Path "1.ico")) {
            throw "1.ico wurde im Repository nicht gefunden."
          }

          Copy-Item "1.ico" "build/1.ico" -Force

          $safeJsonName = $safeName.Replace('\','\\').Replace('"','\"')

          $package = @"
          {
            "name": "website-wrapper",
            "version": "1.0.0",
            "description": "Website application",
            "author": "08152",
            "main": "main.js",
            "private": true,
            "scripts": {
              "start": "electron .",
              "dist": "electron-builder --win msi"
            },
            "devDependencies": {
              "electron": "38.2.0",
              "electron-builder": "26.0.12"
            },
            "build": {
              "productName": "$safeJsonName",
              "appId": "com.websitewrapper.app",
              "directories": {
                "output": "dist"
              },
              "files": [
                "main.js",
                "1.ico"
              ],
              "win": {
                "icon": "1.ico",
                "target": [
                  {
                    "target": "msi",
                    "arch": [
                      "x64"
                    ]
                  }
                ]
              }
            }
          }
          "@

          Set-Content `
            -Path "build/package.json" `
            -Value $package `
            -Encoding UTF8

          $safeUrl = $targetUrl.Replace('\','\\').Replace('"','\"')

          $main = @"
          const { app, BrowserWindow, session } = require("electron");

          const TARGET_URL = "$safeUrl";

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              minWidth: 800,
              minHeight: 600,
              backgroundColor: "#000000",
              autoHideMenuBar: true,
              icon: __dirname + "/1.ico",

              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                sandbox: true,
                webSecurity: true
              }
            });

            win.loadURL(TARGET_URL);

            win.webContents.setWindowOpenHandler(({ url }) => {
              if (
                url.startsWith("https://") ||
                url.startsWith("http://")
              ) {
                win.loadURL(url);
              }

              return { action: "deny" };
            });
          }

          app.whenReady().then(() => {

            session.defaultSession.setPermissionRequestHandler(
              (webContents, permission, callback) => {
                callback(false);
              }
            );

            createWindow();

            app.on("activate", () => {
              if (BrowserWindow.getAllWindows().length === 0) {
                createWindow();
              }
            });
          });

          app.on("window-all-closed", () => {
            if (process.platform !== "darwin") {
              app.quit();
            }
          });
          "@

          Set-Content `
            -Path "build/main.js" `
            -Value $main `
            -Encoding UTF8

      - name: Abhängigkeiten installieren
        working-directory: build
        run: npm install

      - name: MSI erstellen
        working-directory: build
        run: npm run dist

      - name: MSI hochladen
        uses: actions/upload-artifact@v4
        with:
          name: MSI
          path: build/dist/*.msi
          if-no-files-found: error
