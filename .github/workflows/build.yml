name: Build MSI

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App Name"
        required: true
        default: "Meine Website"

      website_url:
        description: "Website URL"
        required: true
        default: "https://example.com"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Icon prüfen
        shell: pwsh
        run: |
          if (-not (Test-Path "1.ico")) {
            throw "FEHLER: 1.ico wurde nicht im Repository gefunden."
          }

          Write-Host "1.ico gefunden."

      - name: Electron-Projekt erstellen
        shell: pwsh
        env:
          APP_NAME: ${{ inputs.app_name }}
          WEBSITE_URL: ${{ inputs.website_url }}
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path build | Out-Null

          $safeName = $env:APP_NAME.Trim()

          if ([string]::IsNullOrWhiteSpace($safeName)) {
            $safeName = "Meine Website"
          }

          $targetUrl = $env:WEBSITE_URL.Trim()

          try {
            $uri = [System.Uri]$targetUrl
          }
          catch {
            throw "Ungültige URL."
          }

          if ($uri.Scheme -ne "https" -and $uri.Scheme -ne "http") {
            throw "Nur HTTP und HTTPS sind erlaubt."
          }

          if ($uri.UserInfo) {
            throw "URLs mit Benutzername oder Passwort sind nicht erlaubt."
          }

          Copy-Item "1.ico" "build/1.ico" -Force

          $jsonName = $safeName.Replace('\','\\').Replace('"','\"')
          $jsonUrl = $targetUrl.Replace('\','\\').Replace('"','\"')

          $package = @"
          {
            "name": "website-wrapper",
            "version": "1.0.0",
            "description": "Website application",
            "author": "08152",
            "private": true,
            "main": "main.js",
            "scripts": {
              "start": "electron .",
              "dist": "electron-builder --win msi"
            },
            "devDependencies": {
              "electron": "38.2.0",
              "electron-builder": "26.0.12"
            },
            "build": {
              "productName": "$jsonName",
              "appId": "com.websitewrapper.app",
              "directories": {
                "output": "dist"
              },
              "files": [
                "main.js",
                "1.ico"
              ],
              "win": {
                "icon": "1.ico",
                "target": [
                  {
                    "target": "msi",
                    "arch": [
                      "x64"
                    ]
                  }
                ]
              }
            }
          }
          "@

          Set-Content `
            -Path "build/package.json" `
            -Value $package `
            -Encoding UTF8

          $main = @"
          const {
            app,
            BrowserWindow,
            session
          } = require("electron");

          const TARGET_URL = "$jsonUrl";

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              minWidth: 800,
              minHeight: 600,
              backgroundColor: "#000000",
              autoHideMenuBar: true,
              icon: __dirname + "/1.ico",

              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                sandbox: true,
                webSecurity: true
              }
            });

            win.loadURL(TARGET_URL);

            win.webContents.setWindowOpenHandler(({ url }) => {
              if (
                url.startsWith("https://") ||
                url.startsWith("http://")
              ) {
                win.loadURL(url);
              }

              return {
                action: "deny"
              };
            });
          }

          app.whenReady().then(() => {

            session.defaultSession.setPermissionRequestHandler(
              (webContents, permission, callback) => {
                callback(false);
              }
            );

            createWindow();

            app.on("activate", () => {
              if (
                BrowserWindow.getAllWindows().length === 0
              ) {
                createWindow();
              }
            });
          });

          app.on("window-all-closed", () => {
            if (process.platform !== "darwin") {
              app.quit();
            }
          });
          "@

          Set-Content `
            -Path "build/main.js" `
            -Value $main `
            -Encoding UTF8

      - name: Electron herunterladen und installieren
        working-directory: build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $maxAttempts = 5

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {

            Write-Host ""
            Write-Host "========================================="
            Write-Host "Installationsversuch $attempt von $maxAttempts"
            Write-Host "========================================="
            Write-Host ""

            Remove-Item `
              -Recurse `
              -Force `
              node_modules `
              -ErrorAction SilentlyContinue

            Remove-Item `
              -Force `
              package-lock.json `
              -ErrorAction SilentlyContinue

            npm cache verify

            npm install --no-audit --no-fund

            if ($LASTEXITCODE -eq 0) {
              Write-Host ""
              Write-Host "Installation erfolgreich."
              exit 0
            }

            if ($attempt -lt $maxAttempts) {
              Write-Host ""
              Write-Host "Installation fehlgeschlagen."
              Write-Host "Warte 15 Sekunden und versuche es erneut..."
              Start-Sleep -Seconds 15
            }
          }

          throw "Electron konnte nach $maxAttempts Versuchen nicht installiert werden."

      - name: MSI erstellen
        working-directory: build
        shell: pwsh
        run: |
          npm run dist

          if ($LASTEXITCODE -ne 0) {
            throw "MSI-Build fehlgeschlagen."
          }

      - name: MSI prüfen
        shell: pwsh
        run: |
          $files = Get-ChildItem "build/dist/*.msi" -ErrorAction SilentlyContinue

          if ($files.Count -eq 0) {
            throw "Keine MSI-Datei gefunden."
          }

          foreach ($file in $files) {
            Write-Host "MSI gefunden:"
            Write-Host $file.FullName
            Write-Host "Größe: $($file.Length) Bytes"
          }

      - name: MSI hochladen
        uses: actions/upload-artifact@v4
        with:
          name: MSI
          path: build/dist/*.msi
          if-no-files-found: error
