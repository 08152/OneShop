<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Ghost 3D Editor</title>
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<div id="topbar">

    <div class="logo">GHOST 3D</div>

    <div class="shape-menu">

        <button id="addSphere" class="shape-btn">
            <span class="icon sphere"></span>
            Kugel
        </button>

        <button id="addCube" class="shape-btn">
            <span class="icon cube"></span>
            Würfel
        </button>

        <button id="addCylinder" class="shape-btn">
            <span class="icon cylinder"></span>
            Zylinder
        </button>

        <div class="separator"></div>

        <button id="addNegativeSphere" class="shape-btn negative">
            <span class="icon negative-sphere"></span>
            − Kugel
        </button>

        <button id="addNegativeCube" class="shape-btn negative">
            <span class="icon negative-cube"></span>
            − Würfel
        </button>

        <button id="addNegativeCylinder" class="shape-btn negative">
            <span class="icon negative-cylinder"></span>
            − Zylinder
        </button>

    </div>

    <div class="transform-menu">

        <button id="moveMode" class="mode-btn active">
            ↔ Move
        </button>

        <button id="rotateMode" class="mode-btn">
            ↻ Rotate
        </button>

        <button id="scaleMode" class="mode-btn">
            ▣ Größe
        </button>

    </div>

    <button id="homeBtn" class="normal-btn">
        ⌂ Home
    </button>

    <button id="plateBtn" class="plate-btn">
        + Platte
    </button>

    <button id="downloadBtn" class="download-btn">
        ↓ GLB
    </button>

</div>


<div id="rightbar">

    <h3>PINSEL</h3>

    <button class="brush active" data-size="0.08">
        <span class="brush-dot tiny"></span>
        Fein
    </button>

    <button class="brush" data-size="0.25">
        <span class="brush-dot small"></span>
        Kleiner
    </button>

    <button class="brush" data-size="0.60">
        <span class="brush-dot large"></span>
        Groß
    </button>

    <div class="separator-line"></div>

    <h3>MODELLIEREN</h3>

    <button id="raiseBtn" class="tool-btn">
        ▲ Erhöhen
    </button>

    <button id="lowerBtn" class="tool-btn">
        ▼ Senken
    </button>

    <button id="smoothBtn" class="tool-btn">
        ≈ Glätten
    </button>

    <p class="hint">
        Beim Modellieren bleibt<br>
        das Objekt an seiner Position.
    </p>

    <div class="separator-line"></div>

    <h3>PLATTEN</h3>

    <div id="plates"></div>

    <div class="separator-line"></div>

    <button id="deleteObject" class="tool-btn danger">
        Objekt löschen
    </button>

    <button id="deletePlate" class="tool-btn danger">
        Platte löschen
    </button>

</div>


<div id="dimensions">

    <div id="objectName">
        Kein Objekt ausgewählt
    </div>

    <div id="plateName">
        Keine Platte
    </div>

    <div class="size-row">

        <div>
            <small>BREITE</small>
            <strong id="width">0 mm</strong>
        </div>

        <div>
            <small>HÖHE</small>
            <strong id="height">0 mm</strong>
        </div>

        <div>
            <small>TIEFE</small>
            <strong id="depth">0 mm</strong>
        </div>

    </div>

    <div id="pointCount">
        0 Punkte
    </div>

</div>


<div id="mouseCircle"></div>


<div id="status">
    Objekt auswählen
</div>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    TransformControls
} from "three/addons/controls/TransformControls.js";

import {
    GLTFExporter
} from "three/addons/exporters/GLTFExporter.js";


/* =====================================================
   GRUNDVARIABLEN
===================================================== */

let scene;
let camera;
let renderer;

let orbit;
let transform;

let raycaster;
let mouse;

let selectedObject = null;
let selectedPlate = null;

let mode = "translate";

let brushSize = 0.08;
let sculptMode = "raise";

let sculpting = false;
let pointerLocked = false;

const objects = [];
const plates = [];


/* =====================================================
   MATERIALIEN
===================================================== */

const normalMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x6d7d91,
        roughness: 0.55,
        metalness: 0.12
    });


const negativeMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xff425b,
        transparent: true,
        opacity: 0.42,
        roughness: 0.45
    });


const plateMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x252a31,
        roughness: 0.8
    });


/* =====================================================
   START
===================================================== */

init();


function init() {

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x101318);

    scene.fog =
        new THREE.Fog(
            0x101318,
            20,
            100
        );


    camera =
        new THREE.PerspectiveCamera(
            55,
            innerWidth / innerHeight,
            0.01,
            300
        );

    camera.position.set(
        8,
        7,
        9
    );


    renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: "high-performance"
        });

    renderer.setPixelRatio(
        Math.min(devicePixelRatio, 2)
    );

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.shadowMap.enabled = true;

    document.body.appendChild(
        renderer.domElement
    );


    orbit =
        new OrbitControls(
            camera,
            renderer.domElement
        );

    orbit.enableDamping = true;

    orbit.dampingFactor = 0.08;

    orbit.enablePan = true;

    orbit.zoomSpeed = 0.35;

    orbit.minDistance = 2;

    orbit.maxDistance = 60;


    transform =
        new TransformControls(
            camera,
            renderer.domElement
        );

    transform.setMode("translate");

    transform.setSize(1.15);

    scene.add(
        transform.getHelper()
    );


    transform.addEventListener(
        "mouseDown",
        () => {
            orbit.enabled = false;
        }
    );


    transform.addEventListener(
        "mouseUp",
        () => {
            orbit.enabled = true;
            updateInfo();
        }
    );


    transform.addEventListener(
        "objectChange",
        updateInfo
    );


    raycaster =
        new THREE.Raycaster();

    mouse =
        new THREE.Vector2();


    createLights();

    createGround();

    createPlate();


    setupUI();


    renderer.domElement.addEventListener(
        "pointerdown",
        selectFromMouse
    );


    renderer.domElement.addEventListener(
        "pointermove",
        sculptMove
    );


    renderer.domElement.addEventListener(
        "pointerdown",
        startSculpt
    );


    window.addEventListener(
        "pointerup",
        stopSculpt
    );


    window.addEventListener(
        "resize",
        resize
    );


    animate();

}


/* =====================================================
   LICHT
===================================================== */

function createLights() {

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x303030,
            2.4
        );

    scene.add(ambient);


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    sun.position.set(
        7,
        12,
        7
    );

    sun.castShadow = true;

    scene.add(sun);

}


/* =====================================================
   BODEN
===================================================== */

function createGround() {

    const ground =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                100,
                100
            ),

            new THREE.MeshStandardMaterial({
                color: 0x11151b,
                roughness: 1
            })

        );


    ground.rotation.x =
        -Math.PI / 2;

    ground.position.y =
        -0.15;

    scene.add(ground);


    const grid =
        new THREE.GridHelper(
            100,
            100,
            0x555b64,
            0x292e35
        );

    grid.position.y =
        -0.14;

    scene.add(grid);

}


/* =====================================================
   PLATTE
===================================================== */

function createPlate() {

    const plate =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                8,
                0.2,
                8
            ),

            plateMaterial.clone()

        );


    const index =
        plates.length;


    plate.position.set(
        (index % 3) * 10 - 10,
        0,
        Math.floor(index / 3) * 10
    );


    plate.userData.isPlate = true;

    plate.userData.name =
        "Platte " + (index + 1);

    plate.userData.objects = [];


    scene.add(plate);

    plates.push(plate);

    selectPlate(plate);

    updatePlateList();

}


/* =====================================================
   OBJEKTE
===================================================== */

function addObject(
    type,
    negative = false
) {

    if (!selectedPlate)
        createPlate();


    let geometry;


    if (type === "sphere") {

        geometry =
            new THREE.SphereGeometry(
                1.3,
                32,
                32
            );

    }


    if (type === "cube") {

        geometry =
            new THREE.BoxGeometry(
                2,
                2,
                2,
                20,
                20,
                20
            );

    }


    if (type === "cylinder") {

        geometry =
            new THREE.CylinderGeometry(
                1.1,
                1.1,
                2.5,
                32,
                32
            );

    }


    const mesh =
        new THREE.Mesh(
            geometry,
            negative
                ? negativeMaterial.clone()
                : normalMaterial.clone()
        );


    mesh.position.set(
        selectedPlate.position.x,
        1.3,
        selectedPlate.position.z
    );


    mesh.castShadow = true;

    mesh.receiveShadow = true;


    mesh.userData.negative =
        negative;

    mesh.userData.plate =
        selectedPlate;

    mesh.userData.name =
        negative
            ? "Negativ " + type
            : type;


    scene.add(mesh);

    objects.push(mesh);

    selectedPlate.userData.objects.push(mesh);


    selectObject(mesh);

}


/* =====================================================
   AUSWAHL
===================================================== */

function selectFromMouse(event) {

    if (
        sculpting ||
        transform.dragging
    )
        return;


    const rect =
        renderer.domElement.getBoundingClientRect();


    mouse.x =
        ((event.clientX - rect.left) /
        rect.width) * 2 - 1;


    mouse.y =
        -((event.clientY - rect.top) /
        rect.height) * 2 + 1;


    raycaster.setFromCamera(
        mouse,
        camera
    );


    const hits =
        raycaster.intersectObjects(
            objects,
            false
        );


    if (hits.length) {

        const object =
            hits[0].object;

        selectPlate(
            object.userData.plate
        );

        selectObject(object);

        return;
    }


    const plateHits =
        raycaster.intersectObjects(
            plates,
            false
        );


    if (plateHits.length) {

        selectPlate(
            plateHits[0].object
        );

        return;
    }


    selectObject(null);

}


function selectObject(object) {

    selectedObject =
        object || null;


    transform.detach();


    if (selectedObject) {

        transform.attach(
            selectedObject
        );

        transform.setMode(
            mode
        );

        setStatus(
            "Objekt ausgewählt"
        );

    }
    else {

        setStatus(
            "Objekt auswählen"
        );

    }


    updateInfo();

}


/* =====================================================
   PLATTE AUSWÄHLEN
===================================================== */

function selectPlate(plate) {

    if (!plate)
        return;


    plates.forEach(
        p => {
            p.material.color.set(
                p === plate
                    ? 0x315e93
                    : 0x252a31
            );
        }
    );


    selectedPlate =
        plate;


    updatePlateList();

    updateInfo();

}


/* =====================================================
   UI
===================================================== */

function setupUI() {

    addButton(
        "addSphere",
        () => addObject("sphere")
    );

    addButton(
        "addCube",
        () => addObject("cube")
    );

    addButton(
        "addCylinder",
        () => addObject("cylinder")
    );

    addButton(
        "addNegativeSphere",
        () => addObject("sphere", true)
    );

    addButton(
        "addNegativeCube",
        () => addObject("cube", true)
    );

    addButton(
        "addNegativeCylinder",
        () => addObject("cylinder", true)
    );


    addButton(
        "plateBtn",
        createPlate
    );


    addButton(
        "moveMode",
        () => setTransformMode("translate")
    );

    addButton(
        "rotateMode",
        () => setTransformMode("rotate")
    );

    addButton(
        "scaleMode",
        () => setTransformMode("scale")
    );


    addButton(
        "homeBtn",
        focusSelected
    );


    addButton(
        "downloadBtn",
        downloadPlate
    );


    addButton(
        "raiseBtn",
        () => sculptMode = "raise"
    );

    addButton(
        "lowerBtn",
        () => sculptMode = "lower"
    );

    addButton(
        "smoothBtn",
        () => sculptMode = "smooth"
    );


    addButton(
        "deleteObject",
        deleteObject
    );

    addButton(
        "deletePlate",
        deletePlate
    );


    document
        .querySelectorAll(".brush")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(".brush")
                        .forEach(
                            b =>
                                b.classList.remove(
                                    "active"
                                )
                        );

                    button.classList.add(
                        "active"
                    );

                    brushSize =
                        Number(
                            button.dataset.size
                        );

                }
            );

        });


    /*
       Pointer Lock:
       Doppelklick in die Szene aktiviert
       den blauen Maus-Kreis.
    */

    renderer.domElement.addEventListener(
        "dblclick",
        () => {

            renderer.domElement
                .requestPointerLock();

        }
    );


    document.addEventListener(
        "pointerlockchange",
        () => {

            pointerLocked =
                document.pointerLockElement ===
                renderer.domElement;

            document
                .getElementById("mouseCircle")
                .classList.toggle(
                    "visible",
                    pointerLocked
                );

        }
    );

}


function addButton(id, fn) {

    document
        .getElementById(id)
        .addEventListener(
            "click",
            fn
        );

}


/* =====================================================
   TRANSFORM
===================================================== */

function setTransformMode(newMode) {

    mode =
        newMode;


    transform.setMode(
        newMode
    );


    document
        .querySelectorAll(".mode-btn")
        .forEach(
            b =>
                b.classList.remove(
                    "active"
                )
        );


    if (newMode === "translate")
        document
            .getElementById("moveMode")
            .classList.add("active");


    if (newMode === "rotate")
        document
            .getElementById("rotateMode")
            .classList.add("active");


    if (newMode === "scale")
        document
            .getElementById("scaleMode")
            .classList.add("active");

}


/* =====================================================
   MODELLIEREN
===================================================== */

function startSculpt(event) {

    if (
        !selectedObject ||
        transform.dragging
    )
        return;


    if (
        !event.shiftKey
    )
        return;


    sculpting = true;

    orbit.enabled = false;

    transform.detach();

    sculptAt(event);

}


function stopSculpt() {

    if (!sculpting)
        return;


    sculpting = false;

    orbit.enabled = true;

    if (selectedObject)
        transform.attach(
            selectedObject
        );

}


function sculptMove(event) {

    if (!sculpting)
        return;


    sculptAt(event);

}


function sculptAt(event) {

    if (!selectedObject)
        return;


    const rect =
        renderer.domElement
            .getBoundingClientRect();


    mouse.x =
        ((event.clientX - rect.left) /
        rect.width) * 2 - 1;


    mouse.y =
        -((event.clientY - rect.top) /
        rect.height) * 2 + 1;


    raycaster.setFromCamera(
        mouse,
        camera
    );


    const hit =
        raycaster.intersectObject(
            selectedObject,
            false
        );


    if (!hit.length)
        return;


    const localPoint =
        selectedObject.worldToLocal(
            hit[0].point.clone()
        );


    const position =
        selectedObject.geometry
            .getAttribute("position");


    const normal =
        hit[0].face.normal.clone();


    for (
        let i = 0;
        i < position.count;
        i++
    ) {

        const vertex =
            new THREE.Vector3();

        vertex.fromBufferAttribute(
            position,
            i
        );


        const distance =
            vertex.distanceTo(
                localPoint
            );


        if (
            distance >
            brushSize
        )
            continue;


        const strength =
            1 -
            distance / brushSize;


        const amount =
            strength *
            strength *
            0.025;


        if (
            sculptMode ===
            "raise"
        ) {

            vertex.add(
                normal.clone()
                    .multiplyScalar(amount)
            );

        }


        if (
            sculptMode ===
            "lower"
        ) {

            vertex.add(
                normal.clone()
                    .multiplyScalar(-amount)
            );

        }


        if (
            sculptMode ===
            "smooth"
        ) {

            vertex.multiplyScalar(
                1 - amount * 0.2
            );

        }


        position.setXYZ(
            i,
            vertex.x,
            vertex.y,
            vertex.z
        );

    }


    position.needsUpdate = true;

    selectedObject.geometry
        .computeVertexNormals();

    selectedObject.geometry
        .computeBoundingSphere();


    updateInfo();

}


/* =====================================================
   HOME
===================================================== */

function focusSelected() {

    let target;


    if (selectedObject) {

        const box =
            new THREE.Box3()
                .setFromObject(
                    selectedObject
                );

        target =
            box.getCenter(
                new THREE.Vector3()
            );

    }
    else if (selectedPlate) {

        target =
            selectedPlate.position.clone();

    }
    else {

        target =
            new THREE.Vector3();

    }


    const direction =
        new THREE.Vector3(
            1,
            0.65,
            1
        ).normalize();


    camera.position.copy(
        target.clone().add(
            direction.multiplyScalar(
                selectedObject
                    ? 5
                    : 9
            )
        )
    );


    orbit.target.copy(
        target
    );

    orbit.update();

}


/* =====================================================
   INFO / MM
===================================================== */

function updateInfo() {

    document.getElementById(
        "plateName"
    ).textContent =
        selectedPlate
            ? selectedPlate.userData.name
            : "Keine Platte";


    if (!selectedObject) {

        document.getElementById(
            "objectName"
        ).textContent =
            "Kein Objekt ausgewählt";

        document.getElementById(
            "width"
        ).textContent =
            "0 mm";

        document.getElementById(
            "height"
        ).textContent =
            "0 mm";

        document.getElementById(
            "depth"
        ).textContent =
            "0 mm";

        document.getElementById(
            "pointCount"
        ).textContent =
            "0 Punkte";

        return;
    }


    selectedObject.updateMatrixWorld(
        true
    );


    const box =
        new THREE.Box3()
            .setFromObject(
                selectedObject
            );


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    /*
       1 Three.js Einheit = 10 mm.
    */

    const mm = 10;


    document.getElementById(
        "objectName"
    ).textContent =
        selectedObject.userData.name;


    document.getElementById(
        "width"
    ).textContent =
        (size.x * mm).toFixed(1)
        + " mm";


    document.getElementById(
        "height"
    ).textContent =
        (size.y * mm).toFixed(1)
        + " mm";


    document.getElementById(
        "depth"
    ).textContent =
        (size.z * mm).toFixed(1)
        + " mm";


    document.getElementById(
        "pointCount"
    ).textContent =
        selectedObject.geometry
            .getAttribute("position")
            .count
        + " Punkte";

}


/* =====================================================
   PLATTENLISTE
===================================================== */

function updatePlateList() {

    const list =
        document.getElementById(
            "plates"
        );


    list.innerHTML = "";


    plates.forEach(
        plate => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "plate-list";


            if (
                plate === selectedPlate
            )
                button.classList.add(
                    "active"
                );


            button.textContent =
                plate.userData.name;


            button.onclick =
                () => {

                    selectPlate(
                        plate
                    );

                    focusSelected();

                };


            list.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   LÖSCHEN
===================================================== */

function deleteObject() {

    if (!selectedObject)
        return;


    const object =
        selectedObject;


    const index =
        objects.indexOf(
            object
        );


    if (index >= 0)
        objects.splice(
            index,
            1
        );


    const list =
        object.userData
            .plate
            .userData
            .objects;


    const objectIndex =
        list.indexOf(object);


    if (objectIndex >= 0)
        list.splice(
            objectIndex,
            1
        );


    transform.detach();

    scene.remove(object);

    object.geometry.dispose();

    object.material.dispose();


    selectedObject = null;

    updateInfo();

}


function deletePlate() {

    if (
        !selectedPlate ||
        plates.length <= 1
    )
        return;


    selectedPlate
        .userData
        .objects
        .slice()
        .forEach(
            object => {

                const index =
                    objects.indexOf(
                        object
                    );

                if (index >= 0)
                    objects.splice(
                        index,
                        1
                    );

                scene.remove(
                    object
                );

                object.geometry.dispose();

                object.material.dispose();

            }
        );


    const index =
        plates.indexOf(
            selectedPlate
        );


    if (index >= 0)
        plates.splice(
            index,
            1
        );


    scene.remove(
        selectedPlate
    );

    selectedPlate.geometry.dispose();

    selectedPlate.material.dispose();


    selectedPlate =
        plates[0];


    selectPlate(
        selectedPlate
    );

    selectObject(null);

}


/* =====================================================
   GLB
===================================================== */

async function downloadPlate() {

    if (!selectedPlate) {

        alert(
            "Bitte zuerst eine Platte auswählen."
        );

        return;

    }


    const exportScene =
        new THREE.Scene();


    const group =
        new THREE.Group();


    group.name =
        selectedPlate.userData.name;


    /*
       Nur die gewählte Platte.
    */

    const plate =
        selectedPlate.clone(true);


    plate.material =
        new THREE.MeshStandardMaterial({
            color: 0x777777,
            roughness: 0.8
        });


    group.add(plate);


    /*
       Nur deren Objekte.
    */

    selectedPlate.userData.objects
        .forEach(object => {

            const clone =
                object.clone(true);


            clone.material =
                new THREE.MeshStandardMaterial({

                    color:
                        object.userData.negative
                            ? 0xff4055
                            : 0x7188aa,

                    roughness: 0.55

                });


            group.add(clone);

        });


    exportScene.add(group);


    const exporter =
        new GLTFExporter();


    try {

        const data =
            await exporter.parseAsync(
                exportScene,
                {
                    binary: true,
                    onlyVisible: true
                }
            );


        const blob =
            new Blob(
                [data],
                {
                    type:
                        "model/gltf-binary"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href = url;

        a.download =
            selectedPlate.userData.name
            .replace(
                /[^a-z0-9]/gi,
                "_"
            )
            + ".glb";


        document.body.appendChild(a);

        a.click();

        a.remove();


        setTimeout(
            () =>
                URL.revokeObjectURL(
                    url
                ),
            1000
        );

    }
    catch(error) {

        console.error(error);

        alert(
            "GLB-Export konnte nicht erstellt werden."
        );

    }

}


/* =====================================================
   RESIZE
===================================================== */

function resize() {

    camera.aspect =
        innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(text) {

    document.getElementById(
        "status"
    ).textContent =
        text;

}


/* =====================================================
   LOOP
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );

    orbit.update();

    renderer.render(
        scene,
        camera
    );

}

</script>

</html>
