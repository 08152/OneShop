<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GHOST Paint Studio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202124;color:#eee;font-family:Arial,sans-serif}
button,input,select{font:inherit}
button,select{border:1px solid #45464b;background:#303136;color:#eee;border-radius:5px;cursor:pointer}
button:hover{background:#45474e}
.app{height:100vh;display:grid;grid-template-rows:46px 1fr 27px}
.topbar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#292a2e;border-bottom:1px solid #111}
.logo{font-weight:bold;font-size:17px;margin-right:14px}
.tool{width:38px;height:34px;font-size:17px}
.tool.active{background:#5558ff;border-color:#7779ff}
.separator{width:1px;height:28px;background:#4a4b50;margin:0 5px}
.main{display:grid;grid-template-columns:58px 1fr 290px;min-height:0}
.left{background:#292a2e;border-right:1px solid #111;padding:7px 6px;display:flex;flex-direction:column;gap:6px}
.left button{width:46px;height:40px;font-size:18px}
.left button.active{background:#5558ff}
.workspace{position:relative;background:#18191c;overflow:hidden;touch-action:none}
#canvas{position:absolute;left:0;top:0;background:white;box-shadow:0 0 35px #000;transform-origin:0 0}
.right{background:#292a2e;border-left:1px solid #111;display:flex;flex-direction:column;min-width:0}
.panel{border-bottom:1px solid #151515;padding:10px}
.panel h3{margin:0 0 9px;font-size:13px;color:#bbb;text-transform:uppercase}
.row{display:flex;align-items:center;gap:7px;margin:7px 0}
.row label{font-size:12px;color:#bbb;flex:1}
input[type=range]{width:135px}
input[type=color]{width:45px;height:32px;border:0;padding:0;background:none}
.value{width:45px;text-align:right;font-size:12px}
.brushGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-height:220px;overflow:auto}
.brushItem{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px}
.brushItem.active{background:#5558ff}
.preview{width:45px;height:25px;display:flex;align-items:center;justify-content:center}
.layers{flex:1;overflow:auto;padding:8px}
.layer{height:40px;display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid transparent;border-radius:5px;margin-bottom:4px;background:#242529}
.layer.selected{background:#4b4d54;border-color:#7779ff}
.layer span{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer button{width:29px;height:28px;padding:0}
.layerNameInput{width:100%;background:#222;color:white;border:1px solid #777;border-radius:3px;padding:3px}
.layerTools{display:flex;gap:4px;margin-bottom:7px}
.layerTools button{width:34px;height:30px}
.status{display:flex;align-items:center;justify-content:space-between;padding:0 9px;background:#292a2e;border-top:1px solid #111;font-size:11px;color:#aaa}
#cursorInfo{position:absolute;pointer-events:none;background:#111c;color:#fff;padding:3px 6px;border-radius:4px;font-size:11px;display:none;z-index:10}
select{padding:7px;width:100%}
</style>
</head>

<body>
<div class="app">

<div class="topbar">
<div class="logo">GHOST PAINT</div>
<button class="tool" id="newBtn">＋</button>
<button class="tool" id="openBtn">📂</button>
<button class="tool" id="saveBtn">💾</button>
<div class="separator"></div>
<button class="tool" id="undoBtn">↶</button>
<button class="tool" id="redoBtn">↷</button>
<div class="separator"></div>
<button class="tool" id="zoomOut">−</button>
<button class="tool" id="zoomReset">100%</button>
<button class="tool" id="zoomIn">＋</button>
<div style="flex:1"></div>
<button class="tool" id="fullscreen">⛶</button>
</div>

<div class="main">

<div class="left">
<button class="active" data-tool="brush">🖌️</button>
<button data-tool="eraser">🧽</button>
<button data-tool="line">╱</button>
<button data-tool="rect">□</button>
<button data-tool="circle">○</button>
<button data-tool="fill">🪣</button>
<button data-tool="picker">💧</button>
<button data-tool="move">✋</button>
</div>

<div class="workspace" id="workspace">
<canvas id="canvas"></canvas>
<div id="cursorInfo"></div>
<input id="fileInput" type="file" accept="image/*" hidden>
</div>

<div class="right">

<div class="panel">
<h3>Pinsel</h3>

<div class="row">
<label>Größe</label>
<input id="size" type="range" min="1" max="300" value="25">
<span class="value" id="sizeValue">25</span>
</div>

<div class="row">
<label>Deckkraft</label>
<input id="opacity" type="range" min="1" max="100" value="100">
<span class="value" id="opacityValue">100%</span>
</div>

<div class="row">
<label>Farbe</label>
<input id="color" type="color" value="#111111">
</div>

<div class="row">
<label>Härte</label>
<input id="hardness" type="range" min="0" max="100" value="100">
<span class="value" id="hardnessValue">100%</span>
</div>

<div class="row">
<label>Abstand</label>
<input id="spacing" type="range" min="1" max="100" value="5">
<span class="value" id="spacingValue">5%</span>
</div>
</div>

<div class="panel">
<h3>Pinselarten</h3>
<div class="brushGrid" id="brushGrid"></div>
</div>

<div class="panel">
<h3>Werkzeug</h3>
<select id="toolSelect">
<option value="brush">Pinsel</option>
<option value="eraser">Radierer</option>
<option value="line">Linie</option>
<option value="rect">Rechteck</option>
<option value="circle">Kreis</option>
<option value="fill">Füllen</option>
<option value="picker">Farbwähler</option>
<option value="move">Verschieben</option>
</select>
</div>

<div class="layers">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
<h3 style="margin:0">Ebenen</h3>

<div class="layerTools">
<button id="addLayer">＋</button>
<button id="duplicateLayer">▣</button>
<button id="deleteLayer">🗑</button>
</div>
</div>

<div id="layerList"></div>

</div>

</div>
</div>

<div class="status">
<span id="coords">0 × 0</span>
<span id="statusText">Bereit</span>
<span id="zoomText">100%</span>
</div>

</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{willReadFrequently:true});
const workspace=document.getElementById("workspace");

let W=1600,H=1000;
let scale=1,offsetX=0,offsetY=0;

let tool="brush";
let brushType="round";

let drawing=false;
let moving=false;

let startX=0,startY=0;
let lastX=0,lastY=0;

let previewImage=null;

let undoStack=[];
let redoStack=[];

let layers=[];
let currentLayer=0;
let layerId=1;

const brushes={
round:{name:"Rund",icon:"●",type:"round"},
pencil:{name:"Bleistift",icon:"✎",type:"pencil"},
ink:{name:"Tinte",icon:"✒",type:"ink"},
marker:{name:"Marker",icon:"▬",type:"marker"},
paint:{name:"Maler",icon:"🖌",type:"paint"},
water:{name:"Wasser",icon:"≈",type:"water"},
oil:{name:"Öl",icon:"◉",type:"oil"},
chalk:{name:"Kreide",icon:"▰",type:"chalk"},
charcoal:{name:"Kohle",icon:"▓",type:"charcoal"},
airbrush:{name:"Airbrush",icon:"☁",type:"air"},
spray:{name:"Spray",icon:"⁙",type:"spray"},
glow:{name:"Glow",icon:"✦",type:"glow"},
calligraphy:{name:"Kalligrafie",icon:"／",type:"calligraphy"},
pixel:{name:"Pixel",icon:"▦",type:"pixel"},
crayon:{name:"Wachsmaler",icon:"▰",type:"crayon"},
fuzzy:{name:"Flausch",icon:"✹",type:"fuzzy"}
};

function setupCanvas(){
canvas.width=W;
canvas.height=H;
ctx.clearRect(0,0,W,H);
ctx.fillStyle="#fff";
ctx.fillRect(0,0,W,H);
}

function centerCanvas(){
offsetX=(workspace.clientWidth-W*scale)/2;
offsetY=(workspace.clientHeight-H*scale)/2;
updateTransform();
}

function updateTransform(){
canvas.style.transform=
`translate(${offsetX}px,${offsetY}px) scale(${scale})`;

document.getElementById("zoomText").textContent=
Math.round(scale*100)+"%";
}

function point(e){
let r=workspace.getBoundingClientRect();

return{
x:(e.clientX-r.left-offsetX)/scale,
y:(e.clientY-r.top-offsetY)/scale
};
}

function saveState(){
undoStack.push(captureComposite());
if(undoStack.length>30)undoStack.shift();
redoStack=[];
}

function captureComposite(){
let out=document.createElement("canvas");
out.width=W;
out.height=H;
let c=out.getContext("2d");

layers.forEach(layer=>{
if(layer.visible)c.drawImage(layer.canvas,0,0);
});

return out.toDataURL();
}

function restoreComposite(data){
let img=new Image();

img.onload=()=>{
ctx.clearRect(0,0,W,H);
ctx.drawImage(img,0,0);
};

img.src=data;
}

function activeCanvas(){
return layers[currentLayer].canvas;
}

function activeContext(){
return layers[currentLayer].ctx;
}

function redraw(){
ctx.clearRect(0,0,W,H);

layers.forEach(layer=>{
if(layer.visible){
ctx.globalAlpha=layer.opacity;
ctx.drawImage(layer.canvas,0,0);
}
});

ctx.globalAlpha=1;
}

function configure(c){
c.strokeStyle=document.getElementById("color").value;
c.fillStyle=document.getElementById("color").value;
c.lineWidth=+document.getElementById("size").value;
c.globalAlpha=+document.getElementById("opacity").value/100;
c.lineCap="round";
c.lineJoin="round";

c.globalCompositeOperation=
tool==="eraser"?"destination-out":"source-over";
}

function stamp(c,x,y,size,alpha=1){
c.globalAlpha*=alpha;
c.beginPath();
c.arc(x,y,size/2,0,Math.PI*2);
c.fill();
}

function segment(x1,y1,x2,y2){
let c=activeContext();

configure(c);

let size=+document.getElementById("size").value;
let dist=Math.hypot(x2-x1,y2-y1);
let spacing=Math.max(.005,+document.getElementById("spacing").value/100);
let step=Math.max(.25,size*spacing);
let count=Math.max(1,Math.ceil(dist/step));

let type=brushes[brushType].type;

if(type==="round"){
c.lineWidth=size;
c.beginPath();
c.moveTo(x1,y1);
c.lineTo(x2,y2);
c.stroke();
}

else if(type==="pencil"){
c.globalAlpha*=.7;
c.lineWidth=Math.max(1,size*.4);
c.beginPath();
c.moveTo(x1,y1);
c.lineTo(x2,y2);
c.stroke();
}

else if(type==="ink"){
c.lineWidth=size*1.15;
c.beginPath();
c.moveTo(x1,y1);
c.lineTo(x2,y2);
c.stroke();
}

else if(type==="marker"){
c.globalAlpha*=.35;
c.lineWidth=size*2;
c.beginPath();
c.moveTo(x1,y1);
c.lineTo(x2,y2);
c.stroke();
}

else if(type==="paint"){
c.globalAlpha=.2;

for(let i=0;i<=count;i++){
let t=i/count;
let x=x1+(x2-x1)*t;
let y=y1+(y2-y1)*t;

for(let j=0;j<4;j++){
let a=Math.random()*Math.PI*2;
let d=Math.random()*size*.25;

stamp(
c,
x+Math.cos(a)*d,
y+Math.sin(a)*d,
size*(.75+Math.random()*.3),
.7
);
}
}
}

else if(type==="water"){
c.globalAlpha=.13;
c.lineWidth=size*2;

c.beginPath();
c.moveTo(x1,y1);
c.lineTo(x2,y2);
c.stroke();

c.globalAlpha=.08;
c.lineWidth=size*3;

c.beginPath();
c.moveTo(x1,y1);
c.lineTo(x2,y2);
c.stroke();
}

else if(type==="oil"){
c.globalAlpha=.2;

for(let i=0;i<=count;i++){
let t=i/count;
let x=x1+(x2-x1)*t;
let y=y1+(y2-y1)*t;

c.beginPath();
c.arc(
x+(Math.random()-.5)*size*.15,
y+(Math.random()-.5)*size*.15,
size*(.4+Math.random()*.3),
0,Math.PI*2
);
c.fill();
}
}

else if(type==="chalk"){
c.globalAlpha=.17;

for(let j=0;j<6;j++){
let ox=(Math.random()-.5)*size*.5;
let oy=(Math.random()-.5)*size*.5;

c.lineWidth=size*(.12+Math.random()*.25);

c.beginPath();
c.moveTo(x1+ox,y1+oy);
c.lineTo(x2+ox,y2+oy);
c.stroke();
}
}

else if(type==="charcoal"){
c.globalAlpha=.13;

for(let j=0;j<10;j++){
let ox=(Math.random()-.5)*size*.8;
let oy=(Math.random()-.5)*size*.8;

c.lineWidth=size*(.08+Math.random()*.16);

c.beginPath();
c.moveTo(x1+ox,y1+oy);
c.lineTo(x2+ox,y2+oy);
c.stroke();
}
}

else if(type==="air"){
let radius=size*1.5;

for(let i=0;i<=count;i++){
let t=i/count;
let x=x1+(x2-x1)*t;
let y=y1+(y2-y1)*t;

for(let j=0;j<15;j++){
let a=Math.random()*Math.PI*2;
let r=Math.sqrt(Math.random())*radius;

c.globalAlpha=.025;

c.beginPath();
c.arc(
x+Math.cos(a)*r,
y+Math.sin(a)*r,
Math.max(.6,size*.025),
0,Math.PI*2
);
c.fill();
}
}
}

else if(type==="spray"){
let radius=size*1.5;
let particles=Math.max(40,Math.floor(dist*size/1.5));

for(let i=0;i<particles;i++){
let t=Math.random();

let x=x1+(x2-x1)*t;
let y=y1+(y2-y1)*t;

let a=Math.random()*Math.PI*2;
let r=Math.sqrt(Math.random())*radius;

c.globalAlpha=.08+Math.random()*.14;

c.beginPath();
c.arc(
x+Math.cos(a)*r,
y+Math.sin(a)*r,
.5+Math.random()*2,
0,Math.PI*2
);
c.fill();
}
}

else if(type==="glow"){
c.shadowColor=document.getElementById("color").value;
c.shadowBlur=size*1.8;
c.globalAlpha=.8;
c.lineWidth=Math.max(1,size*.55);

c.beginPath();
c.moveTo(x1,y1);
c.lineTo(x2,y2);
c.stroke();

c.shadowBlur=0;
}

else if(type==="calligraphy"){
c.lineCap="butt";
c.lineWidth=size*.65;

c.beginPath();
c.moveTo(x1,y1);
c.lineTo(x2,y2);
c.stroke();

c.lineCap="round";
}

else if(type==="pixel"){
let s=Math.max(1,Math.round(size/4));
let steps=Math.max(1,Math.ceil(dist/s));

for(let i=0;i<=steps;i++){
let t=i/steps;

c.globalAlpha=1;

c.fillRect(
Math.round((x1+(x2-x1)*t)/s)*s,
Math.round((y1+(y2-y1)*t)/s)*s,
s,s
);
}
}

else if(type==="crayon"){
c.globalAlpha=.25;

for(let j=0;j<7;j++){
let ox=(Math.random()-.5)*size*.5;
let oy=(Math.random()-.5)*size*.5;

c.lineWidth=size*(.12+Math.random()*.2);

c.beginPath();
c.moveTo(x1+ox,y1+oy);
c.lineTo(x2+ox,y2+oy);
c.stroke();
}
}

else if(type==="fuzzy"){
c.globalAlpha=.12;

for(let i=0;i<=count;i++){
let t=i/count;
let x=x1+(x2-x1)*t;
let y=y1+(y2-y1)*t;

for(let j=0;j<8;j++){
let a=Math.random()*Math.PI*2;
let r=Math.random()*size*.7;

stamp(
c,
x+Math.cos(a)*r,
y+Math.sin(a)*r,
size*(.1+Math.random()*.3),
.8
);
}
}
}

c.globalAlpha=1;
c.globalCompositeOperation="source-over";
c.shadowBlur=0;

redraw();
}

function begin(e){
if(e.pointerType==="mouse"&&e.button!==0)return;

let p=point(e);

if(tool==="move"){
moving=true;
return;
}

if(tool==="picker"){
let x=Math.floor(p.x);
let y=Math.floor(p.y);

if(x>=0&&y>=0&&x<W&&y<H){
redraw();

let d=ctx.getImageData(x,y,1,1).data;

document.getElementById("color").value=
"#"+[d[0],d[1],d[2]]
.map(v=>v.toString(16).padStart(2,"0"))
.join("");
}

return;
}

if(tool==="fill"){
saveState();
fill(Math.floor(p.x),Math.floor(p.y));
return;
}

saveState();

drawing=true;
startX=p.x;
startY=p.y;
lastX=p.x;
lastY=p.y;

previewImage=ctx.getImageData(0,0,W,H);

if(tool==="brush"||tool==="eraser"){
segment(p.x,p.y,p.x+.01,p.y+.01);
}
}

function move(e){
let p=point(e);

document.getElementById("coords").textContent=
Math.round(p.x)+" × "+Math.round(p.y);

if(tool==="move"&&moving){
offsetX+=e.movementX;
offsetY+=e.movementY;
updateTransform();
return;
}

if(!drawing)return;

if(tool==="brush"||tool==="eraser"){
segment(lastX,lastY,p.x,p.y);
lastX=p.x;
lastY=p.y;
return;
}

ctx.putImageData(previewImage,0,0);

ctx.strokeStyle=document.getElementById("color").value;
ctx.lineWidth=+document.getElementById("size").value;
ctx.globalAlpha=+document.getElementById("opacity").value/100;

if(tool==="line"){
ctx.beginPath();
ctx.moveTo(startX,startY);
ctx.lineTo(p.x,p.y);
ctx.stroke();
}

if(tool==="rect"){
ctx.strokeRect(startX,startY,p.x-startX,p.y-startY);
}

if(tool==="circle"){
let dx=p.x-startX;
let dy=p.y-startY;
let r=Math.sqrt(dx*dx+dy*dy);

ctx.beginPath();
ctx.arc(startX,startY,r,0,Math.PI*2);
ctx.stroke();
}

ctx.globalAlpha=1;
}

function end(){
drawing=false;
moving=false;
previewImage=null;
}

canvas.addEventListener("pointerdown",begin);
workspace.addEventListener("pointermove",move);
window.addEventListener("pointerup",end);

workspace.addEventListener("wheel",e=>{
e.preventDefault();

let r=workspace.getBoundingClientRect();

let mx=e.clientX-r.left;
let my=e.clientY-r.top;

let wx=(mx-offsetX)/scale;
let wy=(my-offsetY)/scale;

let factor=e.deltaY<0?1.12:.892857;

let ns=Math.max(.1,Math.min(8,scale*factor));

offsetX=mx-wx*ns;
offsetY=my-wy*ns;
scale=ns;

updateTransform();
},{passive:false});

function zoomCenter(f){
let cx=workspace.clientWidth/2;
let cy=workspace.clientHeight/2;

let wx=(cx-offsetX)/scale;
let wy=(cy-offsetY)/scale;

scale=Math.max(.1,Math.min(8,scale*f));

offsetX=cx-wx*scale;
offsetY=cy-wy*scale;

updateTransform();
}

document.getElementById("zoomIn").onclick=()=>zoomCenter(1.2);
document.getElementById("zoomOut").onclick=()=>zoomCenter(.833333);

document.getElementById("zoomReset").onclick=()=>{
scale=1;
centerCanvas();
};

document.getElementById("size").oninput=e=>{
document.getElementById("sizeValue").textContent=e.target.value;
};

document.getElementById("opacity").oninput=e=>{
document.getElementById("opacityValue").textContent=e.target.value+"%";
};

document.getElementById("hardness").oninput=e=>{
document.getElementById("hardnessValue").textContent=e.target.value+"%";
};

document.getElementById("spacing").oninput=e=>{
document.getElementById("spacingValue").textContent=e.target.value+"%";
};

document.getElementById("undoBtn").onclick=()=>{
if(!undoStack.length)return;

redoStack.push(captureComposite());
restoreComposite(undoStack.pop());
};

document.getElementById("redoBtn").onclick=()=>{
if(!redoStack.length)return;

undoStack.push(captureComposite());
restoreComposite(redoStack.pop());
};

document.getElementById("newBtn").onclick=()=>{
if(confirm("Neue Leinwand erstellen?")){
W=1600;
H=1000;
setupCanvas();

layers=[];
createLayer("Hintergrund",true);

undoStack=[];
redoStack=[];
scale=1;
centerCanvas();
}
};

document.getElementById("openBtn").onclick=()=>{
document.getElementById("fileInput").click();
};

document.getElementById("fileInput").onchange=e=>{
let file=e.target.files[0];
if(!file)return;

let img=new Image();

img.onload=()=>{
W=img.width;
H=img.height;

canvas.width=W;
canvas.height=H;

ctx.clearRect(0,0,W,H);
ctx.drawImage(img,0,0);

layers=[];
createLayer("Bild",true);

activeContext().drawImage(img,0,0);

redraw();

undoStack=[];
redoStack=[];
scale=1;
centerCanvas();
};

img.src=URL.createObjectURL(file);
};

document.getElementById("saveBtn").onclick=()=>{
redraw();

let a=document.createElement("a");
a.download="ghost-paint.png";
a.href=canvas.toDataURL("image/png");
a.click();
};

document.getElementById("fullscreen").onclick=()=>{
if(!document.fullscreenElement)
document.documentElement.requestFullscreen();
else
document.exitFullscreen();
};

document.querySelectorAll(".left button").forEach(b=>{
b.onclick=()=>setTool(b.dataset.tool);
});

document.getElementById("toolSelect").onchange=e=>{
setTool(e.target.value);
};

function setTool(t){
tool=t;

document.querySelectorAll(".left button").forEach(b=>{
b.classList.toggle("active",b.dataset.tool===t);
});

document.getElementById("toolSelect").value=t;
}

function fill(x,y){
if(x<0||y<0||x>=W||y>=H)return;

let c=activeContext();

let img=c.getImageData(0,0,W,H);
let data=img.data;

let start=(y*W+x)*4;

let target=[
data[start],
data[start+1],
data[start+2],
data[start+3]
];

let hex=document.getElementById("color").value;
let rgb=hex.match(/\w\w/g).map(v=>parseInt(v,16));

let replacement=[rgb[0],rgb[1],rgb[2],255];

if(target.every((v,i)=>v===replacement[i]))return;

let stack=[[x,y]];
let seen=new Uint8Array(W*H);

while(stack.length){
let [px,py]=stack.pop();

if(px<0||py<0||px>=W||py>=H)continue;

let pos=py*W+px;

if(seen[pos])continue;

let i=pos*4;

if(
data[i]!==target[0]||
data[i+1]!==target[1]||
data[i+2]!==target[2]||
data[i+3]!==target[3]
)continue;

seen[pos]=1;

data[i]=replacement[0];
data[i+1]=replacement[1];
data[i+2]=replacement[2];
data[i+3]=replacement[3];

stack.push([px+1,py]);
stack.push([px-1,py]);
stack.push([px,py+1]);
stack.push([px,py-1]);
}

c.putImageData(img,0,0);

redraw();
}

function createLayer(name,background=false){
let c=document.createElement("canvas");
c.width=W;
c.height=H;

let layerCtx=c.getContext("2d");

if(background){
layerCtx.fillStyle="#fff";
layerCtx.fillRect(0,0,W,H);
}

layers.push({
id:layerId++,
name:name,
visible:true,
opacity:1,
canvas:c,
ctx:layerCtx
});

currentLayer=layers.length-1;
renderLayers();
redraw();
}

document.getElementById("addLayer").onclick=()=>{
createLayer("Ebene "+layerId);
};

document.getElementById("duplicateLayer").onclick=()=>{
let old=layers[currentLayer];

let c=document.createElement("canvas");
c.width=W;
c.height=H;

let cctx=c.getContext("2d");
cctx.drawImage(old.canvas,0,0);

layers.splice(currentLayer+1,0,{
id:layerId++,
name:old.name+" Kopie",
visible:old.visible,
opacity:old.opacity,
canvas:c,
ctx:cctx
});

currentLayer++;
renderLayers();
redraw();
};

document.getElementById("deleteLayer").onclick=()=>{
if(layers.length<=1)return;

layers.splice(currentLayer,1);
currentLayer=Math.max(0,currentLayer-1);

renderLayers();
redraw();
};

function renderLayers(){
let list=document.getElementById("layerList");
list.innerHTML="";

[...layers].reverse().forEach(layer=>{
let realIndex=layers.indexOf(layer);

let el=document.createElement("div");
el.className="layer"+(realIndex===currentLayer?" selected":"");

let eye=document.createElement("button");
eye.textContent=layer.visible?"◉":"○";

eye.onclick=e=>{
e.stopPropagation();
layer.visible=!layer.visible;
renderLayers();
redraw();
};

let name=document.createElement("span");
name.textContent=layer.name;
name.ondblclick=e=>{
e.stopPropagation();

let input=document.createElement("input");
input.className="layerNameInput";
input.value=layer.name;

name.replaceWith(input);
input.focus();

function finish(){
layer.name=input.value.trim()||"Ebene";
renderLayers();
}

input.onblur=finish;

input.onkeydown=e=>{
if(e.key==="Enter")finish();
};
};

el.onclick=()=>{
currentLayer=realIndex;
renderLayers();
};

el.appendChild(eye);
el.appendChild(name);

list.appendChild(el);
});
}

function createBrushUI(){
let grid=document.getElementById("brushGrid");

Object.entries(brushes).forEach(([id,b])=>{
let el=document.createElement("button");

el.className="brushItem"+(id==="round"?" active":"");

el.innerHTML=
`<div class="preview"><b style="font-size:20px">${b.icon}</b></div>
<div>${b.name}</div>`;

el.onclick=()=>{
brushType=id;

document.querySelectorAll(".brushItem").forEach(x=>{
x.classList.remove("active");
});

el.classList.add("active");

setTool("brush");
};

grid.appendChild(el);
});
}

document.addEventListener("keydown",e=>{
if(e.ctrlKey&&e.key.toLowerCase()==="z"){
e.preventDefault();
document.getElementById("undoBtn").click();
}

if(e.ctrlKey&&e.key.toLowerCase()==="y"){
e.preventDefault();
document.getElementById("redoBtn").click();
}

if(e.key.toLowerCase()==="b")setTool("brush");
if(e.key.toLowerCase()==="e")setTool("eraser");
if(e.key.toLowerCase()==="l")setTool("line");
if(e.key.toLowerCase()==="r")setTool("rect");
if(e.key.toLowerCase()==="o")setTool("circle");
if(e.key.toLowerCase()==="f")setTool("fill");
if(e.key.toLowerCase()==="i")setTool("picker");
if(e.key.toLowerCase()==="m")setTool("move");

if(e.key==="["){
let s=document.getElementById("size");
s.value=Math.max(1,+s.value-5);
s.dispatchEvent(new Event("input"));
}

if(e.key==="]"){
let s=document.getElementById("size");
s.value=Math.min(300,+s.value+5);
s.dispatchEvent(new Event("input"));
}
});

createBrushUI();
setupCanvas();

layers=[];
createLayer("Hintergrund",true);

scale=1;
centerCanvas();
</script>
</body>
</html>
