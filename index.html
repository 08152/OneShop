<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Kugel Plattform - Jump Edition</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #6ba7e6;
        }
        canvas { display: block; }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="hud">
        <strong>Steuerung:</strong><br>
        WASD = Kugel rollen<br>
        LEERTASTE = Springen<br>
        Maus = Kamera drehen<br>
        Klick = Aktivieren
    </div>

    <script src="https://jsdelivr.net"></script>
    <script src="https://socket.io"></script>
    <script src="game.js"></script>
</body>
</html>
