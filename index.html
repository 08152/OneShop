<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Lumora AI</title>


<style>

/* ==================================================
   RESET
================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {
    width: 100%;
    height: 100%;
}


body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #0d0d0f;

    color: white;

    overflow: hidden;
}


/* ==================================================
   APP
================================================== */

.app {

    width: 100%;
    height: 100vh;

    display: flex;

}


/* ==================================================
   SIDEBAR
================================================== */

.sidebar {

    width: 250px;
    height: 100%;

    background: #121215;

    border-right:
        1px solid #29292e;

    padding: 18px;

    display: flex;
    flex-direction: column;

}


.logo {

    display: flex;

    align-items: center;

    gap: 10px;

    font-size: 20px;

    font-weight: 700;

    margin-bottom: 30px;

}


.logoIcon {

    width: 38px;
    height: 38px;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #4285f4,
            #9b72cb,
            #d96570,
            #fbbc04,
            #34a853
        );

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 20px;

}


.newChat {

    width: 100%;

    padding: 13px;

    border: 0;

    border-radius: 14px;

    background: #242429;

    color: white;

    cursor: pointer;

    font-size: 14px;

}


.newChat:hover {

    background: #303037;

}


.sidebarTitle {

    color: #77777f;

    font-size: 11px;

    margin:
        28px 8px 10px;

}


.history {

    display: flex;

    flex-direction: column;

    gap: 3px;

}


.historyItem {

    padding: 11px;

    border-radius: 10px;

    color: #c7c7cd;

    font-size: 13px;

    cursor: pointer;

}


.historyItem:hover {

    background: #202025;

}


/* ==================================================
   MAIN
================================================== */

.main {

    flex: 1;

    height: 100%;

    display: flex;

    flex-direction: column;

    position: relative;

}


/* ==================================================
   TOPBAR
================================================== */

.topbar {

    height: 65px;

    display: flex;

    align-items: center;

    justify-content: flex-end;

    padding:
        0 25px;

}


.model {

    background: #1e1e22;

    border:
        1px solid #303036;

    border-radius: 20px;

    padding:
        9px 15px;

    font-size: 13px;

    color: #d5d5da;

}


/* ==================================================
   CENTER
================================================== */

.center {

    flex: 1;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    transform:
        translateY(-30px);

}


.aiName {

    font-size:
        clamp(45px, 7vw, 72px);

    font-weight: 700;

    letter-spacing: -4px;

    margin-bottom: 8px;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #8e75d9,
            #d96570,
            #fbbc04,
            #34a853,
            #4285f4
        );

    background-size:
        500% 500%;

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color: transparent;

    animation:
        rainbow 7s linear infinite;

}


.subtitle {

    color: #77777f;

    font-size: 14px;

    margin-bottom: 32px;

}


/* ==================================================
   INPUT
================================================== */

.inputWrapper {

    width:
        min(850px, 92%);

}


.inputBox {

    padding: 5px;

    border-radius: 30px;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #8e75d9,
            #d96570,
            #fbbc04,
            #34a853,
            #4285f4
        );

    background-size:
        500% 500%;

    animation:
        rainbow 7s linear infinite;

}


.inputInner {

    min-height: 155px;

    border-radius: 26px;

    background: #17171b;

    padding: 20px;

    display: flex;

    flex-direction: column;

}


textarea {

    width: 100%;

    min-height: 70px;

    flex: 1;

    resize: none;

    outline: none;

    border: 0;

    background: transparent;

    color: white;

    font-family: inherit;

    font-size: 17px;

    line-height: 1.5;

}


textarea::placeholder {

    color: #77777f;

}


/* ==================================================
   BUTTONS
================================================== */

.inputBottom {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-top: 12px;

}


.buttonGroup {

    display: flex;

    gap: 8px;

}


.iconButton {

    width: 40px;
    height: 40px;

    border: 0;

    border-radius: 50%;

    background: #25252b;

    color: white;

    cursor: pointer;

    font-size: 18px;

}


.iconButton:hover {

    background: #36363d;

}


.sendButton {

    width: 44px;
    height: 44px;

    border: 0;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #4285f4,
            #9b72cb,
            #d96570
        );

    color: white;

    font-size: 20px;

    cursor: pointer;

}


.sendButton:hover {

    transform:
        scale(1.07);

}


/* ==================================================
   IMAGE UPLOAD
================================================== */

#imageInput {

    display: none;

}


.preview {

    display: none;

    gap: 8px;

    margin-bottom: 10px;

}


.preview.show {

    display: flex;

}


.preview img {

    width: 62px;
    height: 62px;

    object-fit: cover;

    border-radius: 11px;

    border:
        1px solid #444;

}


/* ==================================================
   STATUS
================================================== */

.status {

    height: 20px;

    margin-top: 10px;

    text-align: center;

    color: #77777f;

    font-size: 12px;

}


/* ==================================================
   SEARCH RESULTS
================================================== */

.results {

    position: absolute;

    z-index: 20;

    left: 50%;

    transform:
        translateX(-50%);

    bottom: 70px;

    width:
        min(900px, 92%);

    max-height: 58vh;

    overflow-y: auto;

    display: none;

    flex-direction: column;

    gap: 10px;

    padding: 5px;

}


.results.show {

    display: flex;

}


/* scrollbar */

.results::-webkit-scrollbar {

    width: 7px;

}


.results::-webkit-scrollbar-thumb {

    background: #393940;

    border-radius: 10px;

}


/* RESULT */

.result {

    background:
        rgba(25,25,30,.97);

    border:
        1px solid #303037;

    border-radius: 16px;

    padding: 16px;

    cursor: pointer;

    transition: .2s;

}


.result:hover {

    background:
        #222229;

    border-color:
        #44444d;

    transform:
        translateY(-1px);

}


.resultTitle {

    color:
        #8ab4f8;

    font-size: 16px;

    font-weight: 600;

    margin-bottom: 7px;

}


.resultDescription {

    color:
        #c4c4ca;

    font-size: 13px;

    line-height: 1.5;

}


.resultUrl {

    margin-top: 9px;

    color:
        #62b477;

    font-size: 11px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

}


.noResults {

    text-align: center;

    padding: 30px;

    color: #888890;

}


/* ==================================================
   FOOTER
================================================== */

.footer {

    height: 40px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #55555c;

    font-size: 11px;

}


/* ==================================================
   LOADING
================================================== */

.loading {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    padding: 20px;

    color: #888890;

}


.dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #888890;

    animation:
        pulse 1s infinite alternate;

}


.dot:nth-child(2) {

    animation-delay:
        .2s;

}


.dot:nth-child(3) {

    animation-delay:
        .4s;

}


/* ==================================================
   ANIMATIONS
================================================== */

@keyframes rainbow {

    0% {
        background-position: 0% 50%;
    }

    25% {
        background-position: 50% 100%;
    }

    50% {
        background-position: 100% 50%;
    }

    75% {
        background-position: 50% 0%;
    }

    100% {
        background-position: 0% 50%;
    }

}


@keyframes pulse {

    from {
        opacity: .3;
    }

    to {
        opacity: 1;
    }

}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 700px) {

    .sidebar {

        display: none;

    }


    .center {

        transform:
            translateY(-10px);

    }


    .aiName {

        font-size: 48px;

    }


    .inputWrapper {

        width: 95%;

    }


    .results {

        width: 95%;

        bottom: 65px;

        max-height: 55vh;

    }

}

</style>

</head>


<body>


<div class="app">


<!-- ==================================================
     SIDEBAR
================================================== -->

<aside class="sidebar">


<div class="logo">

    <div class="logoIcon">
        ✦
    </div>

    Lumora

</div>


<button
    class="newChat"
    onclick="newChat()"
>
    ＋ Neuer Chat
</button>


<div class="sidebarTitle">
    VERLAUF
</div>


<div
    id="history"
    class="history"
>

    <div class="historyItem">
        Mein erster Chat
    </div>

    <div class="historyItem">
        Websuche
    </div>

</div>


</aside>


<!-- ==================================================
     MAIN
================================================== -->

<main class="main">


<div class="topbar">

    <div class="model">
        Lumora 1.0 ▾
    </div>

</div>


<div class="center">


<div class="aiName">
    Lumora
</div>


<div class="subtitle">
    Deine kreative KI
</div>


<!-- INPUT -->

<div class="inputWrapper">


<div class="inputBox">


<div class="inputInner">


<!-- IMAGE PREVIEW -->

<div
    id="preview"
    class="preview"
></div>


<textarea
    id="message"
    placeholder="Frag Lumora etwas …"
></textarea>


<div class="inputBottom">


<div class="buttonGroup">


<label
    for="imageInput"
    class="iconButton"
    title="Bild hochladen"
>
    ＋
</label>


<input
    id="imageInput"
    type="file"
    accept="image/*"
    multiple
>


<button
    class="iconButton"
    title="Bild"
>
    🖼
</button>


</div>


<div class="buttonGroup">


<button
    class="iconButton"
    title="Mikrofon"
>
    🎤
</button>


<button
    id="sendButton"
    class="sendButton"
    title="Suchen"
>
    ↑
</button>


</div>


</div>


</div>

</div>

</div>


<div
    id="status"
    class="status"
></div>


</div>


</div>


<!-- SEARCH RESULTS -->

<div
    id="results"
    class="results"
></div>


<div class="footer">

    Lumora kann Fehler machen. Überprüfe wichtige Informationen.

</div>


</main>

</div>


<script>

/* ==================================================
   ELEMENTE
================================================== */

const message =
    document.getElementById("message");

const sendButton =
    document.getElementById("sendButton");

const results =
    document.getElementById("results");

const status =
    document.getElementById("status");

const imageInput =
    document.getElementById("imageInput");

const preview =
    document.getElementById("preview");


/* ==================================================
   BILDER
================================================== */

imageInput.addEventListener(
    "change",
    function () {

        preview.innerHTML = "";

        const files =
            Array.from(this.files);


        if (!files.length) {

            preview.classList.remove(
                "show"
            );

            return;
        }


        preview.classList.add(
            "show"
        );


        files.forEach(file => {

            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {
                return;
            }


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                URL.createObjectURL(
                    file
                );


            preview.appendChild(
                image
            );

        });

    }
);


/* ==================================================
   SUCHEN
================================================== */

async function searchWeb(query) {

    results.innerHTML = `

        <div class="loading">

            <span>Suche</span>

            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>

        </div>

    `;


    results.classList.add(
        "show"
    );


    status.textContent =
        "Durchsuche das Web …";


    try {


        const response =
            await fetch(
                "/api/search?q=" +
                encodeURIComponent(
                    query
                )
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Suchfehler"
            );

        }


        results.innerHTML = "";


        if (
            !data.results ||
            data.results.length === 0
        ) {

            results.innerHTML = `

                <div class="noResults">

                    Keine Suchergebnisse gefunden.

                </div>

            `;

            status.textContent =
                "Keine Ergebnisse.";

            return;
        }


        data.results.forEach(
            result => {

                createResult(
                    result
                );

            }
        );


        status.textContent =
            data.results.length +
            " Suchergebnisse";


    } catch (error) {

        console.error(
            error
        );


        results.innerHTML = `

            <div class="noResults">

                Suche fehlgeschlagen.<br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;


        status.textContent =
            "Fehler bei der Suche.";

    }

}


/* ==================================================
   RESULT CARD
================================================== */

function createResult(result) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "result";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "resultTitle";


    title.textContent =
        result.title;


    const description =
        document.createElement(
            "div"
        );


    description.className =
        "resultDescription";


    description.textContent =
        result.description ||
        "Keine Beschreibung verfügbar.";


    const url =
        document.createElement(
            "div"
        );


    url.className =
        "resultUrl";


    url.textContent =
        result.url;


    card.appendChild(
        title
    );


    card.appendChild(
        description
    );


    card.appendChild(
        url
    );


    card.addEventListener(
        "click",
        () => {

            window.open(
                result.url,
                "_blank",
                "noopener,noreferrer"
            );

        }
    );


    results.appendChild(
        card
    );

}


/* ==================================================
   HTML ESCAPE
================================================== */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* ==================================================
   SENDEN
================================================== */

async function sendMessage() {

    const query =
        message.value.trim();


    if (!query) {

        message.focus();

        return;

    }


    await searchWeb(
        query
    );

}


/* ==================================================
   BUTTON
================================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* ==================================================
   ENTER
================================================== */

message.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ==================================================
   NEUER CHAT
================================================== */

function newChat() {

    message.value = "";

    results.innerHTML = "";

    results.classList.remove(
        "show"
    );

    status.textContent = "";

    preview.innerHTML = "";

    preview.classList.remove(
        "show"
    );

    imageInput.value = "";

    message.focus();

}

</script>


</body>
</html>
