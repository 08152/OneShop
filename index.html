<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RiskyLive Nachrichten</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f4f8;
    color: #172033;
}

button, input, textarea {
    font: inherit;
}

.login {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 35px;
    border-radius: 22px;
    box-shadow: 0 15px 50px rgba(0,0,0,.12);
}

.logo {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    color: #697386;
    margin-bottom: 30px;
}

input, textarea {
    width: 100%;
    border: 1px solid #d9dee8;
    border-radius: 12px;
    padding: 13px;
    outline: none;
}

input:focus, textarea:focus {
    border-color: #667eea;
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.login-btn,
.send-btn,
.save-btn {
    border: 0;
    background: #667eea;
    color: white;
    padding: 13px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
}

.login-btn {
    width: 100%;
}

.error {
    color: #d93025;
    margin-top: 15px;
    display: none;
}

.app {
    display: none;
    min-height: 100vh;
}

.sidebar {
    width: 280px;
    background: #151a27;
    color: white;
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    padding: 22px;
}

.sidebar-logo {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 30px;
}

.menu-btn {
    width: 100%;
    background: transparent;
    border: 0;
    color: #c9ceda;
    text-align: left;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 5px;
}

.menu-btn:hover,
.menu-btn.active {
    background: #252c40;
    color: white;
}

.main {
    margin-left: 280px;
    min-height: 100vh;
}

.topbar {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e4e7ed;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

.user-name {
    font-weight: bold;
}

.content {
    padding: 30px;
    max-width: 1100px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
}

.chat {
    height: calc(100vh - 170px);
    display: flex;
    flex-direction: column;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.message {
    max-width: 75%;
    padding: 13px 16px;
    border-radius: 16px;
    margin-bottom: 12px;
    line-height: 1.45;
}

.message.user {
    margin-left: auto;
    background: #667eea;
    color: white;
    border-bottom-right-radius: 4px;
}

.message.ai {
    background: #eef1f6;
    border-bottom-left-radius: 4px;
}

.message small {
    display: block;
    opacity: .7;
    margin-bottom: 5px;
}

.message-form {
    display: flex;
    gap: 10px;
    padding-top: 15px;
}

.message-form textarea {
    resize: none;
    height: 55px;
}

.message-form .send-btn {
    width: 100px;
}

.person {
    border: 1px solid #e1e5ec;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 10px;
    cursor: pointer;
}

.person:hover {
    background: #f5f7fa;
}

.person strong {
    display: block;
}

.badge {
    display: inline-block;
    background: #e8ebff;
    color: #5263c7;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 12px;
    margin-top: 5px;
}

textarea.data {
    min-height: 130px;
    resize: vertical;
}

.logout {
    position: absolute;
    bottom: 20px;
    left: 22px;
    right: 22px;
    width: calc(100% - 44px);
}

@media(max-width:700px) {
    .sidebar {
        width: 70px;
        padding: 10px;
    }

    .sidebar-logo {
        font-size: 0;
    }

    .sidebar-logo::after {
        content: "R";
        font-size: 24px;
    }

    .menu-btn {
        font-size: 0;
        text-align: center;
    }

    .menu-btn::first-letter {
        font-size: 20px;
    }

    .main {
        margin-left: 70px;
    }

    .content {
        padding: 15px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginScreen">

    <div class="login-box">

        <div class="logo">RiskyLive</div>
        <div class="subtitle">
            Nachrichten & KI-Assistent
        </div>

        <div class="field">
            <label>Benutzername / E-Mail</label>
            <input id="username" type="text"
                   placeholder="Benutzername oder E-Mail">
        </div>

        <div class="field">
            <label>PIN</label>
            <input id="pin" type="password"
                   placeholder="PIN">
        </div>

        <button class="login-btn" onclick="login()">
            Anmelden
        </button>

        <div class="error" id="loginError">
            Benutzername oder PIN ist falsch.
        </div>

    </div>

</div>


<!-- APP -->
<div class="app" id="app">

    <aside class="sidebar">

        <div class="sidebar-logo">
            RiskyLive
        </div>

        <button class="menu-btn active"
                onclick="showPage('chat', this)">
            💬 Nachrichten
        </button>

        <button class="menu-btn"
                onclick="showPage('people', this)"
                id="peopleMenu">
            👥 Personen
        </button>

        <button class="menu-btn"
                onclick="showPage('knowledge', this)">
            🧠 KI-Daten
        </button>

        <button class="menu-btn"
                onclick="showPage('settings', this)">
            ⚙️ Einstellungen
        </button>

        <button class="menu-btn logout"
                onclick="logout()">
            🚪 Abmelden
        </button>

    </aside>


    <main class="main">

        <header class="topbar">

            <span id="pageTitle">
                Nachrichten
            </span>

            <span class="user-name"
                  id="currentUser">
            </span>

        </header>


        <section class="content">

            <!-- CHAT -->
            <div class="page active" id="chat">

                <div class="card chat">

                    <h2>
                        KI-Nachrichten
                    </h2>

                    <div class="messages"
                         id="messages">
                    </div>

                    <div class="message-form">

                        <textarea
                            id="messageInput"
                            placeholder="Schreibe eine Frage..."></textarea>

                        <button class="send-btn"
                                onclick="sendMessage()">
                            Senden
                        </button>

                    </div>

                </div>

            </div>


            <!-- PERSONEN -->
            <div class="page" id="people">

                <div class="card">

                    <h2>
                        Personen
                    </h2>

                    <p>
                        Hier siehst du die Personen,
                        die Fragen gestellt haben.
                    </p>

                    <div id="peopleList"></div>

                </div>

            </div>


            <!-- KI-DATEN -->
            <div class="page" id="knowledge">

                <div class="card">

                    <h2>
                        Was weiß die KI?
                    </h2>

                    <p>
                        Diese Informationen verwendet
                        die lokale Demo für ihre Antworten.
                    </p>

                    <label>
                        Öffnungszeiten
                    </label>

                    <textarea class="data"
                              id="openingHours"></textarea>

                    <br><br>

                    <label>
                        Weitere Informationen
                    </label>

                    <textarea class="data"
                              id="aiKnowledge"></textarea>

                    <br><br>

                    <button class="save-btn"
                            onclick="saveKnowledge()">
                        Daten speichern
                    </button>

                    <p id="saveMessage"></p>

                </div>

            </div>


            <!-- SETTINGS -->
            <div class="page" id="settings">

                <div class="card">

                    <h2>
                        Einstellungen
                    </h2>

                    <label>
                        Benutzername
                    </label>

                    <br>

                    <input id="newName"
                           placeholder="Neuer Benutzername">

                    <br><br>

                    <button class="save-btn"
                            onclick="changeName()">
                        Speichern
                    </button>

                    <p id="settingsMessage"></p>

                </div>

            </div>

        </section>

    </main>

</div>


<script>

const ADMIN_EMAIL = "Riskylive@proton.me";
const ADMIN_PIN = "081508151235180Rss#";

let loggedUser = "";
let isAdmin = false;


/* Beispieldaten */
let conversations =
    JSON.parse(localStorage.getItem("conversations") || "[]");

let knowledge =
    JSON.parse(localStorage.getItem("knowledge") || "null");

if (!knowledge) {

    knowledge = {

        openingHours:
            "Montag bis Donnerstag: 15:00–17:00\nFreitag bis Sonntag: geschlossen",

        other:
            "RiskyLive ist ein Nachrichten- und KI-Dienst."

    };

}


/* LOGIN */

function login() {

    const username =
        document.getElementById("username").value.trim();

    const pin =
        document.getElementById("pin").value;

    if (!username || !pin) {
        showLoginError();
        return;
    }


    /*
       Der spezielle Account wird als
       Administrator erkannt.
    */

    if (
        username.toLowerCase() === ADMIN_EMAIL.toLowerCase()
        &&
        pin === ADMIN_PIN
    ) {

        loggedUser = "111.111.111.1";
        isAdmin = true;

    } else {

        /*
           Für normale Benutzer wird ein lokaler
           Benutzername als Identität verwendet.
        */

        loggedUser = username;
        isAdmin = false;

    }


    document.getElementById("loginScreen")
        .style.display = "none";

    document.getElementById("app")
        .style.display = "block";

    document.getElementById("currentUser")
        .textContent = loggedUser;


    document.getElementById("peopleMenu")
        .style.display = isAdmin ? "block" : "none";


    loadKnowledge();
    loadMessages();
    updatePeople();

}


/* LOGIN FEHLER */

function showLoginError() {

    const error =
        document.getElementById("loginError");

    error.style.display = "block";

}


/* SEITEN */

function showPage(page, button) {

    document
        .querySelectorAll(".page")
        .forEach(p => p.classList.remove("active"));

    document
        .getElementById(page)
        .classList.add("active");


    document
        .querySelectorAll(".menu-btn")
        .forEach(b => b.classList.remove("active"));

    if (button)
        button.classList.add("active");


    const titles = {

        chat: "Nachrichten",
        people: "Personen",
        knowledge: "KI-Daten",
        settings: "Einstellungen"

    };

    document.getElementById("pageTitle")
        .textContent = titles[page];

}


/* NACHRICHT SENDEN */

function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (!text) return;


    const conversation = {

        user: loggedUser,

        question: text,

        answer: generateAIAnswer(text),

        time: new Date().toLocaleString("de-DE")

    };


    conversations.push(conversation);

    localStorage.setItem(
        "conversations",
        JSON.stringify(conversations)
    );


    input.value = "";

    loadMessages();
    updatePeople();

}


/* NACHRICHTEN LADEN */

function loadMessages() {

    const container =
        document.getElementById("messages");

    container.innerHTML = "";


    const ownMessages =
        conversations.filter(
            x => x.user === loggedUser
        );


    if (ownMessages.length === 0) {

        container.innerHTML =
            `<div class="message ai">
                <small>KI</small>
                Hallo! Stelle mir eine Frage.
            </div>`;

        return;

    }


    ownMessages.forEach(item => {

        container.innerHTML += `

            <div class="message user">

                <small>Du · ${escapeHTML(item.time)}</small>

                ${escapeHTML(item.question)}

            </div>

            <div class="message ai">

                <small>KI</small>

                ${escapeHTML(item.answer)}

            </div>

        `;

    });


    container.scrollTop =
        container.scrollHeight;

}


/* EINFACHE LOKALE KI */

function generateAIAnswer(question) {

    const q =
        question.toLowerCase();


    if (
        q.includes("öffnungszeit") ||
        q.includes("öffnungszeiten") ||
        q.includes("wann offen") ||
        q.includes("geöffnet")
    ) {

        return knowledge.openingHours;

    }


    if (
        q.includes("hallo") ||
        q.includes("hi")
    ) {

        return "Hallo! Wie kann ich dir helfen?";

    }


    if (
        q.includes("wer bist du")
    ) {

        return "Ich bin der KI-Assistent von RiskyLive.";

    }


    if (
        q.includes("danke")
    ) {

        return "Gerne!";

    }


    return "Ich habe deine Frage erhalten. " +
           "Für diese lokale Demo habe ich " +
           "darauf noch keine spezielle Antwort. " +
           "Ein echter KI-Server kann hier später " +
           "angeschlossen werden.";

}


/* ADMIN: PERSONEN */

function updatePeople() {

    const list =
        document.getElementById("peopleList");

    if (!isAdmin) return;


    const users =
        [...new Set(
            conversations.map(x => x.user)
        )];


    if (users.length === 0) {

        list.innerHTML =
            "<p>Noch keine Fragen vorhanden.</p>";

        return;

    }


    list.innerHTML = "";


    users.forEach(user => {

        const count =
            conversations.filter(
                x => x.user === user
            ).length;


        list.innerHTML += `

            <div class="person"
                 onclick="showPerson('${escapeAttribute(user)}')">

                <strong>
                    ${escapeHTML(user)}
                </strong>

                <span class="badge">
                    ${count} Frage(n)
                </span>

            </div>

        `;

    });

}


/* ADMIN: PERSON ANSEHEN */

function showPerson(user) {

    const questions =
        conversations.filter(
            x => x.user === user
        );


    let output =
        "Fragen von " + user + "\\n\\n";


    questions.forEach((q, index) => {

        output +=
            (index + 1) +
            ". Frage: " +
            q.question +
            "\\n" +
            "KI: " +
            q.answer +
            "\\n\\n";

    });


    alert(output);

}


/* KI-DATEN */

function loadKnowledge() {

    document.getElementById("openingHours")
        .value = knowledge.openingHours;

    document.getElementById("aiKnowledge")
        .value = knowledge.other;

}


function saveKnowledge() {

    knowledge.openingHours =
        document.getElementById("openingHours").value;

    knowledge.other =
        document.getElementById("aiKnowledge").value;


    localStorage.setItem(
        "knowledge",
        JSON.stringify(knowledge)
    );


    document.getElementById("saveMessage")
        .textContent =
        "✓ KI-Daten gespeichert.";

}


/* BENUTZERNAME */

function changeName() {

    const name =
        document.getElementById("newName")
            .value.trim();

    if (!name) return;


    loggedUser = name;

    document.getElementById("currentUser")
        .textContent = loggedUser;


    document.getElementById("settingsMessage")
        .textContent =
        "✓ Benutzername geändert.";

}


/* LOGOUT */

function logout() {

    location.reload();

}


/* HTML SCHUTZ */

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeAttribute(text) {

    return String(text)
        .replaceAll("'", "\\'");

}


/* ENTER SENDEN */

document
    .getElementById("messageInput")
    .addEventListener("keydown", function(e) {

        if (e.key === "Enter" && !e.shiftKey) {

            e.preventDefault();

            sendMessage();

        }

    });

</script>

</body>
</html>
