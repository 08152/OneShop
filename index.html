<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GHOST 3D Landscape Engine</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    display:block;
}

#top{
    position:fixed;
    z-index:20;
    top:0;
    left:0;
    right:0;
    height:58px;
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px;
    background:rgba(22,25,30,.96);
    border-bottom:1px solid #444;
    overflow-x:auto;
}

.logo{
    color:white;
    font-size:19px;
    font-weight:900;
    margin:0 12px 0 5px;
    white-space:nowrap;
}

button{
    border:1px solid #555d66;
    background:#292e35;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#3a4048;
}

.topBtn{
    height:40px;
    padding:0 13px;
    white-space:nowrap;
}

.active{
    background:#e9c300!important;
    color:#111!important;
    border-color:#ffe96b!important;
}

#gravity.active{
    background:#6849e8!important;
    color:white!important;
}

#play.active{
    background:#c83c45!important;
    color:white!important;
}

#left{
    position:fixed;
    z-index:20;
    top:70px;
    left:10px;
    width:210px;
    max-height:calc(100vh - 82px);
    overflow:auto;
    padding:12px;
    border-radius:12px;
    background:rgba(24,28,33,.96);
    border:1px solid #454c55;
    color:white;
}

.title{
    font-size:11px;
    color:#aeb5bd;
    font-weight:bold;
    letter-spacing:1px;
    margin:3px 0 9px;
}

.tool{
    width:100%;
    height:42px;
    margin-bottom:7px;
    font-size:13px;
}

.section{
    border-top:1px solid #41474f;
    margin-top:12px;
    padding-top:12px;
}

.label{
    display:flex;
    justify-content:space-between;
    color:#ddd;
    font-size:12px;
    margin-bottom:5px;
}

input[type=range]{
    width:100%;
}

#right{
    position:fixed;
    z-index:20;
    top:70px;
    right:10px;
    width:245px;
    max-height:calc(100vh - 82px);
    overflow:auto;
    padding:12px;
    border-radius:12px;
    background:rgba(24,28,33,.96);
    border:1px solid #454c55;
    color:white;
}

input[type=text],
input[type=number],
textarea{
    width:100%;
    background:#11151a;
    color:white;
    border:1px solid #505761;
    border-radius:6px;
    padding:8px;
    outline:none;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-bottom:7px;
}

.small{
    width:100%;
    height:35px;
    margin-top:6px;
}

textarea{
    min-height:110px;
    resize:vertical;
    font-family:monospace;
    font-size:12px;
}

#status{
    position:fixed;
    z-index:30;
    left:12px;
    bottom:12px;
    background:rgba(20,24,29,.9);
    border:1px solid #444;
    border-radius:8px;
    padding:8px 11px;
    color:white;
    font-size:12px;
    pointer-events:none;
}

#help{
    position:fixed;
    z-index:30;
    left:50%;
    transform:translateX(-50%);
    bottom:12px;
    background:rgba(20,24,29,.9);
    border:1px solid #444;
    border-radius:8px;
    padding:8px 12px;
    color:#ddd;
    font-size:12px;
    pointer-events:none;
}

#start{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.5);
}

.startBox{
    width:370px;
    max-width:90%;
    background:#20252b;
    border:1px solid #555d66;
    border-radius:18px;
    padding:28px;
    color:white;
    text-align:center;
    box-shadow:0 20px 80px #000;
}

.startBox h1{
    margin:0 0 8px;
}

.startBox button{
    width:100%;
    height:48px;
    margin-top:15px;
    background:#e9c300;
    color:#111;
    border:0;
    font-size:17px;
}

@media(max-width:800px){
    #left{
        width:165px;
    }

    #right{
        width:190px;
    }

    #help{
        display:none;
    }
}
</style>
</head>

<body>

<div id="top">

    <div class="logo">GHOST 3D</div>

    <button class="topBtn active" id="hand">
        ✋ HAND
    </button>

    <button class="topBtn" id="select">
        ↖ AUSWAHL
    </button>

    <button class="topBtn" id="move">
        ↔ MOVE
    </button>

    <button class="topBtn" id="rotate">
        ⟳ ROTATE
    </button>

    <button class="topBtn" id="scale">
        ⤢ SCALE
    </button>

    <button class="topBtn" id="gravity">
        🪐 SCHWERKRAFT
    </button>

    <button class="topBtn" id="newMap">
        🌍 NEUE INSEL
    </button>

    <button class="topBtn" id="save">
        💾 SPEICHERN
    </button>

    <button class="topBtn" id="load">
        📂 LADEN
    </button>

    <button class="topBtn" id="play">
        ▶ PLAY
    </button>

</div>


<div id="left">

    <div class="title">LANDSCAPE</div>

    <button class="tool active" id="raise">
        ⬆ ERHÖHEN
    </button>

    <button class="tool" id="lower">
        ⬇ SENKEN
    </button>

    <button class="tool" id="smooth">
        ◯ GLÄTTEN
    </button>

    <button class="tool" id="flatten">
        ▬ EBENEN
    </button>

    <div class="section">

        <div class="title">BRUSH</div>

        <div class="label">
            <span>Größe</span>
            <b id="sizeValue">25</b>
        </div>

        <input
            id="brushSize"
            type="range"
            min="5"
            max="100"
            value="25"
        >

        <div class="label" style="margin-top:10px">
            <span>Stärke</span>
            <b id="strengthValue">5</b>
        </div>

        <input
            id="strength"
            type="range"
            min="1"
            max="30"
            value="5"
        >

    </div>


    <div class="section">

        <div class="title">OBJECTS</div>

        <button class="tool" id="cube">
            + WÜRFEL
        </button>

        <button class="tool" id="sphere">
            + KUGEL
        </button>

    </div>

</div>


<div id="right">

    <div class="title">INSPECTOR</div>

    <label>Objektname</label>
    <input id="name" type="text">

    <div class="section">

        <div class="title">POSITION</div>

        <div class="row">
            <div>
                <label>X</label>
                <input id="px" type="number" step=".1">
            </div>

            <div>
                <label>Y</label>
                <input id="py" type="number" step=".1">
            </div>
        </div>

        <label>Z</label>
        <input id="pz" type="number" step=".1">

    </div>


    <div class="section">

        <div class="title">ROTATION</div>

        <div class="row">
            <div>
                <label>X</label>
                <input id="rx" type="number" step="1">
            </div>

            <div>
                <label>Y</label>
                <input id="ry" type="number" step="1">
            </div>
        </div>

        <label>Z</label>
        <input id="rz" type="number" step="1">

    </div>


    <div class="section">

        <div class="title">SCALE</div>

        <input id="scaleValue" type="number" value="1" min=".05" step=".05">

    </div>


    <button class="small" id="apply">
        ÜBERNEHMEN
    </button>

    <button class="small" id="duplicate">
        DUPLIZIEREN
    </button>

    <button class="small" id="delete">
        LÖSCHEN
    </button>


    <div class="section">

        <div class="title">SCRIPT</div>

        <textarea id="script"></textarea>

        <button class="small" id="applyScript">
            SCRIPT ÜBERNEHMEN
        </button>

    </div>

</div>


<div id="status">
    HAND
</div>

<div id="help">
    HAND: Maus = Umschauen · WASD = Bewegen · Mausrad = Zoom · Sculpt = Terrain bearbeiten
</div>


<div id="start">

    <div class="startBox">

        <h1>GHOST 3D</h1>

        <p>
            Unreal-inspirierte Landscape-Engine
        </p>

        <p>
            Große zusammenhängende Landschaft ohne Chunks.
        </p>

        <button id="startButton">
            ENGINE STARTEN
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x68c3ed);

scene.fog =
    new THREE.Fog(
        0x68c3ed,
        600,
        3000
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        65,
        innerWidth / innerHeight,
        .1,
        10000
    );


camera.position.set(
    0,
    180,
    500
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x6d8590,
        1.7
    )
);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.2
    );

sun.position.set(
    400,
    800,
    300
);

sun.castShadow = true;

scene.add(sun);


/* =========================================================
   RANDOM SEED
========================================================= */

let seed =
    Math.floor(
        Math.random()*2147483647
    );


/* =========================================================
   TERRAIN
========================================================= */

const SIZE = 1200;

const SEGMENTS = 180;

const HALF = SIZE/2;

const geometry =
    new THREE.PlaneGeometry(
        SIZE,
        SIZE,
        SEGMENTS,
        SEGMENTS
    );

geometry.rotateX(-Math.PI/2);


const position =
    geometry.attributes.position;


const heights =
    new Float32Array(
        position.count
    );


/* =========================================================
   NOISE
========================================================= */

function random2(x,z){

    let n =
        Math.sin(
            x*127.1 +
            z*311.7 +
            seed*.00001
        ) *
        43758.5453123;

    return n -
        Math.floor(n);
}


function noise(x,z){

    const x0 =
        Math.floor(x);

    const z0 =
        Math.floor(z);

    const x1 =
        x0+1;

    const z1 =
        z0+1;

    const sx =
        x-x0;

    const sz =
        z-z0;

    const u =
        sx*sx*(3-2*sx);

    const v =
        sz*sz*(3-2*sz);

    const a =
        random2(x0,z0);

    const b =
        random2(x1,z0);

    const c =
        random2(x0,z1);

    const d =
        random2(x1,z1);

    return (
        a+(b-a)*u
    ) +
    (
        c+(d-c)*u
    -
        (a+(b-a)*u)
    )*v;
}


/* =========================================================
   UNREAL-STYLE LANDSCAPE HEIGHT
========================================================= */

function landscapeHeight(x,z){

    const nx =
        x/(SIZE*.47);

    const nz =
        z/(SIZE*.47);

    const dist =
        Math.sqrt(
            nx*nx+nz*nz
        );


    /*
       Große Inselbasis
    */

    let island =
        Math.max(
            0,
            1-Math.pow(dist,1.55)
        );


    /*
       Unregelmäßige Küste
    */

    const coast =
        noise(
            x*.012,
            z*.012
        );

    island +=
        (coast-.5)*
        .25*
        Math.max(
            0,
            1-dist
        );


    island =
        Math.max(
            0,
            island
        );


    /*
       Multi-Layer Landscape Noise
    */

    const large =
        noise(
            x*.004,
            z*.004
        );

    const medium =
        noise(
            x*.012,
            z*.012
        );

    const small =
        noise(
            x*.035,
            z*.035
        );


    let h =

        island*70

        +

        large*
        45*
        island

        +

        medium*
        22*
        island

        +

        small*
        8*
        island;


    /*
       Berge im Inselinneren
    */

    const mountain =
        Math.max(
            0,
            1-dist*1.8
        );

    h +=
        mountain *
        Math.pow(
            large,
            2
        ) *
        80;


    /*
       Küste
    */

    h -=
        Math.max(
            0,
            dist-.72
        )*35;


    return h;
}


/* =========================================================
   CREATE TERRAIN
========================================================= */

for(
    let i=0;
    i<position.count;
    i++
){

    const x =
        position.getX(i);

    const z =
        position.getZ(i);

    const h =
        landscapeHeight(
            x,
            z
        );

    position.setY(
        i,
        h
    );

    heights[i] = h;
}


geometry.computeVertexNormals();


const terrain =
    new THREE.Mesh(
        geometry,
        new THREE.MeshStandardMaterial({
            color:0xffffff,
            roughness:1,
            metalness:0
        })
    );


terrain.receiveShadow = true;

scene.add(terrain);


/* =========================================================
   WATER
========================================================= */

const waterGeometry =
    new THREE.PlaneGeometry(
        3000,
        3000
    );

waterGeometry.rotateX(
    -Math.PI/2
);


const water =
    new THREE.Mesh(
        waterGeometry,
        new THREE.MeshStandardMaterial({
            color:0x168ed0,
            roughness:.2,
            metalness:.1
        })
    );

water.position.y = -1;

scene.add(water);


/* =========================================================
   TERRAIN HEIGHT
========================================================= */

function getHeight(x,z){

    if(
        x < -HALF ||
        x > HALF ||
        z < -HALF ||
        z > HALF
    ){
        return -2;
    }

    const fx =
        (x+HALF)/SIZE*
        SEGMENTS;

    const fz =
        (z+HALF)/SIZE*
        SEGMENTS;

    let ix =
        Math.floor(fx);

    let iz =
        Math.floor(fz);

    ix =
        Math.max(
            0,
            Math.min(
                SEGMENTS-1,
                ix
            )
        );

    iz =
        Math.max(
            0,
            Math.min(
                SEGMENTS-1,
                iz
            )
        );

    const tx =
        fx-ix;

    const tz =
        fz-iz;

    const i00 =
        iz*(SEGMENTS+1)+ix;

    const i10 =
        i00+1;

    const i01 =
        i00+(SEGMENTS+1);

    const i11 =
        i01+1;

    const a =
        heights[i00];

    const b =
        heights[i10];

    const c =
        heights[i01];

    const d =
        heights[i11];

    const ab =
        a+(b-a)*tx;

    const cd =
        c+(d-c)*tx;

    return ab+(cd-ab)*tz;
}


/* =========================================================
   RAYCAST
========================================================= */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

let mouseX=0;
let mouseY=0;


function setMouse(e){

    mouseX=e.clientX;
    mouseY=e.clientY;

    mouse.x =
        (e.clientX/innerWidth)*2-1;

    mouse.y =
        -(e.clientY/innerHeight)*2+1;
}


/* =========================================================
   TOOLS
========================================================= */

let currentTool = "hand";

const topTools = {
    hand:document.getElementById("hand"),
    select:document.getElementById("select"),
    move:document.getElementById("move"),
    rotate:document.getElementById("rotate"),
    scale:document.getElementById("scale")
};


const sculptTools = {
    raise:document.getElementById("raise"),
    lower:document.getElementById("lower"),
    smooth:document.getElementById("smooth"),
    flatten:document.getElementById("flatten")
};


function setTool(name){

    currentTool=name;

    Object.values(topTools)
        .forEach(
            b=>b.classList.remove("active")
        );

    Object.values(sculptTools)
        .forEach(
            b=>b.classList.remove("active")
        );

    if(topTools[name]){
        topTools[name]
            .classList.add("active");
    }

    if(sculptTools[name]){
        sculptTools[name]
            .classList.add("active");
    }

    document.getElementById("status")
        .innerText =
        name.toUpperCase();
}


for(
    const [name,button]
    of Object.entries(topTools)
){

    button.onclick=()=>{
        setTool(name);
    };

}


for(
    const [name,button]
    of Object.entries(sculptTools)
){

    button.onclick=()=>{
        setTool(name);
    };

}


/* =========================================================
   BRUSH
========================================================= */

let brushSize=25;

let brushStrength=5;

let mouseDown=false;


document.getElementById("brushSize")
    .oninput=e=>{

        brushSize =
            Number(e.target.value);

        document.getElementById(
            "sizeValue"
        ).innerText =
            brushSize;

    };


document.getElementById("strength")
    .oninput=e=>{

        brushStrength =
            Number(e.target.value);

        document.getElementById(
            "strengthValue"
        ).innerText =
            brushStrength;

    };


/* =========================================================
   SCULPT TERRAIN
========================================================= */

function sculpt(){

    raycaster.setFromCamera(
        mouse,
        camera
    );

    const hit =
        raycaster.intersectObject(
            terrain
        )[0];

    if(!hit)
        return;


    const point =
        hit.point;


    const radius =
        brushSize;


    const minX =
        Math.max(
            -HALF,
            point.x-radius
        );

    const maxX =
        Math.min(
            HALF,
            point.x+radius
        );

    const minZ =
        Math.max(
            -HALF,
            point.z-radius
        );

    const maxZ =
        Math.min(
            HALF,
            point.z+radius
        );


    const step =
        SIZE/SEGMENTS;


    const startX =
        Math.floor(
            (minX+HALF)/step
        );

    const endX =
        Math.ceil(
            (maxX+HALF)/step
        );

    const startZ =
        Math.floor(
            (minZ+HALF)/step
        );

    const endZ =
        Math.ceil(
            (maxZ+HALF)/step
        );


    const centerHeight =
        getHeight(
            point.x,
            point.z
        );


    for(
        let iz=startZ;
        iz<=endZ;
        iz++
    ){

        if(
            iz<0 ||
            iz>SEGMENTS
        )
            continue;


        for(
            let ix=startX;
            ix<=endX;
            ix++
        ){

            if(
                ix<0 ||
                ix>SEGMENTS
            )
                continue;


            const x =
                -HALF+
                ix*step;

            const z =
                -HALF+
                iz*step;


            const dx =
                x-point.x;

            const dz =
                z-point.z;

            const distance =
                Math.sqrt(
                    dx*dx+
                    dz*dz
                );


            if(
                distance>radius
            )
                continue;


            let falloff =
                1-
                distance/radius;


            falloff =
                falloff*
                falloff;


            const index =
                iz*(SEGMENTS+1)+ix;


            if(currentTool==="raise"){

                heights[index] +=
                    brushStrength*
                    .12*
                    falloff;

            }


            if(currentTool==="lower"){

                heights[index] -=
                    brushStrength*
                    .12*
                    falloff;

            }


            if(currentTool==="smooth"){

                heights[index] +=
                    (
                        centerHeight-
                        heights[index]
                    )*
                    .08*
                    falloff;

            }


            if(currentTool==="flatten"){

                heights[index] +=
                    (
                        centerHeight-
                        heights[index]
                    )*
                    .18*
                    falloff;

            }

        }

    }


    for(
        let i=0;
        i<position.count;
        i++
    ){

        position.setY(
            i,
            heights[i]
        );

    }


    position.needsUpdate=true;

    geometry.computeVertexNormals();

    geometry.attributes.normal
        .needsUpdate=true;
}


/* =========================================================
   MOUSE
========================================================= */

renderer.domElement.addEventListener(
    "pointerdown",
    e=>{

        mouseDown=true;

        setMouse(e);

        if(
            currentTool!=="hand" &&
            currentTool!=="select" &&
            currentTool!=="move" &&
            currentTool!=="rotate" &&
            currentTool!=="scale"
        ){

            sculpt();
        }

        if(
            currentTool==="select"
        ){

            selectObject();
        }

    }
);


renderer.domElement.addEventListener(
    "pointermove",
    e=>{

        setMouse(e);

        if(
            mouseDown &&
            ["raise","lower","smooth","flatten"]
            .includes(currentTool)
        ){

            sculpt();

        }

    }
);


window.addEventListener(
    "pointerup",
    ()=>{
        mouseDown=false;
    }
);


/* =========================================================
   CAMERA / HAND
========================================================= */

let yaw=0;

let pitch=-.35;

let cameraDistance=500;

let looking=false;

let lastMouseX=0;

let lastMouseY=0;


renderer.domElement.addEventListener(
    "pointerdown",
    e=>{

        if(currentTool==="hand"){

            looking=true;

            lastMouseX=e.clientX;
            lastMouseY=e.clientY;

        }

    }
);


window.addEventListener(
    "pointerup",
    ()=>{
        looking=false;
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    e=>{

        if(
            !looking ||
            currentTool!=="hand"
        )
            return;


        const dx =
            e.clientX-lastMouseX;

        const dy =
            e.clientY-lastMouseY;


        yaw -= dx*.006;

        pitch -= dy*.005;


        pitch =
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    pitch
                )
            );


        lastMouseX=e.clientX;
        lastMouseY=e.clientY;

    }
);


/* =========================================================
   ZOOM
========================================================= */

renderer.domElement.addEventListener(
    "wheel",
    e=>{

        e.preventDefault();

        cameraDistance *=
            Math.exp(
                e.deltaY*.0012
            );

        cameraDistance =
            Math.max(
                2,
                Math.min(
                    5000,
                    cameraDistance
                )
            );

    },
    {passive:false}
);


/* =========================================================
   WASD
========================================================= */

const keys={};

window.addEventListener(
    "keydown",
    e=>{
        keys[e.key.toLowerCase()]=true;
    }
);

window.addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);


/* =========================================================
   CAMERA TARGET
========================================================= */

const target =
    new THREE.Vector3(
        0,
        0,
        0
    );


function updateCamera(){

    if(currentTool==="hand"){

        const speed=3;

        const forward =
            new THREE.Vector3(
                Math.sin(yaw),
                0,
                Math.cos(yaw)
            );

        const right =
            new THREE.Vector3(
                Math.cos(yaw),
                0,
                -Math.sin(yaw)
            );


        if(keys.w)
            target.addScaledVector(
                forward,
                speed
            );

        if(keys.s)
            target.addScaledVector(
                forward,
                -speed
            );

        if(keys.a)
            target.addScaledVector(
                right,
                -speed
            );

        if(keys.d)
            target.addScaledVector(
                right,
                speed
            );

    }


    const x =
        target.x+
        Math.sin(yaw)*
        Math.cos(pitch)*
        cameraDistance;

    const y =
        target.y+
        Math.sin(pitch)*
        cameraDistance;

    const z =
        target.z+
        Math.cos(yaw)*
        Math.cos(pitch)*
        cameraDistance;


    camera.position.set(
        x,
        y,
        z
    );

    camera.lookAt(target);

}


/* =========================================================
   OBJECT SYSTEM
========================================================= */

const objects=[];

let selected=null;


function addObject(mesh){

    mesh.castShadow=true;

    mesh.receiveShadow=true;

    mesh.userData.script="";

    mesh.userData.name=
        "Object_"+(objects.length+1);

    scene.add(mesh);

    objects.push(mesh);

    selected=mesh;

    updateInspector();

}


document.getElementById("cube").onclick=()=>{

    const cube =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                30,
                30,
                30
            ),
            new THREE.MeshStandardMaterial({
                color:0xffaa22
            })
        );

    cube.position.set(
        target.x,
        getHeight(
            target.x,
            target.z
        )+15,
        target.z
    );

    addObject(cube);
};


document.getElementById("sphere").onclick=()=>{

    const sphere =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                18,
                32,
                20
            ),
            new THREE.MeshStandardMaterial({
                color:0x55aaff
            })
        );

    sphere.position.set(
        target.x,
        getHeight(
            target.x,
            target.z
        )+18,
        target.z
    );

    addObject(sphere);
};


/* =========================================================
   SELECT
========================================================= */

function selectObject(){

    raycaster.setFromCamera(
        mouse,
        camera
    );

    const hits =
        raycaster.intersectObjects(
            objects,
            true
        );

    if(!hits.length)
        return;

    let obj=hits[0].object;

    while(
        obj.parent &&
        obj.parent!==scene
    ){

        if(
            objects.includes(obj)
        )
            break;

        obj=obj.parent;
    }

    if(objects.includes(obj)){

        selected=obj;

        updateInspector();

    }
}


/* =========================================================
   INSPECTOR
========================================================= */

function updateInspector(){

    if(!selected){

        document.getElementById("name")
            .value="";

        return;
    }


    document.getElementById("name")
        .value=
        selected.userData.name || "";


    document.getElementById("px")
        .value=selected.position.x.toFixed(2);

    document.getElementById("py")
        .value=selected.position.y.toFixed(2);

    document.getElementById("pz")
        .value=selected.position.z.toFixed(2);


    document.getElementById("rx")
        .value=
        THREE.MathUtils.radToDeg(
            selected.rotation.x
        ).toFixed(1);

    document.getElementById("ry")
        .value=
        THREE.MathUtils.radToDeg(
            selected.rotation.y
        ).toFixed(1);

    document.getElementById("rz")
        .value=
        THREE.MathUtils.radToDeg(
            selected.rotation.z
        ).toFixed(1);


    document.getElementById("scaleValue")
        .value=
        selected.scale.x.toFixed(2);


    document.getElementById("script")
        .value=
        selected.userData.script || "";
}


document.getElementById("apply")
.onclick=()=>{

    if(!selected)
        return;

    selected.userData.name =
        document.getElementById("name")
            .value;


    selected.position.set(
        Number(document.getElementById("px").value),
        Number(document.getElementById("py").value),
        Number(document.getElementById("pz").value)
    );


    selected.rotation.set(
        THREE.MathUtils.degToRad(
            Number(document.getElementById("rx").value)
        ),
        THREE.MathUtils.degToRad(
            Number(document.getElementById("ry").value)
        ),
        THREE.MathUtils.degToRad(
            Number(document.getElementById("rz").value)
        )
    );


    const s =
        Number(
            document.getElementById("scaleValue").value
        );

    selected.scale.setScalar(s);

};


/* =========================================================
   TRANSFORM WITH MOUSE
========================================================= */

let transformStart=null;

let transformMouseX=0;


renderer.domElement.addEventListener(
    "pointerdown",
    e=>{

        if(
            !["move","rotate","scale"]
            .includes(currentTool)
        )
            return;


        raycaster.setFromCamera(
            mouse,
            camera
        );

        const hits =
            raycaster.intersectObjects(
                objects,
                true
            );

        if(!hits.length)
            return;

        let obj=hits[0].object;

        while(
            obj.parent &&
            obj.parent!==scene &&
            !objects.includes(obj)
        ){
            obj=obj.parent;
        }

        if(
            !objects.includes(obj)
        )
            return;

        selected=obj;

        transformStart={
            position:obj.position.clone(),
            rotation:obj.rotation.clone(),
            scale:obj.scale.clone()
        };

        transformMouseX=e.clientX;

    }
);


renderer.domElement.addEventListener(
    "pointermove",
    e=>{

        if(
            !transformStart ||
            !selected
        )
            return;


        const dx =
            e.clientX-transformMouseX;


        if(currentTool==="move"){

            selected.position.x =
                transformStart.position.x+
                dx*.15;

            selected.position.y =
                transformStart.position.y;

        }


        if(currentTool==="rotate"){

            selected.rotation.y =
                transformStart.rotation.y+
                dx*.01;

        }


        if(currentTool==="scale"){

            const s =
                Math.max(
                    .05,
                    transformStart.scale.x+
                    dx*.01
                );

            selected.scale.setScalar(s);

        }


        updateInspector();

    }
);


window.addEventListener(
    "pointerup",
    ()=>{
        transformStart=null;
    }
);


/* =========================================================
   DUPLICATE
========================================================= */

document.getElementById("duplicate")
.onclick=()=>{

    if(!selected)
        return;

    const clone =
        selected.clone(true);

    clone.position.x+=30;

    clone.userData =
        {...selected.userData};

    clone.userData.name =
        selected.userData.name+
        "_Copy";

    scene.add(clone);

    objects.push(clone);

    selected=clone;

    updateInspector();
};


/* =========================================================
   DELETE
========================================================= */

document.getElementById("delete")
.onclick=()=>{

    if(!selected)
        return;

    scene.remove(selected);

    const i =
        objects.indexOf(selected);

    if(i!==-1)
        objects.splice(i,1);

    selected=null;

    updateInspector();
};


/* =========================================================
   SCRIPT
========================================================= */

document.getElementById("applyScript")
.onclick=()=>{

    if(!selected)
        return;

    selected.userData.script =
        document.getElementById("script")
            .value;
};


/* =========================================================
   PLAY MODE
========================================================= */

let playing=false;


document.getElementById("play")
.onclick=()=>{

    playing=!playing;

    document.getElementById("play")
        .classList.toggle(
            "active",
            playing
        );

    document.getElementById("play")
        .innerText =
        playing
        ? "■ STOP"
        : "▶ PLAY";
};


function runScripts(){

    if(!playing)
        return;

    for(
        const object of objects
    ){

        const code =
            object.userData.script;

        if(!code)
            continue;

        try{

            new Function(
                "object",
                "THREE",
                code
            )(
                object,
                THREE
            );

        }catch(err){

            console.warn(
                "Script error:",
                err
            );

        }

    }
}


/* =========================================================
   GRAVITY
========================================================= */

let gravityEnabled=false;

let verticalVelocity=0;


document.getElementById("gravity")
.onclick=()=>{

    gravityEnabled=
        !gravityEnabled;

    document.getElementById("gravity")
        .classList.toggle(
            "active",
            gravityEnabled
        );

};


function updateGravity(){

    if(!gravityEnabled)
        return;


    verticalVelocity-=.45;

    target.y+=
        verticalVelocity;


    const ground =
        getHeight(
            target.x,
            target.z
        );


    const minHeight =
        ground+30;


    if(target.y<minHeight){

        target.y=minHeight;

        verticalVelocity=0;

    }

}


/* =========================================================
   SAVE
========================================================= */

document.getElementById("save")
.onclick=()=>{

    const data={

        seed:seed,

        heights:Array.from(
            heights
        ),

        camera:{

            target:[
                target.x,
                target.y,
                target.z
            ],

            yaw:yaw,
            pitch:pitch,
            distance:cameraDistance

        },

        objects:
            objects.map(
                o=>({

                    name:o.userData.name,

                    type:
                        o.geometry
                            instanceof
                            THREE.SphereGeometry
                        ? "sphere"
                        : "cube",

                    position:[
                        o.position.x,
                        o.position.y,
                        o.position.z
                    ],

                    rotation:[
                        o.rotation.x,
                        o.rotation.y,
                        o.rotation.z
                    ],

                    scale:[
                        o.scale.x,
                        o.scale.y,
                        o.scale.z
                    ],

                    script:
                        o.userData.script || ""

                })
            )

    };


    const blob =
        new Blob(
            [JSON.stringify(data)],
            {
                type:"application/json"
            }
        );


    const a =
        document.createElement("a");

    a.href =
        URL.createObjectURL(blob);

    a.download=
        "ghost-landscape.json";

    a.click();

    URL.revokeObjectURL(
        a.href
    );

};


/* =========================================================
   LOAD
========================================================= */

const fileInput =
    document.createElement("input");

fileInput.type="file";

fileInput.accept=".json";


document.getElementById("load")
.onclick=()=>{
    fileInput.click();
};


fileInput.onchange=e=>{

    const file=
        e.target.files[0];

    if(!file)
        return;

    const reader=
        new FileReader();


    reader.onload=()=>{

        try{

            const data=
                JSON.parse(
                    reader.result
                );


            if(
                Array.isArray(
                    data.heights
                )
            ){

                for(
                    let i=0;
                    i<heights.length;
                    i++
                ){

                    heights[i]=
                        data.heights[i] ??
                        heights[i];

                    position.setY(
                        i,
                        heights[i]
                    );

                }

                position.needsUpdate=true;

                geometry.computeVertexNormals();

            }


            if(data.camera){

                target.set(
                    data.camera.target[0],
                    data.camera.target[1],
                    data.camera.target[2]
                );

                yaw=
                    data.camera.yaw;

                pitch=
                    data.camera.pitch;

                cameraDistance=
                    data.camera.distance;

            }


            for(
                const o of objects
            )
                scene.remove(o);

            objects.length=0;

            selected=null;


            if(
                Array.isArray(
                    data.objects
                )
            ){

                for(
                    const d of data.objects
                ){

                    let mesh;


                    if(
                        d.type==="sphere"
                    ){

                        mesh=
                            new THREE.Mesh(
                                new THREE.SphereGeometry(
                                    18,
                                    32,
                                    20
                                ),
                                new THREE.MeshStandardMaterial({
                                    color:0x55aaff
                                })
                            );

                    }else{

                        mesh=
                            new THREE.Mesh(
                                new THREE.BoxGeometry(
                                    30,
                                    30,
                                    30
                                ),
                                new THREE.MeshStandardMaterial({
                                    color:0xffaa22
                                })
                            );

                    }


                    mesh.position.fromArray(
                        d.position
                    );

                    mesh.rotation.set(
                        d.rotation[0],
                        d.rotation[1],
                        d.rotation[2]
                    );

                    mesh.scale.fromArray(
                        d.scale
                    );

                    mesh.castShadow=true;

                    mesh.receiveShadow=true;

                    mesh.userData.name=
                        d.name;

                    mesh.userData.script=
                        d.script || "";

                    scene.add(mesh);

                    objects.push(mesh);

                }

            }

        }catch(err){

            alert(
                "Projekt konnte nicht geladen werden."
            );

        }

    };


    reader.readAsText(file);

};


/* =========================================================
   NEW RANDOM ISLAND
========================================================= */

document.getElementById("newMap")
.onclick=()=>{

    location.reload();

};


/* =========================================================
   START
========================================================= */

document.getElementById("startButton")
.onclick=()=>{

    document.getElementById("start")
        .style.display="none";

};


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    updateGravity();

    updateCamera();

    runScripts();


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>
