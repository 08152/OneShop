<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live GPS Navi</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

html,body{
margin:0;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
}


#map{
width:100%;
height:100%;
}


.panel{

position:absolute;
top:10px;
left:10px;
right:10px;

z-index:1000;

background:white;

padding:12px;

border-radius:20px;

box-shadow:0 5px 20px rgba(0,0,0,.3);

}



input,button{

width:100%;

padding:14px;

margin-top:8px;

font-size:17px;

border-radius:12px;

border:1px solid #aaa;

box-sizing:border-box;

}



button{

background:#006cff;

color:white;

font-weight:bold;

}



#locationBtn{

position:absolute;

right:15px;

top:70px;

width:60px;

height:60px;

font-size:25px;

z-index:2000;

}



#fullscreenBtn{

position:absolute;

right:15px;

top:140px;

width:60px;

height:60px;

font-size:25px;

z-index:2000;

}




.car-icon{

font-size:45px;

text-align:center;

transform-origin:center;

}



#naviInfo{

position:absolute;

bottom:20px;

left:20px;

right:20px;

z-index:3000;

background:rgba(0,0,0,.8);

color:white;

padding:20px;

border-radius:20px;

text-align:center;

font-size:24px;

display:none;

}



.arrow{

font-size:80px;

}



</style>

</head>


<body>


<div class="panel">


<input id="ziel" placeholder="Ziel eingeben">


<button onclick="prepareRoute()">

🔎 Route suchen

</button>



<button id="startBtn"
style="display:none"
onclick="startNavigation()">

🚗 Navigation starten

</button>



<div id="info">

📍 Suche GPS...

</div>


</div>




<button id="locationBtn"
onclick="centerLocation()">

📍

</button>



<button id="fullscreenBtn"
onclick="toggleNaviMode()">

⛶

</button>





<div id="naviInfo">

<div class="arrow">

⬆️

</div>


<div id="naviText">

Navigation

</div>


</div>




<div id="map"></div>





<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>



<script>


let map =
L.map("map")
.setView([48.1351,11.5820],16);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19

}

).addTo(map);




let currentPos=null;

let marker=null;


let routeLine=null;

let navigationLine=null;



let routing=[];


let instructions=[];


let nextInstruction=0;



let followLocation=true;


let navigationStarted=false;



let heading=0;



let carIcon=L.divIcon({

html:"⬆️",

className:"car-icon",

iconSize:[50,50],

iconAnchor:[25,25]

});
// ===============================
// LIVE GPS TRACKING
// ===============================


navigator.geolocation.watchPosition(

function(position){



let lat =
position.coords.latitude;


let lon =
position.coords.longitude;



currentPos=[lat,lon];




// GPS Anzeige

document.getElementById("info").innerHTML =

"📍 "
+
lat.toFixed(6)
+
", "
+
lon.toFixed(6);







// Richtung vom GPS

if(position.coords.heading !== null &&
position.coords.heading !== undefined &&
!isNaN(position.coords.heading)){


heading =
position.coords.heading;



let car =
document.querySelector(".car-icon");



if(car){


car.style.transform =
"rotate("
+
heading
+
"deg)";


}


}








// Auto erstellen

if(marker===null){


marker =
L.marker(

currentPos,

{
icon:carIcon
}

)
.addTo(map);



map.setView(

currentPos,

18

);



}

else{


marker.setLatLng(

currentPos

);


}







// Karte folgt Bewegung


if(followLocation){



map.panTo(

currentPos,

{

animate:true,

duration:1

}

);



}






// Navigation prüfen


if(navigationStarted){


updateNavigationLine();


checkRoute();


checkInstructions();


}




},





function(error){



document.getElementById("info").innerHTML=

"❌ GPS Fehler: "
+
error.message;



},





{

enableHighAccuracy:true,

maximumAge:0,

timeout:10000

}



);









// ===============================
// STANDORT KNOPF
// ===============================


function centerLocation(){


if(currentPos){


followLocation=true;



map.setView(

currentPos,

19,

{

animate:true

}

);



}


}









// ===============================
// BENUTZER BEWEGT KARTE
// DANN NICHT MEHR FOLGEN
// ===============================


map.on(

"dragstart",

function(){


followLocation=false;


}

);



map.on(

"zoomstart",

function(){


followLocation=false;


}

);








// ===============================
// NAVIGATION START
// ===============================


function startNavigation(){


navigationStarted=true;


followLocation=true;



document.getElementById("naviInfo")
.style.display="block";



speak(

"Navigation gestartet"

);


}









// ===============================
// ROUTE SUCHEN
// ===============================


async function prepareRoute(){


document.getElementById("startBtn")
.style.display="block";


await route();


}
// ===============================
// ROUTE BERECHNEN
// ===============================


async function route(){


if(!currentPos){

alert("GPS noch nicht bereit");

return;

}



let ziel =
document.getElementById("ziel").value;



let geo =
await fetch(

"https://nominatim.openstreetmap.org/search?format=json&q="
+
encodeURIComponent(ziel)

);



let data =
await geo.json();



if(!data.length){

alert("Ziel nicht gefunden");

return;

}



let zielPos=[

parseFloat(data[0].lat),

parseFloat(data[0].lon)

];





let url =

"https://router.project-osrm.org/route/v1/driving/"
+
currentPos[1]
+
","
+
currentPos[0]
+
";"
+
zielPos[1]
+
","
+
zielPos[0]
+
"?overview=full&steps=true&geometries=geojson";





let res =
await fetch(url);



let json =
await res.json();



let r =
json.routes[0];





routing =
r.geometry.coordinates.map(

c=>[c[1],c[0]]

);





if(routeLine)

map.removeLayer(routeLine);



routeLine =
L.polyline(

routing,

{

color:"blue",

weight:8

}

)
.addTo(map);





navigationLine =
L.polyline(

routing,

{

color:"#006cff",

weight:8

}

)
.addTo(map);







instructions=[];



r.legs[0].steps.forEach(step=>{


instructions.push({

text:createInstruction(step),

distance:step.distance

});


});



nextInstruction=0;



document.getElementById("info").innerHTML=

"🚗 "
+
(r.distance/1000).toFixed(1)
+
" km | ⏱ "
+
Math.round(r.duration/60)
+
" Minuten";



}









// ===============================
// BLAUE LINIE AKTUALISIEREN
// ===============================


function updateNavigationLine(){


if(!navigationLine ||
!routing.length ||
!currentPos)

return;



let index=0;

let min=999999;



routing.forEach((p,i)=>{


let d =
map.distance(

currentPos,

p

);



if(d<min){

min=d;

index=i;

}


});



navigationLine.setLatLngs(

routing.slice(index)

);


}










// ===============================
// ANSAGE TEXT
// ===============================


function createInstruction(step){


let road="";



if(step.name){

road=
" auf "
+
step.name;

}



let m =
step.maneuver;



if(m.type==="arrive"){

return "Sie haben Ihr Ziel erreicht";

}



if(m.type==="roundabout"){


return (

"Kreisverkehr. "
+
"Die "
+
(m.exit||1)
+
". Ausfahrt nehmen"
+
road

);


}



if(m.type==="turn"){



switch(m.modifier){


case "left":

return "Links abbiegen"
+
road;



case "right":

return "Rechts abbiegen"
+
road;



case "slight left":

return "Links halten"
+
road;



case "slight right":

return "Rechts halten"
+
road;



case "sharp left":

return "Scharf links abbiegen"
+
road;



case "sharp right":

return "Scharf rechts abbiegen"
+
road;



case "uturn":

return "Bitte wenden"
+
road;


}



}



return "Geradeaus weiterfahren"
+
road;


}









// ===============================
// ABBIEGEANSAGEN
// ===============================


let said300=false;
let said100=false;
let said50=false;
let saidNow=false;



function checkInstructions(){



if(nextInstruction>=instructions.length)

return;



let i =
instructions[nextInstruction];



let d =
i.distance;





if(d<300 && !said300){

speak(
"In 300 Metern. "
+
i.text
);

said300=true;

}



if(d<100 && !said100){

speak(
"In 100 Metern. "
+
i.text
);

said100=true;

}




if(d<50 && !said50){

speak(
"In 50 Metern. "
+
i.text
);

said50=true;

}




if(d<15 && !saidNow){


speak(
"Jetzt. "
+
i.text
);


document.getElementById("naviText")
.innerHTML=i.text;



nextInstruction++;


said300=false;
said100=false;
said50=false;
saidNow=false;


}


}









// ===============================
// ROUTE VERLASSEN
// ===============================


function checkRoute(){



if(!routing.length ||
!currentPos)

return;



let min=999999;



routing.forEach(p=>{


let d =
map.distance(
currentPos,
p
);



if(d<min)

min=d;


});



if(min>80){


speak(
"Route verlassen. Neue Route wird berechnet."
);


route();


}


}









// ===============================
// SPRACHANSAGE
// ===============================


let selectedVoice=null;



function loadVoice(){


let voices =
speechSynthesis.getVoices();



selectedVoice =
voices.find(v=>
v.lang.startsWith("de")
);


}



speechSynthesis.onvoiceschanged =
loadVoice;


loadVoice();





function speak(text){


speechSynthesis.cancel();



let msg =
new SpeechSynthesisUtterance(text);



msg.lang="de-DE";



if(selectedVoice)

msg.voice=selectedVoice;



msg.rate=0.9;

msg.pitch=1;



speechSynthesis.speak(msg);


}










// ===============================
// VOLLBILD
// ===============================


let fullscreen=false;



function toggleNaviMode(){


if(!fullscreen){


document.documentElement.requestFullscreen();



document.querySelector(".panel")
.style.display="none";



document.getElementById("naviInfo")
.style.display="block";



fullscreen=true;



}

else{


document.exitFullscreen();



document.querySelector(".panel")
.style.display="block";



document.getElementById("naviInfo")
.style.display="none";



fullscreen=false;


}



}





</script>

</body>

</html>
