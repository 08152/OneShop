<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZEROPOINT – Mapper</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#8acfff;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:16px;
    left:16px;
    z-index:20;
    width:360px;
    padding:16px;
    border-radius:16px;
    background:rgba(18,22,25,.88);
    color:white;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
    backdrop-filter:blur(8px);
}

#title{
    font-size:26px;
    font-weight:bold;
    margin-bottom:12px;
}

.row{
    display:flex;
    gap:8px;
    margin-top:8px;
}

input{
    min-width:0;
    flex:1;
    padding:11px;
    border:0;
    border-radius:9px;
    background:#0d1012;
    color:white;
    outline:none;
    font-family:monospace;
}

button{
    border:0;
    border-radius:9px;
    padding:11px 13px;
    font-weight:bold;
    cursor:pointer;
    color:white;
}

#generate{
    background:#36a852;
    flex:1;
}

#export{
    width:100%;
    margin-top:8px;
    background:#2868d7;
}

button:active{
    transform:scale(.97);
}

#info{
    margin-top:12px;
    font-size:13px;
    line-height:1.5;
    color:#d8dee2;
}

#loading{
    position:absolute;
    inset:0;
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:20px;
    font-weight:bold;
    background:rgba(0,0,0,.3);
}

#hint{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    padding:9px 14px;
    border-radius:10px;
    background:rgba(0,0,0,.5);
    color:white;
    font-size:13px;
    pointer-events:none;
}
</style>
</head>

<body>

<div id="ui">
    <div id="title">ZEROPOINT · MAPPER</div>

    <div class="row">
        <input id="seedInput" placeholder="Seed eingeben...">
        <button id="generate">Neue Welt</button>
    </div>

    <button id="export">GLB herunterladen</button>

    <div id="info">
        Seed: <b id="seedText">-</b><br>
        Welt: 6000 × 6000<br>
        Chunks: <b id="chunkText">0</b><br>
        Kamera: freie 3D-Betrachtung
    </div>
</div>

<div id="loading">ZEROPOINT WIRD GENERIERT...</div>

<div id="hint">
    Linke Maustaste = drehen · Mausrad = zoomen · rechte Maustaste = verschieben
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/exporters/GLTFExporter.js"></script>

<script>

// ============================================================
// ZEROPOINT MAPPER
// ============================================================

const WORLD_SIZE = 6000;
const CHUNK_SIZE = 300;
const GRID = WORLD_SIZE / CHUNK_SIZE;

let seed = randomSeed();

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87cefa);

scene.fog = new THREE.Fog(
    0x87cefa,
    900,
    4300
);


// ============================================================
// KAMERA
// ============================================================

const camera = new THREE.PerspectiveCamera(
    55,
    innerWidth / innerHeight,
    0.1,
    12000
);

camera.position.set(
    850,
    850,
    850
);


// ============================================================
// RENDERER
// ============================================================

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


// ============================================================
// ORBIT-KAMERA
// ============================================================

const controls = new THREE.OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = .055;

controls.minDistance = 80;
controls.maxDistance = 7000;

controls.maxPolarAngle = Math.PI * .495;

controls.target.set(
    0,
    50,
    0
);


// ============================================================
// LICHT
// ============================================================

scene.add(
    new THREE.HemisphereLight(
        0xcfeeff,
        0x4c3928,
        1.5
    )
);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    1200,
    1800,
    800
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -1800;
sun.shadow.camera.right = 1800;
sun.shadow.camera.top = 1800;
sun.shadow.camera.bottom = -1800;

scene.add(sun);


// ============================================================
// SEED
// ============================================================

function randomSeed(){

    return Math.floor(
        Math.random()*2147483647
    );

}

function hash2(x,z){

    let n =
        Math.imul(
            x|0,
            374761393
        ) ^
        Math.imul(
            z|0,
            668265263
        ) ^
        Math.imul(
            seed|0,
            1442695041
        );

    n ^= n >>> 13;
    n = Math.imul(n,1274126177);
    n ^= n >>> 16;

    return (n >>> 0) / 4294967295;

}


// ============================================================
// SMOOTH NOISE
// ============================================================

function fade(t){
    return t*t*(3-2*t);
}

function noise(x,z){

    const x0 = Math.floor(x);
    const z0 = Math.floor(z);

    const x1 = x0+1;
    const z1 = z0+1;

    const sx = fade(x-x0);
    const sz = fade(z-z0);

    const a = hash2(x0,z0);
    const b = hash2(x1,z0);
    const c = hash2(x0,z1);
    const d = hash2(x1,z1);

    const ab = a+(b-a)*sx;
    const cd = c+(d-c)*sx;

    return ab+(cd-ab)*sz;

}


// ============================================================
// FRAKTALES TERRAIN
// ============================================================

function fbm(x,z){

    let value = 0;
    let amplitude = .5;
    let frequency = 1;

    for(let i=0;i<5;i++){

        value +=
            noise(
                x*frequency,
                z*frequency
            ) * amplitude;

        frequency *= 2;
        amplitude *= .5;
    }

    return value;
}


// ============================================================
// TERRAIN
// ============================================================

function terrainHeight(x,z){

    const nx = x / WORLD_SIZE;
    const nz = z / WORLD_SIZE;

    let h = 0;

    // große Landschaft
    h +=
        (fbm(x*.00075,z*.00075)-.5)
        * 300;

    // mittlere Hügel
    h +=
        (fbm(x*.0022+500,z*.0022+800)-.5)
        * 110;

    // kleine Geländeformen
    h +=
        (fbm(x*.007,z*.007)-.5)
        * 35;

    // Gebirgsregionen
    const mountains =
        Math.max(
            0,
            fbm(
                x*.00038+100,
                z*.00038+100
            )-.52
        );

    h +=
        mountains * mountains * 900;

    // Talstruktur
    const valley =
        Math.abs(
            Math.sin(x*.00055)
            *
            Math.cos(z*.00043)
        );

    h -=
        Math.max(0,.23-valley)
        * 120;

    // Inselrand etwas niedriger
    const edge =
        Math.max(
            Math.abs(nx-.5),
            Math.abs(nz-.5)
        );

    h -= Math.max(0,edge-.35)*500;

    return h;
}


// ============================================================
// BIOM
// ============================================================

function biomeAt(x,z,h){

    const moisture =
        fbm(
            x*.0013+700,
            z*.0013+900
        );

    const temperature =
        fbm(
            x*.0009+1200,
            z*.0009+400
        );

    if(h > 260)
        return "snow";

    if(h > 190)
        return "mountain";

    if(h < -2)
        return "water";

    if(h < 7)
        return "beach";

    if(moisture > .65)
        return "forest";

    if(temperature < .35)
        return "rock";

    if(moisture < .28)
        return "dry";

    return "grass";
}


// ============================================================
// MATERIALIEN
// ============================================================

const materials = {

    grass:new THREE.MeshStandardMaterial({
        color:0x4f963f,
        roughness:1
    }),

    forest:new THREE.MeshStandardMaterial({
        color:0x347c38,
        roughness:1
    }),

    dry:new THREE.MeshStandardMaterial({
        color:0x829344,
        roughness:1
    }),

    rock:new THREE.MeshStandardMaterial({
        color:0x777b78,
        roughness:1
    }),

    mountain:new THREE.MeshStandardMaterial({
        color:0x696b69,
        roughness:1
    }),

    snow:new THREE.MeshStandardMaterial({
        color:0xf1f3f2,
        roughness:.9
    }),

    sand:new THREE.MeshStandardMaterial({
        color:0xd8c18a,
        roughness:1
    }),

    dirt:new THREE.MeshStandardMaterial({
        color:0x76502f,
        roughness:1
    }),

    water:new THREE.MeshStandardMaterial({
        color:0x318dc2,
        transparent:true,
        opacity:.72,
        roughness:.2,
        metalness:.05
    }),

    trunk:new THREE.MeshStandardMaterial({
        color:0x60432b,
        roughness:1
    }),

    leaves:new THREE.MeshStandardMaterial({
        color:0x2e7136,
        roughness:1
    }),

    leaves2:new THREE.MeshStandardMaterial({
        color:0x438b3d,
        roughness:1
    })
};


// ============================================================
// WELT-GRUPPE
// ============================================================

const world = new THREE.Group();

scene.add(world);

const terrainGroup = new THREE.Group();
const detailGroup = new THREE.Group();
const waterGroup = new THREE.Group();

world.add(terrainGroup);
world.add(detailGroup);
world.add(waterGroup);


// ============================================================
// CHUNKS
// ============================================================

const chunks = new Map();

function key(cx,cz){
    return cx+"_"+cz;
}


// ============================================================
// CHUNK TERRAIN
// ============================================================

function createChunk(cx,cz){

    const k = key(cx,cz);

    if(chunks.has(k))
        return;

    const group = new THREE.Group();

    const segments = 20;

    const geo =
        new THREE.PlaneGeometry(
            CHUNK_SIZE,
            CHUNK_SIZE,
            segments,
            segments
        );

    geo.rotateX(-Math.PI/2);

    const pos = geo.attributes.position;

    let centerHeight = 0;

    for(let i=0;i<pos.count;i++){

        const lx = pos.getX(i);
        const lz = pos.getZ(i);

        const x =
            cx*CHUNK_SIZE +
            lx +
            CHUNK_SIZE/2 -
            WORLD_SIZE/2;

        const z =
            cz*CHUNK_SIZE +
            lz +
            CHUNK_SIZE/2 -
            WORLD_SIZE/2;

        const h =
            terrainHeight(x,z);

        pos.setY(i,h);

        centerHeight += h;
    }

    centerHeight /= pos.count;

    geo.computeVertexNormals();

    const biome =
        biomeAt(
            cx*CHUNK_SIZE -
            WORLD_SIZE/2 +
            CHUNK_SIZE/2,

            cz*CHUNK_SIZE -
            WORLD_SIZE/2 +
            CHUNK_SIZE/2,

            centerHeight
        );

    let mat = materials.grass;

    if(biome==="forest")
        mat = materials.forest;

    if(biome==="dry")
        mat = materials.dry;

    if(biome==="rock")
        mat = materials.rock;

    if(biome==="mountain")
        mat = materials.mountain;

    if(biome==="snow")
        mat = materials.snow;

    if(biome==="beach")
        mat = materials.sand;

    const terrain =
        new THREE.Mesh(
            geo,
            mat
        );

    terrain.receiveShadow = true;
    terrain.castShadow = false;

    group.add(terrain);

    createChunkDetails(
        group,
        cx,
        cz
    );

    world.add(group);

    chunks.set(k,group);
}


// ============================================================
// DETAILS
// ============================================================

function createChunkDetails(group,cx,cz){

    const baseX =
        cx*CHUNK_SIZE -
        WORLD_SIZE/2;

    const baseZ =
        cz*CHUNK_SIZE -
        WORLD_SIZE/2;

    const amount =
        18 +
        Math.floor(
            hash2(cx*91,cz*47)*20
        );

    for(let i=0;i<amount;i++){

        const r1 =
            hash2(
                cx*1000+i,
                cz*2000+i
            );

        const r2 =
            hash2(
                cx*3000+i,
                cz*4000+i
            );

        const x =
            baseX+r1*CHUNK_SIZE;

        const z =
            baseZ+r2*CHUNK_SIZE;

        const h =
            terrainHeight(x,z);

        const biome =
            biomeAt(x,z,h);

        if(
            biome==="forest" ||
            biome==="grass"
        ){

            if(r1>.22)
                createTree(
                    group,
                    x,
                    h,
                    z,
                    r1,
                    r2
                );
            else
                createBush(
                    group,
                    x,
                    h,
                    z,
                    r1
                );

        }

        if(
            biome==="rock" ||
            biome==="mountain"
        ){

            createRock(
                group,
                x,
                h,
                z,
                r1
            );

        }

        if(
            biome==="beach" &&
            r1>.5
        ){

            createRock(
                group,
                x,
                h,
                z,
                r2
            );

        }
    }
}


// ============================================================
// BÄUME
// ============================================================

function createTree(
    group,
    x,
    y,
    z,
    r1,
    r2
){

    const tree = new THREE.Group();

    const height =
        18+r1*28;

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                1.2+r1*1.2,
                1.8+r1*1.5,
                height,
                7
            ),
            materials.trunk
        );

    trunk.position.y =
        height/2;

    trunk.castShadow = true;

    tree.add(trunk);

    const crownCount =
        3+
        Math.floor(r2*3);

    for(let i=0;i<crownCount;i++){

        const angle =
            hash2(
                Math.floor(x)+i*17,
                Math.floor(z)+i*31
            ) *
            Math.PI*2;

        const radius =
            5+
            hash2(
                Math.floor(x)+i*71,
                Math.floor(z)+i*43
            )*5;

        const crown =
            new THREE.Mesh(
                new THREE.IcosahedronGeometry(
                    radius,
                    1
                ),
                i%2===0
                    ? materials.leaves
                    : materials.leaves2
            );

        crown.position.set(
            Math.cos(angle)*radius*.45,
            height*.62+
            i*3+
            radius*.25,
            Math.sin(angle)*radius*.45
        );

        crown.scale.y =
            .85+
            r1*.45;

        crown.castShadow = true;

        tree.add(crown);
    }

    tree.position.set(
        x,
        y,
        z
    );

    tree.rotation.y =
        r1*Math.PI*2;

    group.add(tree);
}


// ============================================================
// BÜSCHE
// ============================================================

function createBush(
    group,
    x,
    y,
    z,
    r
){

    const bush =
        new THREE.Mesh(
            new THREE.IcosahedronGeometry(
                2.5+r*3,
                1
            ),
            materials.leaves2
        );

    bush.position.set(
        x,
        y+2,
        z
    );

    bush.scale.y=.65;

    bush.castShadow=true;

    group.add(bush);
}


// ============================================================
// FELSEN
// ============================================================

function createRock(
    group,
    x,
    y,
    z,
    r
){

    const size =
        3+r*15;

    const rock =
        new THREE.Mesh(
            new THREE.DodecahedronGeometry(
                size,
                1
            ),
            materials.rock
        );

    rock.position.set(
        x,
        y+size*.35,
        z
    );

    rock.rotation.set(
        r*2,
        r*5,
        r*3
    );

    rock.scale.y =
        .65+r*.5;

    rock.castShadow=true;

    group.add(rock);
}


// ============================================================
// SEEN
// ============================================================

function createLakes(){

    while(waterGroup.children.length)
        waterGroup.remove(
            waterGroup.children[0]
        );

    // mehrere natürliche Seen
    const lakeCount = 7;

    for(let i=0;i<lakeCount;i++){

        const r1 =
            hash2(
                i*923,
                i*731
            );

        const r2 =
            hash2(
                i*541,
                i*119
            );

        const x =
            (r1-.5)*
            WORLD_SIZE*.8;

        const z =
            (r2-.5)*
            WORLD_SIZE*.8;

        const h =
            terrainHeight(x,z);

        if(h>55)
            continue;

        const radius =
            80+
            r1*180;

        const lake =
            new THREE.Mesh(
                new THREE.CircleGeometry(
                    radius,
                    48
                ),
                materials.water
            );

        lake.rotation.x =
            -Math.PI/2;

        lake.position.set(
            x,
            Math.max(
                -1,
                h+2
            ),
            z
        );

        lake.scale.x =
            .65+r2*.55;

        lake.scale.z =
            1;

        waterGroup.add(lake);
    }
}


// ============================================================
// FLUSS
// ============================================================

function createRiver(){

    const points = [];

    const offset =
        (hash2(444,222)-.5)
        * 1200;

    for(let i=0;i<35;i++){

        const t=i/34;

        const x =
            -WORLD_SIZE*.45 +
            t*WORLD_SIZE*.9;

        const z =
            offset+
            Math.sin(t*8+seed*.00001)*350;

        const y =
            terrainHeight(x,z)+3;

        points.push(
            new THREE.Vector3(
                x,
                y,
                z
            )
        );
    }

    const curve =
        new THREE.CatmullRomCurve3(
            points
        );

    const geometry =
        new THREE.TubeGeometry(
            curve,
            100,
            8,
            8,
            false
        );

    // Fluss als abgeflachtes Band
    const river =
        new THREE.Mesh(
            geometry,
            materials.water
        );

    river.scale.y=.08;
    river.scale.x=1.8;

    waterGroup.add(river);
}


// ============================================================
// WELT GENERIEREN
// ============================================================

function clearWorld(){

    while(world.children.length){

        world.remove(
            world.children[0]
        );

    }

    terrainGroup.clear();
    detailGroup.clear();
    waterGroup.clear();

    chunks.clear();

    world.add(terrainGroup);
    world.add(detailGroup);
    world.add(waterGroup);
}


function generateWorld(){

    document.getElementById(
        "loading"
    ).style.display="flex";

    requestAnimationFrame(()=>{

        clearWorld();

        const total = GRID*GRID;

        for(let cx=0;cx<GRID;cx++){

            for(let cz=0;cz<GRID;cz++){

                createChunk(
                    cx,
                    cz
                );

            }
        }

        createLakes();
        createRiver();

        document.getElementById(
            "seedText"
        ).innerText=seed;

        document.getElementById(
            "chunkText"
        ).innerText=chunks.size;

        controls.target.set(
            0,
            terrainHeight(0,0),
            0
        );

        camera.position.set(
            900,
            800,
            900
        );

        controls.update();

        document.getElementById(
            "loading"
        ).style.display="none";

    });
}


// ============================================================
// NEUE WELT
// ============================================================

document.getElementById(
    "generate"
).onclick=()=>{

    const input =
        document.getElementById(
            "seedInput"
        ).value.trim();

    if(input===""){

        seed=randomSeed();

    }else{

        let n=0;

        for(let i=0;i<input.length;i++){

            n =
                Math.imul(
                    n^input.charCodeAt(i),
                    16777619
                );

        }

        seed =
            Math.abs(n) ||
            1;
    }

    generateWorld();
};


// Enter im Seed-Feld
document.getElementById(
    "seedInput"
).addEventListener(
    "keydown",
    e=>{

        if(e.key==="Enter")
            document.getElementById(
                "generate"
            ).click();

    }
);


// ============================================================
// GLB EXPORT
// ============================================================

document.getElementById(
    "export"
).onclick=()=>{

    const exporter =
        new THREE.GLTFExporter();

    const button =
        document.getElementById(
            "export"
        );

    button.innerText =
        "GLB wird erstellt...";

    button.disabled=true;

    // Wasser beim Export ebenfalls behalten
    exporter.parse(
        world,
        function(result){

            const blob =
                new Blob(
                    [
                        result
                    ],
                    {
                        type:
                        "model/gltf-binary"
                    }
                );

            const url =
                URL.createObjectURL(
                    blob
                );

            const a =
                document.createElement(
                    "a"
                );

            a.href=url;

            a.download =
                "ZEROPOINT_WORLD_" +
                seed +
                ".glb";

            document.body.appendChild(a);

            a.click();

            a.remove();

            URL.revokeObjectURL(
                url
            );

            button.innerText =
                "GLB herunterladen";

            button.disabled=false;

        },
        function(error){

            console.error(error);

            alert(
                "GLB-Export fehlgeschlagen."
            );

            button.innerText =
                "GLB herunterladen";

            button.disabled=false;

        },
        {
            binary:true,
            onlyVisible:true
        }
    );
};


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


// ============================================================
// LOOP
// ============================================================

function animate(){

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );
}


// ============================================================
// START
// ============================================================

generateWorld();
animate();

</script>

</body>
</html>
