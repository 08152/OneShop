<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Kugel Guys - 3D Plattform (No Shader)</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #6ba7e6;
    font-family: 'Arial Black', sans-serif;
    user-select: none;
}
canvas { display: block; }

/* Fall Guys Style HUD */
#hud-container {
    position: absolute;
    top: 20px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 30px;
    box-sizing: border-box;
    z-index: 10;
    pointer-events: none;
}
.fall-box {
    background: linear-gradient(135deg, #ff007f, #7f00ff);
    color: white;
    padding: 12px 25px;
    border-radius: 15px;
    font-size: 20px;
    box-shadow: 0 6px 0 #4a0080, 0 10px 20px rgba(0,0,0,0.4);
    border: 3px solid white;
    text-transform: uppercase;
    letter-spacing: 1px;
}
#timer-box {
    background: linear-gradient(135deg, #00f0ff, #0072ff);
    box-shadow: 0 6px 0 #0044aa, 0 10px 20px rgba(0,0,0,0.4);
}

/* Riesen-Anzeigen in der Mitte */
#center-display {
    position: absolute;
    top: 40%;
    width: 100%;
    text-align: center;
    z-index: 10;
    pointer-events: none;
}
.big-banner {
    display: inline-block;
    color: yellow;
    font-size: 50px;
    text-transform: uppercase;
    background: rgba(0, 0, 0, 0.7);
    padding: 20px 50px;
    border-radius: 20px;
    border: 4px solid yellow;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-shadow: 3px 3px 0 #000;
}
.show-banner {
    opacity: 1;
    transform: scale(1);
}
.eliminated {
    color: #ff0055;
    border-color: #ff0055;
    text-shadow: 3px 3px 0 #330011;
}
</style>
</head>
<body>

<div id="hud-container">
    <div class="fall-box" id="controls-box">
        WASD: Rollen | LEER: Springen
    </div>
    <div class="fall-box" id="timer-box">
        Warten auf Spieler...
    </div>
    <div class="fall-box" id="status-box">
        Überlebende: 4 / 4
    </div>
</div>

<div id="center-display">
    <div id="banner" class="big-banner">Runde 1</div>
</div>

<!-- Three.js laden -->
<script src="https://jsdelivr.net"></script>

<!-- Skripte laden (OHNE shader.js!) -->
<script src="game.js"></script>
<script src="script.js"></script>

</body>
</html>
