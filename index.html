<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GHOST VIDEO CUTTER</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#111318;
    color:#fff;
}

body{
    display:flex;
    justify-content:center;
    padding:25px 12px;
}

.app{
    width:100%;
    max-width:1000px;
    background:#1a1d24;
    border:1px solid #303541;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

header{
    padding:22px 25px;
    border-bottom:1px solid #303541;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:800;
    letter-spacing:1px;
}

.logo span{
    color:#ffd400;
}

.status{
    font-size:13px;
    color:#aeb4c0;
}

.content{
    padding:25px;
}

.upload{
    border:2px dashed #444a57;
    border-radius:15px;
    padding:40px 20px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.upload:hover{
    border-color:#ffd400;
    background:#20242d;
}

.upload.drag{
    border-color:#ffd400;
    background:#292b20;
}

.upload-icon{
    font-size:48px;
    margin-bottom:10px;
}

.upload-title{
    font-size:20px;
    font-weight:bold;
}

.upload-sub{
    color:#9299a7;
    margin-top:8px;
}

#fileInput{
    display:none;
}

.editor{
    display:none;
    margin-top:25px;
}

.video-box{
    background:#000;
    border-radius:14px;
    overflow:hidden;
    position:relative;
}

video{
    width:100%;
    max-height:550px;
    display:block;
    background:#000;
}

.file-info{
    padding:12px 15px;
    background:#20242c;
    color:#aeb4c0;
    font-size:14px;
}

.controls{
    margin-top:20px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.control-card{
    background:#20242c;
    border-radius:12px;
    padding:16px;
}

label{
    display:block;
    color:#b8bec9;
    font-size:13px;
    margin-bottom:8px;
}

.time-row{
    display:flex;
    gap:8px;
}

input[type="number"],
input[type="text"]{
    width:100%;
    background:#111318;
    color:#fff;
    border:1px solid #3b414d;
    border-radius:8px;
    padding:11px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#ffd400;
}

.range-area{
    margin-top:20px;
    background:#20242c;
    border-radius:12px;
    padding:18px;
}

.range-title{
    display:flex;
    justify-content:space-between;
    color:#b8bec9;
    font-size:13px;
    margin-bottom:12px;
}

.range-wrap{
    position:relative;
    height:40px;
}

.range-track{
    position:absolute;
    top:17px;
    left:0;
    right:0;
    height:7px;
    background:#3a3f49;
    border-radius:10px;
}

.range-selected{
    position:absolute;
    top:17px;
    height:7px;
    background:#ffd400;
    border-radius:10px;
}

input[type="range"]{
    position:absolute;
    left:0;
    top:5px;
    width:100%;
    height:30px;
    margin:0;
    pointer-events:none;
    appearance:none;
    background:transparent;
}

input[type="range"]::-webkit-slider-thumb{
    appearance:none;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#ffd400;
    border:3px solid #111318;
    cursor:pointer;
    pointer-events:auto;
}

input[type="range"]::-moz-range-thumb{
    width:20px;
    height:20px;
    border-radius:50%;
    background:#ffd400;
    border:3px solid #111318;
    cursor:pointer;
    pointer-events:auto;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 18px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}

button:hover{
    transform:translateY(-1px);
}

.primary{
    background:#ffd400;
    color:#111;
}

.secondary{
    background:#303541;
    color:#fff;
}

.danger{
    background:#54282d;
    color:#fff;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

.progress{
    display:none;
    margin-top:20px;
    background:#20242c;
    padding:16px;
    border-radius:12px;
}

.progress-text{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:#b8bec9;
    margin-bottom:9px;
}

.progress-bar{
    width:100%;
    height:9px;
    background:#111318;
    border-radius:10px;
    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;
    background:#ffd400;
    transition:.2s;
}

.result{
    display:none;
    margin-top:20px;
    padding:18px;
    border-radius:12px;
    background:#20242c;
}

.result-title{
    font-weight:bold;
    margin-bottom:12px;
}

.download{
    display:inline-block;
    background:#ffd400;
    color:#111;
    padding:13px 20px;
    border-radius:9px;
    text-decoration:none;
    font-weight:bold;
}

.message{
    margin-top:15px;
    color:#ffcf4a;
    font-size:14px;
    line-height:1.5;
}

@media(max-width:650px){
    .controls{
        grid-template-columns:1fr;
    }

    header{
        flex-direction:column;
        align-items:flex-start;
    }

    .content{
        padding:15px;
    }

    .upload{
        padding:30px 15px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">
        GHOST <span>VIDEO CUTTER</span>
    </div>

    <div class="status" id="status">
        Bereit
    </div>
</header>

<div class="content">

    <!-- UPLOAD -->
    <div class="upload" id="upload">
        <div class="upload-icon">🎬</div>

        <div class="upload-title">
            Video auswählen
        </div>

        <div class="upload-sub">
            Klicke hier oder ziehe ein Video hierher
        </div>

        <input
            id="fileInput"
            type="file"
            accept="video/*"
        >
    </div>


    <!-- EDITOR -->
    <div class="editor" id="editor">

        <div class="video-box">
            <video
                id="video"
                controls
                playsinline
                preload="metadata">
            </video>

            <div class="file-info" id="fileInfo">
                Kein Video
            </div>
        </div>


        <!-- ZEIT -->
        <div class="controls">

            <div class="control-card">

                <label>
                    Startzeit in Sekunden
                </label>

                <input
                    id="startInput"
                    type="number"
                    min="0"
                    step="0.01"
                    value="0"
                >

            </div>


            <div class="control-card">

                <label>
                    Endzeit in Sekunden
                </label>

                <input
                    id="endInput"
                    type="number"
                    min="0"
                    step="0.01"
                    value="0"
                >

            </div>

        </div>


        <!-- RANGE -->
        <div class="range-area">

            <div class="range-title">

                <span>
                    Schnittbereich
                </span>

                <span id="durationText">
                    0:00 / 0:00
                </span>

            </div>

            <div class="range-wrap">

                <div class="range-track"></div>

                <div
                    class="range-selected"
                    id="rangeSelected">
                </div>

                <input
                    id="startRange"
                    type="range"
                    min="0"
                    max="0"
                    step="0.01"
                    value="0"
                >

                <input
                    id="endRange"
                    type="range"
                    min="0"
                    max="0"
                    step="0.01"
                    value="0"
                >

            </div>

        </div>


        <!-- BUTTONS -->
        <div class="buttons">

            <button
                class="secondary"
                id="setStart">
                Start = aktuelle Position
            </button>

            <button
                class="secondary"
                id="setEnd">
                Ende = aktuelle Position
            </button>

            <button
                class="secondary"
                id="preview">
                ▶ Bereich ansehen
            </button>

            <button
                class="primary"
                id="cut">
                ✂️ Video zuschneiden
            </button>

            <button
                class="danger"
                id="reset">
                Neues Video
            </button>

        </div>


        <!-- PROGRESS -->
        <div
            class="progress"
            id="progress">

            <div class="progress-text">
                <span id="progressText">
                    Video wird verarbeitet...
                </span>

                <span id="progressPercent">
                    0%
                </span>
            </div>

            <div class="progress-bar">
                <div
                    class="progress-fill"
                    id="progressFill">
                </div>
            </div>

        </div>


        <!-- RESULT -->
        <div
            class="result"
            id="result">

            <div class="result-title">
                ✅ Video wurde zugeschnitten
            </div>

            <a
                id="download"
                class="download"
                download="ghost-cut.mp4">
                💾 Video herunterladen
            </a>

        </div>


        <div
            class="message"
            id="message">
        </div>

    </div>

</div>

</div>


<script type="module">

/*
    GHOST VIDEO CUTTER

    FFmpeg wird nur bei Bedarf geladen.
*/

const upload = document.getElementById("upload");
const fileInput = document.getElementById("fileInput");

const editor = document.getElementById("editor");
const video = document.getElementById("video");

const fileInfo = document.getElementById("fileInfo");
const status = document.getElementById("status");

const startInput = document.getElementById("startInput");
const endInput = document.getElementById("endInput");

const startRange = document.getElementById("startRange");
const endRange = document.getElementById("endRange");

const rangeSelected =
    document.getElementById("rangeSelected");

const durationText =
    document.getElementById("durationText");

const setStart =
    document.getElementById("setStart");

const setEnd =
    document.getElementById("setEnd");

const preview =
    document.getElementById("preview");

const cut =
    document.getElementById("cut");

const reset =
    document.getElementById("reset");

const progress =
    document.getElementById("progress");

const progressFill =
    document.getElementById("progressFill");

const progressText =
    document.getElementById("progressText");

const progressPercent =
    document.getElementById("progressPercent");

const result =
    document.getElementById("result");

const download =
    document.getElementById("download");

const message =
    document.getElementById("message");


let currentFile = null;
let currentUrl = null;
let outputUrl = null;

let duration = 0;

let ffmpeg = null;


/* -------------------------
   UPLOAD
------------------------- */

upload.addEventListener("click", () => {
    fileInput.click();
});

fileInput.addEventListener("change", () => {

    if(fileInput.files.length > 0){

        loadVideo(fileInput.files[0]);

    }

});


/* Drag & Drop */

upload.addEventListener("dragover", e => {

    e.preventDefault();

    upload.classList.add("drag");

});


upload.addEventListener("dragleave", () => {

    upload.classList.remove("drag");

});


upload.addEventListener("drop", e => {

    e.preventDefault();

    upload.classList.remove("drag");

    const file =
        e.dataTransfer.files[0];

    if(file && file.type.startsWith("video/")){

        loadVideo(file);

    }

});


/* -------------------------
   VIDEO LADEN
------------------------- */

function loadVideo(file){

    currentFile = file;

    if(currentUrl){

        URL.revokeObjectURL(currentUrl);

    }

    currentUrl =
        URL.createObjectURL(file);

    video.src = currentUrl;

    video.load();

    editor.style.display = "block";

    upload.style.display = "none";

    result.style.display = "none";

    message.textContent = "";

    status.textContent = "Video geladen";

    fileInfo.textContent =
        file.name +
        " • " +
        formatBytes(file.size);

}


/* -------------------------
   METADATA
------------------------- */

video.addEventListener("loadedmetadata", () => {

    duration = video.duration;

    if(!isFinite(duration)){
        return;
    }

    startRange.max = duration;
    endRange.max = duration;

    startRange.value = 0;
    endRange.value = duration;

    startInput.value = 0;
    endInput.value = duration.toFixed(2);

    updateRange();

    updateDurationText();

});


/* -------------------------
   VIDEO POSITION
------------------------- */

video.addEventListener("timeupdate", () => {

    updateDurationText();

});


function updateDurationText(){

    durationText.textContent =
        formatTime(video.currentTime) +
        " / " +
        formatTime(duration);

}


/* -------------------------
   START RANGE
------------------------- */

startRange.addEventListener("input", () => {

    let value =
        Number(startRange.value);

    let end =
        Number(endRange.value);

    if(value > end){

        value = end;

        startRange.value = value;

    }

    startInput.value =
        value.toFixed(2);

    updateRange();

});


/* -------------------------
   END RANGE
------------------------- */

endRange.addEventListener("input", () => {

    let value =
        Number(endRange.value);

    let start =
        Number(startRange.value);

    if(value < start){

        value = start;

        endRange.value = value;

    }

    endInput.value =
        value.toFixed(2);

    updateRange();

});


/* -------------------------
   START INPUT
------------------------- */

startInput.addEventListener("change", () => {

    let value =
        Number(startInput.value);

    if(!isFinite(value)){
        value = 0;
    }

    value =
        Math.max(0, Math.min(value, duration));

    if(value > Number(endRange.value)){

        value =
            Number(endRange.value);

    }

    startInput.value =
        value.toFixed(2);

    startRange.value = value;

    updateRange();

});


/* -------------------------
   END INPUT
------------------------- */

endInput.addEventListener("change", () => {

    let value =
        Number(endInput.value);

    if(!isFinite(value)){
        value = duration;
    }

    value =
        Math.max(0, Math.min(value, duration));

    if(value < Number(startRange.value)){

        value =
            Number(startRange.value);

    }

    endInput.value =
        value.toFixed(2);

    endRange.value = value;

    updateRange();

});


/* -------------------------
   RANGE VISUALISIERUNG
------------------------- */

function updateRange(){

    if(duration <= 0){
        return;
    }

    const start =
        Number(startRange.value);

    const end =
        Number(endRange.value);

    const left =
        (start / duration) * 100;

    const width =
        ((end - start) / duration) * 100;

    rangeSelected.style.left =
        left + "%";

    rangeSelected.style.width =
        width + "%";

}


/* -------------------------
   START SETZEN
------------------------- */

setStart.addEventListener("click", () => {

    let value =
        video.currentTime;

    if(value > Number(endRange.value)){

        value =
            Number(endRange.value);

    }

    startRange.value = value;

    startInput.value =
        value.toFixed(2);

    updateRange();

});


/* -------------------------
   ENDE SETZEN
------------------------- */

setEnd.addEventListener("click", () => {

    let value =
        video.currentTime;

    if(value < Number(startRange.value)){

        value =
            Number(startRange.value);

    }

    endRange.value = value;

    endInput.value =
        value.toFixed(2);

    updateRange();

});


/* -------------------------
   PREVIEW
------------------------- */

preview.addEventListener("click", async () => {

    const start =
        Number(startRange.value);

    const end =
        Number(endRange.value);

    if(end <= start){

        showMessage(
            "Der Endzeitpunkt muss größer als der Startzeitpunkt sein."
        );

        return;

    }

    video.currentTime = start;

    await video.play();

    const stopPreview = () => {

        if(video.currentTime >= end){

            video.pause();

            video.removeEventListener(
                "timeupdate",
                stopPreview
            );

        }

    };

    video.addEventListener(
        "timeupdate",
        stopPreview
    );

});


/* -------------------------
   FFmpeg LADEN
------------------------- */

async function loadFFmpeg(){

    if(ffmpeg){
        return ffmpeg;
    }

    status.textContent =
        "FFmpeg wird geladen...";

    progress.style.display =
        "block";

    progressText.textContent =
        "Video-Schnittmodul wird geladen...";

    progressFill.style.width = "10%";
    progressPercent.textContent = "10%";


    try{

        const module =
            await import(
                "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js"
            );

        const util =
            await import(
                "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js"
            );

        const {
            FFmpeg
        } = module;

        const {
            fetchFile,
            toBlobURL
        } = util;

        ffmpeg =
            new FFmpeg();

        ffmpeg.on(
            "progress",
            ({progress}) => {

                const percent =
                    Math.round(progress * 100);

                progressFill.style.width =
                    percent + "%";

                progressPercent.textContent =
                    percent + "%";

            }
        );

        const baseURL =
            "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm";

        await ffmpeg.load({
            coreURL:
                await toBlobURL(
                    `${baseURL}/ffmpeg-core.js`,
                    "text/javascript"
                ),

            wasmURL:
                await toBlobURL(
                    `${baseURL}/ffmpeg-core.wasm`,
                    "application/wasm"
                )
        });

        progressFill.style.width = "20%";
        progressPercent.textContent = "20%";

        return ffmpeg;

    }catch(error){

        console.error(error);

        ffmpeg = null;

        throw error;

    }

}


/* -------------------------
   VIDEO SCHNEIDEN
------------------------- */

cut.addEventListener("click", async () => {

    if(!currentFile){

        showMessage(
            "Bitte zuerst ein Video auswählen."
        );

        return;

    }

    const start =
        Number(startRange.value);

    const end =
        Number(endRange.value);

    if(!isFinite(start) || !isFinite(end)){

        showMessage(
            "Ungültige Zeit."
        );

        return;

    }

    if(end <= start){

        showMessage(
            "Das Ende muss nach dem Start liegen."
        );

        return;

    }

    const length =
        end - start;

    if(length <= 0){

        showMessage(
            "Der ausgewählte Bereich ist leer."
        );

        return;

    }


    cut.disabled = true;

    preview.disabled = true;

    progress.style.display =
        "block";

    result.style.display =
        "none";

    message.textContent = "";

    progressText.textContent =
        "FFmpeg wird vorbereitet...";

    progressFill.style.width =
        "5%";

    progressPercent.textContent =
        "5%";


    try{

        const engine =
            await loadFFmpeg();


        progressText.textContent =
            "Video wird verarbeitet...";


        const inputName =
            "input_" +
            Date.now() +
            getExtension(currentFile.name);


        const outputName =
            "ghost_cut_" +
            Date.now() +
            ".mp4";


        /*
            Datei in FFmpeg schreiben
        */

        await engine.writeFile(
            inputName,
            await fetchFile(currentFile)
        );


        /*
            Schneiden.

            -ss = Start
            -t  = Länge
            -c:v libx264 = kompatibles MP4
            -c:a aac     = kompatibles Audio
        */

        await engine.exec([
            "-ss",
            String(start),

            "-i",
            inputName,

            "-t",
            String(length),

            "-c:v",
            "libx264",

            "-preset",
            "veryfast",

            "-crf",
            "18",

            "-c:a",
            "aac",

            "-movflags",
            "+faststart",

            outputName
        ]);


        progressText.textContent =
            "Download wird vorbereitet...";


        const data =
            await engine.readFile(
                outputName
            );


        const blob =
            new Blob(
                [data.buffer],
                {
                    type:"video/mp4"
                }
            );


        if(outputUrl){

            URL.revokeObjectURL(
                outputUrl
            );

        }


        outputUrl =
            URL.createObjectURL(blob);


        download.href =
            outputUrl;

        download.download =
            createOutputName(
                currentFile.name
            );


        progressFill.style.width =
            "100%";

        progressPercent.textContent =
            "100%";

        progressText.textContent =
            "Fertig!";


        result.style.display =
            "block";


        status.textContent =
            "Schnitt fertig";


        /*
            Temporäre Dateien löschen
        */

        try{

            await engine.deleteFile(
                inputName
            );

            await engine.deleteFile(
                outputName
            );

        }catch(e){

            console.warn(
                "Temporäre Datei konnte nicht gelöscht werden.",
                e
            );

        }


    }catch(error){

        console.error(error);

        progressFill.style.width =
            "0%";

        progressPercent.textContent =
            "Fehler";

        progressText.textContent =
            "Verarbeitung fehlgeschlagen";

        showMessage(
            "Das Video konnte nicht geschnitten werden. " +
            "Prüfe, ob der Browser FFmpeg laden kann."
        );

    }finally{

        cut.disabled = false;

        preview.disabled = false;

    }

});


/* -------------------------
   RESET
------------------------- */

reset.addEventListener("click", () => {

    if(currentUrl){

        URL.revokeObjectURL(
            currentUrl
        );

    }

    if(outputUrl){

        URL.revokeObjectURL(
            outputUrl
        );

    }

    currentFile = null;
    currentUrl = null;
    outputUrl = null;

    video.pause();

    video.removeAttribute("src");

    video.load();

    fileInput.value = "";

    editor.style.display =
        "none";

    upload.style.display =
        "block";

    progress.style.display =
        "none";

    result.style.display =
        "none";

    message.textContent = "";

    status.textContent =
        "Bereit";

});


/* -------------------------
   HILFSFUNKTIONEN
------------------------- */

function formatTime(seconds){

    if(!isFinite(seconds)){
        return "0:00";
    }

    seconds =
        Math.max(0, seconds);

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        Math.floor(seconds % 60);

    if(hours > 0){

        return (
            hours +
            ":" +
            String(minutes).padStart(2,"0") +
            ":" +
            String(secs).padStart(2,"0")
        );

    }

    return (
        minutes +
        ":" +
        String(secs).padStart(2,"0")
    );

}


function formatBytes(bytes){

    if(bytes === 0){
        return "0 Bytes";
    }

    const units =
        [
            "Bytes",
            "KB",
            "MB",
            "GB"
        ];

    const index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );

    return (
        (bytes /
        Math.pow(1024,index))
        .toFixed(2)
        +
        " " +
        units[index]
    );

}


function getExtension(name){

    const match =
        name.match(/\.[^/.]+$/);

    return match
        ? match[0]
        : ".mp4";

}


function createOutputName(name){

    const withoutExtension =
        name.replace(
            /\.[^/.]+$/,
            ""
        );

    return (
        withoutExtension +
        "_geschnitten.mp4"
    );

}


function showMessage(text){

    message.textContent =
        text;

}


/* -------------------------
   TASTATUR
------------------------- */

document.addEventListener(
    "keydown",
    e => {

        /*
            Leertaste = Play/Pause,
            aber nicht wenn gerade
            ein Eingabefeld benutzt wird.
        */

        if(
            e.code === "Space" &&
            document.activeElement.tagName !== "INPUT"
        ){

            e.preventDefault();

            if(video.paused){
                video.play();
            }else{
                video.pause();
            }

        }

    }
);
