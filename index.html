<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHOST Island 3D Sculptor</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#79caff;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    inset:0;
    pointer-events:none;
}

#topbar{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    height:58px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 12px;
    background:rgba(20,25,30,.94);
    color:white;
    border-radius:12px;
    pointer-events:auto;
    box-shadow:0 5px 25px #0008;
}

#logo{
    font-size:20px;
    font-weight:bold;
    margin-right:15px;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 13px;
    background:#303943;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#45515d;
}

button.active{
    background:#e3ad29;
    color:#111;
}

#newMap{
    background:#38a955;
}

#save{
    background:#287fd0;
}

#load{
    background:#704bd1;
}

#side{
    position:absolute;
    top:84px;
    right:12px;
    width:245px;
    padding:16px;
    background:rgba(20,25,30,.94);
    color:white;
    border-radius:12px;
    pointer-events:auto;
    box-shadow:0 5px 25px #0008;
}

.title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:14px;
}

.tool{
    width:100%;
    margin-bottom:7px;
}

label{
    display:block;
    margin-top:15px;
    color:#ccc;
    font-size:13px;
}

input[type=range]{
    width:100%;
}

.value{
    float:right;
    color:white;
}

.info{
    margin-top:16px;
    padding:10px;
    border-radius:8px;
    background:#111820;
    color:#aeb8c2;
    font-size:12px;
    line-height:1.6;
}

#status{
    position:absolute;
    left:15px;
    bottom:15px;
    padding:10px 15px;
    background:rgba(0,0,0,.65);
    color:white;
    border-radius:8px;
}

#brush{
    position:absolute;
    width:50px;
    height:50px;
    border:2px solid white;
    border-radius:50%;
    pointer-events:none;
    display:none;
    transform:translate(-50%,-50%);
    z-index:50;
}

#file{
    display:none;
}
</style>
</head>

<body>

<div id="ui">

<div id="topbar">

<div id="logo">
🌴 GHOST ISLAND 3D
</div>

<button id="newMap">
Neue Insel
</button>

<button id="sculpt" class="active">
Sculpt
</button>

<button id="lower">
Absenken
</button>

<button id="smooth">
Glätten
</button>

<button id="save">
⬇ Speichern
</button>

<button id="load">
⬆ Laden
</button>

<input id="file" type="file" accept=".json">

</div>


<div id="side">

<div class="title">
Terrain-Werkzeuge
</div>

<button id="raiseTool" class="tool active">
⛰ Gelände erhöhen
</button>

<button id="lowerTool" class="tool">
🕳 Gelände absenken
</button>

<button id="smoothTool" class="tool">
🧽 Gelände glätten
</button>

<label>
Pinselgröße
<span class="value" id="sizeText">12</span>
</label>

<input
id="size"
type="range"
min="2"
max="35"
value="12"
>

<label>
Stärke
<span class="value" id="strengthText">0.5</span>
</label>

<input
id="strength"
type="range"
min="0.05"
max="2"
step="0.05"
value="0.5"
>

<div class="info">

<b>3D-Steuerung</b><br><br>

Linke Maustaste:
Terrain bearbeiten<br><br>

Rechte Maustaste:
Kamera drehen<br><br>

Mausrad:
Zoom<br><br>

Shift + Mausrad:
schneller Zoom

</div>

<div class="info">

<b>Welt</b><br>

12.000 × 12.000 Meter<br>
große zufällige Insel<br>
Berge und Täler<br>
Strände<br>
Wasser

</div>

</div>


<div id="status">
Sculpt: Gelände erhöhen
</div>

<div id="brush"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>

const SIZE = 161;

const WORLD_SIZE = 12000;

const SEA_LEVEL = 0;

let heights =
new Float32Array(
SIZE * SIZE
);

let seed =
Math.floor(
Math.random()*2147483647
);

let terrain;

let geometry;

let material;

let water;

let tool = "raise";

let brushSize = 12;

let strength = .5;

let mouseDown = false;

let mouseX = 0;

let mouseY = 0;


/* =========================
   SCENE
========================= */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(
0x79caff
);

scene.fog =
new THREE.Fog(
0x79caff,
4500,
12000
);


/* =========================
   CAMERA
========================= */

const camera =
new THREE.PerspectiveCamera(
55,
innerWidth/innerHeight,
1,
30000
);

camera.position.set(
4200,
3600,
4200
);


/* =========================
   RENDERER
========================= */

const renderer =
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(devicePixelRatio,1.5)
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
renderer.domElement
);


/* =========================
   ORBIT CAMERA
========================= */

const controls =
new THREE.OrbitControls(
camera,
renderer.domElement
);

controls.target.set(
0,
100,
0
);

controls.enableDamping = true;

controls.dampingFactor = .08;

controls.maxDistance = 11000;

controls.minDistance = 150;

controls.maxPolarAngle =
Math.PI*.48;


/* =========================
   LIGHT
========================= */

scene.add(
new THREE.HemisphereLight(
0xc9edff,
0x35552d,
1.8
)
);

const sun =
new THREE.DirectionalLight(
0xffffff,
2.2
);

sun.position.set(
3000,
5000,
2000
);

sun.castShadow = true;

scene.add(sun);


/* =========================
   RANDOM
========================= */

function hash(x,z){

let n =
Math.sin(
x*127.1+
z*311.7+
seed*0.001
)*43758.5453;

return n-
Math.floor(n);

}


/* =========================
   SMOOTH NOISE
========================= */

function noise(x,z){

const x0 =
Math.floor(x);

const z0 =
Math.floor(z);

const x1 =
x0+1;

const z1 =
z0+1;

const tx =
x-x0;

const tz =
z-z0;

const sx =
tx*tx*(3-2*tx);

const sz =
tz*tz*(3-2*tz);

const a =
hash(x0,z0);

const b =
hash(x1,z0);

const c =
hash(x0,z1);

const d =
hash(x1,z1);

const ab =
a+(b-a)*sx;

const cd =
c+(d-c)*sx;

return ab+(cd-ab)*sz;

}


/* =========================
   FRACTAL NOISE
========================= */

function terrainNoise(x,z){

let value=0;

let amp=1;

let freq=1;

let total=0;

for(let i=0;i<5;i++){

value +=
noise(
x*freq,
z*freq
)*amp;

total += amp;

amp *= .5;

freq *= 2;

}

return value/total;

}


/* =========================
   ISLAND GENERATION
========================= */

function generateIsland(){

seed =
Math.floor(
Math.random()*2147483647
);

for(let z=0;z<SIZE;z++){

for(let x=0;x<SIZE;x++){

const nx =
x/(SIZE-1)*2-1;

const nz =
z/(SIZE-1)*2-1;

const distance =
Math.sqrt(
nx*nx+nz*nz
);


/* Inselform */

let island =
1-
Math.pow(
distance,
2.25
);


/* unregelmäßige Küste */

const coast =
terrainNoise(
nx*3+30,
nz*3+30
);

island *=
.80+
coast*.38;


/* große Landschaft */

const large =
terrainNoise(
nx*2.3+100,
nz*2.3+100
);

const medium =
terrainNoise(
nx*6+200,
nz*6+200
);

const small =
terrainNoise(
nx*15+300,
nz*15+300
);


let height =

large*700+
medium*300+
small*80;


/* Berge */

const mountainA =
Math.exp(
-(
Math.pow(nx-.30,2)+
Math.pow(nz+.22,2)
)*8
);

const mountainB =
Math.exp(
-(
Math.pow(nx+.35,2)+
Math.pow(nz-.20,2)
)*10
);

const mountainC =
Math.exp(
-(
Math.pow(nx-.05,2)+
Math.pow(nz+.42,2)
)*14
);


height +=
mountainA*1000;

height +=
mountainB*750;

height +=
mountainC*500;


/* Inselrand */

height *=
Math.max(
0,
island
);


/* Strand */

height -= 35;


/* äußerer Rand */

if(distance > .92){

height =
-80+
(distance-.92)*-300;

}


heights[
z*SIZE+x
] =
height;

}

}

buildTerrain();

}


/* =========================
   TERRAIN BUILD
========================= */

function buildTerrain(){

if(terrain){

scene.remove(terrain);

geometry.dispose();

material.dispose();

}


geometry =
new THREE.PlaneGeometry(
WORLD_SIZE,
WORLD_SIZE,
SIZE-1,
SIZE-1
);

geometry.rotateX(
-Math.PI/2
);


const pos =
geometry.attributes.position;

const colors =
[];


for(
let i=0;
i<pos.count;
i++
){

pos.setY(
i,
heights[i]
);

const h =
heights[i];

let c;

if(h < -20){

c =
new THREE.Color(
0xcbb879
);

}
else if(h < 30){

c =
new THREE.Color(
0xe0c77a
);

}
else if(h < 300){

c =
new THREE.Color(
0x3f9b43
);

}
else if(h < 650){

c =
new THREE.Color(
0x39763c
);

}
else if(h < 950){

c =
new THREE.Color(
0x5d6b54
);

}
else{

c =
new THREE.Color(
0xdfe3e2
);

}


colors.push(
c.r,
c.g,
c.b
);

}


geometry.setAttribute(
"color",
new THREE.Float32BufferAttribute(
colors,
3
)
);

geometry.computeVertexNormals();


material =
new THREE.MeshStandardMaterial({

vertexColors:true,

roughness:1,

metalness:0

});


terrain =
new THREE.Mesh(
geometry,
material
);

terrain.receiveShadow=true;

terrain.castShadow=false;

scene.add(terrain);

}


/* =========================
   WATER
========================= */

function createWater(){

if(water)
scene.remove(water);

const geo =
new THREE.PlaneGeometry(
WORLD_SIZE,
WORLD_SIZE
);

const mat =
new THREE.MeshStandardMaterial({

color:0x2588c4,

transparent:true,

opacity:.72,

roughness:.12,

metalness:.05

});

water =
new THREE.Mesh(
geo,
mat
);

water.rotation.x =
-Math.PI/2;

water.position.y =
SEA_LEVEL;

scene.add(water);

}

createWater();


/* =========================
   RAYCAST
========================= */

const raycaster =
new THREE.Raycaster();

const mouse =
new THREE.Vector2();


function getHit(e){

const rect =
renderer.domElement
.getBoundingClientRect();

mouse.x =
((e.clientX-rect.left)/
rect.width)*2-1;

mouse.y =
-((e.clientY-rect.top)/
rect.height)*2+1;

raycaster.setFromCamera(
mouse,
camera
);

const hits =
raycaster.intersectObject(
terrain
);

return hits.length
? hits[0]
: null;

}


/* =========================
   SCULPT
========================= */

function editTerrain(e){

const hit =
getHit(e);

if(!hit)
return;

const p =
hit.point;

const gx =
Math.round(
(
p.x+
WORLD_SIZE/2
)/
WORLD_SIZE*
(SIZE-1)
);

const gz =
Math.round(
(
p.z+
WORLD_SIZE/2
)/
WORLD_SIZE*
(SIZE-1)
);


const radius =
Math.ceil(
brushSize
);


for(
let z=-radius;
z<=radius;
z++
){

for(
let x=-radius;
x<=radius;
x++
){

const px =
gx+x;

const pz =
gz+z;

if(
px<0||
pz<0||
px>=SIZE||
pz>=SIZE
)
continue;


const dist =
Math.sqrt(
x*x+z*z
);

if(
dist>brushSize
)
continue;


const falloff =
Math.pow(
1-dist/brushSize,
2
);


const index =
pz*SIZE+px;


if(tool==="raise"){

heights[index] +=
strength*
falloff*
18;

}

else if(tool==="lower"){

heights[index] -=
strength*
falloff*
18;

}

else if(tool==="smooth"){

let total=0;

let count=0;

for(let sy=-2;sy<=2;sy++){

for(let sx=-2;sx<=2;sx++){

const ix =
px+sx;

const iz =
pz+sy;

if(
ix>=0&&
iz>=0&&
ix<SIZE&&
iz<SIZE
){

total +=
heights[
iz*SIZE+ix
];

count++;

}

}

}

const average =
total/count;

heights[index] +=
(
average-
heights[index]
)*
strength*
falloff;

}

}

}


updateMesh();

}


/* =========================
   UPDATE MESH
========================= */

function updateMesh(){

const pos =
geometry.attributes.position;

for(
let i=0;
i<heights.length;
i++
){

pos.setY(
i,
heights[i]
);

}

pos.needsUpdate=true;

geometry.computeVertexNormals();

updateColors();

}


/* =========================
   COLORS
========================= */

function updateColors(){

const colors =
geometry.attributes.color;

for(
let i=0;
i<heights.length;
i++
){

const h =
heights[i];

let c;

if(h < -20){

c =
new THREE.Color(
0xcbb879
);

}
else if(h < 30){

c =
new THREE.Color(
0xe0c77a
);

}
else if(h < 300){

c =
new THREE.Color(
0x3f9b43
);

}
else if(h < 650){

c =
new THREE.Color(
0x39763c
);

}
else if(h < 950){

c =
new THREE.Color(
0x5d6b54
);

}
else{

c =
new THREE.Color(
0xdfe3e2
);

}

colors.setXYZ(
i,
c.r,
c.g,
c.b
);

}

colors.needsUpdate=true;

}


/* =========================
   MOUSE
========================= */

renderer.domElement.addEventListener(
"pointerdown",
e=>{

if(e.button===0){

mouseDown=true;

editTerrain(e);

}

});


renderer.domElement.addEventListener(
"pointerup",
e=>{

if(e.button===0)
mouseDown=false;

});


renderer.domElement.addEventListener(
"pointermove",
e=>{

mouseX=e.clientX;

mouseY=e.clientY;


const brush =
document.getElementById(
"brush"
);

brush.style.left =
mouseX+"px";

brush.style.top =
mouseY+"px";

brush.style.width =
(brushSize*8)+"px";

brush.style.height =
(brushSize*8)+"px";


if(mouseDown){

editTerrain(e);

}

});


renderer.domElement.addEventListener(
"pointerenter",
()=>{

document.getElementById(
"brush"
).style.display="block";

});


renderer.domElement.addEventListener(
"pointerleave",
()=>{

document.getElementById(
"brush"
).style.display="none";

});


renderer.domElement.addEventListener(
"contextmenu",
e=>e.preventDefault()
);


/* =========================
   TOOLS
========================= */

function setTool(t){

tool=t;

document
.querySelectorAll(".tool")
.forEach(
b=>b.classList.remove("active")
);


if(t==="raise"){

document
.getElementById("raiseTool")
.classList.add("active");

document
.getElementById("status")
.innerText=
"Sculpt: Gelände erhöhen";

}

if(t==="lower"){

document
.getElementById("lowerTool")
.classList.add("active");

document
.getElementById("status")
.innerText=
"Sculpt: Gelände absenken";

}

if(t==="smooth"){

document
.getElementById("smoothTool")
.classList.add("active");

document
.getElementById("status")
.innerText=
"Sculpt: Gelände glätten";

}

}


document
.getElementById("raiseTool")
.onclick=()=>{
setTool("raise");
};


document
.getElementById("lowerTool")
.onclick=()=>{
setTool("lower");
};


document
.getElementById("smoothTool")
.onclick=()=>{
setTool("smooth");
};


document
.getElementById("sculpt")
.onclick=()=>{
setTool("raise");
};


document
.getElementById("lower")
.onclick=()=>{
setTool("lower");
};


document
.getElementById("smooth")
.onclick=()=>{
setTool("smooth");
};


/* =========================
   SLIDER
========================= */

document
.getElementById("size")
.oninput=e=>{

brushSize =
Number(e.target.value);

document
.getElementById("sizeText")
.innerText=
brushSize;

};


document
.getElementById("strength")
.oninput=e=>{

strength =
Number(e.target.value);

document
.getElementById("strengthText")
.innerText=
strength.toFixed(2);

};


/* =========================
   NEW MAP
========================= */

document
.getElementById("newMap")
.onclick=()=>{

generateIsland();

};


/* =========================
   SAVE
========================= */

document
.getElementById("save")
.onclick=()=>{

const data = {

version:1,

size:SIZE,

worldSize:WORLD_SIZE,

seed:seed,

heights:Array.from(
heights
)

};


const blob =
new Blob(
[
JSON.stringify(data)
],
{
type:"application/json"
}
);


const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href=url;

a.download=
"ghost-island-map.json";

a.click();

URL.revokeObjectURL(url);

};


/* =========================
   LOAD
========================= */

document
.getElementById("load")
.onclick=()=>{

document
.getElementById("file")
.click();

};


document
.getElementById("file")
.onchange=e=>{

const file =
e.target.files[0];

if(!file)
return;

const reader =
new FileReader();

reader.onload=()=>{

try{

const data =
JSON.parse(
reader.result
);

if(
data.size!==SIZE||
!Array.isArray(data.heights)||
data.heights.length!==SIZE*SIZE
){

alert(
"Diese Map passt nicht zu diesem Editor."
);

return;

}

seed =
data.seed||
0;

heights =
new Float32Array(
data.heights
);

buildTerrain();

}
catch(err){

alert(
"Map konnte nicht geladen werden."
);

}

};

reader.readAsText(file);

};


/* =========================
   RESIZE
========================= */

window.addEventListener(
"resize",
()=>{

camera.aspect =
innerWidth/
innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

});


/* =========================
   START
========================= */

generateIsland();


/* =========================
   LOOP
========================= */

function animate(){

requestAnimationFrame(
animate
);

controls.update();

renderer.render(
scene,
camera
);

}

animate();

</script>

</body>
</html>
