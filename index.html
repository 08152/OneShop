<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Norton Smart Scanner</title>

<style>

body{
margin:0;
background:#101010;
color:white;
font-family:Arial;
display:flex;
height:100vh;
}

.sidebar{

width:250px;
background:#080808;
padding:20px;
border-right:1px solid #333;

}


.logo{

font-size:25px;
font-weight:bold;
color:#ffcc00;
margin-bottom:40px;

}


button{

width:100%;
padding:15px;
margin:8px 0;
background:#222;
color:white;
border:0;
border-radius:8px;
cursor:pointer;

}


button:hover,
.active{

background:#ffcc00;
color:black;

}


.main{

flex:1;
padding:30px;
overflow:auto;

}


.hidden{

display:none;

}


.circle{

width:200px;
height:200px;
border-radius:50%;
border:8px solid #ffcc00;

display:flex;
align-items:center;
justify-content:center;
flex-direction:column;

}


.safe{

border-color:#2ecc71;

}


.danger{

border-color:#e74c3c;

}



.card{

background:#1c1c1c;
padding:25px;
margin-top:25px;
border-radius:15px;

}


iframe{

width:100%;
height:300px;
background:white;
border:2px solid #444;
margin-top:20px;

}


.progress{

height:20px;
background:#333;
border-radius:10px;
overflow:hidden;

}


.bar{

height:100%;
width:0%;
background:#ffcc00;

}


</style>

</head>


<body>



<div class="sidebar">


<div class="logo">
✓ Norton 360
</div>


<button class="active" onclick="openPage('home',this)">
Home
</button>


<button onclick="openPage('scan',this)">
Scan
</button>


<button onclick="openPage('download',this)">
Download 1.json
</button>


</div>





<div class="main">



<div id="home">


<h1>Home</h1>


<div id="circle" class="circle">

<span>RISIKO</span>

<h2 id="status">
BEREIT
</h2>

</div>



<div class="card">


<h2>Datei Scan</h2>


<input type="file" id="homeFile">


<button onclick="startSandbox('homeFile')">
Starten
</button>


<p id="info">
Bereit
</p>



<iframe
id="sandbox"
sandbox="allow-scripts">
</iframe>



</div>


</div>









<div id="scan" class="hidden">


<h1>Scan</h1>


<div class="card">


<button onclick="single()">
Einzelscan
</button>


<button onclick="folder()">
OrdnerScan
</button>


<button onclick="update()">
Update Scan
</button>



<div id="scanArea">

</div>


</div>


</div>







<div id="download" class="hidden">


<h1>Download 1.json</h1>


<div class="card">


<button onclick="downloadJSON()">
1.json herunterladen
</button>


</div>


</div>




</div>






<script>


function openPage(id,btn){

document
.querySelectorAll(".main>div")
.forEach(x=>x.classList.add("hidden"));


document
.getElementById(id)
.classList.remove("hidden");


document
.querySelectorAll(".sidebar button")
.forEach(x=>x.classList.remove("active"));


btn.classList.add("active");

}







function startSandbox(id){


let file=
document.getElementById(id).files[0];


if(!file){

alert("Datei wählen");

return;

}



let status=
document.getElementById("status");


let info=
document.getElementById("info");



status.innerHTML="START";

info.innerHTML="Datei wird geladen...";



let reader=new FileReader();



reader.onload=function(e){


let iframe=
document.getElementById("sandbox");


let blob=
new Blob(
[
e.target.result
],
{
type:file.type || "text/html"
}
);



iframe.src=
URL.createObjectURL(blob);



info.innerHTML=
"Testumgebung gestartet: "+file.name;



status.innerHTML="PRÜFEN";



setTimeout(()=>{


document
.getElementById("circle")
.className="circle safe";


status.innerHTML="SICHER";


info.innerHTML=
"Scan beendet";


ask();


},2000);



};



reader.readAsText(file);


}






function ask(){

let a=
confirm(
"War diese Datei schädlich?\n\nOK = Ja\nAbbrechen = Nein"
);


if(a){

alert("Als schädlich gespeichert");

}

else{

alert("Als sicher gespeichert");

}

}







function single(){

document
.getElementById("scanArea")
.innerHTML=`

<h3>Einzelscan</h3>

<input id="singleFile" type="file">

<button onclick="startSandbox('singleFile')">
Start
</button>

`;

}







function folder(){


document
.getElementById("scanArea")
.innerHTML=`

<h3>OrdnerScan</h3>

<input id="folderFile"
type="file"
webkitdirectory
multiple>


<button onclick="folderStart()">
Ordner starten
</button>

<p id="folderStatus"></p>

`;

}





async function folderStart(){


let files=
document.getElementById("folderFile").files;


let out=
document.getElementById("folderStatus");


for(let i=0;i<files.length;i++){


out.innerHTML=
"Starte: "+files[i].name;


await new Promise(r=>setTimeout(r,500));


}


out.innerHTML=
"Ordner fertig geprüft";


}







function update(){

document
.getElementById("scanArea")
.innerHTML=
`
<h3>Update Scan</h3>

<p style="color:red">
Nicht verfügbar
</p>
`;

}







function downloadJSON(){


let data={

version:"1.0",

signatures:[]

};



let blob=
new Blob(
[
JSON.stringify(data,null,2)
],
{
type:"application/json"
}
);


let a=document.createElement("a");


a.href=
URL.createObjectURL(blob);


a.download="1.json";


a.click();


}



</script>


</body>
</html>
