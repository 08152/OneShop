<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GHOST 3D MODEL EDITOR</title>

<link rel="stylesheet" href="./style.css">

<!-- =====================================================
     DERSELBE THREE.JS AUFBAU WIE IN DEINEM FUNKTIONIERENDEN
     FPS-PROJEKT
===================================================== -->

<script type="importmap">
{
    "imports": {
        "three":
            "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

        "gltfloader":
            "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",

        "orbitcontrols":
            "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js"
    }
}
</script>

</head>

<body>


<!-- =====================================================
     TOPBAR
===================================================== -->

<div id="topbar">

    <div id="logo">
        GHOST 3D
    </div>


    <div id="objectMenu">

        <!-- POSITIVE FORMEN -->

        <button
            class="objectButton"
            id="sphereButton"
            title="Kugel"
        >
            <span class="sphereIcon"></span>
        </button>


        <button
            class="objectButton"
            id="cubeButton"
            title="Würfel"
        >
            <span class="cubeIcon"></span>
        </button>


        <button
            class="objectButton"
            id="cylinderButton"
            title="Zylinder"
        >
            <span class="cylinderIcon"></span>
        </button>


        <div class="separator"></div>


        <!-- NEGATIVE FORMEN -->

        <button
            class="objectButton negativeButton"
            id="negativeSphereButton"
            title="Negative Kugel"
        >
            <span class="negativeSphereIcon"></span>
        </button>


        <button
            class="objectButton negativeButton"
            id="negativeCubeButton"
            title="Negativer Würfel"
        >
            <span class="negativeCubeIcon"></span>
        </button>


        <button
            class="objectButton negativeButton"
            id="negativeCylinderButton"
            title="Negativer Zylinder"
        >
            <span class="negativeCylinderIcon"></span>
        </button>

    </div>


    <!-- TRANSFORM -->

    <div id="transformMenu">

        <button
            class="toolButton active"
            id="moveButton"
        >
            ↔ Bewegen
        </button>


        <button
            class="toolButton"
            id="rotateButton"
        >
            ⟳ Drehen
        </button>


        <button
            class="toolButton"
            id="scaleButton"
        >
            ↗ Skalieren
        </button>

    </div>

</div>



<!-- =====================================================
     RECHTE LEISTE
===================================================== -->

<div id="rightbar">

    <div class="panelTitle">
        PINSEL
    </div>


    <button
        class="brushButton active"
        data-size="0.12"
    >

        <span class="brushDot tiny"></span>

        Fein

    </button>


    <button
        class="brushButton"
        data-size="0.35"
    >

        <span class="brushDot medium"></span>

        Kleiner

    </button>


    <button
        class="brushButton"
        data-size="0.75"
    >

        <span class="brushDot big"></span>

        Groß

    </button>


    <div class="line"></div>


    <div class="panelTitle">
        MODELLIEREN
    </div>


    <button
        class="actionButton"
        id="raiseButton"
    >
        ▲ Erhöhen
    </button>


    <button
        class="actionButton"
        id="lowerButton"
    >
        ▼ Senken
    </button>


    <button
        class="actionButton"
        id="smoothButton"
    >
        ≈ Glätten
    </button>


    <div class="line"></div>


    <div class="panelTitle">
        OBJEKT
    </div>


    <button
        class="actionButton"
        id="deleteButton"
    >
        🗑 Löschen
    </button>


    <button
        class="actionButton"
        id="clearButton"
    >
        Szene leeren
    </button>

</div>



<!-- =====================================================
     INFO
===================================================== -->

<div id="infoPanel">

    <div id="selectedObject">
        Kein Objekt ausgewählt
    </div>


    <div id="dimensions">

        <div class="dimension">
            <span>BREITE</span>
            <strong id="width">
                0 mm
            </strong>
        </div>


        <div class="dimension">
            <span>HÖHE</span>
            <strong id="height">
                0 mm
            </strong>
        </div>


        <div class="dimension">
            <span>TIEFE</span>
            <strong id="depth">
                0 mm
            </strong>
        </div>

    </div>


    <div id="vertices">
        0 Modellierungspunkte
    </div>

</div>



<!-- =====================================================
     HILFE
===================================================== -->

<div id="help">

    <strong>GHOST 3D</strong>

    <br><br>

    Linksklick:
    Objekt auswählen

    <br>

    Ziehen:
    Objekt bewegen

    <br>

    Shift + Ziehen:
    Modellieren

    <br>

    Rechtsklick + Ziehen:
    Kamera

    <br>

    Mausrad:
    Zoom

    <br><br>

    <span class="positiveText">
        ● Positive Form
    </span>

    <br>

    <span class="negativeText">
        ● Negative Form
    </span>

</div>



<!-- =====================================================
     THREE.JS
===================================================== -->

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "orbitcontrols";


/* =====================================================
   GRUNDLEGENDE VARIABLEN
===================================================== */

let scene;

let camera;

let renderer;

let controls;

let raycaster;

let mouse;

let selected = null;

let mode = "move";

let brushSize = 0.12;

let sculptMode = "raise";

let dragging = false;

let sculpting = false;

let lastX = 0;

let lastY = 0;


/*
    Alle positiven und negativen Formen
*/

const objects = [];



/* =====================================================
   MATERIALIEN
===================================================== */

const positiveMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x6d86a8,

        roughness: 0.55,

        metalness: 0.15

    });


const selectedMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x2388ff,

        roughness: 0.5,

        metalness: 0.1

    });


/*
    Negative Formen bekommen ein rotes,
    durchsichtiges Material.
*/

const negativeMaterial =
    new THREE.MeshStandardMaterial({

        color: 0xff304f,

        transparent: true,

        opacity: 0.42,

        roughness: 0.35,

        metalness: 0.05,

        depthWrite: false

    });


const negativeSelectedMaterial =
    new THREE.MeshStandardMaterial({

        color: 0xff6a7c,

        transparent: true,

        opacity: 0.58,

        roughness: 0.3,

        depthWrite: false

    });



/* =====================================================
   INITIALISIERUNG
===================================================== */

init();


function init() {

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x101216
        );


    scene.fog =
        new THREE.Fog(
            0x101216,
            15,
            80
        );


    camera =
        new THREE.PerspectiveCamera(

            55,

            window.innerWidth /
            window.innerHeight,

            0.01,

            500

        );


    camera.position.set(
        7,
        5,
        9
    );


    renderer =
        new THREE.WebGLRenderer({

            antialias: true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    renderer.shadowMap.enabled =
        true;


    document.body.appendChild(
        renderer.domElement
    );


    controls =
        new OrbitControls(

            camera,

            renderer.domElement

        );


    controls.enableDamping =
        true;


    controls.dampingFactor =
        0.08;


    controls.target.set(
        0,
        1,
        0
    );


    raycaster =
        new THREE.Raycaster();


    mouse =
        new THREE.Vector2();


    createLights();

    createWorld();

    setupButtons();


    renderer.domElement
        .addEventListener(
            "pointerdown",
            pointerDown
        );


    renderer.domElement
        .addEventListener(
            "pointermove",
            pointerMove
        );


    window.addEventListener(
        "pointerup",
        pointerUp
    );


    window.addEventListener(
        "resize",
        resize
    );


    renderer.domElement
        .addEventListener(
            "contextmenu",
            event =>
                event.preventDefault()
        );


    animate();

}



/* =====================================================
   LICHT
===================================================== */

function createLights() {

    const ambient =
        new THREE.HemisphereLight(

            0xffffff,

            0x303030,

            2.5

        );


    scene.add(
        ambient
    );


    const directional =
        new THREE.DirectionalLight(

            0xffffff,

            3

        );


    directional.position.set(

        8,
        12,
        8

    );


    directional.castShadow =
        true;


    scene.add(
        directional
    );

}



/* =====================================================
   WELT
===================================================== */

function createWorld() {

    const groundGeometry =
        new THREE.PlaneGeometry(

            40,
            40

        );


    const groundMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x181c22,

            roughness: 0.9

        });


    const ground =
        new THREE.Mesh(

            groundGeometry,

            groundMaterial

        );


    ground.rotation.x =
        -Math.PI / 2;


    ground.position.y =
        -0.02;


    ground.receiveShadow =
        true;


    scene.add(
        ground
    );


    const grid =
        new THREE.GridHelper(

            40,

            40,

            0x555d68,

            0x292e36

        );


    scene.add(
        grid
    );

}



/* =====================================================
   POSITIVE KUGEL
===================================================== */

function createSphere() {

    const geometry =
        new THREE.SphereGeometry(

            1.4,

            32,

            32

        );


    createObject(

        geometry,

        "Kugel",

        false

    );

}



/* =====================================================
   POSITIVER WÜRFEL
===================================================== */

function createCube() {

    const geometry =
        new THREE.BoxGeometry(

            2,

            2,

            2,

            20,

            20,

            20

        );


    createObject(

        geometry,

        "Würfel",

        false

    );

}



/* =====================================================
   POSITIVER ZYLINDER
===================================================== */

function createCylinder() {

    const geometry =
        new THREE.CylinderGeometry(

            1.1,

            1.1,

            2.5,

            32,

            32

        );


    createObject(

        geometry,

        "Zylinder",

        false

    );

}



/* =====================================================
   NEGATIVE KUGEL
===================================================== */

function createNegativeSphere() {

    const geometry =
        new THREE.SphereGeometry(

            1.2,

            32,

            32

        );


    createObject(

        geometry,

        "Negative Kugel",

        true

    );

}



/* =====================================================
   NEGATIVER WÜRFEL
===================================================== */

function createNegativeCube() {

    const geometry =
        new THREE.BoxGeometry(

            1.7,

            1.7,

            1.7,

            20,

            20,

            20

        );


    createObject(

        geometry,

        "Negativer Würfel",

        true

    );

}



/* =====================================================
   NEGATIVER ZYLINDER
===================================================== */

function createNegativeCylinder() {

    const geometry =
        new THREE.CylinderGeometry(

            0.9,

            0.9,

            2.2,

            32,

            32

        );


    createObject(

        geometry,

        "Negativer Zylinder",

        true

    );

}



/* =====================================================
   OBJEKT ERSTELLEN
===================================================== */

function createObject(

    geometry,

    name,

    negative

) {

    const material =
        negative
            ? negativeMaterial.clone()
            : positiveMaterial.clone();


    const mesh =
        new THREE.Mesh(

            geometry,

            material

        );


    mesh.position.set(

        0,
        1.5,
        0

    );


    mesh.castShadow =
        true;


    mesh.receiveShadow =
        true;


    /*
       WICHTIG:

       negative = true bedeutet,
       dass diese Form später beim
       eigentlichen Modell-Boolean als
       Aussparung verwendet werden kann.
    */

    mesh.userData.name =
        name;


    mesh.userData.negative =
        negative;


    mesh.userData.type =
        negative
            ? "negative"
            : "positive";


    scene.add(
        mesh
    );


    objects.push(
        mesh
    );


    selectObject(
        mesh
    );

}



/* =====================================================
   AUSWÄHLEN
===================================================== */

function selectObject(
    object
) {

    if (selected) {

        selected.material =
            selected.userData.negative
                ? negativeMaterial
                : positiveMaterial;

    }


    selected =
        object;


    if (!selected) {

        updateInfo();

        return;

    }


    selected.material =
        selected.userData.negative
            ? negativeSelectedMaterial
            : selectedMaterial;


    updateInfo();

}



/* =====================================================
   INFO
===================================================== */

function updateInfo() {

    if (!selected) {

        setText(
            "selectedObject",
            "Kein Objekt ausgewählt"
        );


        setText(
            "width",
            "0 mm"
        );


        setText(
            "height",
            "0 mm"
        );


        setText(
            "depth",
            "0 mm"
        );


        setText(
            "vertices",
            "0 Modellierungspunkte"
        );


        return;

    }


    let name =
        selected.userData.name;


    setText(
        "selectedObject",
        name
    );


    selected.updateMatrixWorld(
        true
    );


    const box =
        new THREE.Box3()
            .setFromObject(
                selected
            );


    const size =
        new THREE.Vector3();


    box.getSize(
        size
    );


    /*
        1 Three.js Einheit =
        10 Millimeter
    */

    const MM = 10;


    setText(

        "width",

        (size.x * MM)
            .toFixed(1)
            + " mm"

    );


    setText(

        "height",

        (size.y * MM)
            .toFixed(1)
            + " mm"

    );


    setText(

        "depth",

        (size.z * MM)
            .toFixed(1)
            + " mm"

    );


    const count =
        selected.geometry
            .getAttribute(
                "position"
            )
            .count;


    setText(

        "vertices",

        count.toLocaleString(
            "de-DE"
        )
        +
        " Modellierungspunkte"

    );

}



/* =====================================================
   TEXT
===================================================== */

function setText(
    id,
    text
) {

    const element =
        document.getElementById(
            id
        );


    if (element) {

        element.textContent =
            text;

    }

}



/* =====================================================
   BUTTONS
===================================================== */

function setupButtons() {

    document.getElementById(
        "sphereButton"
    ).onclick =
        createSphere;


    document.getElementById(
        "cubeButton"
    ).onclick =
        createCube;


    document.getElementById(
        "cylinderButton"
    ).onclick =
        createCylinder;


    document.getElementById(
        "negativeSphereButton"
    ).onclick =
        createNegativeSphere;


    document.getElementById(
        "negativeCubeButton"
    ).onclick =
        createNegativeCube;


    document.getElementById(
        "negativeCylinderButton"
    ).onclick =
        createNegativeCylinder;


    document.getElementById(
        "moveButton"
    ).onclick =
        () =>
            setMode(
                "move"
            );


    document.getElementById(
        "rotateButton"
    ).onclick =
        () =>
            setMode(
                "rotate"
            );


    document.getElementById(
        "scaleButton"
    ).onclick =
        () =>
            setMode(
                "scale"
            );


    document.querySelectorAll(
        ".brushButton"
    ).forEach(

        button => {

            button.onclick =
                () => {

                    document
                        .querySelectorAll(
                            ".brushButton"
                        )
                        .forEach(
                            b =>
                                b.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    button.classList
                        .add(
                            "active"
                        );


                    brushSize =
                        Number(
                            button.dataset
                                .size
                        );

                };

        }

    );


    document.getElementById(
        "raiseButton"
    ).onclick =
        () =>
            sculptMode =
                "raise";


    document.getElementById(
        "lowerButton"
    ).onclick =
        () =>
            sculptMode =
                "lower";


    document.getElementById(
        "smoothButton"
    ).onclick =
        () =>
            sculptMode =
                "smooth";


    document.getElementById(
        "deleteButton"
    ).onclick =
        deleteSelected;


    document.getElementById(
        "clearButton"
    ).onclick =
        clearScene;

}



/* =====================================================
   MODUS
===================================================== */

function setMode(
    newMode
) {

    mode =
        newMode;


    document.querySelectorAll(
        ".toolButton"
    ).forEach(

        button =>
            button.classList
                .remove(
                    "active"
                )

    );


    if (
        newMode ===
        "move"
    ) {

        document.getElementById(
            "moveButton"
        ).classList
            .add(
                "active"
            );

    }


    if (
        newMode ===
        "rotate"
    ) {

        document.getElementById(
            "rotateButton"
        ).classList
            .add(
                "active"
            );

    }


    if (
        newMode ===
        "scale"
    ) {

        document.getElementById(
            "scaleButton"
        ).classList
            .add(
                "active"
            );

    }

}



/* =====================================================
   KLICK
===================================================== */

function pointerDown(
    event
) {

    if (
        event.button !== 0
    )
        return;


    lastX =
        event.clientX;


    lastY =
        event.clientY;


    const rect =
        renderer.domElement
            .getBoundingClientRect();


    mouse.x =
        (
            (
                event.clientX -
                rect.left
            )
            /
            rect.width
        )
        * 2 - 1;


    mouse.y =
        -(
            (
                event.clientY -
                rect.top
            )
            /
            rect.height
        )
        * 2 + 1;


    raycaster.setFromCamera(
        mouse,
        camera
    );


    const hits =
        raycaster
            .intersectObjects(
                objects,
                false
            );


    if (!hits.length) {

        selectObject(
            null
        );

        return;

    }


    selectObject(
        hits[0].object
    );


    if (
        event.shiftKey
    ) {

        sculpting =
            true;


        sculpt(
            event
        );

    }
    else {

        dragging =
            true;

    }

}



/* =====================================================
   BEWEGEN
===================================================== */

function pointerMove(
    event
) {

    if (
        sculpting &&
        selected
    ) {

        sculpt(
            event
        );

        return;

    }


    if (
        !dragging ||
        !selected
    )
        return;


    const dx =
        event.clientX -
        lastX;


    const dy =
        event.clientY -
        lastY;


    lastX =
        event.clientX;


    lastY =
        event.clientY;


    if (
        mode ===
        "move"
    ) {

        selected.position.x +=
            dx * 0.01;


        selected.position.y -=
            dy * 0.01;

    }


    if (
        mode ===
        "rotate"
    ) {

        selected.rotation.y +=
            dx * 0.01;


        selected.rotation.x +=
            dy * 0.01;

    }


    if (
        mode ===
        "scale"
    ) {

        const factor =
            THREE.MathUtils.clamp(

                1 -
                dy * 0.01,

                0.85,

                1.15

            );


        selected.scale
            .multiplyScalar(
                factor
            );

    }


    updateInfo();

}



/* =====================================================
   LOSLASSEN
===================================================== */

function pointerUp() {

    dragging =
        false;


    sculpting =
        false;

}



/* =====================================================
   MODELLIERPINSEL
===================================================== */

function sculpt(
    event
) {

    if (!selected)
        return;


    const rect =
        renderer.domElement
            .getBoundingClientRect();


    mouse.x =
        (
            (
                event.clientX -
                rect.left
            )
            /
            rect.width
        )
        * 2 - 1;


    mouse.y =
        -(
            (
                event.clientY -
                rect.top
            )
            /
            rect.height
        )
        * 2 + 1;


    raycaster.setFromCamera(
        mouse,
        camera
    );


    const hits =
        raycaster
            .intersectObject(
                selected,
                false
            );


    if (!hits.length)
        return;


    const hit =
        hits[0];


    const point =
        selected.worldToLocal(
            hit.point.clone()
        );


    const position =
        selected.geometry
            .getAttribute(
                "position"
            );


    const normal =
        hit.face.normal.clone();


    for (
        let i = 0;
        i < position.count;
        i++
    ) {

        const vertex =
            new THREE.Vector3();


        vertex.fromBufferAttribute(
            position,
            i
        );


        const distance =
            vertex.distanceTo(
                point
            );


        if (
            distance >
            brushSize
        )
            continue;


        const strength =
            1 -
            distance /
            brushSize;


        const amount =
            strength *
            strength *
            0.05;


        if (
            sculptMode ===
            "raise"
        ) {

            vertex.add(

                normal
                    .clone()
                    .multiplyScalar(
                        amount
                    )

            );

        }


        if (
            sculptMode ===
            "lower"
        ) {

            vertex.add(

                normal
                    .clone()
                    .multiplyScalar(
                        -amount
                    )

            );

        }


        if (
            sculptMode ===
            "smooth"
        ) {

            vertex.multiplyScalar(
                1 -
                amount *
                0.2
            );

        }


        position.setXYZ(

            i,

            vertex.x,

            vertex.y,

            vertex.z

        );

    }


    position.needsUpdate =
        true;


    selected.geometry
        .computeVertexNormals();


    selected.geometry
        .computeBoundingSphere();


    updateInfo();

}



/* =====================================================
   LÖSCHEN
===================================================== */

function deleteSelected() {

    if (!selected)
        return;


    const index =
        objects.indexOf(
            selected
        );


    if (
        index >= 0
    ) {

        objects.splice(
            index,
            1
        );

    }


    scene.remove(
        selected
    );


    selected.geometry.dispose();


    selected.material.dispose();


    selected =
        null;


    updateInfo();

}



/* =====================================================
   SZENE LEEREN
===================================================== */

function clearScene() {

    objects.forEach(
        object => {

            scene.remove(
                object
            );


            object.geometry
                .dispose();


            object.material
                .dispose();

        }
    );


    objects.length =
        0;


    selected =
        null;


    updateInfo();

}



/* =====================================================
   RESIZE
===================================================== */

function resize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}



/* =====================================================
   RENDER
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );

}

</script>

</body>
</html>
