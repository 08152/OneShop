<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Online-Navigations-System</title>
    <!-- Leaflet CSS für die 2D-Karte -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            color: #e0e0e0;
        }
        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #map-view {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Cockpit & Eingabe Overlay */
        .overlay-panel {
            position: absolute;
            z-index: 1000;
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #search-panel {
            top: 15px;
            left: 15px;
            width: 380px;
        }
        #cockpit-panel {
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
        }
        .input-group {
            position: relative;
            margin-bottom: 12px;
        }
        .input-group:last-child {
            margin-bottom: 0;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            background: #252525;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        /* Autovervollständigung */
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #252525;
            border: 1px solid #444;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1010;
            border-radius: 0 0 6px 6px;
            list-style: none;
        }
        .suggestions-list li {
            padding: 10px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid #333;
        }
        .suggestions-list li:hover {
            background: #3b82f6;
            color: white;
        }
        /* Tacho / Cockpit Werte */
        .cockpit-item {
            flex: 1;
        }
        .cockpit-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .cockpit-value {
            font-size: 18px;
            font-weight: bold;
            color: #3b82f6;
        }
        #nav-status {
            color: #10b981;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            font-weight: 500;
        }
        /* Custom Dark Theme Styles für Leaflet Controls */
        .leaflet-bar a {
            background-color: #222 !important;
            color: #fff !important;
            border-bottom: 1px solid #444 !important;
        }
        .leaflet-bar a:hover {
            background-color: #333 !important;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Das Karten-Element -->
        <div id="map-view"></div>

        <!-- Such-Panel -->
        <div id="search-panel" class="overlay-panel">
            <div class="input-group">
                <input type="text" id="start-input" placeholder="Startadresse eingeben..." autocomplete="off">
                <ul id="start-suggestions" class="suggestions-list"></ul>
            </div>
            <div class="input-group">
                <input type="text" id="target-input" placeholder="Zieladresse eingeben..." autocomplete="off">
                <ul id="target-suggestions" class="suggestions-list"></ul>
            </div>
            <div id="nav-status">Bereit für Navigation</div>
        </div>

        <!-- Cockpit / Tacho-Panel -->
        <div id="cockpit-panel" class="overlay-panel">
            <div class="cockpit-item">
                <div class="cockpit-label">Uhrzeit</div>
                <div id="cockpit-time" class="cockpit-value">--:--:--</div>
            </div>
            <div class="cockpit-item">
                <div class="cockpit-label">Ankunft (ETA)</div>
                <div id="cockpit-eta" class="cockpit-value">--:--</div>
            </div>
            <div class="cockpit-item">
                <div class="cockpit-label">Distanz</div>
                <div id="cockpit-dist" class="cockpit-value">0.0 km</div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS Core-Bibliothek -->
    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Die neue kombinierte Skript-Datei -->
    <script src="1.js"></script>
</body>
</html>
