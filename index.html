<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live GPS Navi</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

html,body{
margin:0;
height:100%;
overflow:hidden;
font-family:Arial;
}

#map{
width:100%;
height:100%;
}


.panel{

position:absolute;
top:10px;
left:10px;
right:10px;

z-index:1000;

background:white;

padding:12px;

border-radius:18px;

box-shadow:0 0 15px #555;

}


input,button{

width:100%;

padding:14px;

margin-top:8px;

font-size:17px;

border-radius:12px;

border:1px solid #aaa;

}


button{

background:#006cff;
color:white;

}


.car-icon{

font-size:50px;

text-align:center;

transform-origin:center;

}



#naviInfo{

position:absolute;

bottom:20px;

left:20px;

right:20px;

z-index:2000;

background:rgba(0,0,0,.75);

color:white;

padding:20px;

border-radius:20px;

font-size:24px;

text-align:center;

display:none;

}


.arrow{

font-size:90px;

}


.fullscreenBtn{

position:absolute;

right:15px;

top:15px;

z-index:3000;

width:auto;

}


</style>

</head>


<body>


<div class="panel">


<input id="ziel"
placeholder="Ziel eingeben">


<button onclick="prepareRoute()">

🔎 Route suchen

</button>


<button id="startBtn"
style="display:none"
onclick="startNavigation()">

🚗 Navigation starten

</button>


<div id="info">

GPS wird gesucht...

</div>


</div>



<button class="fullscreenBtn"
onclick="toggleNaviMode()">

⛶

</button>



<div id="naviInfo">

<div class="arrow">
⬆️
</div>


<div id="naviText">

Navigation

</div>


</div>



<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


let map =
L.map("map")
.setView([48.1351,11.5820],16);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{
maxZoom:19
}

).addTo(map);



let currentPos=null;

let marker=null;

let routeLine=null;

let navigationLine=null;


let routing=[];

let instructions=[];

let nextInstruction=0;


let navigationStarted=false;


let heading=0;


let carIcon=L.divIcon({

html:"⬆️",

className:"car-icon",

iconSize:[50,50],

iconAnchor:[25,25]

});

// ===============================
// LIVE GPS TRACKING
// ===============================


navigator.geolocation.watchPosition(

position=>{


let lat =
position.coords.latitude;


let lon =
position.coords.longitude;



currentPos=[lat,lon];



// Fahrtrichtung aus GPS

if(position.coords.heading !== null &&
position.coords.heading !== undefined){


heading =
position.coords.heading;



let car =
document.querySelector(".car-icon");


if(car){

car.style.transform =
"rotate("
+
heading
+
"deg)";

}


}




// Auto erstellen

if(!marker){


marker=L.marker(

currentPos,

{
icon:carIcon
}

)
.addTo(map);



map.setView(
currentPos,
18
);


}

else{


marker.setLatLng(
currentPos
);


}




// Kamera folgt Auto

if(navigationStarted){


map.setView(

currentPos,

19,

{
animate:true,
duration:0.5
}

);


}





updateNavigationLine();

checkRoute();

checkInstructions();



},



error=>{


document.getElementById("info").innerHTML =
"GPS Fehler";


},



{

enableHighAccuracy:true,

maximumAge:1000,

timeout:5000

}



);







// ===============================
// ROUTE VORBEREITEN
// ===============================


async function prepareRoute(){


document.getElementById("startBtn")
.style.display="block";


await route();


}






function startNavigation(){


navigationStarted=true;


map.setZoom(19);


speak(
"Navigation gestartet"
);


}








// ===============================
// ROUTE BERECHNEN
// ===============================


async function route(){



let ziel =
document.getElementById("ziel").value;



let geo =
await fetch(

"https://nominatim.openstreetmap.org/search?format=json&q="
+
encodeURIComponent(ziel)

);



let data =
await geo.json();



if(data.length===0){

alert("Ziel nicht gefunden");

return;

}




let zielPos=[

parseFloat(data[0].lat),

parseFloat(data[0].lon)

];






let url =

"https://router.project-osrm.org/route/v1/driving/"
+
currentPos[1]
+
","
+
currentPos[0]
+
";"
+
zielPos[1]
+
","
+
zielPos[0]
+
"?overview=full&steps=true&geometries=geojson";





let res =
await fetch(url);



let json =
await res.json();



let r =
json.routes[0];





routing =
r.geometry.coordinates.map(

c=>[c[1],c[0]]

);





if(routeLine)

map.removeLayer(routeLine);



routeLine =
L.polyline(

routing,

{
color:"blue",
weight:8
}

)
.addTo(map);





navigationLine =
L.polyline(

routing,

{
color:"#006cff",
weight:8
}

)
.addTo(map);







// ===============================
// NAVIGATIONS-SCHRITTE
// ===============================


instructions=[];



r.legs[0].steps.forEach(step=>{


instructions.push({

text:createInstruction(step),

distance:step.distance

});



});



nextInstruction=0;




document.getElementById("info").innerHTML=

"🚗 "
+
(r.distance/1000).toFixed(1)
+
" km<br>⏱️ "
+
Math.round(r.duration/60)
+
" Minuten";



}








// ===============================
// BLAUE LINIE NUR VOR AUTO
// ===============================


function updateNavigationLine(){


if(!navigationLine ||
!routing.length ||
!currentPos)

return;



let index=0;

let best=999999;



routing.forEach((p,i)=>{


let d =
map.distance(
currentPos,
p
);



if(d<best){

best=d;

index=i;

}


});



navigationLine.setLatLngs(

routing.slice(index)

);


}

// ===============================
// NAVIGATIONSTEXT MIT STRASSENNAME
// ===============================


function createInstruction(step){


let road="";


if(step.name &&
step.name.trim()!==""){


road =
" auf "
+
step.name;


}



let type =
step.maneuver.type;


let modifier =
step.maneuver.modifier;


let text="";



if(type==="depart"){


text =
"Starten"
+
road;


}



else if(type==="arrive"){


text =
"Sie haben Ihr Ziel erreicht";


}



else if(type==="roundabout"){


let exit =
step.maneuver.exit || 1;


text =
"Kreisverkehr. "
+
"Die "
+
exit
+
". Ausfahrt nehmen"
+
road;


}



else if(type==="turn"){



switch(modifier){


case "left":

text =
"Links abbiegen"
+
road;

break;



case "right":

text =
"Rechts abbiegen"
+
road;

break;



case "slight left":

text =
"Bleiben Sie links halten"
+
road;

break;



case "slight right":

text =
"Bleiben Sie rechts halten"
+
road;

break;



case "sharp left":

text =
"Scharf links abbiegen"
+
road;

break;



case "sharp right":

text =
"Scharf rechts abbiegen"
+
road;

break;



case "uturn":

text =
"Bitte wenden"
+
road;

break;



default:

text =
"Geradeaus weiterfahren"
+
road;


}


}



else{


text =
"Weiterfahren"
+
road;


}



return text;


}








// ===============================
// ABBIEGE-ANSAGEN
// ===============================


let announced300=false;

let announced100=false;

let announced50=false;

let announcedNow=false;




function checkInstructions(){



if(nextInstruction>=instructions.length)

return;




let inst =
instructions[nextInstruction];



let d =
inst.distance;





if(d<300 && !announced300){


speak(

"In 300 Metern. "
+
inst.text

);


announced300=true;


}





if(d<100 && !announced100){


speak(

"In 100 Metern. "
+
inst.text

);


announced100=true;


}





if(d<50 && !announced50){


speak(

"In 50 Metern. "
+
inst.text

);


announced50=true;


}





if(d<15 && !announcedNow){


speak(

"Jetzt. "
+
inst.text

);



document.getElementById("naviText")
.innerHTML=

"➡️ "
+
inst.text;



nextInstruction++;


announced300=false;

announced100=false;

announced50=false;

announcedNow=false;


}


}







// ===============================
// ROUTE VERLASSEN
// ===============================


function checkRoute(){



if(!routing.length ||
!currentPos)

return;



let min=999999;



routing.forEach(p=>{


let d =
map.distance(
currentPos,
p
);



if(d<min)

min=d;


});



if(min>80){


speak(
"Route verlassen. Neue Route wird berechnet."
);


route();


}


}







// ===============================
// FESTE DEUTSCHE STIMME
// ===============================


let selectedVoice=null;



function loadVoice(){



let voices =
speechSynthesis.getVoices();



let bevorzugt=[

"Google Deutsch",

"Microsoft Hedda",

"Anna",

"Helena"

];



for(let name of bevorzugt){


let v =
voices.find(x=>

x.name.includes(name)

);



if(v){

selectedVoice=v;

break;

}


}



if(!selectedVoice){


selectedVoice =
voices.find(v=>

v.lang.startsWith("de")

);


}



}



speechSynthesis.onvoiceschanged =
loadVoice;


loadVoice();







function speak(text){



speechSynthesis.cancel();



let msg =
new SpeechSynthesisUtterance(text);



msg.lang="de-DE";


if(selectedVoice)

msg.voice=selectedVoice;



msg.rate=0.9;

msg.pitch=1;

msg.volume=1;



speechSynthesis.speak(msg);


}







// ===============================
// VOLLBILD ANDROID NAVI
// ===============================


let fullscreen=false;



function toggleNaviMode(){



if(!fullscreen){



if(document.documentElement.requestFullscreen)

document.documentElement.requestFullscreen();



document.querySelector(".panel")
.style.display="none";



document.getElementById("naviInfo")
.style.display="block";



fullscreen=true;



}

else{


if(document.exitFullscreen)

document.exitFullscreen();



document.querySelector(".panel")
.style.display="block";



document.getElementById("naviInfo")
.style.display="none";



fullscreen=false;


}



}







// ===============================
// KOMPASS-DREHUNG
// ===============================


window.addEventListener(

"deviceorientationabsolute",

e=>{


if(e.alpha!==null){


heading =
360-e.alpha;



let car =
document.querySelector(".car-icon");



if(car){


car.style.transform =
"rotate("
+
heading
+
"deg)";


}


}


}

);
</script>

</body>

</html>
