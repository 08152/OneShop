<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AVI zu MP4 Konverter</title>

<style>
body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:500px;
    background:#1f2937;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 20px #000;
}

h1{
    color:#facc15;
}

input{
    width:100%;
    margin:20px 0;
    padding:12px;
    background:#374151;
    color:white;
    border-radius:8px;
}

button{
    width:100%;
    padding:15px;
    background:#facc15;
    color:#111;
    border:0;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#eab308;
}

button:disabled{
    background:#666;
}

progress{
    width:100%;
    height:25px;
    margin-top:20px;
}

#status{
    margin-top:20px;
}
</style>

</head>

<body>

<div class="container">

<h1>🎬 AVI → MP4</h1>

<p>AVI-Datei auswählen und auf dem Render-Server umwandeln.</p>

<input 
type="file" 
id="video"
accept=".avi">

<button id="btn" onclick="upload()">
Konvertieren
</button>

<progress id="progress" value="0" max="100"></progress>

<div id="status">
Bereit
</div>

</div>


<script>

const SERVER =
"https://oneshop-1.onrender.com";


async function upload(){

const file =
document.getElementById("video").files[0];

const btn =
document.getElementById("btn");

const status =
document.getElementById("status");

const progress =
document.getElementById("progress");


if(!file){

alert("Bitte AVI-Datei auswählen");

return;

}


btn.disabled=true;

status.innerHTML =
"Upload wird gestartet...";


let form =
new FormData();

form.append("video",file);



let xhr =
new XMLHttpRequest();


xhr.open(
"POST",
SERVER + "/convert",
true
);


xhr.responseType="blob";



xhr.upload.onprogress=function(e){

if(e.lengthComputable){

let percent =
(e.loaded/e.total)*100;

progress.value=percent;

status.innerHTML =
"Upload: "+
Math.round(percent)+"%";

}

};



xhr.onload=function(){


if(xhr.status===200){


status.innerHTML =
"MP4 wird heruntergeladen...";


let blob =
xhr.response;


let url =
URL.createObjectURL(blob);


let a =
document.createElement("a");


a.href=url;

a.download =
file.name.replace(".avi","")+".mp4";


document.body.appendChild(a);

a.click();

document.body.removeChild(a);


URL.revokeObjectURL(url);


status.innerHTML =
"✅ Fertig!";


}else{


status.innerHTML =
"❌ Server-Fehler: "+xhr.status;


}


btn.disabled=false;


};



xhr.onerror=function(){


status.innerHTML =
"❌ Verbindung zum Server fehlgeschlagen";


btn.disabled=false;


};



xhr.send(form);


}

</script>

</body>
</html>
