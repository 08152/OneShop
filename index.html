<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine freie Suche</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .search-panel {
            text-align: center;
            background-color: #141414;
            padding: 30px;
            border: 2px solid #00ff66;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        input[type="text"] {
            background-color: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 12px;
            width: 80%;
            margin-bottom: 15px;
            border-radius: 4px;
            font-family: inherit;
            outline: none;
        }
        input[type="text"]:focus {
            box-shadow: 0 0 8px #00ff66;
        }
        input[type="submit"] {
            background-color: #00ff66;
            color: #000;
            border: none;
            padding: 10px 25px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        input[type="submit"]:hover {
            background-color: #00cc52;
            box-shadow: 0 0 10px #00cc52;
        }
        p {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="search-panel">
        <h1>Netzwerk Suche</h1>
        
        <!-- Nutzt eine öffentliche, barrierefreie Suchinstanz -->
        <form method="get" action="https://duckduckgo.com">
            <input type="text" name="q" placeholder="Suchbegriff eingeben..." required>
            <br>
            <input type="submit" value="SUCHEN">
        </form>
        
        <p>Ergebnisse laden im sicheren Text-Modus.</p>
    </div>

</body>
</html>
