<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Norton Smart Scanner</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
height:100vh;
background:#101010;
font-family:"Segoe UI",Arial;
color:white;
display:flex;

}


/* Menü */

.sidebar{

width:260px;
background:#080808;
border-right:1px solid #333;
padding:25px;

}


.logo{

font-size:26px;
font-weight:bold;
color:#ffcc00;
margin-bottom:40px;

}


.menu button{

width:100%;
padding:15px;
margin-bottom:12px;

background:#1b1b1b;
color:white;

border:0;
border-radius:8px;

text-align:left;
cursor:pointer;

font-size:16px;

}


.menu button:hover,
.menu button.active{

background:#ffcc00;
color:black;
font-weight:bold;

}



/* Haupt */

.main{

flex:1;
padding:40px;
overflow:auto;

}



.title{

font-size:32px;
font-weight:bold;
margin-bottom:30px;

}




/* Kreis */


.circle{

width:220px;
height:220px;

border-radius:50%;

border:8px solid #ffcc00;

display:flex;

align-items:center;
justify-content:center;

flex-direction:column;

transition:.4s;

}


.circle.safe{

border-color:#2ecc71;

}


.circle.danger{

border-color:#e74c3c;

}


.circle.scan{

animation:pulse 1s infinite;

}


@keyframes pulse{

50%{

transform:scale(1.05);

}

}



.circle span:first-child{

font-size:13px;
color:#aaa;

}



.circle span:last-child{

font-size:30px;
font-weight:bold;

color:#ffcc00;

}





.card{

margin-top:35px;

background:#1c1c1c;

border:1px solid #333;

border-radius:15px;

padding:25px;

max-width:800px;

}




.action{

background:#ffcc00;

color:#000;

border:0;

padding:14px 25px;

border-radius:8px;

font-weight:bold;

cursor:pointer;

margin:5px;

}


.action:hover{

background:#ffe066;

}



.hidden{

display:none;

}




.progress{

margin-top:20px;

background:#333;

height:20px;

border-radius:10px;

overflow:hidden;

}


.bar{

height:100%;

width:0%;

background:#ffcc00;

transition:.3s;

}



.result{

margin-top:20px;

background:#111;

padding:20px;

border-radius:10px;

}


.filelist{

max-height:250px;

overflow:auto;

text-align:left;

margin-top:20px;

}



.file{

padding:8px;

border-bottom:1px solid #333;

}


</style>

</head>


<body>



<div class="sidebar">


<div class="logo">
✓ Norton 360
</div>



<div class="menu">


<button class="active" onclick="page('home',this)">
Home
</button>


<button onclick="page('scan',this)">
Scan
</button>


<button onclick="page('download',this)">
Download 1.json
</button>


</div>


</div>







<div class="main">



<!-- HOME -->


<div id="home">


<div class="title">
Home
</div>



<div id="circle" class="circle">


<span>
RISIKOSTUFE
</span>


<span id="status">
BEREIT
</span>


</div>




<div class="card">


<h2>
Schnellscan
</h2>


<input id="homeFile" type="file">


<br>


<button class="action" onclick="scanSingle('homeFile')">

Scan starten

</button>


<div id="homeResult" class="result">

Bereit

</div>


</div>


</div>







<!-- SCAN -->


<div id="scan" class="hidden">


<div class="title">
Scan
</div>



<div class="card">


<button class="action" onclick="singleScan()">

Einzelscan

</button>


<button class="action" onclick="folderScan()">

OrdnerScan

</button>


<button class="action" onclick="updateScan()">

Update Scan

</button>



<div id="scanArea"></div>


</div>


</div>








<!-- DOWNLOAD -->


<div id="download" class="hidden">


<div class="title">
Download 1.json
</div>


<div class="card">


<p>
Neue Malware-Datenbank herunterladen
</p>


<button class="action" onclick="downloadJSON()">

1.json herunterladen

</button>


</div>


</div>






</div>







<script>


function page(id,btn){


document
.querySelectorAll(".main > div")
.forEach(x=>x.classList.add("hidden"));


document
.getElementById(id)
.classList.remove("hidden");


document
.querySelectorAll(".menu button")
.forEach(x=>x.classList.remove("active"));


btn.classList.add("active");


}






function setScan(text){


document
.getElementById("status")
.innerHTML=text;


}





async function scanSingle(id){


let file =
document.getElementById(id).files[0];


if(!file){

alert("Datei auswählen");

return;

}



let circle=
document.getElementById("circle");


circle.className="circle scan";


setScan("START");



await wait(500);


setScan("LESEN");


await wait(700);


setScan("PRÜFEN");


await wait(1000);


let danger=false;



circle.className="circle safe";

setScan("SICHER");



document
.getElementById("homeResult")
.innerHTML=

"Fertig geprüft:<br>"+file.name;



askLearning();



}







function singleScan(){


document
.getElementById("scanArea")
.innerHTML=`

<h3>Einzelscan</h3>


<input id="singleScanFile" type="file">


<br>


<button class="action"
onclick="scanSingle('singleScanFile')">

Start

</button>


<div class="result" id="scanResult">

Bereit

</div>


`;

}






function folderScan(){


document
.getElementById("scanArea")
.innerHTML=`

<h3>OrdnerScan</h3>


<input 
id="folder"
type="file"
webkitdirectory
multiple>


<br>


<button class="action" onclick="scanFolderFiles()">

Ordner starten

</button>


<div class="progress">

<div id="bar" class="bar"></div>

</div>


<div id="files" class="filelist"></div>


`;

}







async function scanFolderFiles(){


let files=
document.getElementById("folder").files;



if(files.length===0){

alert("Ordner auswählen");

return;

}



let list=
document.getElementById("files");


let bar=
document.getElementById("bar");



list.innerHTML="";


for(let i=0;i<files.length;i++){



list.innerHTML+=

`
<div class="file">
🔍 Starte: ${files[i].name}
</div>
`;



bar.style.width=

((i+1)/files.length*100)
+"%";



await wait(300);



}



document
.getElementById("status")
.innerHTML="SICHER";


askLearning();



}






function updateScan(){


document
.getElementById("scanArea")
.innerHTML=

`

<h3>Update Scan</h3>

<p style="color:#e74c3c">
Nicht verfügbar
</p>

`;

}






function askLearning(){


let answer=
confirm(
"War diese Datei schädlich?\n\nOK = Ja\nAbbrechen = Nein"
);



if(answer){

alert(
"Als Malware gelernt"
);

}
else{

alert(
"Als sicher gelernt"
);

}


}







function downloadJSON(){


let json={

version:"1.0",

signatures:[]

};



let blob=
new Blob(
[
JSON.stringify(json,null,2)
],
{
type:"application/json"
}
);



let url=
URL.createObjectURL(blob);



let a=document.createElement("a");

a.href=url;

a.download="1.json";

a.click();


}



function wait(ms){

return new Promise(
r=>setTimeout(r,ms)
);

}



</script>


</body>
</html>
