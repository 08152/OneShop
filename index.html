<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Global Online Navigator</title>
    <!-- JSZip für den automatischen Download der Offline-Version -->
    <script src="https://cloudflare.com"></script>
    
    <!-- Leaflet Engine (Macht es zu einer interaktiven 2D-Karte wie Google Maps) -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #111; color: #fff; }
        #header { background: #0c0d14; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00d2ff; box-shadow: 0 2px 10px rgba(0,210,255,0.2); z-index: 2000; position: relative; }
        #header h2 { margin: 0; font-size: 20px; color: #00d2ff; letter-spacing: 1px; }
        #status-indicator { font-weight: bold; padding: 6px 12px; border-radius: 20px; font-size: 12px; text-transform: uppercase; }
        .online-status { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
        .offline-status { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }
        
        #main-container { display: flex; width: 100%; height: calc(100vh - 60px); position: relative; }
        #map-view { width: 100%; height: 100%; z-index: 1; }
        
        /* Steuerungs-Panel auf der Karte */
        #control-panel { position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(12, 13, 20, 0.9); padding: 25px; border-radius: 12px; border: 1px solid #00d2ff; width: 300px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); backdrop-filter: blur(8px); }
        #control-panel h3 { margin-top: 0; color: #00d2ff; font-size: 16px; margin-bottom: 15px; text-transform: uppercase; }
        .input-group { margin-bottom: 15px; position: relative; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 11px; color: #8a99ad; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 10px; background: #171926; border: 1px solid #00d2ff; border-radius: 6px; color: white; font-size: 14px; box-sizing: border-box; }
        .input-group input:focus { outline: none; box-shadow: 0 0 10px rgba(0,210,255,0.5); }
        
        /* Dropdown-Vorschläge für die Gemeinden */
        .suggestions-box { position: absolute; top: 60px; left: 0; width: 100%; background: #171926; border: 1px solid #00d2ff; border-top: none; border-radius: 0 0 6px 6px; max-height: 160px; overflow-y: auto; z-index: 3000; display: none; }
        .suggestion-item { padding: 10px 12px; cursor: pointer; font-size: 13px; color: #ccc; border-bottom: 1px solid #23273a; }
        .suggestion-item:hover { background: #4364f7; color: white; }
        
        .btn { width: 100%; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.3s; margin-bottom: 10px; letter-spacing: 0.5px; }
        #btn-route { background: linear-gradient(135deg, #0052d4, #4364f7); color: white; }
        #btn-route:hover { filter: brightness(1.2); }
        #btn-zip { background: linear-gradient(135deg, #e67e22, #d35400); color: white; margin-bottom: 0; }
        #btn-zip:hover { filter: brightness(1.2); }
        
        #output-results { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(0,210,255,0.3); display: none; }
        .data-row { margin-bottom: 8px; font-size: 14px; display: flex; justify-content: space-between; }
        .data-val { font-weight: bold; color: #00d2ff; text-shadow: 0 0 5px rgba(0,210,255,0.3); }
        
        /* Gitter-Hintergrund für den Offline-Fall */
        .offline-grid-bg { background-color: #111217; background-image: linear-gradient(rgba(0, 210, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 210, 255, 0.04) 1px, transparent 1px); background-size: 30px 30px; display: flex; justify-content: center; align-items: center; text-align: center; color: #8a99ad; }
    </style>
</head>
<body>

    <div id="header">
        <h2>★ 2D Online Matrix Navigator</h2>
        <div id="status-indicator" class="online-status">Online-Kartennetz</div>
    </div>

    <div id="main-container">
        <!-- 2D-Kartenansicht (Google Maps Style) -->
        <div id="map-view"></div>

        <!-- Bedienfeld -->
        <div id="control-panel">
            <h3>Routenplaner (3 Mio. Orte)</h3>
            
            <div class="input-group">
                <label>Startpunkt:</label>
                <input type="text" id="start-node" placeholder="Gemeinde eingeben..." autocomplete="off">
                <div id="start-suggestions" class="suggestions-box"></div>
            </div>
            
            <div class="input-group">
                <label>Zielpunkt:</label>
                <input type="text" id="target-node" placeholder="Gemeinde eintippen..." autocomplete="off">
                <div id="target-suggestions" class="suggestions-box"></div>
            </div>
            
            <button id="btn-route" class="btn" onclick="calculate2DRoute()">BLAUE ROUTE ZEICHNEN</button>
            <button id="btn-zip" class="btn" onclick="triggerZipDownload()">OFFLINE-ZIP DOWNLOADEN</button>

            <div id="output-results">
                <div class="data-row"><span>Fahrstrecke:</span> <span id="val-km" class="data-val">-</span></div>
                <div class="data-row"><span>Fahrzeit (Auto):</span> <span id="val-time" class="data-val">-</span></div>
            </div>
        </div>
    </div>

    <!-- Einbindung der externen Steuerungsdatei -->
    <script src="script.js"></script>
</body>
</html>
