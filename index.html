<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D GPS Live Navigator</title>
    <!-- JSZip für den automatischen Download der Offline-Version -->
    <script src="https://cloudflare.com"></script>
    
    <!-- Leaflet Engine (Interaktive 2D-Karte wie Google Maps) -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #0b0c10; color: #fff; }
        #header { background: #1f2833; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #66fcf1; box-shadow: 0 2px 10px rgba(102,252,241,0.2); z-index: 2000; position: relative; }
        #header h2 { margin: 0; font-size: 18px; color: #66fcf1; letter-spacing: 1px; }
        
        /* Obere Cockpit-Anzeige für Navigationstaktung */
        #cockpit-bar { display: flex; gap: 15px; align-items: center; }
        .cockpit-item { background: #0b0c10; padding: 5px 15px; border-radius: 6px; border: 1px solid #45a29e; font-size: 13px; font-weight: bold; color: #66fcf1; }
        
        #main-container { display: flex; width: 100%; height: calc(100vh - 55px); position: relative; }
        #map-view { width: 100%; height: 100%; z-index: 1; }
        
        /* Steuerungs-Panel auf der Karte */
        #control-panel { position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(31, 40, 51, 0.95); padding: 22px; border-radius: 12px; border: 1px solid #66fcf1; width: 290px; box-shadow: 0 4px 25px rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
        #control-panel h3 { margin-top: 0; color: #66fcf1; font-size: 15px; margin-bottom: 15px; text-transform: uppercase; text-align: center; }
        .input-group { margin-bottom: 12px; position: relative; }
        .input-group label { display: block; margin-bottom: 4px; font-size: 11px; color: #c5a059; text-transform: uppercase; font-weight: bold; }
        .input-group input { width: 100%; padding: 10px; background: #0b0c10; border: 1px solid #45a29e; border-radius: 6px; color: white; font-size: 13px; box-sizing: border-box; }
        .input-group input:focus { outline: none; border-color: #66fcf1; box-shadow: 0 0 8px rgba(102,252,241,0.4); }
        
        /* Dropdown-Vorschläge für die 3 Millionen Orte */
        .suggestions-box { position: absolute; top: 58px; left: 0; width: 100%; background: #0b0c10; border: 1px solid #66fcf1; border-top: none; border-radius: 0 0 6px 6px; max-height: 140px; overflow-y: auto; z-index: 3000; display: none; }
        .suggestion-item { padding: 8px 12px; cursor: pointer; font-size: 12px; color: #c5c6c7; border-bottom: 1px solid #1f2833; }
        .suggestion-item:hover { background: #45a29e; color: white; }
        
        .btn { width: 100%; border: none; padding: 11px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
        #btn-route { background: linear-gradient(135deg, #45a29e, #1f2833); color: #66fcf1; border: 1px solid #66fcf1; }
        #btn-route:hover { background: #66fcf1; color: #0b0c10; }
        #btn-zip { background: linear-gradient(135deg, #e67e22, #d35400); color: white; margin-bottom: 0; }
        #btn-zip:hover { filter: brightness(1.2); }
        
        #output-results { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(102,252,241,0.3); display: none; }
        .data-row { margin-bottom: 6px; font-size: 13px; display: flex; justify-content: space-between; }
        .data-val { font-weight: bold; color: #66fcf1; }
        
        /* Box für Sprach- und Tachoassistent */
        #speech-box { background: rgba(102,252,241,0.1); border: 1px dashed #66fcf1; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 12px; color: #fff; text-align: center; font-weight: bold; }
        .offline-grid-bg { background-color: #0b0c10; background-image: linear-gradient(rgba(102, 252, 241, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(102, 252, 241, 0.03) 1px, transparent 1px); background-size: 25px 25px; display: flex; justify-content: center; align-items: center; text-align: center; color: #45a29e; }
    </style>
</head>
<body>

    <div id="header">
        <h2>★ GPS Live-Cockpit</h2>
        <div id="cockpit-bar">
            <div id="clock-display" class="cockpit-item">Uhrzeit: --:--:--</div>
            <div id="status-indicator" class="cockpit-item" style="border-color:#2ecc71; color:#2ecc71;">Online</div>
        </div>
    </div>

    <div id="main-container">
        <!-- Leaflet Kartenfenster -->
        <div id="map-view"></div>

        <!-- Bedienfeld für Routeneingabe -->
        <div id="control-panel">
            <h3>Routen-Zentrale</h3>
            
            <div class="input-group">
                <label>Startpunkt:</label>
                <input type="text" id="start-node" placeholder="Ort eingeben..." autocomplete="off">
                <div id="start-suggestions" class="suggestions-box"></div>
            </div>
            
            <div class="input-group">
                <label>Zielpunkt:</label>
                <input type="text" id="target-node" placeholder="Ort eingeben..." autocomplete="off">
                <div id="target-suggestions" class="suggestions-box"></div>
            </div>
            
            <button id="btn-route" class="btn" onclick="calculate2DRoute()">Navigation starten</button>
            <button id="btn-zip" class="btn" onclick="triggerZipDownload()">ZIP laden</button>

            <div id="output-results">
                <div class="data-row"><span>Restliche Distanz:</span> <span id="val-km" class="data-val">-</span></div>
                <div class="data-row"><span>Ankunftszeit ca.:</span> <span id="val-time" class="data-val">-</span></div>
                <div id="speech-box">🔊 Sprachassistent bereit.</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
