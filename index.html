<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVI zu MP4</title>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

<style>
body{
    background:#111;
    color:#fff;
    font-family:Arial;
    text-align:center;
    padding:40px;
}
button{
    padding:15px 30px;
    font-size:18px;
    cursor:pointer;
}
progress{
    width:100%;
    height:25px;
}
</style>

</head>
<body>

<h1>AVI ➜ MP4</h1>

<input type="file" id="file" accept=".avi">

<br><br>

<button onclick="convert()">Konvertieren</button>

<br><br>

<progress id="progress" value="0" max="100"></progress>

<p id="status">Bereit</p>

<script>

const { createFFmpeg, fetchFile } = FFmpeg;

const ffmpeg=createFFmpeg({
    log:true
});

async function convert(){

const file=document.getElementById("file").files[0];

if(!file){
alert("Bitte AVI auswählen.");
return;
}

const status=document.getElementById("status");
const progress=document.getElementById("progress");

status.innerHTML="FFmpeg wird geladen...";

if(!ffmpeg.isLoaded())
await ffmpeg.load();

ffmpeg.setProgress(({ratio})=>{
progress.value=Math.round(ratio*100);
});

status.innerHTML="Datei wird geladen...";

ffmpeg.FS("writeFile","video.avi",await fetchFile(file));

status.innerHTML="Konvertiere...";

await ffmpeg.run(
"-i","video.avi",
"-c:v","libx264",
"-pix_fmt","yuv420p",
"-preset","ultrafast",
"video.mp4"
);

status.innerHTML="Erstelle Download...";

const data=ffmpeg.FS("readFile","video.mp4");

const blob=new Blob([data.buffer],{type:"video/mp4"});

const url=URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download="video.mp4";
a.click();

URL.revokeObjectURL(url);

status.innerHTML="Fertig!";

}

</script>

</body>
</html>
