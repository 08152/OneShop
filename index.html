<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Norton Smart Scanner</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#ffffff;
color:#111;
height:100vh;
overflow:hidden;
display:flex;
}

aside{
width:260px;
background:#111111;
color:white;
display:flex;
flex-direction:column;
padding:30px;
box-shadow:5px 0 20px rgba(0,0,0,.25);
}

.logo{
font-size:34px;
font-weight:bold;
color:#FFD400;
margin-bottom:60px;
}

.logo span{
color:white;
}

.menu button{

width:100%;
padding:18px;
font-size:18px;
font-weight:bold;
border:0;
border-radius:12px;
cursor:pointer;
background:#FFD400;
color:#000;
transition:.25s;

}

.menu button:hover{

transform:scale(1.03);

}

main{

flex:1;
padding:45px;
overflow:auto;
background:white;

}

.card{

background:white;
border-radius:18px;
padding:35px;
box-shadow:0 15px 40px rgba(0,0,0,.12);
margin-bottom:30px;

}

h1{

font-size:42px;
margin-bottom:30px;

}

.center{

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

}

.circle{

width:260px;
height:260px;
border-radius:50%;
border:12px solid #FFD400;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
transition:.4s;

}

.circle.safe{

border-color:#28c840;

}

.circle.danger{

border-color:#ff3030;

}

.circle h2{

font-size:42px;
margin-top:15px;

}

.circle p{

font-size:22px;
font-weight:bold;

}

.security{

font-size:28px;
margin-top:25px;
font-weight:bold;

}

.scanButton{

margin-top:40px;
background:#FFD400;
color:black;
padding:18px 40px;
border:0;
border-radius:14px;
font-size:22px;
font-weight:bold;
cursor:pointer;

}

.scanButton:hover{

background:#f4c400;

}

#scanBox{

display:none;
margin-top:40px;

}

input[type=file]{

width:100%;
padding:20px;
font-size:18px;
border:2px dashed #FFD400;
border-radius:15px;
background:#fafafa;

}

.upload{

margin-top:25px;
background:#111;
color:white;
padding:16px;
border-radius:12px;
border:0;
font-size:20px;
cursor:pointer;

}

.upload:hover{

background:#000;

}

.progress{

margin-top:35px;
height:28px;
background:#ddd;
border-radius:20px;
overflow:hidden;
display:none;

}

.bar{

height:100%;
width:0%;
background:#FFD400;
transition:.2s;

}

#percent{

margin-top:15px;
font-size:24px;
font-weight:bold;
display:none;

}
iframe{

width:100%;
height:520px;
border:3px solid #FFD400;
border-radius:16px;
background:white;
margin-top:35px;
display:none;

}

#riskBox{

display:none;
margin-top:35px;
padding:25px;
border-radius:16px;
background:#f7f7f7;
border-left:10px solid #FFD400;

}

#riskTitle{

font-size:34px;
font-weight:bold;
margin-bottom:15px;

}

#riskText{

font-size:22px;
line-height:1.6;

}

.info{

margin-top:25px;
padding:18px;
background:#fffbe8;
border:2px solid #FFD400;
border-radius:14px;
font-size:18px;

}

footer{

margin-top:40px;
text-align:center;
color:#666;
font-size:15px;

}

.hidden{
display:none;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

100%{
transform:scale(1);
}

}

.scanning{

animation:pulse 1s infinite;

}

.success{

color:#28c840;

}

.dangerText{

color:#ff3030;

}

</style>

</head>

<body>

<aside>

<div class="logo">
✓ <span>Norton 360</span>
</div>

<div class="menu">

<button onclick="showScanner()">
🏠 Home
</button>

</div>

</aside>

<main>

<div class="card">

<div class="center">

<div id="circle" class="circle">

<p>RISIKO</p>

<h2 id="status">
BEREIT
</h2>

</div>

<div class="security">
Sicherheit
</div>

<button class="scanButton"
onclick="openScan()">

Scan

</button>
<div id="scanBox">

<h2>Ordner auswählen</h2>

<p class="info">
Wähle einen Ordner aus. Nach dem Hochladen wird der Scan gestartet und die Dateien werden in einer Sandbox geprüft.
</p>

<br>

<input
id="folder"
type="file"
webkitdirectory
multiple>

<button
class="upload"
onclick="startUpload()">

Hochladen

</button>

<div
id="progress"
class="progress">

<div
id="bar"
class="bar"></div>

</div>

<div id="percent">
0 %
</div>

<div id="riskBox">

<h2 id="riskTitle">
Risikoanalyse
</h2>

<p id="riskText">
Es wurden noch keine Dateien geprüft.
</p>

</div>

<iframe
id="sandbox"
sandbox="allow-scripts allow-same-origin">
</iframe>

</div>

</div>

</div>

<footer>

Norton Smart Scanner – Demo

</footer>

</main>

<script>

const circle =
document.getElementById("circle");

const statusText =
document.getElementById("status");

const progress =
document.getElementById("progress");

const bar =
document.getElementById("bar");

const percent =
document.getElementById("percent");

const riskBox =
document.getElementById("riskBox");

const riskText =
document.getElementById("riskText");

const sandbox =
document.getElementById("sandbox");

function showScanner(){

document.getElementById("scanBox")
.style.display="block";

window.scrollTo({
top:1000,
behavior:"smooth"
});

}

function openScan(){

showScanner();

}
function startUpload(){

const files =
document.getElementById("folder").files;

if(files.length===0){

alert("Bitte zuerst einen Ordner auswählen.");

return;

}

circle.className="circle scanning";
statusText.innerHTML="UPLOAD";

progress.style.display="block";
percent.style.display="block";

riskBox.style.display="none";
sandbox.style.display="none";

bar.style.width="0%";
percent.innerHTML="0 %";

let p=0;

let timer=setInterval(function(){

p++;

bar.style.width=p+"%";
percent.innerHTML=p+" %";

if(p>=100){

clearInterval(timer);

progress.style.display="none";
percent.style.display="none";

startScan(files);

}

},40);

}

function startScan(files){

statusText.innerHTML="SCAN";

let htmlDatei=null;

for(let i=0;i<files.length;i++){

let name=files[i].name.toLowerCase();

if(name.endsWith(".html") ||
name.endsWith(".htm")){

htmlDatei=files[i];
break;

}

}

if(htmlDatei){

const reader=new FileReader();

reader.onload=function(e){

const blob=new Blob(
[e.target.result],
{type:"text/html"}
);

sandbox.src=
URL.createObjectURL(blob);

sandbox.style.display="block";

finishScan(htmlDatei);

};

reader.readAsText(htmlDatei);

}else{

finishScan(null);

}

}
function finishScan(file){

setTimeout(function(){

circle.className="circle safe";

statusText.innerHTML="SICHER";

riskBox.style.display="block";

if(file){

riskText.innerHTML=
"<b>Datei:</b> "+file.name+
"<br><br>"+
"✔ Keine bekannten Risiken gefunden."+
"<br>"+
"✔ Sandbox-Test erfolgreich abgeschlossen."+
"<br>"+
"✔ Datei konnte geladen werden.";

}else{

riskText.innerHTML=
"Es wurde keine HTML-Datei im ausgewählten Ordner gefunden."+
"<br><br>"+
"Die übrigen Dateien wurden nur überprüft.";

}

},2500);

}

function showDanger(name){

circle.className="circle danger";

statusText.innerHTML="RISIKO";

riskBox.style.display="block";

riskText.innerHTML=
"<span style='color:#ff3030;font-weight:bold;'>"+
"⚠ Verdächtige Datei erkannt"+
"</span><br><br>"+
"Datei: "+name+
"<br><br>"+
"Empfehlung: Datei nicht ausführen.";

}

function resetScanner(){

circle.className="circle";

statusText.innerHTML="BEREIT";

bar.style.width="0%";

percent.innerHTML="0 %";

progress.style.display="none";

percent.style.display="none";

riskBox.style.display="none";

sandbox.style.display="none";

sandbox.src="";

}
function analyseFile(file){

const reader = new FileReader();

reader.onload = function(e){

const text = e.target.result.toLowerCase();

const verdächtig = [
"eval(",
"document.write(",
"atob(",
"fromcharcode",
"websocket",
"xmlhttprequest",
"fetch(",
"localstorage",
"sessionstorage",
"indexeddb",
"navigator.",
"crypto.subtle",
"new function",
"setinterval(",
"settimeout(",
"iframe",
"<script"
];

let treffer=[];

verdächtig.forEach(function(code){

if(text.includes(code)){

treffer.push(code);

}

});

if(treffer.length>0){

showDanger(file.name);

riskText.innerHTML +=
"<br><br><b>Gefundene Muster:</b><br>" +
treffer.join("<br>");

}else{

finishScan(file);

}

};

reader.readAsText(file);

}

function loadSandbox(file){

const reader=new FileReader();

reader.onload=function(e){

const blob=new Blob(
[e.target.result],
{type:"text/html"}
);

sandbox.src=
URL.createObjectURL(blob);

sandbox.style.display="block";

analyseFile(file);

};

reader.readAsText(file);

}
async function scanFolder(files){

if(!files || files.length===0){

alert("Kein Ordner ausgewählt.");

return;

}


circle.className="circle scanning";

statusText.innerHTML="PRÜFE";


let htmlFiles=[];

for(let i=0;i<files.length;i++){

let file=files[i];

let name=file.name.toLowerCase();


if(
name.endsWith(".html") ||
name.endsWith(".htm")
){

htmlFiles.push(file);

}

}



let geprüft=0;


for(let i=0;i<files.length;i++){


let aktuelleDatei=files[i];


riskText.innerHTML=
"Prüfe Datei:<br><b>"+
aktuelleDatei.name+
"</b><br><br>"+
"Fortschritt: "+
(i+1)+" / "+files.length;


await new Promise(resolve=>{

setTimeout(resolve,300);

});


geprüft++;


}



if(htmlFiles.length>0){


loadSandbox(htmlFiles[0]);


}else{


finishScan(null);


}



}



function startUpload(){


const files=
document.getElementById("folder").files;


if(files.length===0){

alert("Bitte Ordner auswählen.");

return;

}



progress.style.display="block";

percent.style.display="block";

bar.style.width="0%";


let wert=0;


let uploadTimer=setInterval(()=>{


wert++;


bar.style.width=
wert+"%";


percent.innerHTML=
wert+" %";


if(wert>=100){


clearInterval(uploadTimer);


progress.style.display="none";

percent.style.display="none";


scanFolder(files);


}


},35);



}
function setScanning(){

circle.className=
"circle scanning";

statusText.innerHTML=
"SCAN";

riskText.innerHTML=
"Dateien werden analysiert...";

}


function setSafe(){

circle.className=
"circle safe";

statusText.innerHTML=
"SICHER";

}


function setRisk(){

circle.className=
"circle danger";

statusText.innerHTML=
"RISIKO";

}



function updateRisk(files){


let gefährlich=false;


for(let i=0;i<files.length;i++){


let name=
files[i].name.toLowerCase();



if(
name.includes("virus") ||
name.includes("malware") ||
name.includes("trojan")
){

gefährlich=true;

break;

}


}



if(gefährlich){


setRisk();


riskBox.style.display=
"block";


riskText.innerHTML=
"⚠ Verdächtiger Dateiname gefunden.<br><br>"+
"Bitte diese Datei nicht öffnen.";


}else{


setSafe();


riskBox.style.display=
"block";


riskText.innerHTML=
"✔ Alle Dateien wurden geprüft.<br><br>"+
"Keine bekannten Gefahren gefunden.";


}


}



function showPreview(file){


if(!file){

return;

}



let reader=
new FileReader();



reader.onload=function(e){


let blob=
new Blob(
[
e.target.result
],
{
type:"text/html"
}
);



sandbox.src=
URL.createObjectURL(blob);


sandbox.style.display=
"block";


};



reader.readAsText(file);


}



document
.getElementById("folder")
.addEventListener(
"change",
function(){


if(this.files.length>0){


riskText.innerHTML=
"Ordner ausgewählt:<br><b>"+
this.files.length+
" Dateien</b>";


}


});
window.onload=function(){

circle.className="circle";

statusText.innerHTML="BEREIT";

riskBox.style.display="none";

sandbox.style.display="none";

progress.style.display="none";

percent.style.display="none";

};



function showMessage(text){

riskBox.style.display="block";

riskText.innerHTML=text;

}



function checkSize(files){


let total=0;


for(let i=0;i<files.length;i++){

total+=files[i].size;

}


let mb=
(total/1024/1024).toFixed(2);



showMessage(
"Ordnergröße: <b>"+
mb+
" MB</b><br><br>"+
"Bereit für Sicherheitsprüfung."
);


}



function prepareScan(){


const files=
document.getElementById("folder").files;


if(files.length===0){

alert("Bitte Ordner auswählen");

return;

}


checkSize(files);


circle.className=
"circle scanning";


statusText.innerHTML=
"START";


}



function fakeProtection(){


let checks=[

"Dateistruktur wird geprüft",

"HTML-Inhalte werden analysiert",

"Sandbox wird vorbereitet",

"Sicherheitsregeln werden geladen"

];


let i=0;


let t=setInterval(()=>{


riskText.innerHTML=
checks[i];


i++;


if(i>=checks.length){

clearInterval(t);

}


},700);


}
</script>

</body>
</html>
