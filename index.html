<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Darknet Seite</title>
    <style>
        /* Dunkles Design passend zum Darknet */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            border: 1px solid #333;
            background-color: #1a1a1a;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }
        h1 {
            color: #00ff66;
            font-size: 24px;
        }
        p {
            font-size: 14px;
            color: #888;
        }
        /* DuckDuckGo Suchmaske */
        .search-box {
            margin-top: 25px;
        }
        input[type="text"] {
            background-color: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            width: 250px;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #00ff66;
            border: none;
            color: #121212;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        input[type="submit"]:hover {
            background-color: #00cc52;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Willkommen auf meiner Onion-Seite</h1>
        <p>Dies ist eine legale, minimalistische HTML-Webseite.</p>

        <!-- DuckDuckGo Onion Suchformular -->
        <div class="search-box">
            <form method="get" action="https://duckduckgogg42xjoc72x3sjasowoarfbgcmvfimaftt6twagswzczad.onion">
                <input type="text" name="q" placeholder="Im Darknet suchen..." required>
                <input type="submit" value="Suchen">
            </form>
        </div>
    </div>

</body>
</html>
