<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Writer</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f3f6;
        color: #222;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        height: 65px;
        background: #202124;
        color: white;
        display: flex;
        align-items: center;
        padding: 0 22px;
        gap: 15px;
    }

    .logo {
        font-size: 22px;
        font-weight: bold;
    }

    .spacer {
        flex: 1;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 11px 17px;
        font-size: 14px;
        cursor: pointer;
        font-weight: bold;
    }

    #download {
        background: #ffd600;
        color: #111;
    }

    #clear {
        background: #444;
        color: white;
    }

    main {
        width: min(1000px, 94%);
        margin: 25px auto;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .toolbar {
        background: white;
        padding: 15px;
        border-radius: 12px 12px 0 0;
        border-bottom: 1px solid #ddd;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    #filename {
        flex: 1;
        border: 1px solid #ccc;
        border-radius: 7px;
        padding: 10px;
        font-size: 15px;
    }

    #editor {
        width: 100%;
        flex: 1;
        min-height: 500px;
        resize: none;
        border: none;
        outline: none;
        padding: 28px;
        font-size: 18px;
        line-height: 1.65;
        font-family: Georgia, serif;
        background: white;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .status {
        background: white;
        border-radius: 0 0 12px 12px;
        padding: 12px 18px;
        color: #666;
        font-size: 13px;
        display: flex;
        gap: 25px;
    }

    @media (max-width: 600px) {
        header {
            padding: 0 12px;
        }

        .logo {
            font-size: 18px;
        }

        #clear {
            display: none;
        }

        main {
            margin: 10px auto;
            width: 98%;
        }

        #editor {
            padding: 18px;
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<header>
    <div class="logo">👻 Ghost Writer</div>

    <div class="spacer"></div>

    <button id="clear">Löschen</button>
    <button id="download">⬇ Text herunterladen</button>
</header>

<main>

    <div class="toolbar">
        <input
            id="filename"
            type="text"
            value="mein_text"
            placeholder="Dateiname"
        >
    </div>

    <textarea
        id="editor"
        placeholder="Schreibe hier deine Geschichte..."
        spellcheck="true"
    ></textarea>

    <div class="status">
        <span id="words">0 Wörter</span>
        <span id="chars">0 Zeichen</span>
        <span id="lines">0 Zeilen</span>
    </div>

</main>

<script>
const editor = document.getElementById("editor");
const filename = document.getElementById("filename");

const words = document.getElementById("words");
const chars = document.getElementById("chars");
const lines = document.getElementById("lines");

function updateStats() {
    const text = editor.value;

    const wordCount = text.trim()
        ? text.trim().split(/\s+/).length
        : 0;

    const charCount = text.length;

    const lineCount = text
        ? text.split("\n").length
        : 0;

    words.textContent = wordCount + " Wörter";
    chars.textContent = charCount + " Zeichen";
    lines.textContent = lineCount + " Zeilen";
}

editor.addEventListener("input", updateStats);

document.getElementById("download").addEventListener("click", () => {

    const text = editor.value;

    if (!text.trim()) {
        alert("Du hast noch keinen Text geschrieben.");
        return;
    }

    let name = filename.value.trim();

    if (!name) {
        name = "mein_text";
    }

    if (!name.toLowerCase().endsWith(".txt")) {
        name += ".txt";
    }

    const blob = new Blob(
        [text],
        { type: "text/plain;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = name;

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    URL.revokeObjectURL(url);
});

document.getElementById("clear").addEventListener("click", () => {

    if (editor.value.trim()) {
        const confirmed = confirm(
            "Möchtest du wirklich den gesamten Text löschen?"
        );

        if (!confirmed) return;
    }

    editor.value = "";
    updateStats();
    editor.focus();
});

updateStats();
</script>

</body>
</html>
