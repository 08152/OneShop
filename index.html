<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokaler MP3 Beat-Slicer</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0d0e12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #16171e;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            text-align: center;
            width: 450px;
            border: 1px solid #252836;
        }
        button {
            background: #ff5722;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.4);
        }
        button:hover {
            background: #ff7043;
            transform: translateY(-2px);
        }
        button.stop {
            background: #37474f;
            box-shadow: none;
            margin-left: 10px;
        }
        .status-box {
            margin-top: 25px;
            background: #1f222f;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            text-align: left;
            border-left: 4px solid #ff5722;
        }
        .highlight {
            color: #ffb74d;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MP3 Beat-Slicer KI</h1>
    <p>Zerlegt deine MP3s mathematisch und baut neue Rhythmen</p>
    <button onclick="loadAndSliceTrack()">Neuen Beat generieren</button>
    <button class="stop" onclick="stopBeat()">Stop</button>
    
    <div class="status-box">
        <p>Status: <span id="statusTxt">Bereit</span></p>
        <p>Geladene Quelldatei: <span id="trackTxt" class="highlight">-</span></p>
        <p>Aktuelles KI-Schnittmuster: <span id="sliceTxt" class="highlight">-</span></p>
    </div>
</div>

<script>
    let audioCtx = null;
    let decodedBuffer = null;
    let isPlaying = false;
    let beatTimeout = null;
    
    // Konfiguration für die Beat-Generierung
    const bpm = 125; 
    const stepLength = 60 / bpm / 2; // Achtelnoten-Raster
    let currentStep = 0;

    async function loadAndSliceTrack() {
        stopBeat();
        document.getElementById('statusTxt').innerText = "Suche MP3-Dateien...";

        // 1. Liste der verfügbaren MP3s vom Server holen
        const res = await fetch('/api/available-tracks');
        const tracks = await res.json();

        if (tracks.length === 0) {
            document.getElementById('statusTxt').innerText = "Fehler: Keine MP3s im 'musik'-Ordner!";
            alert("Bitte lege zuerst MP3-Dateien in den Ordner 'musik'!");
            return;
        }

        // Zufälligen Track als KI-Basis wählen
        const selectedTrack = tracks[Math.floor(Math.random() * tracks.length)];
        document.getElementById('trackTxt').innerText = selectedTrack;
        document.getElementById('statusTxt').innerText = "Lade und decodiere Audiosignale...";

        // 2. Audio-Kontext initialisieren
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // 3. MP3 als Binärdaten (ArrayBuffer) herunterladen
        const trackRes = await fetch(`/tracks/${encodeURIComponent(selectedTrack)}`);
        const arrayBuffer = await trackRes.arrayBuffer();

        // 4. Die komprimierte MP3 in rohe PCM-Wellenformen decodieren
        decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        
        document.getElementById('statusTxt').innerText = "Generiere neuen Rhythmus-Loop...";
        isPlaying = true;
        currentStep = 0;
        
        playSlicedLoop();
    }

    function playSlicedLoop() {
        if (!isPlaying || !decodedBuffer) return;

        // KI-Logik: Berechne zufällige, aber mathematisch saubere Abschnitte aus der MP3
        // Wir teilen die Datei gedanklich in Schnipsel und wählen pro Schritt ein zufälliges Fragment
        const totalDuration = decodedBuffer.duration;
        const sliceDuration = 0.25; // Länge eines Sound-Schnipsels (250ms)
        
        // Wähle einen zufälligen Startpunkt innerhalb der ersten 80% des Songs
        const randomOffset = Math.random() * (totalDuration * 0.8);

        // Slice abspielen
        playBufferSlice(randomOffset, sliceDuration);

        document.getElementById('sliceTxt').innerText = `Step ${currentStep + 1}/8 - Offset: ${randomOffset.toFixed(2)}s`;
        document.getElementById('statusTxt').innerText = "Beat-Wiedergabe aktiv";

        currentStep = (currentStep + 1) % 8;

        // Exaktes Timing-Intervall für den nächsten Beat-Schritt
        beatTimeout = setTimeout(playSlicedLoop, stepLength * 1000);
    }

    function playBufferSlice(startTime, duration) {
        // Erzeuge eine neue Audioquelle aus dem decodierten MP3-Speicher
        const source = audioCtx.createBufferSource();
        source.buffer = decodedBuffer;

        // Ein kleiner Lautstärken-Filter (Gain), um Knackgeräusche an den Schnittkanten zu verhindern
        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration - 0.02);

        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        // Spiele genau den berechneten Ausschnitt der MP3 ab
        source.start(0, startTime, duration);
    }

    function stopBeat() {
        isPlaying = false;
        clearTimeout(beatTimeout);
        if (audioCtx) {
            audioCtx.close();
            audioCtx = null;
        }
        document.getElementById('statusTxt').innerText = "Gestoppt";
        document.getElementById('sliceTxt').innerText = "-";
    }
</script>

</body>
</html>
