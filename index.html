<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI-Trainingsdaten Sammler</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 20px; background-color: #0f172a; color: #f8fafc; }
        .box { background: #1e293b; padding: 25px; margin-bottom: 25px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; margin-top: 0; }
        h3 { color: #f1f5f9; margin-bottom: 10px; }
        input[type="text"] { width: 75%; padding: 14px; font-size: 16px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; box-sizing: border-box; }
        input[type="text"]:focus { border-color: #38bdf8; outline: none; }
        button { padding: 14px 24px; font-size: 16px; background-color: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0369a1; }
        .btn-download { background-color: #16a34a; width: 100%; font-size: 18px; padding: 16px; margin-top: 20px; display: none; text-transform: uppercase; letter-spacing: 1px; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        .btn-download:hover { background-color: #15803d; }
        #statusLog { height: 150px; overflow-y: auto; background: #0f172a; border: 1px solid #334155; padding: 15px; font-family: 'Courier New', Courier, monospace; font-size: 13px; color: #34d399; border-radius: 6px; }
        .stats { display: flex; gap: 20px; margin-top: 15px; }
        .stat-card { background: #334155; padding: 10px 20px; border-radius: 6px; flex: 1; text-align: center; }
        .stat-card span { display: block; font-size: 24px; font-weight: bold; color: #38bdf8; }
        .source-list { max-height: 150px; overflow-y: auto; padding-left: 20px; color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="box">
        <h1>📦 KI-Trainingsdaten Crawler</h1>
        <p>Diese Oberfläche sammelt strukturierte Rohdaten aus dem Internet für deine KI.</p>
        
        <form id="crawlerForm">
            <input type="text" id="searchQuery" placeholder="Suchbegriff eingeben..." required>
            <button type="submit">Daten sammeln</button>
        </form>
    </div>

    <div class="box">
        <h3>📊 Sammlungs-Status</h3>
        <div class="stats">
            <div class="stat-card">Gesammelte Zeichen <span id="statChars">0</span></div>
            <div class="stat-card">Durchsuchte Links <span id="statLinks">0</span></div>
        </div>
        <h4 style="margin-top: 15px; margin-bottom: 5px;">Quellen:</h4>
        <div id="sourcesUsed" class="source-list">Keine Quellen geladen.</div>
    </div>

    <div class="box">
        <h3>📜 System-Protokoll</h3>
        <div id="statusLog">> System bereit...</div>
    </div>

    <div class="box" style="text-align: center;">
        <button id="downloadBtn" class="btn-download">📥 JETZT TRAININGSDATEN ALS JSON DOWNLOADEN</button>
    </div>

<script>
    let datasetContainer = { erstellungsDatum: new Date().toISOString(), gesamteZeichen: 0, anzahlQuellen: 0, datenSaetze: [] };

    document.getElementById('crawlerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const searchQuery = document.getElementById('searchQuery').value;
        const log = document.getElementById('statusLog');
        log.innerHTML += `<br>> Suche nach: "${searchQuery}"...`;
        log.scrollTop = log.scrollHeight;

        try {
            const response = await fetch('/api/search-and-scrape', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ searchQuery })
            });
            const data = await response.json();
            
            if(data.success) {
                datasetContainer.datenSaetze.push({
                    suchbegriff: data.searchTerm,
                    zeitstempel: new Date().toISOString(),
                    quellen: data.sources,
                    rohText: data.text
                });

                datasetContainer.anzahlQuellen += data.sources.length;
                datasetContainer.gesamteZeichen += data.text.length;

                document.getElementById('statChars').innerText = datasetContainer.gesamteZeichen.toLocaleString();
                document.getElementById('statLinks').innerText = datasetContainer.anzahlQuellen;
                
                // Quellen-Liste aktualisieren
                let sourcesDiv = document.getElementById('sourcesUsed');
                sourcesDiv.innerHTML = "<ul>";
                datasetContainer.datenSaetze.forEach(set => {
                    set.quellen.forEach(s => {
                        sourcesDiv.innerHTML += `<li><b>[${set.suchbegriff}]</b> <a href="${s.url}" target="_blank" style="color: #38bdf8;">${s.title}</a></li>`;
                    });
                });
                sourcesDiv.innerHTML += "</ul>";

                log.innerHTML += `<br>> ✓ ${data.text.length} Zeichen extrahiert.`;
                document.getElementById('downloadBtn').style.display = "block";
            } else {
                log.innerHTML += `<br>> ❌ Fehler: ${data.error}`;
            }
        } catch (err) {
            log.innerHTML += `<br>> ❌ Keine Verbindung zum Server.`;
        }
        log.scrollTop = log.scrollHeight;
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
        const jsonString = JSON.stringify(datasetContainer, null, 2);
        const blob = new Blob([jsonString], { type: "application/json;charset=utf-8;" });
        const blobUrl = URL.createObjectURL(blob);
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", blobUrl);
        downloadAnchor.setAttribute("download", `ki_trainingsdaten.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        document.body.removeChild(downloadAnchor);
        URL.revokeObjectURL(blobUrl);
    });
</script>
</body>
</html>
