<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHOST ISLAND 3D</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#75c9ff;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#hud{
    position:absolute;
    top:15px;
    left:15px;
    z-index:20;
    color:white;
    text-shadow:0 2px 5px #000;
    pointer-events:none;
    line-height:1.5;
}

#title{
    font-size:24px;
    font-weight:bold;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:25px;
    font-weight:bold;
    z-index:20;
    text-shadow:0 0 5px black;
    pointer-events:none;
}

#controls{
    position:absolute;
    left:20px;
    bottom:20px;
    z-index:30;

    display:grid;
    grid-template-columns:65px 65px 65px;
    grid-template-rows:65px 65px 65px;

    gap:6px;

    touch-action:none;
}

.move{
    width:65px;
    height:65px;

    border:2px solid rgba(255,255,255,.75);
    border-radius:14px;

    background:rgba(0,0,0,.4);
    color:white;

    font-size:25px;
    font-weight:bold;

    user-select:none;
    touch-action:none;
}

.move:active{
    transform:scale(.92);
    background:rgba(255,255,255,.3);
}

#up{
    grid-column:2;
    grid-row:1;
}

#left{
    grid-column:1;
    grid-row:2;
}

#down{
    grid-column:2;
    grid-row:2;
}

#right{
    grid-column:3;
    grid-row:2;
}

#jump{
    position:absolute;
    right:25px;
    bottom:30px;

    width:100px;
    height:100px;

    z-index:30;

    border-radius:50%;
    border:2px solid white;

    background:rgba(0,0,0,.4);
    color:white;

    font-weight:bold;

    touch-action:none;
}

#jump:active{
    transform:scale(.92);
}

#menu{
    position:absolute;
    inset:0;

    z-index:100;

    background:rgba(0,0,0,.6);

    display:flex;
    justify-content:center;
    align-items:center;
}

#menuBox{
    width:380px;
    max-width:85%;

    background:#20252a;
    color:white;

    border-radius:20px;

    padding:30px;

    text-align:center;

    box-shadow:0 20px 80px black;
}

#menuBox h1{
    margin:0;
    font-size:40px;
}

#seed{
    background:#111;
    padding:10px;
    border-radius:8px;

    font-family:monospace;

    margin:18px 0;
}

.menuButton{
    width:100%;
    padding:15px;

    margin-top:10px;

    border:0;
    border-radius:10px;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

#start{
    background:#42d35b;
}

#newWorld{
    background:#e3a82c;
}
</style>
</head>

<body>

<div id="hud">

<div id="title">
GHOST ISLAND
</div>

WASD / Pfeile = Bewegen<br>
SPACE = Springen<br>
Klick = Maus aktivieren<br>

Position:
<span id="position">0 / 0</span><br>

Chunk:
<span id="chunk">0 / 0</span>

</div>

<div id="crosshair">+</div>


<div id="controls">

<button class="move" id="up">▲</button>
<button class="move" id="left">◀</button>
<button class="move" id="down">▼</button>
<button class="move" id="right">▶</button>

</div>


<button id="jump">
SPRINGEN
</button>


<div id="menu">

<div id="menuBox">

<h1>GHOST ISLAND</h1>

<p>
Riesige zufällig erzeugte 3D-Welt
</p>

<p>
Chunks werden nur in deiner Nähe geladen.
</p>

<div id="seed">
SEED
</div>

<button
class="menuButton"
id="start">
SPIEL STARTEN
</button>

<button
class="menuButton"
id="newWorld">
NEUE WELT
</button>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>


// =====================================================
// SEED
// =====================================================

let storedSeed =
localStorage.getItem("GHOST_ISLAND_SEED");

if(!storedSeed){

storedSeed =
String(
Math.floor(
Math.random()*2147483647
)
);

localStorage.setItem(
"GHOST_ISLAND_SEED",
storedSeed
);

}

const WORLD_SEED =
Number(storedSeed);

document.getElementById("seed")
.innerText =
"SEED: "+WORLD_SEED;


// =====================================================
// DETERMINISTISCHER RANDOM
// =====================================================

function randomHash(x,z,extra=0){

let n =
Math.sin(
x*12.9898+
z*78.233+
extra*37.719+
WORLD_SEED
)
*
43758.5453123;

return n-Math.floor(n);

}


// =====================================================
// SCENE
// =====================================================

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x75caff);

scene.fog =
new THREE.Fog(
0x75caff,
600,
2300
);


// =====================================================
// CAMERA
// =====================================================

const camera =
new THREE.PerspectiveCamera(
75,
innerWidth/innerHeight,
0.1,
5000
);


// =====================================================
// RENDERER
// =====================================================

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(devicePixelRatio,1.4)
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
renderer.domElement
);


// =====================================================
// LICHT
// =====================================================

scene.add(
new THREE.AmbientLight(
0xffffff,
0.9
)
);

const sun =
new THREE.DirectionalLight(
0xffffff,
1.5
);

sun.position.set(
500,
900,
300
);

sun.castShadow=true;

scene.add(sun);


// =====================================================
// CHUNK SETTINGS
// =====================================================

const CHUNK_SIZE = 300;

// 2 = 5x5 Chunks
const RENDER_DISTANCE = 2;

const chunks = new Map();


// =====================================================
// TERRAIN
// =====================================================

function getHeight(x,z){

const distance =
Math.sqrt(
x*x+
z*z
);


// Inselrand
const island =
Math.max(
0,
1-distance/5800
);


// Berge
let h =
Math.sin(x*.0017) *
Math.cos(z*.0015) *
110;


// große Landschaft
h +=
Math.sin(
x*.00055+
z*.00035
)*
170;


// Hügel
h +=
Math.sin(
x*.004+
z*.003
)*
30;


// kleine Details
h +=
Math.sin(
x*.014-
z*.011
)*
7;


// Rand absenken
h *= island;


// leichte Grundhöhe
h += 5;


return h;
}


// =====================================================
// CHUNK KEY
// =====================================================

function key(cx,cz){

return cx+"_"+cz;

}


// =====================================================
// CHUNK ERSTELLEN
// =====================================================

function createChunk(cx,cz){

const id =
key(cx,cz);

if(chunks.has(id))
return;


const group =
new THREE.Group();

group.userData.cx=cx;
group.userData.cz=cz;


// =================================================
// TERRAIN
// =================================================

const geometry =
new THREE.PlaneGeometry(
CHUNK_SIZE,
CHUNK_SIZE,
20,
20
);

geometry.rotateX(
-Math.PI/2
);


const positions =
geometry.attributes.position;


// WICHTIG:
// Der Chunk liegt jetzt exakt um seinen Mittelpunkt.

const centerX =
cx*CHUNK_SIZE;

const centerZ =
cz*CHUNK_SIZE;


for(
let i=0;
i<positions.count;
i++
){

const localX =
positions.getX(i);

const localZ =
positions.getZ(i);


const worldX =
centerX+
localX;

const worldZ =
centerZ+
localZ;


positions.setY(
i,
getHeight(
worldX,
worldZ
)
);

}


geometry.computeVertexNormals();


const ground =
new THREE.Mesh(

geometry,

new THREE.MeshStandardMaterial({

color:0x4d9945,

roughness:1

})

);


ground.position.set(
centerX,
0,
centerZ
);

ground.receiveShadow=true;


group.add(ground);


// =================================================
// BÄUME
// =================================================

const trees=[];


// Weniger Objekte = bessere FPS

const treeCount =
7+
Math.floor(
randomHash(cx,cz,10)*7
);


for(
let i=0;
i<treeCount;
i++
){

const r1 =
randomHash(cx,cz,100+i);

const r2 =
randomHash(cx,cz,200+i);


const x =
centerX+
(r1-.5)*
(CHUNK_SIZE-30);


const z =
centerZ+
(r2-.5)*
(CHUNK_SIZE-30);


const y =
getHeight(x,z);


// Nicht unter Wasser
if(y<7)
continue;


// Mindestabstand
let tooClose=false;

for(
const p of trees
){

const dx=x-p.x;
const dz=z-p.z;

if(
dx*dx+
dz*dz
<
40*40
){

tooClose=true;
break;

}

}

if(tooClose)
continue;


trees.push({
x:x,
z:z
});


createTree(
group,
x,
y,
z,
cx,
cz,
i
);

}


// =================================================
// STEINE
// =================================================

const rocks=[];

const rockCount =
4+
Math.floor(
randomHash(cx,cz,400)*6
);


for(
let i=0;
i<rockCount;
i++
){

const r1 =
randomHash(cx,cz,500+i);

const r2 =
randomHash(cx,cz,600+i);


const x =
centerX+
(r1-.5)*
(CHUNK_SIZE-20);

const z =
centerZ+
(r2-.5)*
(CHUNK_SIZE-20);


const y =
getHeight(x,z);


if(y<7)
continue;


let tooClose=false;

for(
const p of rocks
){

const dx=x-p.x;
const dz=z-p.z;

if(
dx*dx+
dz*dz
<
25*25
){

tooClose=true;
break;

}

}


if(tooClose)
continue;


rocks.push({
x:x,
z:z
});


createRock(
group,
x,
y,
z,
cx,
cz,
i
);

}


scene.add(group);

chunks.set(id,group);

}


// =====================================================
// BAUM
// =====================================================

function createTree(
group,
x,
y,
z,
cx,
cz,
index
){

const tree =
new THREE.Group();


const r =
randomHash(
cx,
cz,
1000+index
);


const height =
25+
r*30;


const trunkRadius =
1.3+
r*1.2;


// =================================================
// STAMM
// =================================================

const trunk =
new THREE.Mesh(

new THREE.CylinderGeometry(
trunkRadius*.7,
trunkRadius,
height,
7
),

new THREE.MeshStandardMaterial({

color:0x59381f,

roughness:1

})

);


trunk.position.y =
height/2;

tree.add(trunk);


// =================================================
// ÄSTE
// =================================================

const branchCount =
4+
Math.floor(r*4);


for(
let i=0;
i<branchCount;
i++
){

const a =
randomHash(
cx,
cz,
1200+
index*10+
i
)*
Math.PI*2;


const branchY =
height*
(
.35+
randomHash(
cx,
cz,
1300+
index*10+
i
)*.45
);


const length =
6+
randomHash(
cx,
cz,
1400+
index*10+
i
)*12;


const branch =
new THREE.Mesh(

new THREE.CylinderGeometry(
.3,
.7,
length,
6
),

new THREE.MeshStandardMaterial({

color:0x59371f

})

);


branch.position.set(

Math.cos(a)*length*.3,

branchY,

Math.sin(a)*length*.3

);


branch.rotation.z =
Math.PI/2-.4;

branch.rotation.y =
-a;


tree.add(branch);


// =================================================
// BLÄTTER
// =================================================

const leaves =
new THREE.Mesh(

new THREE.IcosahedronGeometry(
4+
randomHash(
cx,
cz,
1500+
index*10+
i
)*4,
1
),

new THREE.MeshStandardMaterial({

color:0x277f3a,

roughness:1

})

);


leaves.position.set(

Math.cos(a)*length*.65,

branchY+4,

Math.sin(a)*length*.65

);


tree.add(leaves);

}


// =================================================
// BAUM POSITION
// =================================================

// Das ist der entscheidende Teil:
// Der Baum steht direkt auf getHeight(x,z).

tree.position.set(
x,
y,
z
);


tree.rotation.y =
r*Math.PI*2;

tree.scale.setScalar(
.8+r*.45
);


group.add(tree);

}


// =====================================================
// STEIN
// =====================================================

function createRock(
group,
x,
y,
z,
cx,
cz,
index
){

const r =
randomHash(
cx,
cz,
2000+index
);


const size =
3+
r*7;


const rock =
new THREE.Mesh(

new THREE.DodecahedronGeometry(
size,
1
),

new THREE.MeshStandardMaterial({

color:0x70756f,

roughness:.9

})

);


rock.position.set(
x,
y+size*.55,
z
);


rock.scale.y =
.7+
r*.5;


rock.rotation.x =
r*Math.PI;

rock.rotation.y =
r*Math.PI*2;


group.add(rock);

}


// =====================================================
// CHUNK STREAMING
// =====================================================

let lastCX=null;
let lastCZ=null;


function updateChunks(){

const cx =
Math.floor(
player.position.x/
CHUNK_SIZE
);

const cz =
Math.floor(
player.position.z/
CHUNK_SIZE
);


if(
cx===lastCX &&
cz===lastCZ
){

return;

}


lastCX=cx;
lastCZ=cz;


const needed =
new Set();


for(
let x=-RENDER_DISTANCE;
x<=RENDER_DISTANCE;
x++
){

for(
let z=-RENDER_DISTANCE;
z<=RENDER_DISTANCE;
z++
){

const nx=cx+x;
const nz=cz+z;

const id =
key(nx,nz);

needed.add(id);

createChunk(
nx,nz
);

}

}


// =================================================
// ENTFERNEN
// =================================================

for(
const [id,group]
of chunks
){

if(
!needed.has(id)
){

scene.remove(group);

chunks.delete(id);

}

}

}


// =====================================================
// PLAYER
// =====================================================

const player =
new THREE.Object3D();

scene.add(player);

camera.position.y=2;

player.add(camera);


player.position.set(
0,
getHeight(0,0),
0
);


// =====================================================
// PHYSICS
// =====================================================

let velocity =
new THREE.Vector3();

let gravity=.035;

let canJump=false;

let keys={};


// =====================================================
// KEYBOARD
// =====================================================

document.onkeydown=(e)=>{

keys[
e.key.toLowerCase()
]=true;


if(
e.code==="Space" &&
canJump
){

velocity.y=.9;

canJump=false;

}

};


document.onkeyup=(e)=>{

keys[
e.key.toLowerCase()
]=false;

};


// =====================================================
// BUTTONS
// =====================================================

function button(id,keyName){

const b =
document.getElementById(id);


function down(e){

e.preventDefault();

keys[keyName]=true;

}


function up(e){

e.preventDefault();

keys[keyName]=false;

}


b.addEventListener(
"pointerdown",
down
);

b.addEventListener(
"pointerup",
up
);

b.addEventListener(
"pointercancel",
up
);

b.addEventListener(
"pointerleave",
up
);

}


button("up","w");
button("down","s");
button("left","a");
button("right","d");


document.getElementById(
"jump"
).addEventListener(
"pointerdown",
(e)=>{

e.preventDefault();

if(canJump){

velocity.y=.9;

canJump=false;

}

}
);


// =====================================================
// MAUS
// =====================================================

let rx=0;
let ry=0;


document.body.onclick=()=>{

if(
!document.pointerLockElement
){

document.body.requestPointerLock();

}

};


document.onmousemove=(e)=>{

if(
document.pointerLockElement
){

ry -=
e.movementX*.002;

rx -=
e.movementY*.002;


rx=Math.max(
-1.5,
Math.min(
1.5,
rx
)
);


camera.rotation.x=rx;

player.rotation.y=ry;

}

};


// =====================================================
// PLAYER UPDATE
// =====================================================

function update(){

let dir =
new THREE.Vector3();


if(keys.w)
dir.z-=1;

if(keys.s)
dir.z+=1;

if(keys.a)
dir.x-=1;

if(keys.d)
dir.x+=1;


if(dir.length()>0)
dir.normalize();


dir.applyAxisAngle(

new THREE.Vector3(0,1,0),

player.rotation.y

);


velocity.x +=
dir.x*.18;

velocity.z +=
dir.z*.18;


velocity.x*=.84;
velocity.z*=.84;


velocity.y-=gravity;


player.position.add(
velocity
);


// Bodenhöhe

const ground =
getHeight(
player.position.x,
player.position.z
);


if(
player.position.y<
ground
){

player.position.y=
ground;

velocity.y=0;

canJump=true;

}


updateChunks();


document.getElementById(
"position"
).innerText=

Math.round(
player.position.x
)
+
" / "+
Math.round(
player.position.z
);


document.getElementById(
"chunk"
).innerText=

lastCX+
" / "+
lastCZ;

}


// =====================================================
// MENÜ
// =====================================================

document.getElementById(
"start"
).onclick=()=>{

document.getElementById(
"menu"
).style.display="none";

document.body.requestPointerLock();

};


document.getElementById(
"newWorld"
).onclick=()=>{

localStorage.setItem(
"GHOST_ISLAND_SEED",
Math.floor(
Math.random()*2147483647
)
);

location.reload();

};


// =====================================================
// ERSTE CHUNKS
// =====================================================

updateChunks();


// =====================================================
// LOOP
// =====================================================

function animate(){

requestAnimationFrame(
animate
);

update();

renderer.render(
scene,
camera
);

}

animate();


// =====================================================
// RESIZE
// =====================================================

window.onresize=()=>{

camera.aspect=
innerWidth/
innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

};

</script>

</body>
</html>
