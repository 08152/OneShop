<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Norton Smart Security</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

height:100vh;

background:#101010;

font-family:"Segoe UI",Arial;

color:white;

display:flex;

}


/* Menü */

.sidebar{

width:250px;

background:#080808;

border-right:1px solid #333;

padding:25px;

}



.logo{

font-size:26px;

font-weight:bold;

color:#ffcc00;

margin-bottom:40px;

}



.menu button{

width:100%;

padding:15px;

margin-bottom:12px;

border:0;

border-radius:8px;

background:#1b1b1b;

color:white;

text-align:left;

font-size:16px;

cursor:pointer;

}



.menu button:hover,
.menu button.active{

background:#ffcc00;

color:black;

font-weight:bold;

}




/* Inhalt */

.main{

flex:1;

padding:40px;

overflow:auto;

}



.title{

font-size:32px;

font-weight:bold;

margin-bottom:30px;

}





/* Risiko */

.circle{

width:220px;

height:220px;

border-radius:50%;

border:8px solid #ffcc00;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

}



.circle.safe{

border-color:#2ecc71;

}



.circle.danger{

border-color:#e74c3c;

}



.circle span:first-child{

color:#aaa;

font-size:13px;

}



.circle span:last-child{

font-size:30px;

font-weight:bold;

color:#ffcc00;

}






.card{

margin-top:35px;

background:#1c1c1c;

border:1px solid #333;

border-radius:15px;

padding:25px;

max-width:700px;

}




input{

margin-top:20px;

}




button.action{

background:#ffcc00;

color:black;

border:0;

padding:14px 25px;

border-radius:8px;

font-weight:bold;

cursor:pointer;

margin:5px;

}



button.action:hover{

background:#ffe066;

}




.hidden{

display:none;

}




.result{

margin-top:20px;

padding:15px;

background:#111;

border-radius:10px;

}



</style>


</head>


<body>




<div class="sidebar">


<div class="logo">

✓ Norton 360

</div>



<div class="menu">


<button class="active" onclick="page('home',this)">
Home
</button>


<button onclick="page('scan',this)">
Scan
</button>



</div>


</div>








<div class="main">





<div id="home">


<div class="title">
Home
</div>



<div id="riskCircle" class="circle">


<span>
RISIKOSTUFE
</span>


<span id="riskText">
BEREIT
</span>


</div>





<div class="card">


<h2>
Schnellscan
</h2>


<p>
Datei auswählen und prüfen
</p>



<input 
id="homeFile"
type="file"
>



<br>


<button class="action" onclick="startScan('homeFile')">

Scan starten

</button>



<div id="homeResult" class="result">

Bereit

</div>



</div>



</div>









<div id="scan" class="hidden">


<div class="title">
Scan
</div>



<div class="card">


<h2>
Scan auswählen
</h2>



<button class="action" onclick="singleScan()">

Einzelscan

</button>



<button class="action" onclick="folderScan()">

OrdnerScan

</button>



<button class="action" onclick="updateScan()">

Update Scan

</button>




<div id="scanArea">

</div>



</div>



</div>








</div>







<script>



function page(id,btn){


document
.getElementById("home")
.classList.add("hidden");


document
.getElementById("scan")
.classList.add("hidden");



document
.getElementById(id)
.classList.remove("hidden");



document
.querySelectorAll(".menu button")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");


}








async function startScan(input){


let file =
document.getElementById(input).files[0];



if(!file){

alert("Datei auswählen");

return;

}



document
.getElementById("riskText")
.innerHTML="SCANNT...";



// HIER kommt später deine eigene Server-Schnittstelle hin



setTimeout(()=>{


document
.getElementById("riskCircle")
.className="circle safe";


document
.getElementById("riskText")
.innerHTML="SICHER";



document
.getElementById("homeResult")
.innerHTML=

"Datei geprüft: "
+
file.name;



},1500);



}








function singleScan(){


document
.getElementById("scanArea")
.innerHTML=`

<h3>Einzelscan</h3>

<input type="file" id="singleFile">

<br>

<button class="action"
onclick="startScan('singleFile')">

Datei prüfen

</button>

`;


}







function folderScan(){


document
.getElementById("scanArea")
.innerHTML=`

<h3>OrdnerScan</h3>

<input 
type="file"
webkitdirectory
multiple
>


<p>
Ordnerscan bereit.
Server-Schnittstelle später.
</p>

`;


}








function updateScan(){


document
.getElementById("scanArea")
.innerHTML=`

<h3>Update Scan</h3>

<p style="color:#e74c3c">
Nicht verfügbar
</p>

`;

}



</script>



</body>

</html>
