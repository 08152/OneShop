<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live GPS Navi</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

html,body{
margin:0;
height:100%;
overflow:hidden;
font-family:Arial;
}


#map{
width:100%;
height:100%;
}


.panel{

position:absolute;
top:10px;
left:10px;
right:10px;

z-index:1000;

background:white;

padding:12px;

border-radius:18px;

box-shadow:0 0 15px #555;

}



input,button{

width:100%;

padding:14px;

margin-top:8px;

font-size:17px;

border-radius:12px;

border:1px solid #aaa;

}



button{

background:#006cff;

color:white;

}



.car-icon{

font-size:50px;

text-align:center;

transform-origin:center;

}



#naviInfo{

position:absolute;

bottom:20px;

left:20px;

right:20px;

z-index:2000;

background:rgba(0,0,0,.75);

color:white;

padding:20px;

border-radius:20px;

font-size:24px;

text-align:center;

display:none;

}



.arrow{

font-size:90px;

}



.fullscreenBtn{

position:absolute;

right:15px;

top:15px;

z-index:3000;

width:auto;

}



.locationBtn{

position:absolute;

right:15px;

top:70px;

z-index:3000;

width:auto;

}



</style>

</head>


<body>


<div class="panel">


<input id="ziel" placeholder="Ziel eingeben">


<button onclick="prepareRoute()">
🔎 Route suchen
</button>


<button id="startBtn"
style="display:none"
onclick="startNavigation()">

🚗 Navigation starten

</button>


<div id="info">

GPS wird gesucht...

</div>


</div>



<button class="fullscreenBtn"
onclick="toggleNaviMode()">

⛶

</button>


<button class="locationBtn"
onclick="centerLocation()">

📍

</button>




<div id="naviInfo">

<div class="arrow">

⬆️

</div>


<div id="naviText">

Navigation

</div>


</div>



<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>



<script>


let map =
L.map("map")
.setView([48.1351,11.5820],16);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19

}

).addTo(map);



let currentPos=null;

let marker=null;

let routeLine=null;

let navigationLine=null;


let routing=[];

let instructions=[];

let nextInstruction=0;


let navigationStarted=false;


let followLocation=true;


let heading=0;



let carIcon=L.divIcon({

html:"⬆️",

className:"car-icon",

iconSize:[50,50],

iconAnchor:[25,25]

});
// ===============================
// LIVE GPS TRACKING
// ===============================


navigator.geolocation.watchPosition(

position=>{


let lat =
position.coords.latitude;


let lon =
position.coords.longitude;



currentPos=[lat,lon];




// Fahrtrichtung vom GPS

if(position.coords.heading !== null &&
position.coords.heading !== undefined){


heading =
position.coords.heading;



let car =
document.querySelector(".car-icon");



if(car){


car.style.transform =
"rotate("
+
heading
+
"deg)";


}


}





// Auto setzen

if(!marker){


marker=L.marker(

currentPos,

{
icon:carIcon
}

)
.addTo(map);



map.setView(
currentPos,
18
);



}

else{


marker.setLatLng(
currentPos
);


}






// Karte folgt dem Standort

if(followLocation){


map.panTo(

currentPos,

{

animate:true,

duration:0.5

}

);


}




// Route aktualisieren

updateNavigationLine();


checkRoute();


checkInstructions();





},



error=>{


document.getElementById("info").innerHTML=

"GPS Fehler";


},



{

enableHighAccuracy:true,

maximumAge:1000,

timeout:5000

}



);






// ===============================
// STANDORT KNOPF
// ===============================


function centerLocation(){


if(currentPos){


followLocation=true;



map.setView(

currentPos,

19,

{

animate:true

}

);


}


}






// ===============================
// MANUELLE KARTENBEWEGUNG
// STOPPT AUTOMATISCHE FOLGE
// ===============================


map.on(

"dragstart",

()=>{


followLocation=false;


}

);



map.on(

"zoomstart",

()=>{


followLocation=false;


}

);






// ===============================
// NAVIGATION STARTEN
// ===============================


function startNavigation(){


navigationStarted=true;


followLocation=true;



map.setZoom(19);



speak(

"Navigation gestartet"

);


}





// ===============================
// ROUTE VORBEREITEN
// ===============================


async function prepareRoute(){


document.getElementById("startBtn")
.style.display="block";


await route();


}
// ===============================
// ROUTE BERECHNEN
// ===============================


async function route(){


let ziel =
document.getElementById("ziel").value;



let geo =
await fetch(

"https://nominatim.openstreetmap.org/search?format=json&q="
+
encodeURIComponent(ziel)

);



let data =
await geo.json();



if(data.length===0){

alert("Ziel nicht gefunden");

return;

}




let zielPos=[

parseFloat(data[0].lat),

parseFloat(data[0].lon)

];





let url =

"https://router.project-osrm.org/route/v1/driving/"
+
currentPos[1]
+
","
+
currentPos[0]
+
";"
+
zielPos[1]
+
","
+
zielPos[0]
+
"?overview=full&steps=true&geometries=geojson";





let res =
await fetch(url);



let json =
await res.json();



let r =
json.routes[0];






routing =
r.geometry.coordinates.map(

c=>[c[1],c[0]]

);





if(routeLine)

map.removeLayer(routeLine);



routeLine =
L.polyline(

routing,

{

color:"blue",

weight:8

}

)
.addTo(map);






navigationLine =
L.polyline(

routing,

{

color:"#006cff",

weight:8

}

)
.addTo(map);






instructions=[];



r.legs[0].steps.forEach(step=>{


instructions.push({

text:createInstruction(step),

distance:step.distance

});


});



nextInstruction=0;



document.getElementById("info").innerHTML=

"🚗 "
+
(r.distance/1000).toFixed(1)
+
" km<br>⏱️ "
+
Math.round(r.duration/60)
+
" Minuten";



}








// ===============================
// BLAUE LINIE MIT AUTO BEWEGEN
// ===============================


function updateNavigationLine(){


if(!navigationLine ||
!currentPos)

return;



let index=0;

let best=999999;



routing.forEach((p,i)=>{


let d =
map.distance(

currentPos,

p

);



if(d<best){

best=d;

index=i;

}


});



navigationLine.setLatLngs(

routing.slice(index)

);


}







// ===============================
// STRASSEN-ANSAGEN
// ===============================


function createInstruction(step){



let road="";


if(step.name &&
step.name.trim()!==""){


road =
" auf "
+
step.name;


}



let text="";



if(step.maneuver.type==="arrive"){


text=
"Sie haben Ihr Ziel erreicht";


}


else if(step.maneuver.type==="roundabout"){


text=
"Kreisverkehr. "
+
"Die "
+
(step.maneuver.exit||1)
+
". Ausfahrt nehmen"
+
road;


}


else if(step.maneuver.type==="turn"){


switch(step.maneuver.modifier){


case "left":

text="Links abbiegen";

break;


case "right":

text="Rechts abbiegen";

break;


case "slight left":

text="Bleiben Sie links halten";

break;


case "slight right":

text="Bleiben Sie rechts halten";

break;


case "sharp left":

text="Scharf links abbiegen";

break;


case "sharp right":

text="Scharf rechts abbiegen";

break;


case "uturn":

text="Bitte wenden";

break;


default:

text="Geradeaus weiterfahren";


}



}


else{


text="Weiterfahren";


}



return text + road;


}








// ===============================
// ABBIEGE-ANSAGEN
// ===============================


let a300=false;
let a100=false;
let a50=false;
let aNow=false;



function checkInstructions(){


if(nextInstruction>=instructions.length)

return;



let i =
instructions[nextInstruction];



let d =
i.distance;



if(d<300 && !a300){

speak(
"In 300 Metern. "
+
i.text
);

a300=true;

}



if(d<100 && !a100){

speak(
"In 100 Metern. "
+
i.text
);

a100=true;

}



if(d<50 && !a50){

speak(
"In 50 Metern. "
+
i.text
);

a50=true;

}



if(d<15 && !aNow){

speak(
"Jetzt. "
+
i.text
);


document.getElementById("naviText")
.innerHTML=i.text;



nextInstruction++;


a300=false;
a100=false;
a50=false;
aNow=false;


}


}








// ===============================
// ROUTE VERLASSEN
// ===============================


function checkRoute(){


if(!routing.length ||
!currentPos)

return;



let min=999999;



routing.forEach(p=>{


let d =
map.distance(

currentPos,

p

);



if(d<min)

min=d;


});



if(min>80){


speak(
"Route verlassen. Neue Route wird berechnet."
);


route();


}


}







// ===============================
// SPRACHE
// ===============================


let selectedVoice=null;



function loadVoice(){


let voices =
speechSynthesis.getVoices();



selectedVoice =
voices.find(v=>

v.lang.startsWith("de")

);



}



speechSynthesis.onvoiceschanged=loadVoice;

loadVoice();




function speak(text){


speechSynthesis.cancel();



let msg =
new SpeechSynthesisUtterance(text);



msg.lang="de-DE";



if(selectedVoice)

msg.voice=selectedVoice;



msg.rate=0.9;

msg.pitch=1;

msg.volume=1;



speechSynthesis.speak(msg);


}







// ===============================
// VOLLBILD NAVI
// ===============================


let fullscreen=false;



function toggleNaviMode(){


if(!fullscreen){


if(document.documentElement.requestFullscreen)

document.documentElement.requestFullscreen();



document.querySelector(".panel")
.style.display="none";



document.getElementById("naviInfo")
.style.display="block";



fullscreen=true;


}

else{


if(document.exitFullscreen)

document.exitFullscreen();



document.querySelector(".panel")
.style.display="block";


document.getElementById("naviInfo")
.style.display="none";


fullscreen=false;


}


}




</script>

</body>

</html>
