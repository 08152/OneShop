<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>GHOST 3D Battle Royale</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#70c9ff;
}

canvas{
    display:block;
}

#hud{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-family:Arial;
    z-index:10;
    text-shadow:0 2px 5px black;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:25px;
    z-index:10;
    text-shadow:0 0 5px black;
    pointer-events:none;
}

#menu{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:50;
    font-family:Arial;
    color:white;
}

#box{
    background:#20252a;
    padding:35px;
    border-radius:18px;
    text-align:center;
    width:350px;
    box-shadow:0 10px 50px black;
}

button{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:0;
    border-radius:9px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#play{
    background:#42d35a;
}

#newWorld{
    background:#e6a72c;
}

#seed{
    background:#111;
    padding:10px;
    margin-top:15px;
    font-family:monospace;
    border-radius:7px;
}
</style>
</head>

<body>

<div id="hud">
    <b>GHOST ISLAND</b><br>
    WASD = Bewegen<br>
    SHIFT = Rennen<br>
    SPACE = Springen<br>
    Klick = Maus<br>
    Position: <span id="pos">0 / 0</span>
</div>

<div id="crosshair">+</div>

<div id="menu">
    <div id="box">

        <h1>GHOST ISLAND</h1>

        <p>
            Deine dauerhaft gespeicherte,
            zufällig generierte 3D-Insel.
        </p>

        <div id="seed">
            Seed wird geladen...
        </div>

        <button id="play">
            SPIEL STARTEN
        </button>

        <button id="newWorld">
            NEUE WELT GENERIEREN
        </button>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// ======================================================
// DAUERHAFTER SEED
// ======================================================

let savedSeed =
localStorage.getItem("GHOST_ISLAND_SEED");

if(!savedSeed){

    savedSeed =
    Math.floor(
        Math.random()*2147483647
    );

    localStorage.setItem(
        "GHOST_ISLAND_SEED",
        savedSeed
    );
}

let seed = Number(savedSeed);

document.getElementById("seed").innerText =
"SEED: " + savedSeed;


// ======================================================
// SEEDED RANDOM
// ======================================================

function random(){

    seed =
    (seed * 1664525 + 1013904223)
    >>> 0;

    return seed / 4294967296;
}


// ======================================================
// SCENE
// ======================================================

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x75caff);

scene.fog =
new THREE.Fog(
    0x75caff,
    800,
    6000
);


// ======================================================
// CAMERA
// ======================================================

const camera =
new THREE.PerspectiveCamera(
    75,
    innerWidth/innerHeight,
    0.1,
    10000
);


// ======================================================
// RENDERER
// ======================================================

const renderer =
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
    renderer.domElement
);


// ======================================================
// LICHT
// ======================================================

scene.add(
new THREE.AmbientLight(
    0xffffff,
    1
));

const sun =
new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    1000,
    2000,
    1000
);

sun.castShadow=true;

scene.add(sun);


// ======================================================
// MAP EINSTELLUNGEN
// ======================================================

const MAP_SIZE = 12000;

const WATER_LEVEL = 8;

const SEGMENTS = 220;


// ======================================================
// TERRAIN HÖHE
// ======================================================

function terrainHeight(x,z){

    const distance =
    Math.sqrt(
        x*x + z*z
    );

    // Inselrand
    const island =
    Math.max(
        0,
        1-distance/5700
    );

    let h=20;


    // große Landschaft
    h +=
    Math.sin(
        x*0.0015
    ) *
    Math.cos(
        z*0.0017
    ) * 120;


    // weitere Hügel
    h +=
    Math.sin(
        x*0.004 +
        z*0.003
    ) * 45;


    // kleine Details
    h +=
    Math.sin(
        x*0.012 -
        z*0.009
    ) * 12;


    // Berge
    const mountains =
    Math.max(
        0,
        Math.sin(x*.0008) *
        Math.cos(z*.001)
    );

    h += mountains*220;


    h *= island;


    if(h < WATER_LEVEL)
        h = WATER_LEVEL-5;


    return h;
}


// ======================================================
// RIESIGES TERRAIN
// ======================================================

const terrainGeometry =
new THREE.PlaneGeometry(
    MAP_SIZE,
    MAP_SIZE,
    SEGMENTS,
    SEGMENTS
);

terrainGeometry.rotateX(
    -Math.PI/2
);


const vertices =
terrainGeometry.attributes.position;


for(let i=0;i<vertices.count;i++){

    const x =
    vertices.getX(i);

    const z =
    vertices.getZ(i);

    vertices.setY(
        i,
        terrainHeight(x,z)
    );
}


terrainGeometry.computeVertexNormals();


const terrain =
new THREE.Mesh(
    terrainGeometry,
    new THREE.MeshStandardMaterial({
        color:0x4f9e43,
        roughness:1
    })
);

terrain.receiveShadow=true;

scene.add(terrain);


// ======================================================
// WASSER
// ======================================================

const water =
new THREE.Mesh(
    new THREE.PlaneGeometry(
        15000,
        15000
    ),
    new THREE.MeshStandardMaterial({
        color:0x168bd0,
        transparent:true,
        opacity:.72
    })
);

water.rotation.x =
-Math.PI/2;

water.position.y =
WATER_LEVEL;

scene.add(water);


// ======================================================
// BÄUME
// ======================================================

function createTree(x,z){

    const y =
    terrainHeight(x,z);

    if(y < WATER_LEVEL+5)
        return;


    const group =
    new THREE.Group();


    const trunk =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            2,
            3,
            20,
            7
        ),
        new THREE.MeshStandardMaterial({
            color:0x654329
        })
    );

    trunk.position.y=10;

    trunk.castShadow=true;

    group.add(trunk);


    const leaves =
    new THREE.Mesh(
        new THREE.ConeGeometry(
            17,
            42,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0x247b35
        })
    );

    leaves.position.y=40;

    leaves.castShadow=true;

    group.add(leaves);


    group.position.set(
        x,
        y,
        z
    );

    scene.add(group);
}


// Viele Bäume
for(let i=0;i<1000;i++){

    createTree(
        (random()-.5)*10500,
        (random()-.5)*10500
    );
}


// ======================================================
// HÄUSER
// ======================================================

function createBuilding(x,z){

    const y =
    terrainHeight(x,z);

    if(y < WATER_LEVEL+5)
        return;


    const width =
    30 + random()*50;

    const depth =
    30 + random()*50;

    const height =
    20 + random()*60;


    const body =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            height,
            depth
        ),
        new THREE.MeshStandardMaterial({
            color:
            new THREE.Color(
                .25+random()*.35,
                .25+random()*.35,
                .3+random()*.3
            )
        })
    );


    body.position.set(
        x,
        y+height/2,
        z
    );

    body.rotation.y =
    random()*Math.PI;

    body.castShadow=true;
    body.receiveShadow=true;

    scene.add(body);


    // Dach
    const roof =
    new THREE.Mesh(
        new THREE.ConeGeometry(
            Math.max(width,depth)*.75,
            18,
            4
        ),
        new THREE.MeshStandardMaterial({
            color:0x333333
        })
    );


    roof.position.set(
        x,
        y+height+9,
        z
    );

    roof.rotation.y =
    Math.PI/4;

    roof.castShadow=true;

    scene.add(roof);
}


// ======================================================
// STÄDTE / DÖRFER
// ======================================================

const cityCenters=[];


// Zufällige Städte
for(let i=0;i<12;i++){

    const x =
    (random()-.5)*8000;

    const z =
    (random()-.5)*8000;

    cityCenters.push({
        x:x,
        z:z
    });
}


for(const city of cityCenters){

    const amount =
    8+Math.floor(random()*15);

    for(let i=0;i<amount;i++){

        createBuilding(
            city.x +
            (random()-.5)*600,

            city.z +
            (random()-.5)*600
        );
    }
}


// ======================================================
// FELSEN
// ======================================================

function createRock(x,z){

    const y =
    terrainHeight(x,z);

    if(y<WATER_LEVEL+3)
        return;


    const size =
    5+random()*25;


    const rock =
    new THREE.Mesh(
        new THREE.DodecahedronGeometry(
            size,
            1
        ),
        new THREE.MeshStandardMaterial({
            color:0x777777,
            roughness:1
        })
    );


    rock.position.set(
        x,
        y+size/2,
        z
    );


    rock.rotation.set(
        random()*3,
        random()*3,
        random()*3
    );


    rock.castShadow=true;

    scene.add(rock);
}


for(let i=0;i<450;i++){

    createRock(
        (random()-.5)*11000,
        (random()-.5)*11000
    );
}


// ======================================================
// PLAYER
// ======================================================

const player =
new THREE.Object3D();

scene.add(player);


// Genau wie in deinem Code:
camera.position.y=2;

player.add(camera);


// Spawn
player.position.set(
    0,
    terrainHeight(0,0)+2,
    0
);


// ======================================================
// FPS PHYSICS
// ======================================================

let velocity =
new THREE.Vector3();

let gravity =
0.03;

let canJump=false;

let keys={};


document.onkeydown=(e)=>{

    keys[e.key.toLowerCase()]=true;


    if(
        e.code==="Space" &&
        canJump
    ){

        velocity.y=.9;

        canJump=false;
    }
};


document.onkeyup=(e)=>{

    keys[e.key.toLowerCase()]=false;
};


// ======================================================
// MAUS
// ======================================================

let rx=0;

let ry=0;


document.body.onclick=()=>{

    document.body.requestPointerLock();
};


document.onmousemove=(e)=>{

    if(
        document.pointerLockElement
    ){

        ry -=
        e.movementX*.002;

        rx -=
        e.movementY*.002;


        rx =
        Math.max(
            -1.5,
            Math.min(1.5,rx)
        );


        camera.rotation.x=rx;

        player.rotation.y=ry;
    }
};


// ======================================================
// BEWEGUNG
// ======================================================

function update(){

    let dir =
    new THREE.Vector3();


    if(keys.w)
        dir.z-=1;

    if(keys.s)
        dir.z+=1;

    if(keys.a)
        dir.x-=1;

    if(keys.d)
        dir.x+=1;


    if(dir.length()>0)
        dir.normalize();


    dir.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        player.rotation.y
    );


    let speed =
    keys.shift
    ? .32
    : .20;


    velocity.x +=
    dir.x*speed;

    velocity.z +=
    dir.z*speed;


    velocity.x*=.82;

    velocity.z*=.82;


    // Schwerkraft
    velocity.y-=gravity;


    player.position.add(
        velocity
    );


    // Bodenhöhe
    const ground =
    terrainHeight(
        player.position.x,
        player.position.z
    );


    if(
        player.position.y <
        ground
    ){

        player.position.y=
        ground;

        velocity.y=0;

        canJump=true;
    }


    document.getElementById("pos")
    .innerText =
    Math.round(player.position.x)
    +" / "+
    Math.round(player.position.z);
}


// ======================================================
// START
// ======================================================

document.getElementById("play")
.onclick=()=>{

    document.body.requestPointerLock();

    document.getElementById("menu")
    .style.display="none";
};


document.addEventListener(
    "pointerlockchange",
    ()=>{

        if(
            document.pointerLockElement
            !==document.body
        ){

            document.getElementById("menu")
            .style.display="flex";

        }else{

            document.getElementById("menu")
            .style.display="none";
        }
    }
);


// ======================================================
// NEUE WELT
// ======================================================

document.getElementById("newWorld")
.onclick=()=>{

    const newSeed =
    Math.floor(
        Math.random()*2147483647
    );

    localStorage.setItem(
        "GHOST_ISLAND_SEED",
        newSeed
    );

    location.reload();
};


// ======================================================
// LOOP
// ======================================================

function animate(){

    requestAnimationFrame(
        animate
    );

    update();

    renderer.render(
        scene,
        camera
    );
}

animate();


// ======================================================
// RESIZE
// ======================================================

window.onresize=()=>{

    camera.aspect =
    innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
};

</script>

</body>
</html>
