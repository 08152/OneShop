<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Kugel Plattform - Shader Edition</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 100;
        }
    </style>
    <!-- Externe Bibliotheken laden -->
    <script src="https://cloudflare.com"></script>
    <script src="https://socket.io"></script>
</head>
<body>

    <div id="info">
        <strong>Steuerung (Zwei-Dateien-Struktur):</strong><br>
        W, A, S, D = Bewegen<br>
        Maus bewegen = Kamera drehen<br>
        Klick ins Fenster = Maus sperren
    </div>

    <!-- Das ausgelagerte 3D-Spiellogik-Skript laden -->
    <script src="game.js"></script>
</body>
</html>
