<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktive 2D-Weltkarte</title>
    
    <!-- Leaflet CSS Bibliothek für das Karten-Styling -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <style>
        /* Macht die Karte vollflächig im Browserfenster sichtbar */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        /* Styling für die Infobox */
        .info-box {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- Infobox über der Karte -->
    <div class="info-box">
        <h3>2D-Weltkarte</h3>
        <p>Nutze das Mausrad zum Zoomen. Klicke, um Koordinaten zu sehen.</p>
    </div>

    <!-- Das Kartenelement -->
    <div id="map"></div>

    <!-- Leaflet JavaScript Bibliothek -->
    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // 1. Karte initialisieren (Startpunkt: Mitte der Welt bei Zoomstufe 2)
        const map = L.map('map', {
            minZoom: 2,
            maxZoom: 18
        }).setView([20, 0], 2);

        // 2. OpenStreetMap-Kacheln (Hintergrundkarte) hinzufügen
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> Mitwirkende'
        }).addTo(map);

        // 3. Beispiel-Marker für ein paar Hauptstädte setzen
        const markers = [
            { coords: [52.52, 13.40], text: "<b>Berlin</b><br>Hauptstadt von Deutschland." },
            { coords: [40.71, -74.00], text: "<b>New York City</b><br>Großstadt in den USA." },
            { coords: [35.67, 139.65], text: "<b>Tokio</b><br>Hauptstadt von Japan." },
            { coords: [-22.90, -43.17], text: "<b>Rio de Janeiro</b><br>Metropole in Brasilien." }
        ];

        // Marker in einer Schleife auf der Karte platzieren
        markers.forEach(m => {
            L.marker(m.coords).addTo(map).bindPopup(m.text);
        });

        // 4. Interaktive Funktion: Zeigt Koordinaten beim Klicken an
        const popup = L.popup();
        function onMapClick(e) {
            popup
                .setLatLng(e.latlng)
                .setContent("Koordinaten an dieser Stelle:<br>" + e.latlng.toString())
                .openOn(map);
        }
        map.on('click', onMapClick);
    </script>
</body>
</html>
