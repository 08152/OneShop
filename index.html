<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Norton Smart Scanner</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
background:#fff;
color:#111;
overflow:hidden;
}


/* Menü */

aside{
width:260px;
background:#111;
color:white;
padding:30px;
display:flex;
flex-direction:column;
}

.logo{
font-size:32px;
font-weight:bold;
color:#FFD400;
margin-bottom:50px;
}

.logo span{
color:white;
}


.menu button{

width:100%;
padding:16px;
margin-bottom:15px;
border:0;
border-radius:12px;
background:#FFD400;
color:#000;
font-size:18px;
font-weight:bold;
cursor:pointer;

}


.menu button:hover{

transform:scale(1.04);

}



/* Hauptseite */

main{

flex:1;
padding:40px;
overflow:auto;

}



.card{

background:#fff;
padding:35px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.15);
margin-bottom:30px;

}



.center{

display:flex;
align-items:center;
justify-content:center;
flex-direction:column;

}



/* Sicherheitskreis */

.circle{

width:260px;
height:260px;
border-radius:50%;
border:12px solid #FFD400;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
transition:.3s;

}


.circle.safe{

border-color:#28c840;

}


.circle.danger{

border-color:#ff3030;

}


.circle.scanning{

animation:pulse 1s infinite;

}


@keyframes pulse{

50%{
transform:scale(1.05);
}

}


.circle p{

font-size:22px;
font-weight:bold;

}


.circle h2{

font-size:40px;

}



/* Buttons */

.scanButton{

margin-top:35px;
padding:18px 45px;
background:#FFD400;
border:0;
border-radius:15px;
font-size:22px;
font-weight:bold;
cursor:pointer;

}



.upload{

margin-top:20px;
padding:15px;
background:#111;
color:white;
border:0;
border-radius:12px;
font-size:18px;
cursor:pointer;

}


input[type=file]{

width:100%;
margin-top:20px;
padding:20px;
border:3px dashed #FFD400;
border-radius:15px;

}



/* Fortschritt */

.progress{

display:none;
height:28px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-top:25px;

}


.bar{

height:100%;
width:0%;
background:#FFD400;

}


#percent{

display:none;
font-size:22px;
font-weight:bold;
margin-top:15px;

}



/* Risiko */

#riskBox{

display:none;
margin-top:30px;
padding:25px;
background:#f7f7f7;
border-left:10px solid #FFD400;
border-radius:15px;

}


#riskTitle{

font-size:32px;

}


#riskText{

font-size:20px;
line-height:1.6;

}



/* Bewertung */

#questionBox{

display:none;
margin-top:30px;

}


#questionBox button{

padding:15px 25px;
margin:8px;
border:0;
border-radius:12px;
background:#FFD400;
font-size:17px;
font-weight:bold;
cursor:pointer;

}


#questionBox button:hover{

transform:scale(1.05);

}



/* Sandbox */

iframe{

display:none;
width:100%;
height:500px;
margin-top:30px;
border:3px solid #FFD400;
border-radius:15px;

}


.info{

margin-top:20px;
padding:18px;
background:#fffbe8;
border:2px solid #FFD400;
border-radius:14px;

}


footer{

text-align:center;
color:#777;
margin-top:40px;

}


</style>

</head>


<body>


<aside>


<div class="logo">
✓ <span>Norton 360</span>
</div>


<div class="menu">


<button onclick="openScan()">
🏠 Scan
</button>


<button onclick="downloadJSON()">
📥 1.json Download
</button>


<button onclick="clearDatabase()">
🗑 Daten löschen
</button>


</div>


</aside>


<main>


<div class="card">


<div class="center">


<div class="circle" id="circle">

<p>RISIKO</p>

<h2 id="status">
BEREIT
</h2>


</div>


<h2 style="margin-top:25px">
Sicherheit
</h2>


<button class="scanButton" onclick="openScan()">

Scan starten

</button>


<div id="scanBox" style="display:none;width:100%;margin-top:40px">


<h2>
Ordner auswählen
</h2>


<p class="info">

Wähle einen Ordner. Dateien werden simuliert geprüft.

</p>


<input id="folder" type="file" webkitdirectory multiple>


<button class="upload" onclick="startUpload()">

Hochladen

</button>


<div class="progress" id="progress">

<div class="bar" id="bar"></div>

</div>


<div id="percent">
0 %
</div>
<div id="riskBox">

<h2 id="riskTitle">
Risikoanalyse
</h2>


<p id="riskText">

Noch keine Datei geprüft.

</p>


</div>



<div id="questionBox">


<h2>
Datei bewerten
</h2>


<p>

Ist diese Datei gefährlich?

</p>



<button onclick="saveAnswer('sicher')">

🟢 Nein – sicher

</button>



<button onclick="saveAnswer('gefährlich')">

🔴 Ja – gefährlich

</button>



<button onclick="saveAnswer('unbekannt')">

⚪ Ich weiß nicht

</button>



</div>




<iframe id="sandbox"
sandbox="allow-scripts allow-same-origin">

</iframe>



</div>

</div>


<footer>

Norton Smart Scanner – Demo

</footer>


</main>



<script>


let scanData =

JSON.parse(

localStorage.getItem("scanData")

) || [];



let aktuelleDatei="";



const circle =
document.getElementById("circle");


const statusText =
document.getElementById("status");


const progress =
document.getElementById("progress");


const bar =
document.getElementById("bar");


const percent =
document.getElementById("percent");


const riskBox =
document.getElementById("riskBox");


const riskText =
document.getElementById("riskText");


const sandbox =
document.getElementById("sandbox");




function openScan(){

document.getElementById("scanBox")
.style.display="block";

}




function startUpload(){


let files =
document.getElementById("folder").files;



if(files.length===0){

alert("Bitte zuerst einen Ordner auswählen.");

return;

}



circle.className=
"circle scanning";


statusText.innerHTML=
"UPLOAD";



progress.style.display="block";

percent.style.display="block";



let p=0;



let timer=setInterval(()=>{


p++;


bar.style.width=
p+"%";


percent.innerHTML=
p+" %";



if(p>=100){


clearInterval(timer);



progress.style.display="none";

percent.style.display="none";



scanFolder(files);



}



},40);



}




async function scanFolder(files){



circle.className=
"circle scanning";


statusText.innerHTML=
"SCAN";



riskBox.style.display="block";


riskText.innerHTML=
"Dateien werden analysiert...";



for(let i=0;i<files.length;i++){


riskText.innerHTML=

"Prüfe Datei:<br><b>"+
files[i].name+
"</b><br><br>"+
(i+1)+
" / "+
files.length;



await new Promise(

r=>setTimeout(r,500)

);



if(
files[i].name.toLowerCase()
.includes("virus")
){


showDanger(
files[i].name,
[
"Verdächtiger Dateiname"
]
);


return;


}



if(
files[i].name.endsWith(".html")
){


checkHTML(files[i]);


return;


}


}



finishSafe();



}
function checkHTML(file){


aktuelleDatei=file.name;



let reader=new FileReader();



reader.onload=function(e){


let text=
e.target.result.toLowerCase();



let suchMuster=[

"eval(",
"document.cookie",
"document.write",
"websocket",
"fetch(",
"xmlhttprequest",
"localstorage",
"sessionstorage",
"crypto",
"<script",
"iframe",
"setinterval(",
"settimeout("

];



let gefunden=[];



suchMuster.forEach(
muster=>{


if(text.includes(muster)){


gefunden.push(muster);


}


});



showPreview(file);



if(gefunden.length>0){


showDanger(
file.name,
gefunden
);


}else{


showSafe(
file.name
);


}



};



reader.readAsText(file);



}




function showPreview(file){



let reader=new FileReader();



reader.onload=function(e){


let blob=new Blob(
[
e.target.result
],
{
type:"text/html"
}
);



sandbox.src=
URL.createObjectURL(blob);



sandbox.style.display=
"block";



};



reader.readAsText(file);



}




function showDanger(name,found){



circle.className=
"circle danger";


statusText.innerHTML=
"RISIKO";



riskBox.style.display=
"block";



riskText.innerHTML=

"⚠ Verdächtige Datei erkannt<br><br>"+

"Datei:<br><b>"+
name+
"</b><br><br>"+

"Gefundene Muster:<br>"+

found.join("<br>");



aktuelleDatei=name;



document
.getElementById("questionBox")
.style.display=
"block";



}




function showSafe(name){



circle.className=
"circle safe";


statusText.innerHTML=
"SICHER";



riskBox.style.display=
"block";



riskText.innerHTML=

"✔ Keine bekannten Risiken gefunden.<br><br>"+

"Datei:<br><b>"+
name+
"</b>";



aktuelleDatei=name;



document
.getElementById("questionBox")
.style.display=
"block";



}




function finishSafe(){



circle.className=
"circle safe";


statusText.innerHTML=
"SICHER";



riskBox.style.display=
"block";



riskText.innerHTML=

"✔ Alle Dateien wurden geprüft.<br><br>"+
"Keine verdächtigen Dateien gefunden.";



}
function saveAnswer(answer){



let eintrag={


datei:
aktuelleDatei,


risiko:

answer==="gefährlich"
?
"GEFAEHRLICH"
:

answer==="sicher"
?
"SICHER"
:

"UNBEKANNT",



bewertung:
answer,



zeit:

new Date()
.toLocaleString("de-DE")



};



scanData.push(eintrag);



localStorage.setItem(

"scanData",

JSON.stringify(scanData)

);



document
.getElementById("questionBox")
.style.display=
"none";



riskBox.style.display=
"block";



riskText.innerHTML=

"✔ Bewertung gespeichert<br><br>"+

"Datei:<br><b>"+
aktuelleDatei+
"</b><br><br>"+

"Bewertung:<br><b>"+
answer+
"</b>";



if(answer==="gefährlich"){


circle.className=
"circle danger";


statusText.innerHTML=
"RISIKO";


}

else{


circle.className=
"circle safe";


statusText.innerHTML=
"SICHER";


}



}





function downloadJSON(){



if(scanData.length===0){


alert(
"Keine gespeicherten Ergebnisse."
);


return;


}



let daten={



programm:

"Norton Smart Scanner Demo",



erstellt:

new Date()
.toLocaleString("de-DE"),



dateien:

scanData



};



let json=

JSON.stringify(

daten,

null,

2

);



let blob=

new Blob(

[json],

{

type:"application/json"

}

);



let url=

URL.createObjectURL(blob);



let link=

document.createElement("a");



link.href=url;



link.download=
"1.json";



link.click();



URL.revokeObjectURL(url);



}





function clearDatabase(){



let sicher=

confirm(

"Alle Scan-Ergebnisse löschen?"

);



if(sicher){



localStorage.removeItem(
"scanData"
);



scanData=[];



alert(
"Daten gelöscht."
);



}



}





document
.getElementById("folder")
.addEventListener(
"change",
function(){



if(this.files.length>0){



riskBox.style.display=
"block";



riskText.innerHTML=

"Ordner ausgewählt:<br><br>"+
"<b>"+
this.files.length+
"</b> Dateien bereit.";



}



});
function resetScanner(){


circle.className=
"circle";


statusText.innerHTML=
"BEREIT";



bar.style.width=
"0%";



percent.innerHTML=
"0 %";



progress.style.display=
"none";



percent.style.display=
"none";



riskBox.style.display=
"none";



document
.getElementById("questionBox")
.style.display=
"none";



sandbox.style.display=
"none";



sandbox.src="";



}





function setScanning(){



circle.className=
"circle scanning";



statusText.innerHTML=
"SCAN";



riskBox.style.display=
"block";



riskText.innerHTML=

"Dateien werden geprüft...";



}




function setSafe(){



circle.className=
"circle safe";


statusText.innerHTML=
"SICHER";



}





function setRisk(){



circle.className=
"circle danger";


statusText.innerHTML=
"RISIKO";



}




function checkFileSize(files){



let größe=0;



for(let file of files){


größe+=file.size;


}



let mb=

(
größe /
1024 /
1024
)
.toFixed(2);



riskBox.style.display=
"block";



riskText.innerHTML=

"Ordnergröße:<br><b>"+
mb+
" MB</b><br><br>"+
"Bereit für Sicherheitsprüfung.";



}




function showMessage(text){



riskBox.style.display=
"block";



riskText.innerHTML=text;



}




function prepareScan(){



let files=

document
.getElementById("folder")
.files;



if(files.length===0){


alert(
"Bitte Ordner auswählen."
);


return;


}



checkFileSize(files);



setScanning();



}





window.onload=function(){


resetScanner();



};




</script>


</body>

</html>
