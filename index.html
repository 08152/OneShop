<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub & Render Video KI</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; background-color: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); margin-bottom: 20px; border: 1px solid #334155; }
        .flex { display: flex; gap: 10px; margin-bottom: 10px; }
        input, textarea { flex: 1; padding: 12px; border: 1px solid #475569; border-radius: 6px; font-size: 14px; background: #0f172a; color: white; }
        input:focus, textarea:focus { border-color: #38bdf8; outline: none; }
        button { padding: 12px 20px; border: none; border-radius: 6px; background-color: #38bdf8; color: #0f172a; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        button:hover { background-color: #7dd3fc; transform: translateY(-1px); }
        button.delete { background-color: #ef4444; color: white; }
        button.delete:hover { background-color: #f87171; }
        .status-box { background: #020617; padding: 15px; border-radius: 8px; margin-top: 20px; border-left: 4px solid #38bdf8; display: none; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .video-box { background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #475569; text-align: center; }
        video { width: 100%; border-radius: 6px; margin-top: 10px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .loader { color: #38bdf8; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <h1>Web-basierte Video-KI</h1>
    <p style="color: #94a3b8; margin-top: -10px;">Gehostet auf Render. Berechnet über freie Cloud-Pipelines (Ohne API-Key).</p>
    
    <div class="card">
        <h3>Szenen-Editor</h3>
        <div id="scenesContainer"><!-- Dynamische Szenen --></div>
        <button onclick="addScene()">+ Neue Szene hinzufügen</button>
    </div>

    <button onclick="generateVideoFromWebAI()" style="background-color: #10b981; color: white; width: 100%; font-size: 16px; padding: 15px;">
        🚀 KI-Generierung in der Cloud starten
    </button>

    <div class="status-box" id="statusSection">
        <h3>KI-Verarbeitungsstatus</h3>
        <p id="statusMessage">Verbindung mit Cloud-Server wird aufgebaut...</p>
        <div class="video-grid" id="videoGrid"></div>
    </div>

    <script>
        // Erste Szene direkt laden
        window.onload = () => { addScene(); };

        function addScene() {
            const container = document.getElementById('scenesContainer');
            const id = Date.now();
            
            container.insertAdjacentHTML('beforeend', `
                <div class="card" id="scene_${id}" style="background: #111827; margin-bottom: 15px;">
                    <div class="flex">
                        <input type="url" class="scene-url" placeholder="Optional: Start-Bild-Link (http://...)">
                        <button class="delete" onclick="document.getElementById('scene_${id}').remove()">X</button>
                    </div>
                    <div class="flex">
                        <textarea class="scene-prompt" placeholder="Beschreibe die Videoszene (z.B. 'Neon-Cyberpunk Stadt im Regen, 4k, Kino-Look')" rows="2" required></textarea>
                    </div>
                </div>
            `);
        }

        async function generateVideoFromWebAI() {
            const prompts = document.querySelectorAll('.scene-prompt');
            const urls = document.querySelectorAll('.scene-url');
            const grid = document.getElementById('videoGrid');
            
            let activeScenes = [];
            prompts.forEach((p, i) => {
                if(p.value.trim() !== "") {
                    activeScenes.push({ prompt: p.value.trim(), url: urls[i].value.trim() });
                }
            });

            if(activeScenes.length === 0) return alert("Bitte trage mindestens einen Text-Prompt ein!");

            document.getElementById('statusSection').style.display = 'block';
            document.getElementById('statusMessage').innerHTML = "<span class='loader'>Kostenlose KI-Instanz wird angefragt... Dies kann 1-2 Minuten dauern.</span>";
            grid.innerHTML = "";

            // Wir verarbeiten die Szenen nacheinander über eine freie HuggingFace API-Schnittstelle
            for(let i = 0; i < activeScenes.length; i++) {
                const scene = activeScenes[i];
                const boxId = `box_${i}`;
                
                grid.insertAdjacentHTML('beforeend', `
                    <div class="video-box" id="${boxId}">
                        <strong>Szene ${i+1}</strong>
                        <p style="font-size: 12px; color: #94a3b8; margin: 5px 0;">"${scene.prompt.substring(0, 30)}..."</p>
                        <div class="status-lbl" style="color: #fbbf24;">In Warteschlange...</div>
                    </div>
                `);

                try {
                    // Nutzung des öffentlichen Gradio/HuggingFace API Endpunkts für Video-KI (Beispiel-Modell)
                    const response = await fetch("https://hf.space", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            data: [scene.prompt, scene.url || null, 20, 1] // Prompt, Image, Steps, Seed
                        })
                    });
                    
                    const result = await response.json();
                    const eventId = result.event_id;

                    // Stream/Polling um das fertige MP4-Video abzurufen
                    if(eventId) {
                        checkVideoResult(eventId, boxId);
                    }
                } catch (error) {
                    document.getElementById(boxId).querySelector('.status-lbl').innerText = "Fehler beim Aufruf.";
                    document.getElementById(boxId).querySelector('.status-lbl').style.color = "#ef4444";
                }
            }
            document.getElementById('statusMessage').innerText = "Alle Szenen wurden an die Cloud-KI übermittelt!";
        }

        async function checkVideoResult(eventId, boxId) {
            const box = document.getElementById(boxId);
            const label = box.querySelector('.status-lbl');
            
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`https://hf.space/${eventId}`);
                    if(res.status === 200) {
                        const textData = await res.text();
                        // Hugging Face sendet Server-Sent Events (SSE). Wir suchen nach dem fertigen Video-Pfad im Text.
                        if(textData.includes("complete") && textData.includes(".mp4")) {
                            clearInterval(interval);
                            
                            // Extrahiere die Video-URL aus der Antwort
                            const match = textData.match(/"([^"]+\.mp4)"/);
                            if(match && match[1]) {
                                const videoUrl = "https://hf.space" + match[1];
                                label.innerText = "Fertig!";
                                label.style.color = "#10b981";
                                box.insertAdjacentHTML('beforeend', `<video src="${videoUrl}" controls autoplay loop></video>`);
                            }
                        } else {
                            label.innerHTML = "<span class='loader'>KI rendert Video...</span>";
                        }
                    }
                } catch (e) {
                    clearInterval(interval);
                    label.innerText = "Fehler beim Laden.";
                }
            }, 5000);
        }
    </script>
</body>
</html>
