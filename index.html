<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Norton Smart Scanner</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

background:
radial-gradient(circle at top,#333,#080808);

font-family:"Segoe UI",Arial,sans-serif;

color:white;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

}



.card{

width:100%;

max-width:850px;

background:#171717;

border:1px solid #333;

border-radius:18px;

overflow:hidden;

box-shadow:
0 20px 60px #000;

}



.header{

height:70px;

background:#090909;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

border-bottom:1px solid #333;

}



.logo{

color:#ffcc00;

font-size:26px;

font-weight:900;

}



.badge{

color:#aaa;

font-size:14px;

}



.main{

padding:45px;

text-align:center;

}




.circle{

width:190px;

height:190px;

border-radius:50%;

border:7px solid #ffcc00;

margin:auto;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

transition:.4s;

}



.circle.scan{

animation:pulse 1s infinite;

}



.circle.safe{

border-color:#2ecc71;

box-shadow:
0 0 40px #2ecc71;

}



.circle.danger{

border-color:#e74c3c;

box-shadow:
0 0 40px #e74c3c;

}



@keyframes pulse{

50%{

transform:scale(1.05);

}

}



.small{

color:#aaa;

font-size:12px;

letter-spacing:2px;

}



.status{

font-size:26px;

font-weight:bold;

margin-top:10px;

color:#ffcc00;

}




.upload{

margin-top:45px;

padding:50px;

border:2px dashed #444;

border-radius:15px;

background:#111;

transition:.3s;

}



.upload:hover{

border-color:#ffcc00;

}



input{

display:none;

}



button{

margin-top:20px;

background:#ffcc00;

color:#000;

border:0;

padding:14px 35px;

font-size:15px;

font-weight:bold;

border-radius:8px;

cursor:pointer;

}



button:hover{

background:#ffe066;

}



.file{

margin-top:20px;

color:#aaa;

}



.progress{

height:8px;

background:#333;

border-radius:10px;

margin-top:25px;

overflow:hidden;

display:none;

}



.bar{

height:100%;

width:0%;

background:#ffcc00;

transition:.3s;

}



.result{

display:none;

margin-top:30px;

background:#111;

border-radius:12px;

padding:25px;

text-align:left;

}



.result h3{

color:#ffcc00;

}



.result li{

margin:10px 0;

}



.footer{

padding:15px;

text-align:center;

color:#666;

font-size:12px;

border-top:1px solid #333;

}


</style>


</head>



<body>



<div class="card">


<div class="header">


<div class="logo">
✓ Norton Smart Scanner
</div>


<div class="badge">
150 MB Upload
</div>


</div>




<div class="main">


<div id="circle" class="circle">


<div class="small">
RISIKO
</div>


<div id="status" class="status">
BEREIT
</div>


</div>





<div id="upload" class="upload">


<h2>
Datei Analyse
</h2>


<p>
Datei hier hineinziehen oder auswählen
</p>


<input 
id="file"
type="file"
>


<button onclick="selectFile()">
Datei auswählen
</button>


<br>


<button onclick="scan()">
Jetzt prüfen
</button>



<div id="filename" class="file">

Keine Datei gewählt

</div>



<div id="progress" class="progress">

<div id="bar" class="bar"></div>

</div>


</div>





<div id="result" class="result">


</div>



</div>




<div class="footer">

Smart Heuristic Scanner

</div>


</div>






<script>


let file=null;



function selectFile(){

document
.getElementById("file")
.click();

}




document
.getElementById("file")
.onchange=function(e){

file=e.target.files[0];

showFile();

};





const upload=
document.getElementById("upload");



upload.ondragover=function(e){

e.preventDefault();

upload.style.borderColor="#ffcc00";

}



upload.ondragleave=function(){

upload.style.borderColor="#444";

}



upload.ondrop=function(e){

e.preventDefault();

file=e.dataTransfer.files[0];

showFile();

}





function showFile(){

if(file){

document
.getElementById("filename")
.innerHTML=

file.name+
"<br>"+
Math.round(file.size/1024/1024)
+" MB";

}

}






async function scan(){



if(!file){

alert("Bitte Datei auswählen");

return;

}



const circle=
document.getElementById("circle");


const status=
document.getElementById("status");


const result=
document.getElementById("result");


const progress=
document.getElementById("progress");


const bar=
document.getElementById("bar");



circle.className="circle scan";

status.innerHTML="SCANNT...";


progress.style.display="block";


let p=0;

let timer=setInterval(()=>{

p+=10;

bar.style.width=p+"%";


if(p>=90){

clearInterval(timer);

}


},100);






let form=new FormData();

form.append(
"file",
file
);



try{


let response=
await fetch(
"/api/scan",
{

method:"POST",

body:form

}

);



let data=
await response.json();



clearInterval(timer);

bar.style.width="100%";



circle.className="circle";




if(data.verdict==="GEFÄHRLICH"){


circle.classList.add("danger");

status.innerHTML="GEFAHR";


result.style.display="block";


result.innerHTML=

"<h3>⚠ Bedrohungen gefunden</h3><ul>"+

data.findings
.map(
x=>"<li>"+x+"</li>"
)
.join("")

+
"</ul>";


}

else{


circle.classList.add("safe");

status.innerHTML="SICHER";


result.style.display="block";


result.innerHTML=

"<h3>✓ Keine Gefahr</h3>"+
"Die Datei wurde geprüft.";

}


}



catch(error){


circle.className="circle danger";

status.innerHTML="FEHLER";


result.style.display="block";


result.innerHTML=
"Server nicht erreichbar.";


}



}



</script>



</body>
</html>
