<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lumora AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0d0d0f;
    color: #f5f5f5;
    overflow: hidden;
}

/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    background:
        radial-gradient(circle at 50% 40%, rgba(70,70,100,.12), transparent 40%),
        #0d0d0f;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 250px;
    height: 100%;
    background: rgba(18,18,21,.96);
    border-right: 1px solid #29292e;
    padding: 18px;
    display: flex;
    flex-direction: column;
    transition: .3s;
}

.logo {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 30px;
}

.logo-icon {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: linear-gradient(
        135deg,
        #4285f4,
        #9b72cb,
        #d96570,
        #fbbc04
    );
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 19px;
}

.new-chat {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 14px;
    background: #242429;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: .2s;
}

.new-chat:hover {
    background: #303036;
    transform: translateY(-1px);
}

.sidebar-title {
    color: #8c8c94;
    font-size: 12px;
    margin: 28px 8px 10px;
}

.history {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.history-item {
    padding: 11px 12px;
    border-radius: 10px;
    color: #c8c8ce;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.history-item:hover {
    background: #202025;
}

.sidebar-bottom {
    margin-top: auto;
}

.sidebar-button {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: #bdbdc4;
    border: none;
    text-align: left;
    border-radius: 10px;
    cursor: pointer;
}

.sidebar-button:hover {
    background: #202025;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 24px;
}

.model {
    background: #1d1d21;
    border: 1px solid #303037;
    border-radius: 20px;
    padding: 9px 15px;
    color: #d5d5da;
    font-size: 13px;
}

/* =========================
   CENTER
========================= */

.center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transform: translateY(-25px);
}

.ai-name {
    font-size: clamp(35px, 6vw, 65px);
    font-weight: 700;
    letter-spacing: -3px;
    margin-bottom: 9px;

    background: linear-gradient(
        90deg,
        #4285f4,
        #8e75d9,
        #d96570,
        #fbbc04,
        #34a853,
        #4285f4
    );

    background-size: 400% 400%;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation: rainbow 7s ease infinite;
}

.subtitle {
    color: #77777f;
    font-size: 14px;
    margin-bottom: 35px;
}

/* =========================
   INPUT AREA
========================= */

.input-wrapper {
    width: min(850px, 92%);
    position: relative;
}

.input-box {
    width: 100%;
    min-height: 155px;
    border-radius: 30px;
    padding: 5px;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #8e75d9,
            #d96570,
            #fbbc04,
            #34a853,
            #4285f4
        );

    background-size: 500% 500%;
    animation: rainbow 8s linear infinite;

    box-shadow:
        0 0 25px rgba(66,133,244,.12),
        0 0 50px rgba(217,101,112,.07);
}

.input-inner {
    width: 100%;
    min-height: 145px;
    border-radius: 26px;
    background: #17171b;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

textarea {
    flex: 1;
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 17px;
    font-family: inherit;
    line-height: 1.5;
}

textarea::placeholder {
    color: #77777f;
}

/* =========================
   BOTTOM INPUT BUTTONS
========================= */

.input-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
}

.left-buttons,
.right-buttons {
    display: flex;
    gap: 8px;
}

.icon-button {
    width: 39px;
    height: 39px;
    border: none;
    border-radius: 50%;
    background: #25252b;
    color: #d8d8dd;
    cursor: pointer;
    font-size: 18px;
    transition: .2s;
}

.icon-button:hover {
    background: #34343b;
    transform: scale(1.06);
}

.send-button {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #4285f4,
            #9b72cb,
            #d96570
        );

    color: white;
    font-size: 19px;
    cursor: pointer;
    transition: .2s;
}

.send-button:hover {
    transform: scale(1.08);
}

/* =========================
   IMAGE PREVIEW
========================= */

.preview {
    display: none;
    gap: 10px;
    padding: 8px 0;
    overflow-x: auto;
}

.preview.show {
    display: flex;
}

.preview-image {
    width: 65px;
    height: 65px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid #44444b;
}

/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;
    color: #55555c;
    font-size: 11px;
    padding: 15px;
}

/* =========================
   ANIMATION
========================= */

@keyframes rainbow {
    0% {
        background-position: 0% 50%;
    }

    25% {
        background-position: 50% 100%;
    }

    50% {
        background-position: 100% 50%;
    }

    75% {
        background-position: 50% 0%;
    }

    100% {
        background-position: 0% 50%;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .topbar {
        height: 60px;
        padding-right: 15px;
    }

    .center {
        transform: translateY(-10px);
    }

    .ai-name {
        font-size: 45px;
    }

    .subtitle {
        margin-bottom: 25px;
    }

    .input-wrapper {
        width: 96%;
    }

    .input-box {
        min-height: 145px;
    }

    .input-inner {
        min-height: 135px;
        padding: 16px;
    }

    textarea {
        font-size: 16px;
    }
}

/* =========================
   FILE INPUT
========================= */

#imageInput {
    display: none;
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">✦</div>
            <span>Lumora</span>
        </div>

        <button class="new-chat">
            ＋ Neuer Chat
        </button>

        <div class="sidebar-title">
            VERLAUF
        </div>

        <div class="history">

            <div class="history-item">
                Mein erster Chat
            </div>

            <div class="history-item">
                Bilder analysieren
            </div>

            <div class="history-item">
                Ideen für ein Spiel
            </div>

        </div>

        <div class="sidebar-bottom">

            <button class="sidebar-button">
                ⚙ Einstellungen
            </button>

            <button class="sidebar-button">
                ? Hilfe
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="topbar">
            <div class="model">
                Lumora 1.0 ▾
            </div>
        </div>


        <section class="center">

            <div class="ai-name">
                Lumora
            </div>

            <div class="subtitle">
                Deine kreative KI
            </div>


            <!-- INPUT -->

            <div class="input-wrapper">

                <div class="input-box">

                    <div class="input-inner">

                        <div id="preview"
                             class="preview">
                        </div>

                        <textarea
                            id="message"
                            placeholder="Frag Lumora etwas …"
                        ></textarea>


                        <div class="input-bottom">

                            <div class="left-buttons">

                                <!-- IMAGE UPLOAD -->

                                <label
                                    for="imageInput"
                                    class="icon-button"
                                    title="Bild hochladen"
                                >
                                    ＋
                                </label>

                                <input
                                    id="imageInput"
                                    type="file"
                                    accept="image/*"
                                    multiple
                                >


                                <button
                                    class="icon-button"
                                    title="Bild"
                                >
                                    🖼
                                </button>

                            </div>


                            <div class="right-buttons">

                                <button
                                    class="icon-button"
                                    title="Mikrofon"
                                >
                                    🎤
                                </button>

                                <button
                                    class="send-button"
                                    title="Senden"
                                >
                                    ↑
                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <div class="footer">
            Lumora kann Fehler machen. Überprüfe wichtige Informationen.
        </div>

    </main>

</div>


<script>

/* =========================
   IMAGE UPLOAD PREVIEW
========================= */

const imageInput =
    document.getElementById("imageInput");

const preview =
    document.getElementById("preview");


imageInput.addEventListener("change", function () {

    preview.innerHTML = "";

    const files = Array.from(this.files);

    if (files.length === 0) {
        preview.classList.remove("show");
        return;
    }

    preview.classList.add("show");

    files.forEach(file => {

        if (!file.type.startsWith("image/")) {
            return;
        }

        const img =
            document.createElement("img");

        img.className = "preview-image";

        img.src =
            URL.createObjectURL(file);

        preview.appendChild(img);

    });

});


/* =========================
   TEXTAREA AUTO GROW
========================= */

const textarea =
    document.getElementById("message");

textarea.addEventListener("input", function () {

    this.style.height = "auto";

    this.style.height =
        Math.min(this.scrollHeight, 90) + "px";

});


/* =========================
   ENTER
========================= */

textarea.addEventListener("keydown", function (event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        // Noch keine KI-Funktion.
        console.log("Senden");

    }

});

</script>

</body>
</html>
