<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Navi</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Suchleiste -->
    <div class="panel">

        <input
            id="ziel"
            type="text"
            placeholder="Ziel eingeben...">

        <button id="routeBtn">
            🔎 Route suchen
        </button>

        <button
            id="startBtn"
            style="display:none;">
            🚗 Navigation starten
        </button>

        <div id="info">
            📍 GPS wird gesucht...
        </div>

    </div>

    <!-- Standort -->
    <button id="locationBtn" title="Standort">
        📍
    </button>

    <!-- Vollbild -->
    <button id="fullscreenBtn" title="Vollbild">
        ⛶
    </button>

    <!-- Navi -->
    <div id="naviInfo">

        <div id="nextInstruction">
            Navigation
        </div>

        <div id="distanceLeft">
            –
        </div>

        <div id="timeLeft">
            –
        </div>

    </div>

    <!-- Karte -->
    <div id="map"></div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Eigene Dateien -->
    <script src="map.js"></script>
    <script src="script.js"></script>

</body>
</html>
