<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GPS Navi</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<style>

html,body{
margin:0;
height:100%;
font-family:Arial;
overflow:hidden;
}


#map{
height:100%;
width:100%;
}


.panel{

position:absolute;
top:10px;
left:10px;
right:10px;
z-index:1000;

background:white;
padding:12px;

border-radius:18px;

box-shadow:0 0 15px #555;

}


input,button{

width:100%;
padding:14px;
margin-top:8px;

border-radius:12px;

border:1px solid #aaa;

font-size:17px;

}


button{

background:#006cff;
color:white;

}


.car-icon{

font-size:45px;
text-align:center;

}


#naviInfo{

position:absolute;

bottom:20px;

left:20px;

right:20px;

z-index:2000;

background:rgba(0,0,0,.75);

color:white;

padding:20px;

border-radius:20px;

font-size:24px;

text-align:center;

display:none;

}


.bigArrow{

font-size:90px;

}


.fullscreenBtn{

position:absolute;

right:15px;

top:15px;

z-index:3000;

width:auto;

}


</style>

</head>


<body>


<div class="panel">


<input id="ziel"
placeholder="Ziel eingeben">


<button onclick="prepareRoute()">

🔎 Route suchen

</button>


<button id="startBtn"
style="display:none"
onclick="startNavigation()">

🚗 Navigation starten

</button>


<div id="info">

Warte auf GPS...

</div>


</div>



<button class="fullscreenBtn"
onclick="toggleNaviMode()">

⛶

</button>



<div id="naviInfo">

<div class="bigArrow">

⬆️

</div>


<div id="naviText">

Navigation

</div>


</div>



<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


let map=L.map("map")
.setView([48.1351,11.5820],16);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png"

).addTo(map);



let currentPos;

let marker;

let routeLine;

let navigationLine;


let routing=[];

let instructions=[];

let nextInstruction=0;


let navigationStarted=false;



let carIcon=L.divIcon({

html:"⬆️",

className:"car-icon",

iconSize:[50,50],

iconAnchor:[25,25]

});



navigator.geolocation.watchPosition(

p=>{


currentPos=[

p.coords.latitude,

p.coords.longitude

];



if(!marker){

marker=L.marker(
currentPos,
{
icon:carIcon
}
)
.addTo(map);


map.setView(currentPos,18);


}else{


marker.setLatLng(currentPos);


}



updateNavigationLine();

checkRoute();

checkInstructions();



},


e=>alert("GPS Fehler"),


{

enableHighAccuracy:true

}

);



async function prepareRoute(){

document.getElementById("startBtn")
.style.display="block";


await route();

}



function startNavigation(){

navigationStarted=true;


map.setZoom(19);


speak(
"Navigation gestartet"
);

}

// ROUTE BERECHNEN

async function route(){


let ziel=
document.getElementById("ziel").value;



let geo=
await fetch(
"https://nominatim.openstreetmap.org/search?format=json&q="
+
encodeURIComponent(ziel)
);



let data=await geo.json();



if(!data.length){

alert("Ziel nicht gefunden");

return;

}



let zielPos=[

parseFloat(data[0].lat),

parseFloat(data[0].lon)

];



let url=

"https://router.project-osrm.org/route/v1/driving/"
+
currentPos[1]+","+currentPos[0]
+
";"
+
zielPos[1]+","+zielPos[0]
+
"?overview=full&steps=true&geometries=geojson";



let res=
await fetch(url);



let json=
await res.json();



let r=json.routes[0];



routing=
r.geometry.coordinates.map(
c=>[c[1],c[0]]
);



if(routeLine)

map.removeLayer(routeLine);



routeLine=L.polyline(
routing,
{
color:"blue",
weight:8
}
)
.addTo(map);



navigationLine=L.polyline(
routing,
{
color:"#006cff",
weight:8
}
)
.addTo(map);




// Abbiegeinformationen


instructions=[];



r.legs[0].steps.forEach(step=>{


let text="";


switch(step.maneuver.type){


case "turn":


switch(step.maneuver.modifier){


case "slight left":

text="Bleiben Sie links halten";
break;


case "slight right":

text="Bleiben Sie rechts halten";
break;


case "left":

text="Links abbiegen";
break;


case "right":

text="Rechts abbiegen";
break;


case "sharp left":

text="Scharf links abbiegen";
break;


case "sharp right":

text="Scharf rechts abbiegen";
break;


default:

text="Geradeaus weiterfahren";

}


break;



case "roundabout":

text=
"Kreisverkehr. "
+
(step.maneuver.exit||1)
+
". Ausfahrt nehmen";

break;



case "arrive":

text="Ziel erreicht";

break;



default:

text="Weiterfahren";

}



instructions.push({

text:text,

distance:step.distance

});


});



nextInstruction=0;



document.getElementById("info").innerHTML=

"🚗 "
+
(r.distance/1000).toFixed(1)
+
" km<br>⏱️ "
+
Math.round(r.duration/60)
+
" Minuten";


}





// BLAUE LINIE MIT AUTO BEWEGEN


function updateNavigationLine(){


if(!routing.length || !currentPos)
return;


let index=0;

let min=999999;



routing.forEach((p,i)=>{


let d=map.distance(
currentPos,
p
);


if(d<min){

min=d;
index=i;

}


});



navigationLine.setLatLngs(
routing.slice(index)
);



if(navigationStarted){

map.setView(
currentPos,
19,
{
animate:true
}
);

}



}




// ROUTE VERLASSEN


function checkRoute(){


if(!routing.length)
return;



let min=9999;



routing.forEach(p=>{


let d=
map.distance(
currentPos,
p
);


if(d<min)
min=d;


});



if(min>80){


speak(
"Route verlassen. Neue Route wird berechnet."
);


route();


}


}





// ABBIEGEANSAGEN


let announced300=false;

let announced50=false;

let announcedNow=false;



function checkInstructions(){


if(nextInstruction>=instructions.length)
return;


let i=instructions[nextInstruction];



let d=i.distance;



if(d<300 && !announced300){

speak(
"In 300 Metern. "
+i.text
);

announced300=true;

}



if(d<50 && !announced50){

speak(
"In 50 Metern. "
+i.text
);

announced50=true;

}



if(d<10 && !announcedNow){


speak(
"Jetzt. "
+i.text
);


document.getElementById("naviText")
.innerHTML=
"➡️ "
+i.text;


nextInstruction++;


announced300=false;

announced50=false;

announcedNow=false;


}


}





// GLEICHE NAVI-STIMME


let selectedVoice;



function loadVoice(){


let voices=
speechSynthesis.getVoices();



if(!selectedVoice){

selectedVoice=
voices.find(v=>
v.lang.startsWith("de")
);

}


}


speechSynthesis.onvoiceschanged=
loadVoice;


loadVoice();



function speak(text){


speechSynthesis.cancel();


let msg=
new SpeechSynthesisUtterance(text);


msg.voice=selectedVoice;

msg.lang="de-DE";

msg.rate=0.9;

msg.pitch=1;

msg.volume=1;


speechSynthesis.speak(msg);


}




// VOLLBILD NAVI


let full=false;



function toggleNaviMode(){


if(!full){


document.documentElement.requestFullscreen();


document.querySelector(".panel")
.style.display="none";


document.getElementById("naviInfo")
.style.display="block";


full=true;


}else{


document.exitFullscreen();


document.querySelector(".panel")
.style.display="block";


document.getElementById("naviInfo")
.style.display="none";


full=false;


}


}


</script>


</body>
</html>
