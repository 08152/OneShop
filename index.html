<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casino</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#111;
    color:white;
}

header{
    background:#1b1b1b;
    padding:20px;
    text-align:center;
    position:relative;
    border-bottom:3px solid gold;
}

header h1{
    color:gold;
}

#adminButton{
    position:absolute;
    right:20px;
    top:18px;
    width:40px;
    height:40px;
    background:gold;
    border-radius:50%;
    cursor:pointer;
    box-shadow:0 0 12px gold;
}

#spieler{
    width:320px;
    margin:40px auto;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:18px;
}

button{
    margin-top:12px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:gold;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}

#games{
    display:none;
    width:340px;
    margin:30px auto;
}

.game{
    display:block;
    text-decoration:none;
    color:white;
    background:#222;
    margin:18px 0;
    padding:25px;
    text-align:center;
    border-radius:15px;
    transition:.2s;
    font-size:28px;
}

.game:hover{
    transform:scale(1.04);
    background:#333;
}

footer{
    text-align:center;
    margin-top:40px;
    color:#aaa;
}
</style>
</head>
<body>

<header>

<h1>🎰 Casino</h1>

<div id="adminButton" title="Admin"></div>

</header>

<div id="spieler">

<h2>Spielername</h2>

<input id="name" placeholder="Name eingeben">

<button onclick="speichern()">
Weiter
</button>

</div>

<div id="games">

<a class="game" href="1.html">
🎰 Automat
</a>

<a class="game" href="2.html">
🎡 Roulette
</a>

<a class="game" href="3.html">
🃏 Black Jack
</a>

</div>

<footer>

Casino

</footer>

<script>

const spieler = localStorage.getItem("spieler");

if(spieler){

document.getElementById("spieler").style.display="none";
document.getElementById("games").style.display="block";

}

function speichern(){

const name=document.getElementById("name").value.trim();

if(name.length<2){

alert("Bitte Namen eingeben.");

return;

}

localStorage.setItem("spieler",name);

document.getElementById("spieler").style.display="none";
document.getElementById("games").style.display="block";

}

document.getElementById("adminButton").onclick=function(){

const pin=prompt("PIN eingeben");

if(pin==="081508"){

location.href="admin.html";

}else if(pin!==null){

alert("Falscher PIN.");

}

};

</script>

</body>
</html>
