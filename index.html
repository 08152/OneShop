<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Pixel KI Renderer</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #fff; text-align: center; padding: 40px; }
        .box { background: #1a1a2e; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        input[type="text"] { padding: 12px; width: 280px; border: 2px solid #3f3f5f; border-radius: 6px; background: #111; color: #fff; font-size: 16px; }
        button { padding: 12px 24px; background: #e94560; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #ff4f73; }
        .output { margin-top: 30px; }
        img { border: 4px solid #fff; border-radius: 4px; width: 256px; height: 256px; image-rendering: pixelated; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🤖 Pixel-zu-Beschreibung KI</h2>
        <p>Nutze Bilder im selben GitHub-Ordner für die Farb-KI.</p>
        
        <!-- Das Formular schickt die Beschreibung an deine app.py -->
        <form method="POST">
            <input type="text" name="prompt" placeholder="kreis, wiese, sonne oder wellen..." value="{{ prompt }}" required>
            <button type="submit">Pixel rendern</button>
        </form>

        <!-- Zeigt das Bild an, sobald es generiert wurde -->
        {% if generated %}
        <div class="output">
            <h3>Generiertes Bild für: "{{ prompt }}"</h3>
            <img src="/render_image?cb={{ cache_buster }}" alt="KI Bild">
        </div>
        {% endif %}
    </div>
</body>
</html>
