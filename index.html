<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZEROPOINT – Mapper</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#79caff;
    font-family:Arial,sans-serif;
}

canvas{display:block}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    z-index:20;
    width:350px;
    padding:16px;
    border-radius:16px;
    background:rgba(20,24,28,.92);
    color:white;
    box-shadow:0 10px 40px #0008;
}

#title{
    font-size:26px;
    font-weight:bold;
    margin-bottom:12px;
}

.row{
    display:flex;
    gap:8px;
}

input{
    flex:1;
    min-width:0;
    padding:11px;
    border:0;
    border-radius:8px;
    background:#101214;
    color:white;
    font-family:monospace;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 14px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#generate{background:#39a852}

#export{
    width:100%;
    margin-top:8px;
    background:#2874d8;
}

#export:disabled{
    opacity:.6;
    cursor:wait;
}

#info{
    margin-top:11px;
    font-size:13px;
    line-height:1.5;
}

#hint{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    background:#0008;
    color:white;
    padding:9px 14px;
    border-radius:9px;
    pointer-events:none;
    white-space:nowrap;
}

#loading{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#0005;
    color:white;
    font-size:20px;
    font-weight:bold;
    z-index:100;
}
</style>
</head>

<body>

<div id="ui">

    <div id="title">ZEROPOINT · MAPPER</div>

    <div class="row">
        <input id="seedInput" placeholder="Seed...">
        <button id="generate">Neue Welt</button>
    </div>

    <button id="export">GLB herunterladen</button>

    <div id="info">
        Seed: <b id="seedText">-</b><br>
        Runde Terrain-Insel · Ø 5000<br>
        Eine einzige Terrain-Geometrie
    </div>

</div>

<div id="hint">
    Linksklick + Maus = 360° · Mausrad = Zoom · Rechtsklick = verschieben
</div>

<div id="loading">
    ZEROPOINT TERRAIN WIRD GENERIERT...
</div>


<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- GLTFExporter -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/exporters/GLTFExporter.js"></script>


<script>

// ============================================================
// EINSTELLUNGEN
// ============================================================

const MAP_RADIUS = 2500;
const MAP_DIAMETER = MAP_RADIUS * 2;

const SEGMENTS = 220;


// ============================================================
// SEED
// ============================================================

let seed =
    Math.floor(
        Math.random() * 2147483647
    );


// ============================================================
// SCENE
// ============================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x79caff
    );

scene.fog =
    new THREE.Fog(
        0x79caff,
        900,
        5000
    );


// ============================================================
// CAMERA
// AUS DEINEM 3-D-SYSTEM
// ============================================================

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.1,
        10000
    );

camera.position.set(
    0,
    650,
    1000
);


// ============================================================
// RENDERER
// ============================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        preserveDrawingBuffer:false
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.5
    )
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


// ============================================================
// LICHT
// ============================================================

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1
    )
);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        1.7
    );

sun.position.set(
    700,
    1200,
    500
);

sun.castShadow=true;

scene.add(sun);


// ============================================================
// CAMERA RIG
// ============================================================

const rig =
    new THREE.Object3D();

scene.add(rig);

rig.add(camera);


// ============================================================
// 3-D MAUS
// ============================================================

let mouseDown=false;

let rotX=-0.45;
let rotY=0;

renderer.domElement.addEventListener(
    "mousedown",
    e=>{

        if(e.button===0)
            mouseDown=true;

    }
);

window.addEventListener(
    "mouseup",
    ()=>{
        mouseDown=false;
    }
);

window.addEventListener(
    "mousemove",
    e=>{

        if(!mouseDown)
            return;

        rotY -=
            e.movementX * 0.003;

        rotX -=
            e.movementY * 0.003;

        rotX =
            Math.max(
                -1.5,
                Math.min(
                    1.5,
                    rotX
                )
            );

        camera.rotation.x =
            rotX;

        rig.rotation.y =
            rotY;

    }
);


// ============================================================
// ZOOM
// ============================================================

renderer.domElement.addEventListener(
    "wheel",
    e=>{

        e.preventDefault();

        const direction =
            new THREE.Vector3(
                0,
                0,
                1
            );

        direction.applyQuaternion(
            camera.quaternion
        );

        camera.position.addScaledVector(
            direction,
            e.deltaY * 0.8
        );

        camera.position.y =
            Math.max(
                30,
                Math.min(
                    4500,
                    camera.position.y
                )
            );

    },
    {
        passive:false
    }
);


// ============================================================
// HASH
// ============================================================

function hash(x,z){

    let n =
        Math.imul(
            x|0,
            374761393
        ) ^
        Math.imul(
            z|0,
            668265263
        ) ^
        Math.imul(
            seed|0,
            1442695041
        );

    n ^= n >>> 13;

    n =
        Math.imul(
            n,
            1274126177
        );

    n ^= n >>> 16;

    return (
        n >>> 0
    ) / 4294967295;
}


// ============================================================
// NOISE
// ============================================================

function smooth(t){

    return t*t*(3-2*t);

}


function noise(x,z){

    const x0 =
        Math.floor(x);

    const z0 =
        Math.floor(z);

    const x1=x0+1;
    const z1=z0+1;

    const sx =
        smooth(x-x0);

    const sz =
        smooth(z-z0);

    const a =
        hash(x0,z0);

    const b =
        hash(x1,z0);

    const c =
        hash(x0,z1);

    const d =
        hash(x1,z1);

    const ab =
        a+(b-a)*sx;

    const cd =
        c+(d-c)*sx;

    return (
        ab+(cd-ab)*sz
    );
}


// ============================================================
// FBM
// ============================================================

function fbm(x,z){

    let value=0;
    let amplitude=.5;
    let frequency=1;

    for(let i=0;i<6;i++){

        value +=
            noise(
                x*frequency,
                z*frequency
            ) *
            amplitude;

        frequency*=2;
        amplitude*=.5;

    }

    return value;
}


// ============================================================
// TERRAIN HÖHE
// ============================================================

function getHeight(x,z){

    const distance =
        Math.sqrt(
            x*x+
            z*z
        );

    // Runde Insel
    const edge =
        distance / MAP_RADIUS;

    if(edge>=1)
        return -30;

    let h=0;

    // große Landschaft
    h +=
        (fbm(
            x*.00065,
            z*.00065
        )-.5)
        *350;

    // Hügel
    h +=
        (fbm(
            x*.0018+200,
            z*.0018+500
        )-.5)
        *130;

    // kleine Details
    h +=
        (fbm(
            x*.006,
            z*.006
        )-.5)
        *30;

    // Bergketten
    const mountains =
        Math.max(
            0,
            fbm(
                x*.0003+500,
                z*.0003+700
            )-.54
        );

    h +=
        mountains *
        mountains *
        800;

    // Rand fällt zum Meeresspiegel ab
    const falloff =
        Math.pow(
            Math.max(
                0,
                edge-.70
            ) / .30,
            2
        );

    h -=
        falloff * 180;

    return h;
}


// ============================================================
// TERRAIN
// ============================================================

let terrain=null;

function createTerrain(){

    if(terrain){

        scene.remove(
            terrain
        );

        terrain.geometry.dispose();

        terrain.material.dispose();

        terrain=null;
    }


    const geometry =
        new THREE.PlaneGeometry(
            MAP_DIAMETER,
            MAP_DIAMETER,
            SEGMENTS,
            SEGMENTS
        );

    geometry.rotateX(
        -Math.PI/2
    );


    const positions =
        geometry.attributes.position;


    for(
        let i=0;
        i<positions.count;
        i++
    ){

        const x =
            positions.getX(i);

        const z =
            positions.getZ(i);

        const distance =
            Math.sqrt(
                x*x+
                z*z
            );


        if(distance > MAP_RADIUS){

            // außerhalb der runden Welt
            positions.setY(
                i,
                -30
            );

        }else{

            positions.setY(
                i,
                getHeight(
                    x,
                    z
                )
            );

        }

    }


    geometry.computeVertexNormals();


    const material =
        new THREE.MeshStandardMaterial({

            color:0x4d9844,

            roughness:1,

            metalness:0

        });


    terrain =
        new THREE.Mesh(
            geometry,
            material
        );

    terrain.receiveShadow=true;

    scene.add(
        terrain
    );
}


// ============================================================
// GENERIEREN
// ============================================================

function generateWorld(){

    document.getElementById(
        "loading"
    ).style.display="flex";


    requestAnimationFrame(()=>{

        createTerrain();

        document.getElementById(
            "seedText"
        ).innerText =
            seed;


        camera.position.set(
            0,
            650,
            1000
        );

        rotX=-.45;
        rotY=0;

        camera.rotation.x=
            rotX;

        rig.rotation.y=
            rotY;


        document.getElementById(
            "loading"
        ).style.display="none";

    });

}


// ============================================================
// NEUE WELT / SEED
// ============================================================

document.getElementById(
    "generate"
).onclick=()=>{

    const text =
        document.getElementById(
            "seedInput"
        ).value.trim();


    if(text===""){

        seed =
            Math.floor(
                Math.random() *
                2147483647
            );

    }else{

        let n=2166136261;

        for(
            let i=0;
            i<text.length;
            i++
        ){

            n ^=
                text.charCodeAt(i);

            n =
                Math.imul(
                    n,
                    16777619
                );

        }

        seed =
            (n >>> 0) ||
            1;
    }


    generateWorld();

};


// ============================================================
// GLB EXPORT
// ============================================================

document.getElementById(
    "export"
).onclick=()=>{

    if(!terrain)
        return;


    const button =
        document.getElementById(
            "export"
        );

    button.disabled=true;

    button.innerText=
        "GLB wird erstellt...";


    // --------------------------------------------------------
    // Export-Kopie
    // Damit der Export sicher eine eigene Szene besitzt.
    // --------------------------------------------------------

    const exportScene =
        new THREE.Scene();


    const exportTerrain =
        terrain.clone(true);


    exportTerrain.geometry =
        terrain.geometry.clone();


    exportTerrain.material =
        terrain.material.clone();


    exportScene.add(
        exportTerrain
    );


    const exporter =
        new THREE.GLTFExporter();


    exporter.parse(

        exportScene,

        result=>{

            try{

                const blob =
                    new Blob(
                        [result],
                        {
                            type:
                            "model/gltf-binary"
                        }
                    );


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const a =
                    document.createElement(
                        "a"
                    );

                a.style.display="none";

                a.href=url;

                a.download =
                    "ZEROPOINT_TERRAIN_" +
                    seed +
                    ".glb";


                document.body.appendChild(a);

                a.click();

                document.body.removeChild(a);


                setTimeout(
                    ()=>{
                        URL.revokeObjectURL(
                            url
                        );
                    },
                    1000
                );


            }catch(error){

                console.error(error);

                alert(
                    "Der GLB konnte nicht gespeichert werden."
                );

            }


            button.disabled=false;

            button.innerText=
                "GLB herunterladen";

        },


        error=>{

            console.error(error);

            alert(
                "GLB-Export fehlgeschlagen."
            );

            button.disabled=false;

            button.innerText=
                "GLB herunterladen";

        },


        {
            binary:true,
            onlyVisible:true
        }

    );

};


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


// ============================================================
// START
// ============================================================

generateWorld();


// ============================================================
// LOOP
// ============================================================

function animate(){

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>
