<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Lumora AI</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    background:#0d0d10;

    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow:hidden;

}


/* =====================================================
   APP
===================================================== */

.app{

    width:100%;
    height:100vh;

    display:flex;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

    width:245px;

    background:#121216;

    border-right:
        1px solid #29292e;

    padding:18px;

    flex-shrink:0;

}

.logo{

    display:flex;

    align-items:center;

    gap:10px;

    font-size:21px;

    font-weight:bold;

    margin-bottom:28px;

}

.logoIcon{

    width:38px;
    height:38px;

    border-radius:13px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #4285f4,
            #9b72cb,
            #d96570,
            #fbbc04,
            #34a853
        );

    background-size:400% 400%;

    animation:
        rainbow 7s linear infinite;

}

.newChat{

    width:100%;

    border:0;

    border-radius:14px;

    padding:13px;

    background:#242429;

    color:white;

    cursor:pointer;

}

.newChat:hover{

    background:#303036;

}

.sidebarTitle{

    color:#77777f;

    font-size:11px;

    margin:
        28px 8px 10px;

}

.historyItem{

    padding:11px;

    border-radius:10px;

    color:#c8c8ce;

    font-size:13px;

}

.historyItem:hover{

    background:#202025;

}


/* =====================================================
   MAIN
===================================================== */

.main{

    flex:1;

    min-width:0;

    height:100%;

    display:flex;

    flex-direction:column;

    position:relative;

}


/* =====================================================
   TOP
===================================================== */

.topbar{

    height:65px;

    display:flex;

    align-items:center;

    justify-content:flex-end;

    padding:
        0 24px;

}

.model{

    padding:
        9px 15px;

    border-radius:20px;

    background:#1e1e23;

    border:
        1px solid #303037;

    color:#d5d5db;

    font-size:13px;

}


/* =====================================================
   CHAT
===================================================== */

.chat{

    flex:1;

    overflow-y:auto;

    padding:
        20px 20px 200px;

}

.chatInner{

    width:
        min(900px,100%);

    margin:auto;

}


/* =====================================================
   START
===================================================== */

.start{

    min-height:
        calc(100vh - 200px);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

}

.lumora{

    font-size:
        clamp(52px,8vw,76px);

    font-weight:bold;

    letter-spacing:-4px;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #9b72cb,
            #d96570,
            #fbbc04,
            #34a853,
            #4285f4
        );

    background-size:500% 500%;

    animation:
        rainbow 7s linear infinite;

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

}

.startText{

    color:#77777f;

    margin-top:8px;

}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    margin-bottom:28px;

}

.user{

    display:flex;

    justify-content:flex-end;

}

.userBubble{

    max-width:80%;

    padding:
        13px 17px;

    border-radius:
        22px 22px 5px 22px;

    background:#29292f;

    white-space:pre-wrap;

    line-height:1.5;

}

.aiHeader{

    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:10px;

    font-weight:bold;

}

.aiIcon{

    width:29px;
    height:29px;

    border-radius:9px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #4285f4,
            #9b72cb,
            #d96570
        );

}

.aiContent{

    color:#dedee3;

    line-height:1.6;

}


/* =====================================================
   SEARCH ANSWER
===================================================== */

.answerBox{

    padding:16px;

    border-radius:17px;

    background:#18181d;

    border:
        1px solid #2d2d34;

    margin-bottom:12px;

}

.answerTitle{

    font-size:17px;

    font-weight:bold;

    margin-bottom:9px;

}

.answerText{

    color:#d3d3d8;

    line-height:1.6;

}

.source{

    display:inline-block;

    margin-top:12px;

    color:#8ab4f8;

    text-decoration:none;

    font-size:12px;

}

.source:hover{

    text-decoration:underline;

}


/* =====================================================
   TOPICS
===================================================== */

.topicList{

    display:flex;

    flex-direction:column;

    gap:8px;

}

.topic{

    display:block;

    text-decoration:none;

    background:#18181d;

    border:
        1px solid #2b2b31;

    padding:14px;

    border-radius:14px;

}

.topic:hover{

    background:#202026;

}

.topicTitle{

    color:#8ab4f8;

    font-weight:bold;

    margin-bottom:5px;

}

.topicText{

    color:#bdbdc4;

    font-size:13px;

    line-height:1.5;

}


/* =====================================================
   IMAGE
===================================================== */

.resultImage{

    max-width:260px;

    max-height:180px;

    object-fit:cover;

    border-radius:14px;

    margin-bottom:14px;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    color:#9999a2;

    display:flex;

    align-items:center;

    gap:9px;

}

.dots{

    display:flex;

    gap:4px;

}

.dot{

    width:6px;
    height:6px;

    background:#888;

    border-radius:50%;

    animation:
        pulse 1s infinite alternate;

}

.dot:nth-child(2){

    animation-delay:.2s;

}

.dot:nth-child(3){

    animation-delay:.4s;

}


/* =====================================================
   ERROR
===================================================== */

.error{

    padding:15px;

    border-radius:15px;

    background:#21191b;

    border:
        1px solid #503136;

    color:#ddd;

}

.error strong{

    display:block;

    color:#f28b82;

    margin-bottom:6px;

}


/* =====================================================
   INPUT
===================================================== */

.inputArea{

    position:absolute;

    bottom:0;

    left:0;
    right:0;

    padding:
        15px 20px 20px;

    background:
        linear-gradient(
            to top,
            #0d0d10 70%,
            transparent
        );

}

.inputWrapper{

    width:
        min(850px,100%);

    margin:auto;

}

.inputBox{

    padding:5px;

    border-radius:30px;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #9b72cb,
            #d96570,
            #fbbc04,
            #34a853,
            #4285f4
        );

    background-size:500% 500%;

    animation:
        rainbow 7s linear infinite;

}

.inputInner{

    background:#17171b;

    border-radius:26px;

    padding:19px;

    min-height:150px;

}

textarea{

    width:100%;

    min-height:70px;

    max-height:130px;

    resize:none;

    border:0;

    outline:0;

    background:transparent;

    color:white;

    font-size:17px;

    font-family:inherit;

}

textarea::placeholder{

    color:#77777f;

}

.inputBottom{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-top:12px;

}

.buttons{

    display:flex;

    gap:8px;

}

.iconButton,
.sendButton{

    width:42px;
    height:42px;

    border:0;

    border-radius:50%;

    cursor:pointer;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

}

.iconButton{

    background:#27272d;

}

.iconButton:hover{

    background:#36363d;

}

.sendButton{

    background:
        linear-gradient(
            135deg,
            #4285f4,
            #9b72cb,
            #d96570
        );

    font-size:19px;

}

.sendButton:disabled{

    opacity:.5;

    cursor:wait;

}

#imageInput{

    display:none;

}

.status{

    height:18px;

    text-align:center;

    color:#77777f;

    font-size:11px;

    margin-top:7px;

}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes rainbow{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}

@keyframes pulse{

    from{
        opacity:.3;
    }

    to{
        opacity:1;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .sidebar{
        display:none;
    }

    .chat{
        padding:
            15px 12px 195px;
    }

    .inputArea{
        padding:
            10px;
    }

    .userBubble{
        max-width:90%;
    }

}

</style>

</head>

<body>

<div class="app">


<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">

        <div class="logoIcon">
            ✦
        </div>

        Lumora

    </div>


    <button
        class="newChat"
        onclick="newChat()"
    >
        ＋ Neuer Chat
    </button>


    <div class="sidebarTitle">
        VERLAUF
    </div>


    <div id="history">

        <div class="historyItem">
            Neuer Chat
        </div>

    </div>

</aside>


<!-- MAIN -->

<main class="main">


    <div class="topbar">

        <div class="model">
            Lumora 1.0 ▾
        </div>

    </div>


    <div
        id="chat"
        class="chat"
    >

        <div
            id="chatInner"
            class="chatInner"
        >

            <div
                id="start"
                class="start"
            >

                <div class="lumora">
                    Lumora
                </div>

                <div class="startText">
                    Deine kreative KI
                </div>

            </div>

        </div>

    </div>


    <!-- INPUT -->

    <div class="inputArea">

        <div class="inputWrapper">

            <div class="inputBox">

                <div class="inputInner">

                    <textarea
                        id="message"
                        placeholder="Frag Lumora etwas …"
                    ></textarea>


                    <div class="inputBottom">


                        <div class="buttons">

                            <label
                                class="iconButton"
                                for="imageInput"
                            >
                                🖼
                            </label>

                            <input
                                id="imageInput"
                                type="file"
                                accept="image/*"
                                multiple
                            >

                        </div>


                        <div class="buttons">

                            <button
                                class="sendButton"
                                id="sendButton"
                            >
                                ↑
                            </button>

                        </div>


                    </div>

                </div>

            </div>


            <div
                id="status"
                class="status"
            ></div>

        </div>

    </div>

</main>

</div>


<script>

/* =====================================================
   ELEMENTE
===================================================== */

const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const input =
    document.getElementById("message");

const send =
    document.getElementById("sendButton");

const status =
    document.getElementById("status");

const imageInput =
    document.getElementById("imageInput");


/* =====================================================
   USER
===================================================== */

function addUserMessage(text){

    const message =
        document.createElement("div");

    message.className =
        "message user";


    const bubble =
        document.createElement("div");

    bubble.className =
        "userBubble";

    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );


    chatInner.appendChild(
        message
    );


    scrollDown();

}


/* =====================================================
   AI
===================================================== */

function addAIMessage(){

    const message =
        document.createElement("div");

    message.className =
        "message";


    const header =
        document.createElement("div");

    header.className =
        "aiHeader";


    const icon =
        document.createElement("div");

    icon.className =
        "aiIcon";

    icon.textContent =
        "✦";


    const name =
        document.createElement("span");

    name.textContent =
        "Lumora";


    header.appendChild(
        icon
    );

    header.appendChild(
        name
    );


    const content =
        document.createElement("div");

    content.className =
        "aiContent";


    message.appendChild(
        header
    );

    message.appendChild(
        content
    );


    chatInner.appendChild(
        message
    );


    return content;

}


/* =====================================================
   LOADING
===================================================== */

function showLoading(){

    const content =
        addAIMessage();


    content.innerHTML = `

        <div class="loading">

            <span>Ich suche nach Informationen</span>

            <div class="dots">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

        </div>

    `;


    scrollDown();


    return content;

}


/* =====================================================
   ERGEBNISSE
===================================================== */

function renderResults(
    content,
    data
){

    content.innerHTML = "";


    if(data.image){

        const image =
            document.createElement("img");

        image.className =
            "resultImage";

        image.src =
            data.image.url;

        image.alt =
            data.heading ||
            "DuckDuckGo Ergebnis";


        image.onerror =
            () => image.remove();


        content.appendChild(
            image
        );

    }


    if(data.heading){

        const heading =
            document.createElement("div");

        heading.className =
            "answerTitle";

        heading.textContent =
            data.heading;

        content.appendChild(
            heading
        );

    }


    const answers =
        data.results.filter(
            item =>
                item.type === "answer" ||
                item.type === "abstract"
        );


    for(
        const item of answers
    ){

        const box =
            document.createElement("div");

        box.className =
            "answerBox";


        const title =
            document.createElement("div");

        title.className =
            "answerTitle";

        title.textContent =
            item.title;


        const text =
            document.createElement("div");

        text.className =
            "answerText";

        text.textContent =
            item.text;


        box.appendChild(
            title
        );

        box.appendChild(
            text
        );


        if(item.source){

            const source =
                document.createElement("a");

            source.className =
                "source";

            source.href =
                item.source;

            source.target =
                "_blank";

            source.rel =
                "noopener noreferrer";

            source.textContent =
                "Quelle öffnen ↗";


            box.appendChild(
                source
            );

        }


        content.appendChild(
            box
        );

    }


    const topics =
        data.results.filter(
            item =>
                item.type === "topic"
        );


    if(topics.length){

        const list =
            document.createElement("div");

        list.className =
            "topicList";


        for(
            const topic of topics
        ){

            const link =
                document.createElement("a");

            link.className =
                "topic";

            link.href =
                topic.source;

            link.target =
                "_blank";

            link.rel =
                "noopener noreferrer";


            const title =
                document.createElement("div");

            title.className =
                "topicTitle";

            title.textContent =
                topic.title;


            const text =
                document.createElement("div");

            text.className =
                "topicText";

            text.textContent =
                topic.text;


            link.appendChild(
                title
            );

            link.appendChild(
                text
            );


            list.appendChild(
                link
            );

        }


        content.appendChild(
            list
        );

    }


    if(
        data.results.length === 0
    ){

        const empty =
            document.createElement("div");

        empty.className =
            "answerBox";

        empty.textContent =
            "DuckDuckGo hat für diese Anfrage keine Instant-Answer-Daten zurückgegeben.";

        content.appendChild(
            empty
        );

    }


    const attribution =
        document.createElement("div");

    attribution.style.marginTop =
        "14px";

    attribution.style.color =
        "#77777f";

    attribution.style.fontSize =
        "11px";

    attribution.textContent =
        "Informationen von DuckDuckGo Instant Answers.";

    content.appendChild(
        attribution
    );

}


/* =====================================================
   FEHLER
===================================================== */

function renderError(
    content,
    message
){

    content.innerHTML = "";


    const box =
        document.createElement("div");

    box.className =
        "error";


    const title =
        document.createElement("strong");

    title.textContent =
        "Suche fehlgeschlagen";


    const text =
        document.createElement("span");

    text.textContent =
        message;


    box.appendChild(
        title
    );

    box.appendChild(
        text
    );


    content.appendChild(
        box
    );

}


/* =====================================================
   SUCHE
===================================================== */

async function search(
    query,
    content
){

    status.textContent =
        "Suche …";


    try{

        const response =
            await fetch(
                "/api/search?q=" +
                encodeURIComponent(
                    query
                )
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.error ||
                "Keine Antwort vom Suchserver."
            );

        }


        renderResults(
            content,
            data
        );


        status.textContent =
            "Antwort erhalten";


    }catch(error){

        console.error(
            error
        );


        renderError(
            content,
            error.message
        );


        status.textContent =
            "Suche beendet";

    }finally{

        send.disabled =
            false;

    }


    scrollDown();

}


/* =====================================================
   SENDEN
===================================================== */

async function sendMessage(){

    const query =
        input.value.trim();


    if(!query){

        input.focus();

        return;

    }


    const start =
        document.getElementById(
            "start"
        );


    if(start){

        start.remove();

    }


    addUserMessage(
        query
    );


    input.value = "";


    send.disabled =
        true;


    const ai =
        showLoading();


    await search(
        query,
        ai
    );


    input.focus();

}


/* =====================================================
   ENTER
===================================================== */

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   BUTTON
===================================================== */

send.addEventListener(
    "click",
    sendMessage
);


/* =====================================================
   IMAGE
===================================================== */

imageInput.addEventListener(
    "change",
    () => {

        if(
            imageInput.files.length
        ){

            const ai =
                addAIMessage();

            ai.textContent =
                "🖼️ Bild ausgewählt. Die Bildanalyse ist in dieser Version noch nicht angeschlossen.";

        }

    }
);


/* =====================================================
   NEUER CHAT
===================================================== */

function newChat(){

    chatInner.innerHTML = `

        <div
            id="start"
            class="start"
        >

            <div class="lumora">
                Lumora
            </div>

            <div class="startText">
                Deine kreative KI
            </div>

        </div>

    `;


    input.value = "";

    status.textContent = "";

    chat.scrollTop = 0;

    input.focus();

}


/* =====================================================
   SCROLL
===================================================== */

function scrollDown(){

    setTimeout(
        () => {

            chat.scrollTop =
                chat.scrollHeight;

        },
        50
    );

}

</script>

</body>

</html>
