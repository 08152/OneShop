<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>3D Cyber-Matrix Map View</title>
    <!-- JSZip für den automatischen Download aller Projektdateien -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { margin:0; overflow:hidden; background:black; font-family:Arial, sans-serif; }
        canvas { display:block; }
        
        #hud {
            position:absolute; top:20px; left:20px; color:white; z-index:10;
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; border: 1px solid #00d2ff;
        }
        #routing-panel {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            background: rgba(5,5,10,0.85); padding: 20px; border-radius: 12px;
            border: 1px solid #00d2ff; width: 260px; color: white;
        }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; margin-bottom: 4px; font-size: 11px; color: #8a99ad; text-transform: uppercase; }
        .input-group select { width: 100%; padding: 8px; background: #0c0d14; border: 1px solid #00d2ff; border-radius: 6px; color: white; }
        
        #btn-route { width: 100%; background: linear-gradient(135deg, #0052d4, #4364f7); color: white; border: none; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        #btn-download { width: 100%; background: linear-gradient(135deg, #e67e22, #d35400); color: white; border: none; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        
        #results { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(0,210,255,0.3); display: none; }
        .result-line { margin-bottom: 8px; font-size: 14px; display: flex; justify-content: space-between; }
        .result-val { font-weight: bold; color: #00d2ff; }
    </style>
</head>
<body>

    <div id="hud">
        <b>Steuerung:</b><br>
        • WASD = Bewegen<br>
        • Mausbewegung = Umschauen<br>
        • Klick auf Bildschirm = Aktivieren
    </div>

    <div id="routing-panel">
        <h3 style="margin-top:0; color:#00d2ff;">3D Navigator</h3>
        <div class="input-group">
            <label>Start-Ort:</label>
            <select id="start-city">
                <option value="52.520,13.404">Berlin</option>
                <option value="48.137,11.575">München</option>
                <option value="53.551,9.993">Hamburg</option>
            </select>
        </div>
        <div class="input-group">
            <label>Ziel-Ort:</label>
            <select id="target-city">
                <option value="48.137,11.575">München</option>
                <option value="52.520,13.404">Berlin</option>
                <option value="53.551,9.993">Hamburg</option>
            </select>
        </div>
        <button id="btn-route" onclick="trigger3DMapping()">ROUTE PLANEN</button>
        <button id="btn-download" onclick="downloadOfflineZip()">OFFLINE ZIP LADEN</button>

        <div id="results">
            <div class="result-line"><span>Distanz:</span> <span id="res-km" class="result-val">-</span></div>
            <div class="result-line"><span>Fahrzeit:</span> <span id="res-time" class="result-val">-</span></div>
        </div>
    </div>

    <!-- Three.js Einbindung analog zu Ihrem funktionierenden Skript -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="script.js"></script>
    <script src="map.js"></script>
</body>
</html>
