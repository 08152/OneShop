<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WinOS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="desktop">

    <div class="icon" id="syntax">
        <div class="icon-box"></div>
        <span>SyntaxVoid.exe</span>
    </div>

</div>

<div id="popup" class="hidden">

    <div class="window">

        <div class="titlebar">
            SYSTEM WARNUNG: Kritischer Prozesszugriff
        </div>

        <div class="content">

            <p>
            Die Anwendung <b>"SyntaxVoid.exe"</b> versucht,
            direkten Zugriff auf den Kernel-Treiber von
            WinOS zuzulassen.
            </p>

            <p>
            Möchten Sie der Anwendung
            erweiterte Systemrechte gewähren?
            </p>

            <div class="buttons">

                <button id="allow">
                    Zulassen
                </button>

                <button id="cancel">
                    Abbrechen
                </button>

            </div>

        </div>

    </div>

</div>

<div id="terminal" class="hidden">

<canvas id="matrix"></canvas>

</div>

<script src="script.js"></script>

</body>
</html>
