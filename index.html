<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainingsdaten-Extraktor</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; line-height: 1.6; background-color: #f4f7f6; color: #333; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input[type="text"] { width: 70%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 12px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; background-color: #007bff; color: white; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .download-btn { background-color: #28a745; margin-top: 15px; display: none; width: 100%; text-align: center; }
        .download-btn:hover { background-color: #218838; }
        .result-box { margin-top: 25px; padding: 20px; border: 1px solid #e0e0e0; background: #fafafa; border-radius: 4px; display: none; }
        .error { color: #dc3545; font-weight: bold; }
        pre { background: #eee; padding: 10px; overflow-x: auto; border-radius: 4px; max-height: 200px; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 Trainingsdaten-Generator</h1>
    <p>Gib einen Begriff ein, um Webinhalte zu extrahieren und als JSON-Datensatz für KI-Training herunterzuladen:</p>

    <form id="searchForm">
        <input type="text" id="searchQuery" placeholder="Thema für Trainingsdaten..." required>
        <button type="submit">Daten extrahieren</button>
    </form>

    <!-- Download-Button wird erst nach erfolgreichem Scrape sichtbar -->
    <button id="downloadBtn" class="download-btn">📥 Trainingsdaten als JSON herunterladen</button>

    <div id="result" class="result-box"></div>
</div>

<script>
    // Variable, die die rohen, ungekürzten Daten speichert
    let currentScrapedData = null;

    document.getElementById('searchForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const searchQuery = document.getElementById('searchQuery').value;
        const resultDiv = document.getElementById('result');
        const downloadBtn = document.getElementById('downloadBtn');
        
        // UI zurücksetzen
        downloadBtn.style.display = 'none';
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '<em>Generiere Trainingsdaten aus dem Web... (Bitte warten)</em>';

        try {
            const response = await fetch('/api/scrape', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ searchQuery })
            });

            const data = await response.json();

            if (!data.success) {
                resultDiv.innerHTML = `<p class="error">Fehler: ${data.error}</p>`;
                return;
            }

            // Gesamtes JSON-Objekt für den späteren Download sichern
            currentScrapedData = data;
            downloadBtn.style.display = 'block';

            // Vorschau in der Oberfläche anzeigen
            resultDiv.innerHTML = `
                <h3>Erfolg: Daten extrahiert</h3>
                <p><strong>Ziel-Quelle:</strong> <a href="${data.sourceUrl}" target="_blank">${data.sourceUrl}</a></p>
                <p><strong>Stichprobe des Texts:</strong> ${data.preview}</p>
                <h4>Struktur-Vorschau der JSON:</h4>
                <pre>${JSON.stringify({ title: data.title, headers: data.headers }, null, 2)}</pre>
            `;

        } catch (err) {
            resultDiv.innerHTML = '<p class="error">Verbindungsfehler zum Backend-Server.</p>';
        }
    });

    // Download-Logik für extrem lange JSON-Dateien
    document.getElementById('downloadBtn').addEventListener('click', () => {
        if (!currentScrapedData) return;

        // Erstellt einen virtuellen Blob aus den JSON-Daten im Speicher
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentScrapedData, null, 2));
        
        // Erstellt ein unsichtbares Download-Element im HTML
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        
        // Generiert einen sauberen Dateinamen basierend auf dem Suchbegriff
        const fileName = `trainingsdaten_${currentScrapedData.title.toLowerCase().replace(/[^a-z0-9]/g, '_')}.json`;
        downloadAnchorNode.setAttribute("download", fileName);
        
        // Klickt das Element automatisch an und entfernt es wieder
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
    });
</script>

</body>
</html>
