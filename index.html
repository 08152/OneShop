<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weltkarte mit Navigation</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

#map{
    width:100%;
    height:100%;
}

#menu{
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
    background:white;
    padding:12px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
    width:260px;
}

#menu h2{
    margin:0 0 10px;
    font-size:18px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:8px;
    margin-bottom:8px;
}

button{
    width:100%;
    padding:10px;
    margin-top:5px;
    cursor:pointer;
    border:none;
    border-radius:6px;
    background:#2d89ef;
    color:white;
    font-size:15px;
}

button:hover{
    background:#1b5fbf;
}
</style>
</head>
<body>

<div id="menu">
    <h2>🗺 Navigation</h2>

    <input id="start" placeholder="Start (z.B. München)">
    <input id="ziel" placeholder="Ziel (z.B. Berlin)">

    <button onclick="routeBerechnen()">Route berechnen</button>
    <button onclick="meinStandort()">📍 Mein Standort</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script>

const map = L.map("map").setView([20,0],2);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:"© OpenStreetMap"
}).addTo(map);

let routingControl=null;
let marker=null;

async function sucheOrt(name){

    const url=`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(name)}`;

    const daten=await fetch(url,{
        headers:{
            "Accept":"application/json"
        }
    });

    const json=await daten.json();

    if(json.length===0){
        throw "Ort nicht gefunden.";
    }

    return L.latLng(json[0].lat,json[0].lon);
}

async function routeBerechnen(){

    const start=document.getElementById("start").value.trim();
    const ziel=document.getElementById("ziel").value.trim();

    if(start===""||ziel===""){
        alert("Bitte Start und Ziel eingeben.");
        return;
    }

    try{

        const startPos=await sucheOrt(start);
        const zielPos=await sucheOrt(ziel);

        if(routingControl){
            map.removeControl(routingControl);
        }

        routingControl=L.Routing.control({
            waypoints:[
                startPos,
                zielPos
            ],
            routeWhileDragging:true,
            addWaypoints:true,
            draggableWaypoints:true,
            fitSelectedRoutes:true,
            show:true
        }).addTo(map);

    }catch(e){
        alert(e);
    }

}

function meinStandort(){

    if(!navigator.geolocation){
        alert("Geolocation wird nicht unterstützt.");
        return;
    }

    navigator.geolocation.getCurrentPosition(function(pos){

        const lat=pos.coords.latitude;
        const lon=pos.coords.longitude;

        map.setView([lat,lon],14);

        if(marker){
            map.removeLayer(marker);
        }

        marker=L.marker([lat,lon]).addTo(map);

        marker.bindPopup("📍 Dein Standort").openPopup();

        document.getElementById("start").value=lat+","+lon;

    },function(){
        alert("Standort konnte nicht bestimmt werden.");
    });

}

</script>

</body>
</html>
