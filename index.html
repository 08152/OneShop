<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokaler Video KI Controller</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 20px; background-color: #1e1e1e; color: #f5f5f5; }
        .card { background: #2d2d2d; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px; border: 1px solid #3d3d3d; }
        .flex { display: flex; gap: 10px; margin-bottom: 10px; }
        input, textarea, select { flex: 1; padding: 10px; border: 1px solid #444; border-radius: 4px; font-size: 14px; background: #1e1e1e; color: white; }
        button { padding: 10px 15px; border: none; border-radius: 4px; background-color: #007bff; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        button.delete { background-color: #dc3545; }
        .status-container { background: #252526; padding: 15px; border-radius: 4px; margin-top: 20px; border-left: 4px solid #007bff; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 15px; }
        .video-box { background: #333; padding: 10px; border-radius: 6px; border: 1px solid #444; text-align: center; }
        video { width: 100%; border-radius: 4px; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>Lokale Video-KI (Ohne API)</h1>
    <p style="color: #aaa;">Generiert Videos direkt über deine lokale Grafikkarte.</p>
    
    <div class="card">
        <h3>Szenen-Konfigurator</h3>
        <div id="linksContainer"></div>
        <button onclick="addScene()">+ Neue Szene einfügen</button>
    </div>

    <div class="card">
        <button onclick="sendToLocalAI()" style="background-color: #28a745; font-size: 16px; padding: 12px 24px; width: 100%;">Lokal auf Grafikkarte berechnen</button>
    </div>

    <div class="card status-container" id="statusSection" style="display:none;">
        <h3>Lokaler GPU-Status</h3>
        <p id="globalStatus">Warte auf GPU-Antwort...</p>
        <div class="video-grid" id="videoGrid"></div>
    </div>

    <script>
        window.onload = function() { addScene(); };

        function addScene() {
            const container = document.getElementById('linksContainer');
            const sceneId = Date.now();
            
            container.insertAdjacentHTML('beforeend', `
                <div class="scene-item card" id="scene_${sceneId}" style="background: #252526;">
                    <div class="flex">
                        <input type="url" class="scene-url" placeholder="Optional: Lokaler Bildpfad / URL">
                        <button class="delete" onclick="document.getElementById('scene_${sceneId}').remove()">X</button>
                    </div>
                    <div class="flex">
                        <textarea class="scene-prompt" placeholder="Beschreibe die Bewegung für die lokale KI..." rows="2" required></textarea>
                    </div>
                </div>
            `);
        }

        async function sendToLocalAI() {
            const scenes = [];
            const urls = document.querySelectorAll('.scene-url');
            const prompts = document.querySelectorAll('.scene-prompt');

            prompts.forEach((p, i) => {
                if(p.value.trim() !== "") {
                    scenes.push({ scene_number: i+1, source_url: urls[i].value.trim(), ai_prompt: p.value.trim() });
                }
            });

            if(scenes.length === 0) return alert("Bitte Prompt ausfüllen.");

            document.getElementById('statusSection').style.display = 'block';
            document.getElementById('globalStatus').innerText = "Verbinde mit lokaler GPU...";
            document.getElementById('videoGrid').innerHTML = "";

            try {
                const res = await fetch('/api/generate-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ timeline: scenes })
                });
                const result = await res.json();
                
                if(result.error) throw new Error(result.error);

                document.getElementById('globalStatus').innerText = "Grafikkarte rendert... Bitte Fenster nicht schließen.";
                
                result.tasks.forEach(task => {
                    document.getElementById('videoGrid').insertAdjacentHTML('beforeend', `
                        <div class="video-box" id="task_${task.generation_id}">
                            <strong>Szene ${task.scene_number}</strong>
                            <div class="status-lbl" style="color: #ffc107; font-weight:bold; margin-top:5px;">Berechne Frames...</div>
                        </div>
                    `);
                    trackLocalStatus(task.generation_id);
                });
            } catch (e) {
                document.getElementById('globalStatus').innerText = "Fehler: " + e.message;
            }
        }

        function trackLocalStatus(id) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/generation-status/${id}`);
                    const data = await res.json();
                    const box = document.getElementById(`task_${id}`);
                    const label = box.querySelector('.status-lbl');

                    if (data.status === 'completed') {
                        clearInterval(interval);
                        label.style.color = '#28a745';
                        label.innerText = "Fertig!";
                        box.insertAdjacentHTML('beforeend', `<video src="${data.video_url || 'https://w3schools.com'}" controls autoplay loop></video>`);
                    }
                } catch (e) { console.log(e); }
            }, 4000);
        }
    </script>
</body>
</html>
