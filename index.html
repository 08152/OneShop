<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI Song Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #090a0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #12141d;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            text-align: center;
            width: 400px;
            border: 1px solid #1f2233;
        }
        h1 { font-size: 24px; margin-bottom: 5px; color: #ff007f; }
        p { color: #a0a5c0; font-size: 14px; margin-top: 0; }
        button {
            background: #ff007f; color: white; border: none; padding: 15px 30px;
            font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer;
            transition: 0.2s; box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            width: 100%; margin-top: 15px;
        }
        button:hover { background: #ff3399; transform: translateY(-2px); }
        button:disabled { background: #444; color: #888; box-shadow: none; cursor: not-allowed; }
        .status-box {
            margin-top: 25px; background: #1a1d29; padding: 20px;
            border-radius: 12px; font-size: 14px; text-align: left; border-left: 4px solid #ff007f;
        }
        audio { width: 100%; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>KI Song-Generator</h1>
    <p>Komponiert eine neue MP3 direkt auf dem Server</p>
    
    <button id="genBtn" onclick="generateNewSong()">Neuen Song komponieren</button>
    
    <div class="status-box">
        <div>Status: <span id="statusTxt" style="font-weight:bold;">Bereit</span></div>
    </div>

    <!-- Nativer Player für die fertige Datei -->
    <audio id="audioPlayer" controls></audio>
</div>

<script>
    async function generateNewSong() {
        const btn = document.getElementById('genBtn');
        const status = document.getElementById('statusTxt');
        const player = document.getElementById('audioPlayer');

        btn.disabled = true;
        player.style.display = "none";
        player.pause();
        status.innerText = "Die KI schneidet und fusioniert Daten...";

        try {
            const res = await fetch('/api/generate-new-song', { method: 'POST' });
            const data = await res.json();

            if (data.error) {
                status.innerText = "Fehler!";
                alert(data.error);
                btn.disabled = false;
                return;
            }

            status.innerText = "Song erfolgreich erstellt!";
            btn.disabled = false;

            // Cache-Buster anhängen (?t=...), damit der Browser die Datei wirklich neu lädt
            player.src = `/${data.filename}?t=${new Date().getTime()}`;
            player.style.display = "block";
            player.play();

        } catch (err) {
            status.innerText = "Verbindungsfehler!";
            btn.disabled = false;
            console.error(err);
        }
    }
</script>

</body>
</html>
