<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVI → MP4 Konverter</title>

<style>
body{
    margin:0;
    background:#111827;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.box{
    width:90%;
    max-width:500px;
    background:#1f2937;
    padding:30px;
    border-radius:15px;
    text-align:center;
}
input[type=file]{
    width:100%;
    padding:15px;
    background:#374151;
    color:white;
    border-radius:8px;
    margin:20px 0;
}
button{
    width:100%;
    padding:15px;
    background:#facc15;
    border:none;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    background:#eab308;
}
progress{
    width:100%;
    height:25px;
    margin-top:20px;
}
#status{
    margin-top:20px;
}
</style>

</head>
<body>

<div class="box">

<h1>AVI → MP4</h1>

<p>Datei auswählen und konvertieren.</p>

<input id="video" type="file" accept=".avi">

<button onclick="upload()">Konvertieren</button>

<progress id="progress" value="0" max="100"></progress>

<div id="status">Bereit.</div>

</div>

<script>

async function upload(){

const file=document.getElementById("video").files[0];

if(!file){
alert("Bitte eine AVI-Datei auswählen.");
return;
}

const status=document.getElementById("status");
const progress=document.getElementById("progress");

const form=new FormData();

form.append("video",file);

status.innerHTML="Datei wird hochgeladen...";

const xhr=new XMLHttpRequest();

xhr.open("POST","/convert",true);

xhr.upload.onprogress=function(e){

if(e.lengthComputable){

progress.value=(e.loaded/e.total)*100;

}

};

xhr.responseType="blob";

xhr.onload=function(){

if(xhr.status===200){

const blob=xhr.response;

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download=file.name.replace(/\.[^/.]+$/,"")+".mp4";

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

URL.revokeObjectURL(url);

status.innerHTML="✅ Fertig!";

progress.value=100;

}else{

status.innerHTML="❌ Fehler bei der Konvertierung.";

}

};

xhr.onerror=function(){

status.innerHTML="❌ Server nicht erreichbar.";

};

xhr.send(form);

}

</script>

</body>
</html>
