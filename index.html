<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<title>GHOST ISLAND 3D</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#75caff;
font-family:Arial;
}

canvas{
display:block;
}


/* =========================
   HUD
========================= */

#hud{
position:absolute;
top:15px;
left:15px;
color:white;
z-index:10;
font-size:15px;
text-shadow:0 2px 5px black;
pointer-events:none;
}

#hud b{
font-size:24px;
}


/* =========================
   CROSSHAIR
========================= */

#crosshair{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
color:white;
font-size:25px;
font-weight:bold;
z-index:10;
text-shadow:0 0 5px black;
pointer-events:none;
}


/* =========================
   BUTTONS
========================= */

#controls{
position:absolute;
left:20px;
bottom:20px;
z-index:20;
display:grid;
grid-template-columns:70px 70px 70px;
grid-template-rows:70px 70px 70px;
gap:7px;
}

.control{
width:70px;
height:70px;
border:2px solid rgba(255,255,255,.7);
border-radius:15px;
background:rgba(0,0,0,.45);
color:white;
font-size:25px;
font-weight:bold;
user-select:none;
-webkit-user-select:none;
touch-action:none;
}

.control:active{
background:rgba(255,255,255,.35);
transform:scale(.94);
}

#up{
grid-column:2;
grid-row:1;
}

#left{
grid-column:1;
grid-row:2;
}

#down{
grid-column:2;
grid-row:2;
}

#right{
grid-column:3;
grid-row:2;
}

#jump{
position:absolute;
right:25px;
bottom:30px;
z-index:20;
width:100px;
height:100px;
border-radius:50%;
border:2px solid white;
background:rgba(0,0,0,.45);
color:white;
font-size:18px;
font-weight:bold;
touch-action:none;
}

#jump:active{
transform:scale(.94);
background:rgba(255,255,255,.35);
}


/* =========================
   MENU
========================= */

#menu{
position:absolute;
inset:0;
z-index:100;
background:rgba(0,0,0,.6);
display:flex;
align-items:center;
justify-content:center;
}

#menuBox{
width:380px;
max-width:85%;
background:#20252a;
border-radius:20px;
padding:30px;
text-align:center;
color:white;
box-shadow:0 15px 60px black;
}

#menuBox h1{
font-size:40px;
margin:0 0 10px;
}

#seed{
background:#111;
padding:10px;
border-radius:8px;
font-family:monospace;
margin:15px 0;
}

.menuButton{
width:100%;
padding:15px;
border:0;
border-radius:10px;
margin-top:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#startButton{
background:#42d35b;
}

#newButton{
background:#e2a72c;
}

</style>
</head>


<body>


<!-- =========================
     HUD
========================= -->

<div id="hud">

<b>GHOST ISLAND</b><br>

WASD / Buttons = Bewegen<br>
SPACE / SPRINGEN = Springen<br>
Klick = Maus aktivieren<br>

Position:
<span id="position">0 / 0</span>

</div>


<div id="crosshair">+</div>


<!-- =========================
     MOVEMENT BUTTONS
========================= -->

<div id="controls">

<button class="control" id="up">▲</button>

<button class="control" id="left">◀</button>

<button class="control" id="down">▼</button>

<button class="control" id="right">▶</button>

</div>


<button id="jump">
SPRINGEN
</button>


<!-- =========================
     MENU
========================= -->

<div id="menu">

<div id="menuBox">

<h1>GHOST ISLAND</h1>

<p>
Riesige zufällig generierte 3D-Insel
</p>

<p>
Die Welt bleibt auf diesem Gerät gespeichert.
</p>

<div id="seed">
Seed...
</div>

<button
class="menuButton"
id="startButton">

SPIEL STARTEN

</button>

<button
class="menuButton"
id="newButton">

NEUE WELT GENERIEREN

</button>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>


// ======================================================
// SEED
// ======================================================

let savedSeed =
localStorage.getItem(
"GHOST_ISLAND_SEED"
);

if(!savedSeed){

savedSeed =
Math.floor(
Math.random()*2147483647
);

localStorage.setItem(
"GHOST_ISLAND_SEED",
savedSeed
);

}

let seed =
Number(savedSeed);


document.getElementById("seed").innerText =
"SEED: "+savedSeed;


// ======================================================
// RANDOM
// ======================================================

function random(){

seed =
(seed*1664525+1013904223)
>>>0;

return seed/4294967296;

}


// ======================================================
// SCENE
// ======================================================

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(
0x75caff
);


// ======================================================
// CAMERA
// ======================================================

const camera =
new THREE.PerspectiveCamera(

75,

innerWidth/
innerHeight,

0.1,

3000

);


// ======================================================
// RENDERER
// ======================================================

const renderer =
new THREE.WebGLRenderer({

antialias:true

});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
renderer.domElement
);


// ======================================================
// LICHT
// ======================================================

scene.add(

new THREE.AmbientLight(
0xffffff,
0.9
)

);


const mainLight =
new THREE.DirectionalLight(
0xffffff,
1.5
);

mainLight.position.set(
500,
1000,
500
);

mainLight.castShadow=true;

scene.add(mainLight);


const fillLight =
new THREE.PointLight(
0xffffff,
1
);

fillLight.position.set(
0,
100,
0
);

scene.add(fillLight);


// ======================================================
// MAP
// ======================================================

const MAP_SIZE =
12000;

const WATER_LEVEL =
5;

const SEGMENTS =
180;


// ======================================================
// TERRAIN HÖHE
// ======================================================

function terrainHeight(x,z){

const distance =
Math.sqrt(
x*x+z*z
);


const island =
Math.max(
0,
1-distance/5700
);


let h=15;


// große Berge

h +=
Math.sin(
x*.0015
)*
Math.cos(
z*.0017
)*
120;


// Hügel

h +=
Math.sin(
x*.004+
z*.003
)*
45;


// kleine Unebenheiten

h +=
Math.sin(
x*.012-
z*.009
)*
12;


// Berge

h +=
Math.max(
0,
Math.sin(x*.0008)*
Math.cos(z*.001)
)*
200;


h*=island;


if(h<WATER_LEVEL)
h=WATER_LEVEL-4;


return h;

}


// ======================================================
// TERRAIN
// ======================================================

const terrainGeometry =
new THREE.PlaneGeometry(

MAP_SIZE,
MAP_SIZE,

SEGMENTS,
SEGMENTS

);

terrainGeometry.rotateX(
-Math.PI/2
);


const vertices =
terrainGeometry.attributes.position;


for(
let i=0;
i<vertices.count;
i++
){

const x =
vertices.getX(i);

const z =
vertices.getZ(i);


vertices.setY(
i,
terrainHeight(x,z)
);

}


terrainGeometry.computeVertexNormals();


const terrain =
new THREE.Mesh(

terrainGeometry,

new THREE.MeshStandardMaterial({

color:0x4c9b43,

roughness:1

})

);


terrain.receiveShadow=true;

scene.add(terrain);


// ======================================================
// WASSER
// ======================================================

const waterGeometry =
new THREE.PlaneGeometry(

15000,
15000,

160,
160

);

waterGeometry.rotateX(
-Math.PI/2
);


const waterMaterial =
new THREE.MeshPhysicalMaterial({

color:0x168dcc,

transparent:true,

opacity:.62,

roughness:.08,

metalness:.05,

transmission:.15,

clearcoat:1,

clearcoatRoughness:.05

});


const water =
new THREE.Mesh(

waterGeometry,
waterMaterial

);

water.position.y =
WATER_LEVEL;

scene.add(water);


// ======================================================
// WASSER WELLE
// ======================================================

const waterPositions =
waterGeometry.attributes.position;


const waterOriginal=[];


for(
let i=0;
i<waterPositions.count;
i++
){

waterOriginal.push({

x:waterPositions.getX(i),

z:waterPositions.getZ(i)

});

}


function updateWater(time){

for(
let i=0;
i<waterPositions.count;
i++
){

const p =
waterOriginal[i];


const wave =

Math.sin(
p.x*.018+
time*.0012
)*1.2

+

Math.cos(
p.z*.015+
time*.001
)*.9

+

Math.sin(
(p.x+p.z)*.008+
time*.0008
)*.7;


waterPositions.setY(
i,
wave
);

}


waterPositions.needsUpdate=true;

}


// ======================================================
// BAUM
// ======================================================

function createTree(x,z){

const y =
terrainHeight(x,z);


if(y<WATER_LEVEL+4)
return;


const tree =
new THREE.Group();


const height =
35+
random()*45;


const trunkSize =
2+
random()*2;


// ------------------------------------------------------
// STAMM
// ------------------------------------------------------

const trunk =
new THREE.Mesh(

new THREE.CylinderGeometry(

trunkSize*.75,
trunkSize,
height,
9

),

new THREE.MeshStandardMaterial({

color:0x57351f,
roughness:1

})

);

trunk.position.y =
height/2;

trunk.castShadow=true;

tree.add(trunk);


// ------------------------------------------------------
// ÄSTE
// ------------------------------------------------------

const branchCount =
8+
Math.floor(
random()*8
);


for(
let i=0;
i<branchCount;
i++
){

const angle =
random()*Math.PI*2;


const branchHeight =
height*.25+
random()*height*.55;


const length =
10+
random()*25;


const branch =
new THREE.Mesh(

new THREE.CylinderGeometry(

.45,
1.2,
length,
7

),

new THREE.MeshStandardMaterial({

color:0x56341f

})

);


branch.position.set(

Math.cos(angle)*
length*.3,

branchHeight,

Math.sin(angle)*
length*.3

);


branch.rotation.z =
Math.PI/2-
(.25+
random()*.55);

branch.rotation.y =
-angle;


branch.castShadow=true;

tree.add(branch);


// ------------------------------------------------------
// KLEINE ÄSTE
// ------------------------------------------------------

for(
let j=0;
j<3+
Math.floor(random()*3);
j++
){

const smallAngle =
angle+
(random()-.5)*1.4;


const smallLength =
5+
random()*10;


const small =
new THREE.Mesh(

new THREE.CylinderGeometry(

.2,
.65,
smallLength,
6

),

new THREE.MeshStandardMaterial({

color:0x5a3822

})

);


small.position.set(

Math.cos(angle)*
length*.6,

branchHeight+
random()*4,

Math.sin(angle)*
length*.6

);


small.rotation.z =
Math.PI/2-
(.3+
random()*.6);

small.rotation.y =
-smallAngle;


tree.add(small);


// --------------------------------------------------
// BLÄTTER
// --------------------------------------------------

const leaves =
new THREE.Mesh(

new THREE.IcosahedronGeometry(

4+
random()*6,

1

),

new THREE.MeshStandardMaterial({

color:
new THREE.Color(

0.04+
random()*.1,

0.30+
random()*.25,

0.07+
random()*.1

),

roughness:1

})

);


leaves.position.set(

small.position.x+
Math.cos(smallAngle)*
smallLength*.7,

small.position.y+
2+
random()*6,

small.position.z+
Math.sin(smallAngle)*
smallLength*.7

);


leaves.scale.set(

.9+
random()*.7,

.8+
random()*.6,

.9+
random()*.7

);


leaves.castShadow=true;

tree.add(leaves);

}

}


// ------------------------------------------------------
// WURZELN
// ------------------------------------------------------

for(
let i=0;
i<5;
i++
){

const angle =
random()*Math.PI*2;


const root =
new THREE.Mesh(

new THREE.CylinderGeometry(

.3,
1,

6+
random()*5,

7

),

new THREE.MeshStandardMaterial({

color:0x50301c

})

);


root.position.set(

Math.cos(angle)*3,

2,

Math.sin(angle)*3

);


root.rotation.z =
Math.cos(angle)*.7;

root.rotation.x =
Math.sin(angle)*.7;


tree.add(root);

}


// ------------------------------------------------------
// POSITION
// ------------------------------------------------------

tree.position.set(
x,
y,
z
);


tree.rotation.y =
random()*Math.PI*2;


const scale =
.75+
random()*.55;


tree.scale.setScalar(
scale
);


scene.add(tree);

}


// ======================================================
// BÄUME GENERIEREN
// ======================================================

for(
let i=0;
i<700;
i++
){

createTree(

(random()-.5)*
10500,

(random()-.5)*
10500

);

}


// ======================================================
// PLAYER
// ======================================================

const player =
new THREE.Object3D();

scene.add(player);


// GENAU WIE DEIN CODE

player.position.set(
0,
terrainHeight(0,0),
0
);

camera.position.y=2;

player.add(camera);


// ======================================================
// PHYSICS
// ======================================================

let velocity =
new THREE.Vector3();

let gravity=.03;

let canJump=false;

let keys={};


// ======================================================
// TASTATUR
// ======================================================

document.onkeydown=(e)=>{

keys[
e.key.toLowerCase()
]=true;


if(
e.code==="Space" &&
canJump
){

velocity.y=.9;

canJump=false;

}

};


document.onkeyup=(e)=>{

keys[
e.key.toLowerCase()
]=false;

};


// ======================================================
// BUTTON-STEUERUNG
// ======================================================

function buttonKey(
button,
key
){

const b =
document.getElementById(
button
);


function down(e){

e.preventDefault();

keys[key]=true;

}


function up(e){

e.preventDefault();

keys[key]=false;

}


b.addEventListener(
"pointerdown",
down
);

b.addEventListener(
"pointerup",
up
);

b.addEventListener(
"pointercancel",
up
);

b.addEventListener(
"pointerleave",
up
);

}


buttonKey("up","w");
buttonKey("down","s");
buttonKey("left","a");
buttonKey("right","d");


// Springen

const jumpButton =
document.getElementById(
"jump"
);


function jump(){

if(canJump){

velocity.y=.9;

canJump=false;

}

}


jumpButton.addEventListener(
"pointerdown",
(e)=>{

e.preventDefault();

jump();

}
);


// ======================================================
// MAUS
// ======================================================

let rx=0;
let ry=0;


document.body.onclick=()=>{

if(
!document.pointerLockElement
){

document.body.requestPointerLock();

}

};


document.onmousemove=(e)=>{

if(
document.pointerLockElement
){

ry -=
e.movementX*.002;

rx -=
e.movementY*.002;


rx =
Math.max(
-1.5,
Math.min(
1.5,
rx
)
);


camera.rotation.x=rx;

player.rotation.y=ry;

}

};


// ======================================================
// UPDATE
// ======================================================

function update(){

let dir =
new THREE.Vector3();


if(keys.w)
dir.z-=1;

if(keys.s)
dir.z+=1;

if(keys.a)
dir.x-=1;

if(keys.d)
dir.x+=1;


if(dir.length()>0)
dir.normalize();


dir.applyAxisAngle(

new THREE.Vector3(0,1,0),

player.rotation.y

);


const speed =
keys.shift
? .38
: .2;


velocity.x +=
dir.x*speed;

velocity.z +=
dir.z*speed;


velocity.x*=.85;

velocity.z*=.85;


velocity.y-=gravity;


player.position.add(
velocity
);


// Boden

const ground =
terrainHeight(

player.position.x,
player.position.z

);


if(
player.position.y<
ground
){

player.position.y=
ground;

velocity.y=0;

canJump=true;

}


document.getElementById(
"position"
).innerText=

Math.round(
player.position.x
)
+
" / "+
Math.round(
player.position.z
);

}


// ======================================================
// START
// ======================================================

document.getElementById(
"startButton"
).onclick=()=>{

document.getElementById(
"menu"
).style.display="none";

document.body.requestPointerLock();

};


// ======================================================
// NEUE WELT
// ======================================================

document.getElementById(
"newButton"
).onclick=()=>{

const newSeed =
Math.floor(
Math.random()*2147483647
);


localStorage.setItem(
"GHOST_ISLAND_SEED",
newSeed
);


location.reload();

};


// ======================================================
// LOOP
// ======================================================

function animate(time){

requestAnimationFrame(
animate
);

update();

updateWater(time);

renderer.render(
scene,
camera
);

}


animate(0);


// ======================================================
// RESIZE
// ======================================================

window.onresize=()=>{

camera.aspect=
innerWidth/
innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

};

</script>

</body>
</html>
