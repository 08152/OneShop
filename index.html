<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHOST Island 3D Terrain Editor</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#86cfff;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#topbar{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    height:58px;
    z-index:20;

    display:flex;
    align-items:center;
    gap:7px;

    padding:7px 10px;

    background:rgba(20,24,29,.96);
    color:white;

    border-radius:12px;
    box-shadow:0 5px 25px #0008;

    overflow-x:auto;
}

#logo{
    font-size:19px;
    font-weight:bold;
    white-space:nowrap;
    margin-right:10px;
}

button{
    border:0;
    border-radius:8px;
    padding:9px 12px;

    background:#35404a;
    color:white;

    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
}

button:hover{
    background:#4b5864;
}

button.active{
    background:#e0a927;
    color:#111;
}

#newMap{
    background:#35a953;
}

#save{
    background:#287fd1;
}

#load{
    background:#704bd0;
}

#textureMode{
    background:#9a5fd1;
}

#panel{
    position:absolute;
    top:80px;
    right:10px;
    bottom:10px;

    width:270px;

    z-index:20;

    background:rgba(20,24,29,.96);
    color:white;

    border-radius:12px;

    padding:16px;

    overflow-y:auto;

    box-shadow:0 5px 25px #0008;
}

.section{
    border-top:1px solid #424a52;
    padding-top:14px;
    margin-top:14px;
}

.title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.tool{
    width:100%;
    margin-bottom:7px;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:5px;
    color:#ccc;
    font-size:13px;
}

input[type=range]{
    width:100%;
}

input[type=color]{
    width:100%;
    height:45px;
    border:0;
    padding:2px;
    background:#111;
    cursor:pointer;
}

.value{
    float:right;
    color:white;
}

#colorPreview{
    height:45px;
    border-radius:8px;
    margin-top:8px;
    border:1px solid #555;
}

.info{
    color:#aaa;
    font-size:12px;
    line-height:1.55;
}

#status{
    position:absolute;
    bottom:15px;
    left:15px;
    z-index:30;

    background:#000b;
    color:white;

    padding:10px 14px;

    border-radius:8px;
}

#brush{
    position:absolute;

    width:80px;
    height:80px;

    border:2px solid white;
    border-radius:50%;

    transform:translate(-50%,-50%);

    pointer-events:none;

    display:none;

    z-index:50;

    box-shadow:0 0 5px #000;
}

#file{
    display:none;
}

#textureCanvas{
    display:none;
}
</style>
</head>

<body>

<div id="topbar">

<div id="logo">
GHOST 3D ISLAND

</button>

</button>

</button>

<input
id="file"
type="file"
accept=".json"
>

</div>


<div id="panel">

Werkzeuge
</div>

<button
id="raise"
class="tool active">
⛰ Erhöhen
</button>

<button
id="lower"
class="tool">
🕳 Absenken
</button>

<button

class="tool">
🧽 Glätten
</button>


<div class="section">

<div class="title">
Textur malen
</div>

<button
id="paint"
class="tool">
🖌 Farbe malen
</button>

<button
id="erasePaint"
class="tool">
🧹 Farbe löschen
</button>

<label>
Farbe auswählen
</label>

<input
id="color"
type="color"
value="#4ca34f"
>

<div
id="colorPreview">
</div>

<label>
Pinselgröße
<span
class="value"
id="sizeValue">
12
</span>
</label>

<input
id="size"
type="range"
min="2"
max="35"

>

Stärke
<span
class="value"
id="strengthValue">
0.5
</span>

id="strength"
type="range"
min=".05"
max="2"

>

</div>

Kamera
</div>

id="resetCamera"
class="tool">
🎥 Kamera zurücksetzen
</button>

<button
id="topCamera"
class="tool">
⬇ Draufsicht
</button>

id="islandCamera"
class="tool">
🏝 Insel anzeigen
</button>

</div>


<div class="section">

<div class="title">
Information
</div>

<div class="info">

12.000 × 12.000 Meter<br>
3D-Terrain ohne Standardtextur<br>
eigene Farben direkt auf die Insel malen<br>
Terrain und Farben werden gespeichert.

</div>

</div>

</div>


<div id="status">
Terrain-Modus
</div>

<div id="brush"></div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   GHOST 3D ISLAND EDITOR
========================================================= */

const GRID = 129;

const WORLD_SIZE = 12000;

const SEA_LEVEL = 0;

let seed =
Math.floor(Math.random()*99999999);

let heights =
new Float32Array(
GRID*GRID
);


/*
    Für jeden Terrainpunkt wird eine eigene
    Farbe gespeichert.
*/
let paintColors =
new Array(GRID*GRID);


/* =========================================================
   STANDARD FARBE
========================================================= */

for(
    let i=0;
    i<paintColors.length;
    i++
){

    paintColors[i] =
    {
        r:0.29,
        g:0.64,
        b:0.31
    };

}


/* =========================================================
   THREE
========================================================= */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(
0x86cfff
);

scene.fog =
new THREE.Fog(
0x86cfff,
4500,
13000
);


const camera =
new THREE.PerspectiveCamera(
55,
innerWidth/innerHeight,
1,
30000
);


const renderer =
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(
Math.min(
devicePixelRatio,
1.5
)
);

renderer.setSize(
innerWidth,
innerHeight
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
renderer.domElement
);


/* =========================================================
   CAMERA
========================================================= */

let yaw=.65;

let pitch=.62;

let distance=6500;

let rotating=false;

let lastX=0;

let lastY=0;


function updateCamera(){

const x =
Math.sin(yaw)*
Math.cos(pitch)*
distance;

const y =
Math.sin(pitch)*
distance;

const z =
Math.cos(yaw)*
Math.cos(pitch)*
distance;

camera.position.set(
x,
y,
z
);

camera.lookAt(
0,
100,
0
);

}

updateCamera();


renderer.domElement.addEventListener(
"contextmenu",
e=>e.preventDefault()
);


renderer.domElement.addEventListener(
"pointerdown",
e=>{

if(e.button===2){

rotating=true;

lastX=e.clientX;
lastY=e.clientY;

}

});


renderer.domElement.addEventListener(
"pointerup",
e=>{

if(e.button===2)
rotating=false;

});


renderer.domElement.addEventListener(
"pointermove",
e=>{

if(!rotating)
return;

yaw -=
(e.clientX-lastX)*.005;

pitch +=
(e.clientY-lastY)*.005;

pitch =
Math.max(
.12,
Math.min(
1.48,
pitch
)
);

lastX=e.clientX;
lastY=e.clientY;

updateCamera();

});


renderer.domElement.addEventListener(
"wheel",
e=>{

distance +=
e.deltaY*5;

distance =
Math.max(
400,
Math.min(
14000,
distance
)
);

updateCamera();

});


/* =========================================================
   LICHT
========================================================= */

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x30452d,
2
)
);


const sun =
new THREE.DirectionalLight(
0xffffff,
2
);

sun.position.set(
3500,
6500,
2500
);

sun.castShadow=true;

scene.add(sun);


/* =========================================================
   TERRAIN
========================================================= */

let terrain;

let terrainGeometry;

let terrainMaterial;


/* =========================================================
   RANDOM
========================================================= */

function hash(x,z){

const value =
Math.sin(
x*127.1+
z*311.7+
seed*.013
)*43758.5453;

return value -
Math.floor(value);

}


function noise(x,z){

const x0=Math.floor(x);

const z0=Math.floor(z);

const x1=x0+1;

const z1=z0+1;

const tx=x-x0;

const tz=z-z0;

const sx=tx*tx*(3-2*tx);

const sz=tz*tz*(3-2*tz);

const a=hash(x0,z0);

const b=hash(x1,z0);

const c=hash(x0,z1);

const d=hash(x1,z1);

const ab=a+(b-a)*sx;

const cd=c+(d-c)*sx;

return ab+(cd-ab)*sz;

}


function fbm(x,z){

let result=0;

let amp=1;

let freq=1;

let total=0;

for(
    let i=0;
    i<5;
    i++
){

result +=
noise(
x*freq,
z*freq
)*amp;

total += amp;

amp *= .5;

freq *= 2;

}

return result/total;

}


/* =========================================================
   NEUE INSEL
========================================================= */

function generateIsland(){

seed =
Math.floor(
Math.random()*99999999
);

for(
    let z=0;
    z<GRID;
    z++
){

for(
    let x=0;
    x<GRID;
    x++
){

const nx =
x/(GRID-1)*2-1;

const nz =
z/(GRID-1)*2-1;


const distance =
Math.sqrt(
nx*nx+nz*nz
);


/* Insel */

let mask =
1-
Math.pow(
distance,
2.25
);


/* Küstenvariation */

mask *=
.78+
fbm(
nx*3+50,
nz*3+50
)*.42;


/* Gelände */

let h =
fbm(
nx*2.2+100,
nz*2.2+100
)*850;

h +=
fbm(
nx*7+200,
nz*7+200
)*260;

h +=
fbm(
nx*16+300,
nz*16+300
)*70;


/* Berge */

h +=
Math.exp(
-(
Math.pow(nx-.3,2)+
Math.pow(nz+.2,2)
)*8
)*1100;

h +=
Math.exp(
-(
Math.pow(nx+.36,2)+
Math.pow(nz-.22,2)
)*11
)*850;


/* Inselrand */

h *=
Math.max(
0,
mask
);


/* Strand */

h -= 35;


/* außerhalb */

if(
distance>.97
){

h=-100;

}


heights[
z*GRID+x
]=h;


/*
    Bei neuer Insel zunächst
    keine aufgemalten Farben.
    Die Farbe wird später abhängig
    von der Höhe angezeigt.
*/

paintColors[
z*GRID+x
]=null;

}

}

buildTerrain();

}


/* =========================================================
   TERRAIN BAUEN
========================================================= */

function buildTerrain(){

if(terrain){

scene.remove(terrain);

terrainGeometry.dispose();

terrainMaterial.dispose();

}


terrainGeometry =
new THREE.PlaneGeometry(
WORLD_SIZE,
WORLD_SIZE,
GRID-1,
GRID-1
);

terrainGeometry.rotateX(
-Math.PI/2
);


const pos =
terrainGeometry.attributes.position;

const colors=[];


for(
    let i=0;
    i<pos.count;
    i++
){

pos.setY(
i,
heights[i]
);

let color;


/*
    WICHTIG:
    Ohne aufgemalte Textur wird
    das Terrain zunächst schlicht
    grau angezeigt.
*/

if(
    paintColors[i]
){

const p =
paintColors[i];

color =
new THREE.Color(
p.r,
p.g,
p.b
);

}
else{

color =
new THREE.Color(
0x999999
);

}


colors.push(
color.r,
color.g,
color.b
);

}


terrainGeometry.setAttribute(
"color",
new THREE.Float32BufferAttribute(
colors,
3
)
);


terrainGeometry.computeVertexNormals();


terrainMaterial =
new THREE.MeshStandardMaterial({

vertexColors:true,

roughness:1,

metalness:0

});


terrain =
new THREE.Mesh(
terrainGeometry,
terrainMaterial
);


terrain.receiveShadow=true;

scene.add(terrain);

}


/* =========================================================
   WASSER
========================================================= */

const water =
new THREE.Mesh(

new THREE.PlaneGeometry(
WORLD_SIZE,
WORLD_SIZE
),

new THREE.MeshStandardMaterial({

color:0x228dcc,

transparent:true,

opacity:.55,

roughness:.15

})

);

water.rotation.x =
-Math.PI/2;

water.position.y =
SEA_LEVEL;

scene.add(water);


/* =========================================================
   RAYCAST
========================================================= */

const raycaster =
new THREE.Raycaster();

const mouse =
new THREE.Vector2();


function getHit(e){

const rect =
renderer.domElement
.getBoundingClientRect();

mouse.x =
(
(e.clientX-rect.left)/
rect.width
)*2-1;

mouse.y =
-(
(e.clientY-rect.top)/
rect.height
)*2+1;

raycaster.setFromCamera(
mouse,
camera
);

const hits =
raycaster.intersectObject(
terrain
);

return hits.length
? hits[0]
: null;

}


/* =========================================================
   TERRAIN BEARBEITEN
========================================================= */

let editing=false;


function editTerrain(e){

if(!editing)
return;


const hit =
getHit(e);

if(!hit)
return;


const px =
hit.point.x;

const pz =
hit.point.z;


const gx =
Math.round(
(
px+
WORLD_SIZE/2
)/
WORLD_SIZE*
(GRID-1)
);


const gz =
Math.round(
(
pz+
WORLD_SIZE/2
)/
WORLD_SIZE*
(GRID-1)
);


const radius =
Math.ceil(
brushSize
);


for(
    let z=-radius;
    z<=radius;
    z++
){

for(
    let x=-radius;
    x<=radius;
    x++
){

const ix =
gx+x;

const iz =
gz+z;


if(
ix<0||
iz<0||
ix>=GRID||
iz>=GRID
)
continue;


const d =
Math.sqrt(
x*x+z*z
);


if(
d>brushSize
)
continue;


const falloff =
Math.pow(
1-d/brushSize,
2
);


const index =
iz*GRID+ix;


/* =====================
   TERRAIN
===================== */

if(mode==="raise"){

heights[index] +=
strength*
falloff*
20;

}


if(mode==="lower"){

heights[index] -=
strength*
falloff*
20;

}


/* =====================
   GLÄTTEN
===================== */

if(mode==="smooth"){

let total=0;

let count=0;

for(
    let sy=-2;
    sy<=2;
    sy++
){

for(
    let sx=-2;
    sx<=2;
    sx++
){

const ax=ix+sx;

const az=iz+sy;

if(
ax>=0&&
az>=0&&
ax<GRID&&
az<GRID
){

total +=
heights[
az*GRID+ax
];

count++;

}

}

}

const average =
total/count;

heights[index] +=
(
average-
heights[index]
)*
strength*
falloff;

}


/* =====================
   TEXTUR
===================== */

if(mode==="paint"||
mode==="erase"){

if(mode==="paint"){

const hex =
document
.getElementById("color")
.value;


const r =
parseInt(
hex.substring(1,3),
16
)/255;

const g =
parseInt(
hex.substring(3,5),
16
)/255;

const b =
parseInt(
hex.substring(5,7),
16
)/255;


if(
!paintColors[index]
){

paintColors[index]={
r:r,
g:g,
b:b
};

}
else{

paintColors[index].r +=
(r-paintColors[index].r)*
strength*
falloff;

paintColors[index].g +=
(g-paintColors[index].g)*
strength*
falloff;

paintColors[index].b +=
(b-paintColors[index].b)*
strength*
falloff;

}

}


if(mode==="erase"){

paintColors[index]=null;

}

}

}

}


updateTerrainMesh();

}


/* =========================================================
   UPDATE
========================================================= */

function updateTerrainMesh(){

const pos =
terrainGeometry.attributes.position;

for(
    let i=0;
    i<heights.length;
    i++
){

pos.setY(
i,
heights[i]
);

}

pos.needsUpdate=true;


terrainGeometry.computeVertexNormals();


const colors =
terrainGeometry.attributes.color;


for(
    let i=0;
    i<heights.length;
    i++
){

const p =
paintColors[i];

let color;


if(p){

color =
new THREE.Color(
p.r,
p.g,
p.b
);

}
else{

color =
new THREE.Color(
0x999999
);

}


colors.setXYZ(
i,
color.r,
color.g,
color.b
);

}


colors.needsUpdate=true;

}


/* =========================================================
   MODUS
========================================================= */

function setMode(newMode){

mode=newMode;


document
.querySelectorAll(
".tool"
)
.forEach(
b=>b.classList.remove(
"active"
)
);


if(
newMode==="raise"
){

document
.getElementById("raise")
.classList.add("active");

document
.getElementById("status")
.innerText=
"⛰ Gelände erhöhen";

}

if(
newMode==="lower"
){

document
.getElementById("lower")
.classList.add("active");

document
.getElementById("status")
.innerText=
"🕳 Gelände absenken";

}

if(
newMode==="smooth"
){

document
.getElementById("smooth")
.classList.add("active");

document
.getElementById("status")
.innerText=
"🧽 Gelände glätten";

}

if(
newMode==="paint"
){

document
.getElementById("paint")
.classList.add("active");

document
.getElementById("status")
.innerText=
"🖌 Eigene Farbe malen";

}

if(
newMode==="erase"
){

document
.getElementById("erasePaint")
.classList.add("active");

document
.getElementById("status")
.innerText=
"🧹 Farbe löschen";

}

}


/* =========================================================
   BUTTONS
========================================================= */

document
.getElementById("raise")
.onclick=
()=>setMode("raise");


document
.getElementById("lower")
.onclick=
()=>setMode("lower");


document
.getElementById("smooth")
.onclick=
()=>setMode("smooth");


document
.getElementById("paint")
.onclick=
()=>setMode("paint");


document
.getElementById("erasePaint")
.onclick=
()=>setMode("erase");


document
.getElementById("terrainMode")
.onclick=
()=>setMode("raise");


document
.getElementById("textureMode")
.onclick=
()=>setMode("paint");


/* =========================================================
   PINSIEL
========================================================= */

document
.getElementById("size")
.oninput=
e=>{

brushSize =
Number(e.target.value);

document
.getElementById("sizeValue")
.innerText=
brushSize;

};


/* =========================================================
   STÄRKE
========================================================= */

document
.getElementById("strength")
.oninput=
e=>{

strength =
Number(e.target.value);

document
.getElementById("strengthValue")
.innerText=
strength.toFixed(2);

};


/* =========================================================
   FARBE
========================================================= */

function updateColorPreview(){

const c =
document
.getElementById("color")
.value;

document
.getElementById("colorPreview")
.style.background=
c;

}


document
.getElementById("color")
.oninput=
updateColorPreview;

updateColorPreview();


/* =========================================================
   MAUS
========================================================= */

renderer.domElement.addEventListener(
"pointerdown",
e=>{

if(e.button===0){

editing=true;

editTerrain(e);

}

});


renderer.domElement.addEventListener(
"pointerup",
e=>{

if(e.button===0)
editing=false;

});


renderer.domElement.addEventListener(
"pointermove",
e=>{

const brush =
document.getElementById(
"brush"
);

brush.style.left =
e.clientX+"px";

brush.style.top =
e.clientY+"px";

brush.style.width =
brushSize*8+"px";

brush.style.height =
brushSize*8+"px";


if(editing){

editTerrain(e);

}

});


renderer.domElement.addEventListener(
"pointerenter",
()=>{

document
.getElementById("brush")
.style.display=
"block";

});


renderer.domElement.addEventListener(
"pointerleave",
()=>{

document
.getElementById("brush")
.style.display=
"none";

});


/* =========================================================
   NEUE INSEL
========================================================= */

document
.getElementById("newMap")
.onclick=
()=>{

generateIsland();

};


/* =========================================================
   KAMERA RESET
========================================================= */

document
.getElementById("resetCamera")
.onclick=
()=>{

yaw=.65;

pitch=.62;

distance=6500;

updateCamera();

};


document
.getElementById("topCamera")
.onclick=
()=>{

yaw=0;

pitch=1.48;

distance=8000;

updateCamera();

};


document
.getElementById("islandCamera")
.onclick=
()=>{

yaw=.65;

pitch=.62;

distance=6500;

updateCamera();

};


/* =========================================================
   SPEICHERN
========================================================= */

document
.getElementById("save")
.onclick=
()=>{

const data={

version:2,

seed:seed,

grid:GRID,

worldSize:WORLD_SIZE,

heights:
Array.from(
heights
),

paintColors:
paintColors

};


const blob =
new Blob(
[
JSON.stringify(data)
],
{
type:"application/json"
}
);


const url =
URL.createObjectURL(blob);


const a =
document.createElement("a");

a.href=url;

a.download=
"ghost-island-map.json";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>{
URL.revokeObjectURL(url);
},
1000
);

};


/* =========================================================
   LADEN
========================================================= */

document
.getElementById("load")
.onclick=
()=>{

document
.getElementById("file")
.click();

};


document
.getElementById("file")
.onchange=
e=>{

const file =
e.target.files[0];

if(!file)
return;


const reader =
new FileReader();


reader.onload=
()=>{

try{

const data =
JSON.parse(
reader.result
);


if(
data.grid!==GRID||
!Array.isArray(data.heights)||
data.heights.length!==GRID*GRID
){

alert(
"Diese Map passt nicht zum Editor."
);

return;

}


seed =
data.seed||0;


heights =
new Float32Array(
data.heights
);


if(
Array.isArray(
data.paintColors
)
){

paintColors =
data.paintColors;

}
else{

paintColors =
new Array(
GRID*GRID
).fill(null);

}


buildTerrain();


}
catch(err){

alert(
"Map konnte nicht geladen werden."
);

}

};


reader.readAsText(file);

};


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
"resize",
()=>{

camera.aspect =
innerWidth/
innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

});


/* =========================================================
   START
========================================================= */

generateIsland();


/* =========================================================
   LOOP
========================================================= */

function animate(){

requestAnimationFrame(
animate
);

renderer.render(
scene,
camera
);

}

animate();

</script>
