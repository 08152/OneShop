<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website → MSI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center
}
.card{
  width:min(650px,94vw);
  background:#111;
  border:1px solid #292929;
  border-radius:24px;
  padding:30px;
  box-shadow:0 20px 70px #000
}
h1{margin:0 0 8px}
p{color:#999}
input,button{
  width:100%;
  height:52px;
  margin-top:14px;
  border-radius:12px;
  border:1px solid #333;
  font-size:16px
}
input{
  background:#080808;
  color:white;
  padding:0 15px
}
button{
  background:white;
  color:#000;
  font-weight:bold;
  cursor:pointer
}
button:disabled{
  opacity:.4;
  cursor:not-allowed
}
#status{
  margin-top:18px;
  padding:15px;
  border-radius:12px;
  background:#080808;
  color:#aaa;
  white-space:pre-wrap
}
.ok{color:#6cff9b}
</style>
</head>

<body>

<div class="card">
  <h1>Website → MSI</h1>
  <p>
    Erstelle eine Windows-App, die beim Start deine Website lädt.
    Änderungen auf der Website werden automatisch übernommen.
  </p>

  <input
    id="name"
    maxlength="50"
    placeholder="App-Name"
    value="Meine Website"
  >

  <input
    id="url"
    type="url"
    placeholder="https://example.com"
  >

  <button id="build">
    MSI erstellen
  </button>

  <div id="status">
    Noch keine Website angegeben.
  </div>
</div>

<script>
const nameInput=document.getElementById("name");
const urlInput=document.getElementById("url");
const build=document.getElementById("build");
const status=document.getElementById("status");

function validUrl(value){
  try{
    const u=new URL(value);

    return u.protocol==="https:" || u.protocol==="http:";
  }catch{
    return false;
  }
}

build.onclick=async()=>{

  const name=nameInput.value.trim();
  const url=urlInput.value.trim();

  if(!name){
    status.textContent="❌ Bitte einen App-Namen eingeben.";
    return;
  }

  if(!validUrl(url)){
    status.textContent="❌ Bitte eine gültige http:// oder https:// URL eingeben.";
    return;
  }

  build.disabled=true;

  status.textContent=
    "Build wird vorbereitet...\n"+
    "URL wird geprüft...";

  try{

    const response=await fetch("/api/create",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        name,
        url
      })
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error||"Fehler");
    }

    status.innerHTML=
      '<span class="ok">✓ Projekt erstellt.</span>\n\n'+
      'Der Windows-MSI-Build läuft jetzt über GitHub Actions.\n'+
      'Öffne dein GitHub-Repository und gehe zu:\n'+
      'Actions → Build MSI.\n\n'+
      'Die fertige MSI liegt danach unter den Workflow-Artefakten.';

  }catch(error){

    status.textContent=
      "❌ "+error.message;

  }

  build.disabled=false;
};
</script>

</body>
</html>
