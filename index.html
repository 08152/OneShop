<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suno AI - Erstellen</title>
    <script src="https://cloudflare.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-main: #0a0a0c; --bg-sidebar: #121216; --bg-card: #18181c;
            --bg-input: #222227; --accent: #e11d48; --text-main: #f4f4f5; --text-muted: #a1a1aa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; position: relative; }

        .sidebar { width: 260px; background: var(--bg-sidebar); padding: 20px 15px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #27272a; height: 100vh; z-index: 10; }
        .nav-container { display: flex; flex-direction: column; gap: 8px; }
        .nav-links { list-style: none; display: flex; flex-direction: column; gap: 4px; }
        .nav-links li a { color: var(--text-muted); text-decoration: none; padding: 12px 16px; border-radius: 8px; display: flex; align-items: center; gap: 14px; font-size: 15px; font-weight: 500; transition: 0.2s; }
        .nav-links li a:hover, .nav-links li a.active { background: #1c1c21; color: var(--text-main); }
        
        .user-profile { background: #1c1c21; padding: 12px 16px; border-radius: 30px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 28px; height: 28px; border-radius: 50%; background: #444; display: flex; align-items: center; justify-content: center; font-size: 12px; }

        .create-panel { width: 360px; background: var(--bg-sidebar); padding: 20px; display: flex; flex-direction: column; gap: 20px; border-right: 1px solid #27272a; overflow-y: auto; height: 100vh; padding-bottom: 120px; z-index: 5; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; height: 100vh; padding-bottom: 120px; z-index: 5; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .input-group label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
        textarea, input[type="text"] { background: var(--bg-input); border: 1px solid #3f3f46; border-radius: 8px; color: #fff; padding: 12px; font-size: 14px; outline: none; width: 100%; }
        
        .create-btn { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 25px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .create-btn:hover { opacity: 0.9; }
        
        .song-list { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .song-card { background: var(--bg-card); border: 1px solid #27272a; border-radius: 10px; padding: 15px; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; cursor: pointer; }
        .song-card:hover { background: #222227; }
        .song-info { display: flex; align-items: center; gap: 15px; }
        .song-cover { width: 50px; height: 50px; border-radius: 6px; background: #27272a; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .song-details .title { font-weight: 600; font-size: 15px; }
        .song-details .prompt-text { font-size: 13px; color: var(--text-muted); }
        .play-card-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }

        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 90px; background: #111115; border-top: 1px solid #27272a; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; z-index: 100; }
        .player-left { display: flex; align-items: center; gap: 15px; width: 30%; }
        .player-cover { width: 50px; height: 50px; border-radius: 6px; background: #27272a; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .player-center { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 40%; }
        .player-controls { display: flex; align-items: center; gap: 20px; }
        .control-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }
        .control-btn.main-play { font-size: 32px; color: #fff; }
        .progress-container { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted); }
        .progress-bar { flex: 1; height: 4px; background: #3f3f46; border-radius: 2px; position: relative; }
        .progress-fill { width: 0%; height: 100%; background: var(--accent); border-radius: 2px; }
        .player-right { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 10px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="/start"><i class="fa-solid fa-house"></i> Start</a></li>
                <li><a href="/entdecken"><i class="fa-solid fa-magnifying-glass"></i> Entdecken</a></li>
                <li><a href="/" class="active"><i class="fa-solid fa-music"></i> Erstellen</a></li>
                <li><a href="/studio"><i class="fa-solid fa-wand-magic-sparkles"></i> Studio</a></li>
                <li><a href="/bibliothek"><i class="fa-solid fa-lines-leaning"></i> Bibliothek</a></li>
                <li><a href="/hooks"><i class="fa-solid fa-box-archive"></i> Hooks</a></li>
            </ul>
        </div>
        <div class="user-profile">
            <div class="user-info">
                <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                <span style="font-size: 14px; font-weight: 500;">riskylive</span>
            </div>
            <i class="fa-solid fa-ellipsis" style="color: var(--text-muted);"></i>
        </div>
    </div>

    <div class="create-panel">
        <h2 style="font-size: 18px; margin-bottom: 10px;">Create Music</h2>
        <div class="input-group">
            <label>Song Description</label>
            <textarea id="promptInput" rows="4" placeholder="An upbeat synthwave track..."></textarea>
        </div>
        <div class="input-group">
            <label>Style of Music</label>
            <input type="text" id="styleInput" placeholder="e.g. Cyberpunk">
        </div>
        <div class="input-group">
            <label>Title</label>
            <input type="text" id="titleInput" placeholder="Give it a name">
        </div>
        <button class="create-btn" id="generateBtn">Create Song</button>
    </div>

    <div class="main-content">
        <h2 style="font-size: 24px; margin-bottom: 20px;">Your Creations</h2>
        <div class="song-list" id="songsContainer"></div>
    </div>

    <div class="player-bar">
        <div class="player-left">
            <div class="player-cover" id="currentCover"><i class="fa-solid fa-music"></i></div>
            <div>
                <div class="title" id="currentTitle" style="font-weight:600; font-size:14px;">No Song Playing</div>
                <div id="currentStyle" style="font-size:12px; color:var(--text-muted);">Select or create a track</div>
            </div>
        </div>
        <div class="player-center">
            <div class="player-controls">
                <button class="control-btn"><i class="fa-solid fa-backward-step"></i></button>
                <button class="control-btn main-play" id="globalPlayBtn"><i class="fa-solid fa-circle-play"></i></button>
                <button class="control-btn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <span id="totalTime">0:15</span>
            </div>
        </div>
        <div class="player-right">
            <i class="fa-solid fa-volume-high"></i>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
