<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHOST ISLAND 3D</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#72c9ff;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}


/* HUD */

#hud{
    position:absolute;
    top:15px;
    left:15px;
    z-index:20;

    color:white;
    text-shadow:0 2px 5px black;

    line-height:1.45;

    pointer-events:none;
}

#title{
    font-size:25px;
    font-weight:bold;
}


/* Crosshair */

#crosshair{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:white;
    font-size:25px;
    font-weight:bold;

    text-shadow:0 0 5px black;

    z-index:20;

    pointer-events:none;
}


/* Movement */

#controls{
    position:absolute;

    left:20px;
    bottom:20px;

    z-index:30;

    display:grid;

    grid-template-columns:
    65px 65px 65px;

    grid-template-rows:
    65px 65px 65px;

    gap:6px;

    touch-action:none;
}

.move{

    width:65px;
    height:65px;

    border:2px solid rgba(255,255,255,.75);

    border-radius:14px;

    background:rgba(0,0,0,.42);

    color:white;

    font-size:25px;
    font-weight:bold;

    user-select:none;
    -webkit-user-select:none;

    touch-action:none;
}

.move:active{
    transform:scale(.92);
    background:rgba(255,255,255,.3);
}

#up{
    grid-column:2;
    grid-row:1;
}

#left{
    grid-column:1;
    grid-row:2;
}

#down{
    grid-column:2;
    grid-row:2;
}

#right{
    grid-column:3;
    grid-row:2;
}


/* Jump */

#jump{

    position:absolute;

    right:25px;
    bottom:30px;

    width:105px;
    height:105px;

    z-index:30;

    border-radius:50%;

    border:2px solid white;

    background:rgba(0,0,0,.42);

    color:white;

    font-size:15px;
    font-weight:bold;

    touch-action:none;
}

#jump:active{
    transform:scale(.92);
}


/* Menu */

#menu{

    position:absolute;

    inset:0;

    z-index:100;

    background:rgba(0,0,0,.62);

    display:flex;

    align-items:center;
    justify-content:center;
}

#menuBox{

    width:400px;
    max-width:85%;

    padding:30px;

    background:#20252a;

    color:white;

    border-radius:20px;

    text-align:center;

    box-shadow:0 20px 80px black;
}

#menuBox h1{

    margin:0;

    font-size:40px;
}

#seed{

    margin:18px 0;

    padding:10px;

    background:#111;

    border-radius:8px;

    font-family:monospace;
}

.menuButton{

    width:100%;

    padding:15px;

    margin-top:10px;

    border:0;

    border-radius:10px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;
}

#start{
    background:#42d35b;
}

#newWorld{
    background:#e3a82c;
}

</style>
</head>


<body>


<!-- HUD -->

<div id="hud">

<div id="title">
GHOST ISLAND
</div>

WASD / Buttons = Laufen<br>
SPACE = Springen<br>
Klick = Maus aktivieren<br><br>

Position:
<span id="position">0 / 0</span><br>

Chunk:
<span id="chunk">0 / 0</span>

</div>


<div id="crosshair">+</div>


<!-- Bewegungsbuttons -->

<div id="controls">

<button class="move" id="up">▲</button>

<button class="move" id="left">◀</button>

<button class="move" id="down">▼</button>

<button class="move" id="right">▶</button>

</div>


<button id="jump">
SPRINGEN
</button>


<!-- Menü -->

<div id="menu">

<div id="menuBox">

<h1>GHOST ISLAND</h1>

<p>
Eine große begrenzte Insel mit Wasser.
</p>

<p>
Nur die Umgebung des Spielers wird geladen.
</p>

<div id="seed">
SEED
</div>

<button
class="menuButton"
id="start">

SPIEL STARTEN

</button>

<button
class="menuButton"
id="newWorld">

NEUE WELT

</button>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>


// ======================================================
// WELT
// ======================================================

const WORLD_SIZE = 8000;

const ISLAND_RADIUS = 3500;

const WATER_LEVEL = 8;

const CHUNK_SIZE = 300;

const RENDER_DISTANCE = 2;


// ======================================================
// SEED
// ======================================================

let savedSeed =
localStorage.getItem(
"GHOST_ISLAND_SEED"
);

if(!savedSeed){

savedSeed =
String(
Math.floor(
Math.random()*2147483647
)
);

localStorage.setItem(
"GHOST_ISLAND_SEED",
savedSeed
);

}

const WORLD_SEED =
Number(savedSeed);


document.getElementById(
"seed"
).innerText =
"SEED: "+WORLD_SEED;


// ======================================================
// DETERMINISTISCHER RANDOM
// ======================================================

function rand(
x,
z,
extra=0
){

const value =
Math.sin(

x*12.9898 +

z*78.233 +

extra*37.719 +

WORLD_SEED*.0001

)*43758.5453123;

return value-
Math.floor(value);

}


// ======================================================
// SCENE
// ======================================================

const scene =
new THREE.Scene();


scene.background =
new THREE.Color(
0x72c9ff
);


scene.fog =
new THREE.Fog(
0x72c9ff,
650,
2300
);


// ======================================================
// CAMERA
// ======================================================

const camera =
new THREE.PerspectiveCamera(

75,

innerWidth/
innerHeight,

0.1,

5000

);


// ======================================================
// RENDERER
// ======================================================

const renderer =
new THREE.WebGLRenderer({

antialias:true

});


renderer.setSize(
innerWidth,
innerHeight
);


renderer.setPixelRatio(
Math.min(
devicePixelRatio,
1.4
)
);


renderer.shadowMap.enabled=true;


document.body.appendChild(
renderer.domElement
);


// ======================================================
// LICHT
// ======================================================

scene.add(

new THREE.AmbientLight(
0xffffff,
0.95
)

);


const sun =
new THREE.DirectionalLight(
0xffffff,
1.5
);


sun.position.set(
500,
1000,
400
);


sun.castShadow=true;


scene.add(sun);


// ======================================================
// TERRAIN HEIGHT
// ======================================================

function terrainHeight(
x,
z
){

const distance =
Math.sqrt(
x*x+
z*z
);


// Außerhalb der Insel
// liegt das Terrain unter Wasser.

if(
distance >
ISLAND_RADIUS
){

return WATER_LEVEL-12;

}


// Inselrand

let islandFactor =
1-
distance/ISLAND_RADIUS;


// weicher Rand

islandFactor =
Math.pow(
islandFactor,
0.55
);


// große Landschaft

let h = 18;


h +=
Math.sin(
x*.0014+
WORLD_SEED
)*

Math.cos(
z*.0013
)*

80;


// große Berge

h +=
Math.sin(
x*.00055-
z*.0004
)*

140;


// Hügel

h +=
Math.sin(
x*.004+
z*.003
)*

25;


// kleine Unebenheiten

h +=
Math.sin(
x*.015-
z*.012
)*

5;


// Inselrand

h *= islandFactor;


// Strandbereich

if(
distance >
ISLAND_RADIUS-350
){

const beach =
1-
(
ISLAND_RADIUS-distance
)/350;

h =
h*(1-beach)+
(WATER_LEVEL+2)*beach;

}


return h;

}


// ======================================================
// CHUNKS
// ======================================================

const chunks =
new Map();


function chunkKey(
cx,
cz
){

return cx+"_"+cz;

}


// ======================================================
// CHUNK ERSTELLEN
// ======================================================

function createChunk(
cx,
cz
){

const id =
chunkKey(cx,cz);


if(chunks.has(id))
return;


const group =
new THREE.Group();


group.userData.cx=cx;
group.userData.cz=cz;


// Mittelpunkt

const centerX =
cx*CHUNK_SIZE;

const centerZ =
cz*CHUNK_SIZE;


// ==================================================
// TERRAIN
// ==================================================

const geometry =
new THREE.PlaneGeometry(

CHUNK_SIZE,
CHUNK_SIZE,

18,
18

);


geometry.rotateX(
-Math.PI/2
);


const positions =
geometry.attributes.position;


for(
let i=0;
i<positions.count;
i++
){

const localX =
positions.getX(i);

const localZ =
positions.getZ(i);


const worldX =
centerX+
localX;

const worldZ =
centerZ+
localZ;


positions.setY(
i,
terrainHeight(
worldX,
worldZ
)
);

}


geometry.computeVertexNormals();


const material =
new THREE.MeshStandardMaterial({

color:0x4d9947,

roughness:1

});


const ground =
new THREE.Mesh(
geometry,
material
);


ground.position.set(
centerX,
0,
centerZ
);


ground.receiveShadow=true;


group.add(ground);


// ==================================================
// OBJEKTE NUR AUF DER INSEL
// ==================================================

const distanceFromCenter =
Math.sqrt(
centerX*centerX+
centerZ*centerZ
);


if(
distanceFromCenter <
ISLAND_RADIUS
){

createTrees(
group,
cx,
cz
);

createRocks(
group,
cx,
cz
);

}


// ==================================================
// CHUNK SPEICHERN
// ==================================================

scene.add(group);

chunks.set(
id,
group
);

}


// ======================================================
// BÄUME
// ======================================================

function createTrees(
group,
cx,
cz
){

const centerX =
cx*CHUNK_SIZE;

const centerZ =
cz*CHUNK_SIZE;


const trees=[];


const count =
7+
Math.floor(
rand(cx,cz,1)*7
);


for(
let i=0;
i<count;
i++
){

const rx =
rand(
cx,
cz,
100+i
);

const rz =
rand(
cx,
cz,
200+i
);


const x =
centerX+
(rx-.5)*
(CHUNK_SIZE-30);


const z =
centerZ+
(rz-.5)*
(CHUNK_SIZE-30);


const distance =
Math.sqrt(
x*x+
z*z
);


// nicht außerhalb der Insel

if(
distance >
ISLAND_RADIUS-30
)
continue;


const y =
terrainHeight(
x,
z
);


// nicht im Wasser

if(
y <
WATER_LEVEL+3
)
continue;


// Mindestabstand

let close=false;


for(
const tree
of trees
){

const dx =
x-tree.x;

const dz =
z-tree.z;


if(
dx*dx+
dz*dz
<
45*45
){

close=true;
break;

}

}


if(close)
continue;


trees.push({
x:x,
z:z
});


createTree(
group,
x,
y,
z,
cx,
cz,
i
);

}

}


// ======================================================
// DETAILLIERTER BAUM
// ======================================================

function createTree(
group,
x,
y,
z,
cx,
cz,
index
){

const tree =
new THREE.Group();


const random =
rand(
cx,
cz,
500+index
);


const height =
28+
random*30;


const radius =
1.4+
random*1.2;


// ==================================================
// STAMM
// ==================================================

const trunk =
new THREE.Mesh(

new THREE.CylinderGeometry(

radius*.7,

radius,

height,

8

),

new THREE.MeshStandardMaterial({

color:0x59381f,

roughness:1

})

);


trunk.position.y =
height/2;


tree.add(trunk);


// ==================================================
// ÄSTE
// ==================================================

const branchCount =
5+
Math.floor(
random*4
);


for(
let i=0;
i<branchCount;
i++
){

const a =
rand(
cx,
cz,
600+
index*20+
i
)*
Math.PI*2;


const branchHeight =
height*
(
.35+
rand(
cx,
cz,
700+
index*20+
i
)*.4
);


const length =
7+
rand(
cx,
cz,
800+
index*20+
i
)*12;


const branch =
new THREE.Mesh(

new THREE.CylinderGeometry(

.25,

.7,

length,

6

),

new THREE.MeshStandardMaterial({

color:0x57371f

})

);


branch.position.set(

Math.cos(a)*
length*.3,

branchHeight,

Math.sin(a)*
length*.3

);


branch.rotation.z =
Math.PI/2-.4;

branch.rotation.y =
-a;


tree.add(branch);


// =================================================
// BLÄTTER
// =================================================

const leaves =
new THREE.Mesh(

new THREE.IcosahedronGeometry(

4+
rand(
cx,
cz,
900+
index*20+
i
)*4,

1

),

new THREE.MeshStandardMaterial({

color:0x267d38,

roughness:1

})

);


leaves.position.set(

Math.cos(a)*
length*.65,

branchHeight+4,

Math.sin(a)*
length*.65

);


tree.add(leaves);

}


// ==================================================
// WICHTIG:
// Baum steht exakt auf terrainHeight()
// ==================================================

tree.position.set(
x,
y,
z
);


tree.rotation.y =
random*Math.PI*2;


tree.scale.setScalar(
.85+
random*.4
);


// Keine Hitbox:
// Der Baum ist ausschließlich ein Render-Objekt.

group.add(tree);

}


// ======================================================
// STEINE
// ======================================================

function createRocks(
group,
cx,
cz
){

const centerX =
cx*CHUNK_SIZE;

const centerZ =
cz*CHUNK_SIZE;


const rocks=[];


const count =
4+
Math.floor(
rand(cx,cz,3000)*6
);


for(
let i=0;
i<count;
i++
){

const rx =
rand(
cx,
cz,
3100+i
);

const rz =
rand(
cx,
cz,
3200+i
);


const x =
centerX+
(rx-.5)*
(CHUNK_SIZE-20);


const z =
centerZ+
(rz-.5)*
(CHUNK_SIZE-20);


const distance =
Math.sqrt(
x*x+
z*z
);


if(
distance >
ISLAND_RADIUS-30
)
continue;


const y =
terrainHeight(
x,
z
);


if(
y<
WATER_LEVEL+3
)
continue;


let close=false;


for(
const rock
of rocks
){

const dx =
x-rock.x;

const dz =
z-rock.z;


if(
dx*dx+
dz*dz
<
25*25
){

close=true;
break;

}

}


if(close)
continue;


rocks.push({
x:x,
z:z
});


const size =
3+
rand(
cx,
cz,
3300+i
)*7;


const rock =
new THREE.Mesh(

new THREE.DodecahedronGeometry(
size,
1
),

new THREE.MeshStandardMaterial({

color:0x777b76,

roughness:.95

})

);


rock.position.set(

x,

y+
size*.55,

z

);


rock.rotation.set(

rand(cx,cz,3400+i),
rand(cx,cz,3500+i),
rand(cx,cz,3600+i)

);


rock.scale.y =
.7+
rand(cx,cz,3700+i)*.5;


// Keine Hitbox

group.add(rock);

}

}


// ======================================================
// WASSER
// ======================================================

const waterGeometry =
new THREE.PlaneGeometry(

WORLD_SIZE+2000,
WORLD_SIZE+2000,

100,
100

);


waterGeometry.rotateX(
-Math.PI/2
);


const waterMaterial =
new THREE.MeshPhysicalMaterial({

color:0x158dcc,

transparent:true,

opacity:.58,

roughness:.08,

metalness:.05,

transmission:.18,

clearcoat:1,

clearcoatRoughness:.04

});


const water =
new THREE.Mesh(

waterGeometry,
waterMaterial

);


water.position.y =
WATER_LEVEL;


scene.add(water);


// Originalpositionen

const waterPositions =
waterGeometry.attributes.position;

const waterOriginal=[];


for(
let i=0;
i<waterPositions.count;
i++
){

waterOriginal.push({

x:waterPositions.getX(i),

z:waterPositions.getZ(i)

});

}


// ======================================================
// WASSERWELLEN
// ======================================================

function updateWater(
time
){

for(
let i=0;
i<waterPositions.count;
i++
){

const p =
waterOriginal[i];


const wave =

Math.sin(
p.x*.018+
time*.0012
)*.8

+

Math.cos(
p.z*.015+
time*.001
)*.7

+

Math.sin(
(p.x+p.z)*.009+
time*.0008
)*.45;


waterPositions.setY(
i,
wave
);

}


waterPositions.needsUpdate=true;

}


// ======================================================
// PLAYER
// ======================================================

const player =
new THREE.Object3D();


scene.add(player);


// Spielerhöhe

const PLAYER_HEIGHT=12;


// Startpunkt

player.position.set(

0,

terrainHeight(0,0),

0

);


// Kamera etwas höher

camera.position.y =
PLAYER_HEIGHT;


player.add(camera);


// ======================================================
// PHYSICS
// ======================================================

let velocity =
new THREE.Vector3();


let gravity=.035;

let canJump=false;

let keys={};


// ======================================================
// KEYBOARD
// ======================================================

document.onkeydown=(e)=>{

keys[
e.key.toLowerCase()
]=true;


if(
e.code==="Space" &&
canJump
){

velocity.y=.9;

canJump=false;

}

};


document.onkeyup=(e)=>{

keys[
e.key.toLowerCase()
]=false;

};


// ======================================================
// BUTTONS
// ======================================================

function setupButton(
id,
key
){

const button =
document.getElementById(id);


function down(e){

e.preventDefault();

keys[key]=true;

}


function up(e){

e.preventDefault();

keys[key]=false;

}


button.addEventListener(
"pointerdown",
down
);

button.addEventListener(
"pointerup",
up
);

button.addEventListener(
"pointercancel",
up
);

button.addEventListener(
"pointerleave",
up
);

}


setupButton(
"up",
"w"
);

setupButton(
"down",
"s"
);

setupButton(
"left",
"a"
);

setupButton(
"right",
"d"
);


document.getElementById(
"jump"
).addEventListener(
"pointerdown",
(e)=>{

e.preventDefault();


if(canJump){

velocity.y=.9;

canJump=false;

}

}
);


// ======================================================
// MAUS
// ======================================================

let rx=0;
let ry=0;


document.body.onclick=()=>{

if(
!document.pointerLockElement
){

document.body.requestPointerLock();

}

};


document.onmousemove=(e)=>{

if(
document.pointerLockElement
){

ry -=
e.movementX*.002;


rx -=
e.movementY*.002;


rx=Math.max(
-1.5,
Math.min(
1.5,
rx
)
);


camera.rotation.x=rx;

player.rotation.y=ry;

}

};


// ======================================================
// CHUNK STREAMING
// ======================================================

let lastCX=null;

let lastCZ=null;


function updateChunks(){

const cx =
Math.floor(
player.position.x/
CHUNK_SIZE
);

const cz =
Math.floor(
player.position.z/
CHUNK_SIZE
);


if(
cx===lastCX &&
cz===lastCZ
){

return;

}


lastCX=cx;
lastCZ=cz;


const needed =
new Set();


for(
let x=-RENDER_DISTANCE;
x<=RENDER_DISTANCE;
x++
){

for(
let z=-RENDER_DISTANCE;
z<=RENDER_DISTANCE;
z++
){

const nx =
cx+x;

const nz =
cz+z;


const id =
chunkKey(nx,nz);


needed.add(id);


createChunk(
nx,nz
);

}

}


// ==================================================
// ENTFERNTE CHUNKS ENTFERNEN
// ==================================================

for(
const [id,group]
of chunks
){

if(
!needed.has(id)
){

scene.remove(group);

chunks.delete(id);

}

}

}


// ======================================================
// UPDATE
// ======================================================

function update(){

let dir =
new THREE.Vector3();


if(keys.w)
dir.z-=1;

if(keys.s)
dir.z+=1;

if(keys.a)
dir.x-=1;

if(keys.d)
dir.x+=1;


if(
dir.length()>0
){

dir.normalize();

}


dir.applyAxisAngle(

new THREE.Vector3(0,1,0),

player.rotation.y

);


velocity.x +=
dir.x*.18;

velocity.z +=
dir.z*.18;


velocity.x*=.84;

velocity.z*=.84;


velocity.y-=gravity;


player.position.add(
velocity
);


// ==================================================
// BODEN
// ==================================================

const ground =
terrainHeight(

player.position.x,
player.position.z

);


// Falls Spieler am Wasser ist

if(
player.position.y <
ground
){

player.position.y =
ground;

velocity.y=0;

canJump=true;

}


// ==================================================
// MAP-GRENZE
// ==================================================

// Spieler kann nicht außerhalb
// der 8000x8000-Welt laufen.

const half =
WORLD_SIZE/2;


player.position.x =
Math.max(
-half,
Math.min(
half,
player.position.x
)
);


player.position.z =
Math.max(
-half,
Math.min(
half,
player.position.z
)
);


// ==================================================
// CHUNKS
// ==================================================

updateChunks();


// ==================================================
// HUD
// ==================================================

document.getElementById(
"position"
).innerText=

Math.round(
player.position.x
)+
" / "+
Math.round(
player.position.z
);


document.getElementById(
"chunk"
).innerText=

lastCX+
" / "+
lastCZ;

}


// ======================================================
// MENU
// ======================================================

document.getElementById(
"start"
).onclick=()=>{

document.getElementById(
"menu"
).style.display="none";


document.body.requestPointerLock();

};


document.getElementById(
"newWorld"
).onclick=()=>{

localStorage.setItem(

"GHOST_ISLAND_SEED",

String(
Math.floor(
Math.random()*2147483647
)

)

);


location.reload();

};


// ======================================================
// START CHUNKS
// ======================================================

updateChunks();


// ======================================================
// GAME LOOP
// ======================================================

function animate(
time
){

requestAnimationFrame(
animate
);
