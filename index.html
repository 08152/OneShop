<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Darknet Suche</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }
        h1 {
            color: #00ff66;
            font-size: 24px;
            margin-bottom: 5px;
        }
        p {
            font-size: 14px;
            color: #888;
            margin-top: 0;
        }
        .search-box {
            margin: 15px 0;
        }
        input[type="text"] {
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            width: 60%;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #00ff66;
            border: none;
            color: #121212;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        input[type="submit"]:hover {
            background-color: #00cc52;
        }
        /* Das Ergebnisfenster */
        iframe {
            width: 100%;
            max-width: 900px;
            height: 70vh;
            border: 1px solid #333;
            background-color: #ffffff; /* DDG-HTML liefert weißen Hintergrund */
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Onion Suchportal</h1>
        <p>Ergebnisse werden direkt unten eingeblendet.</p>

        <!-- Formular sendet die Suchanfrage an das iframe ("results") -->
        <div class="search-box">
            <form method="get" action="https://html.duckduckgo.com/html/" target="results">
                <input type="text" name="q" placeholder="Suchbegriff eingeben..." required>
                <input type="submit" value="Suchen">
            </form>
        </div>
    </div>

    <!-- Hier werden die Suchergebnisse geladen -->
    <iframe name="results" src="about:blank" title="Suchergebnisse"></iframe>

</body>
</html>
