<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZEROPOINT – Mapper</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#79caff;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    z-index:20;
    width:360px;
    padding:16px;
    background:rgba(20,25,29,.9);
    color:white;
    border-radius:15px;
    box-shadow:0 10px 40px #0008;
}

#title{
    font-size:26px;
    font-weight:bold;
    margin-bottom:12px;
}

.row{
    display:flex;
    gap:8px;
}

input{
    flex:1;
    min-width:0;
    padding:11px;
    border:0;
    border-radius:8px;
    background:#101214;
    color:white;
    font-family:monospace;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 14px;
    font-weight:bold;
    cursor:pointer;
    color:white;
}

#generate{
    background:#3caf50;
}

#export{
    width:100%;
    margin-top:8px;
    background:#2874d8;
}

#info{
    margin-top:12px;
    font-size:13px;
    line-height:1.5;
}

#hint{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    background:#0008;
    color:white;
    padding:9px 14px;
    border-radius:9px;
    z-index:20;
    pointer-events:none;
    font-size:13px;
}

#loading{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#0005;
    color:white;
    font-size:20px;
    font-weight:bold;
    z-index:100;
}
</style>
</head>

<body>

<div id="ui">
    <div id="title">ZEROPOINT · MAPPER</div>

    <div class="row">
        <input id="seed" placeholder="Seed...">
        <button id="generate">Neue Welt</button>
    </div>

    <button id="export">GLB herunterladen</button>

    <div id="info">
        Seed: <b id="seedText">-</b><br>
        Weltgröße: 6000 × 6000<br>
        Chunks: <b id="chunksText">0</b>
    </div>
</div>

<div id="hint">
    Klick auf die Welt → Maus bewegen = 360° · Mausrad = Zoom
</div>

<div id="loading">
    ZEROPOINT WELT WIRD ERSTELLT...
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/exporters/GLTFExporter.js"></script>

<script>

// ============================================================
// ZEROPOINT MAPPER
// 3-D SYSTEM AUS DEINEM GESCHICKTEN CODE
// KEIN WASD
// KEIN SPIELER
// NUR 3-D KAMERA
// ============================================================

const WORLD_SIZE = 6000;
const CHUNK_SIZE = 300;

const RENDER_DISTANCE = 2;

let seedValue =
    Math.floor(Math.random()*2147483647);


// ============================================================
// SCENE
// ============================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x79caff);

scene.fog =
    new THREE.Fog(
        0x79caff,
        500,
        3500
    );


// ============================================================
// CAMERA
// EXAKT DAS PRINZIP AUS DEINEM CODE
// ============================================================

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth/innerHeight,
        .1,
        5000
    );


// ============================================================
// RENDERER
// ============================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


// ============================================================
// LICHT
// ============================================================

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1
    )
);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        1.6
    );

sun.position.set(
    500,
    900,
    400
);

sun.castShadow=true;

scene.add(sun);


// ============================================================
// 3-D KAMERA-OBJEKT
// AUS DEINEM ORIGINAL ÜBERNOMMEN
// ============================================================

const cameraRig =
    new THREE.Object3D();

scene.add(cameraRig);

cameraRig.add(camera);


// ============================================================
// KAMERA-POSITION
// ============================================================

camera.position.set(
    0,
    180,
    700
);


// ============================================================
// MAUS-3D
// AUS DEINEM CODE
// ============================================================

let rotX = -.45;
let rotY = 0;

let mouseDown=false;

renderer.domElement.addEventListener(
    "mousedown",
    e=>{
        if(e.button===0)
            mouseDown=true;
    }
);

window.addEventListener(
    "mouseup",
    ()=>{
        mouseDown=false;
    }
);

window.addEventListener(
    "mousemove",
    e=>{

        if(!mouseDown)
            return;

        rotY -= e.movementX*.003;

        rotX -= e.movementY*.003;

        rotX =
            Math.max(
                -1.5,
                Math.min(
                    1.5,
                    rotX
                )
            );

        camera.rotation.x=rotX;

        cameraRig.rotation.y=rotY;
    }
);


// ============================================================
// ZOOM
// ============================================================

renderer.domElement.addEventListener(
    "wheel",
    e=>{

        e.preventDefault();

        const direction =
            new THREE.Vector3(
                0,
                0,
                1
            );

        direction.applyQuaternion(
            camera.quaternion
        );

        camera.position.addScaledVector(
            direction,
            e.deltaY*.7
        );

        camera.position.x =
            Math.max(
                -2800,
                Math.min(
                    2800,
                    camera.position.x
                )
            );

        camera.position.z =
            Math.max(
                -2800,
                Math.min(
                    2800,
                    camera.position.z
                )
            );

    },
    {passive:false}
);


// ============================================================
// HASH
// ============================================================

function hash(x,z){

    let n =
        Math.imul(
            x|0,
            374761393
        ) ^
        Math.imul(
            z|0,
            668265263
        ) ^
        Math.imul(
            seedValue|0,
            1442695041
        );

    n ^= n>>>13;

    n =
        Math.imul(
            n,
            1274126177
        );

    n ^= n>>>16;

    return (
        n>>>0
    )/4294967295;
}


// ============================================================
// NOISE
// ============================================================

function noise(x,z){

    const x0=Math.floor(x);
    const z0=Math.floor(z);

    const x1=x0+1;
    const z1=z0+1;

    const sx=x-x0;
    const sz=z-z0;

    const a=hash(x0,z0);
    const b=hash(x1,z0);
    const c=hash(x0,z1);
    const d=hash(x1,z1);

    const ab =
        a+(b-a)*sx;

    const cd =
        c+(d-c)*sx;

    return ab+(cd-ab)*sz;
}


// ============================================================
// FBM
// ============================================================

function fbm(x,z){

    let value=0;
    let amp=.5;
    let freq=1;

    for(let i=0;i<5;i++){

        value +=
            noise(
                x*freq,
                z*freq
            )*amp;

        freq*=2;
        amp*=.5;
    }

    return value;
}


// ============================================================
// TERRAIN
// ============================================================

function getHeight(x,z){

    let h=0;

    h +=
        (fbm(
            x*.0007,
            z*.0007
        )-.5)*260;

    h +=
        (fbm(
            x*.002,
            z*.002
        )-.5)*100;

    h +=
        (fbm(
            x*.007,
            z*.007
        )-.5)*35;

    const mountain =
        Math.max(
            0,
            fbm(
                x*.00035+50,
                z*.00035+90
            )-.52
        );

    h +=
        mountain*
        mountain*
        900;

    return h;
}


// ============================================================
// MATERIALIEN
// ============================================================

const grassMat =
    new THREE.MeshStandardMaterial({
        color:0x4d9944,
        roughness:1
    });

const forestMat =
    new THREE.MeshStandardMaterial({
        color:0x35783b,
        roughness:1
    });

const rockMat =
    new THREE.MeshStandardMaterial({
        color:0x707572,
        roughness:1
    });

const snowMat =
    new THREE.MeshStandardMaterial({
        color:0xf1f3f2,
        roughness:1
    });

const sandMat =
    new THREE.MeshStandardMaterial({
        color:0xd9bd82,
        roughness:1
    });

const trunkMat =
    new THREE.MeshStandardMaterial({
        color:0x604329,
        roughness:1
    });

const leafMat =
    new THREE.MeshStandardMaterial({
        color:0x2f7838,
        roughness:1
    });

const waterMat =
    new THREE.MeshStandardMaterial({
        color:0x318bc0,
        transparent:true,
        opacity:.72,
        roughness:.2
    });


// ============================================================
// WELT
// ============================================================

const world =
    new THREE.Group();

scene.add(world);

const chunks =
    new Map();


// ============================================================
// BIOME
// ============================================================

function getBiome(x,z,h){

    const moisture =
        fbm(
            x*.0012+700,
            z*.0012+400
        );

    if(h>260)
        return "snow";

    if(h>180)
        return "rock";

    if(h<5)
        return "sand";

    if(moisture>.63)
        return "forest";

    return "grass";
}


// ============================================================
// TREE
// ============================================================

function createTree(
    group,
    x,
    y,
    z,
    random
){

    const tree =
        new THREE.Group();

    const height =
        20+random*28;

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                1.2+random,
                1.8+random,
                height,
                7
            ),
            trunkMat
        );

    trunk.position.y=
        height/2;

    trunk.castShadow=true;

    tree.add(trunk);


    for(let i=0;i<4;i++){

        const leaves =
            new THREE.Mesh(
                new THREE.IcosahedronGeometry(
                    5+random*4,
                    1
                ),
                leafMat
            );

        const a =
            hash(
                Math.floor(x)+i*91,
                Math.floor(z)+i*31
            )*
            Math.PI*2;

        leaves.position.set(
            Math.cos(a)*(4+i),
            height*.55+i*5,
            Math.sin(a)*(4+i)
        );

        leaves.scale.y=1.1;

        leaves.castShadow=true;

        tree.add(leaves);
    }

    tree.position.set(
        x,
        y,
        z
    );

    group.add(tree);
}


// ============================================================
// FELS
// ============================================================

function createRock(
    group,
    x,
    y,
    z,
    random
){

    const size =
        3+random*13;

    const rock =
        new THREE.Mesh(
            new THREE.DodecahedronGeometry(
                size,
                1
            ),
            rockMat
        );

    rock.position.set(
        x,
        y+size*.35,
        z
    );

    rock.rotation.set(
        random*2,
        random*5,
        random*3
    );

    rock.scale.y=.6+random*.5;

    rock.castShadow=true;

    group.add(rock);
}


// ============================================================
// CHUNK
// ============================================================

function createChunk(cx,cz){

    const k =
        cx+","+cz;

    if(chunks.has(k))
        return;

    const group =
        new THREE.Group();

    const geo =
        new THREE.PlaneGeometry(
            CHUNK_SIZE,
            CHUNK_SIZE,
            20,
            20
        );

    geo.rotateX(
        -Math.PI/2
    );

    const pos =
        geo.attributes.position;

    let average=0;

    for(
        let i=0;
        i<pos.count;
        i++
    ){

        const lx=pos.getX(i);
        const lz=pos.getZ(i);

        const x =
            cx*CHUNK_SIZE+
            lx+
            CHUNK_SIZE/2-
            WORLD_SIZE/2;

        const z =
            cz*CHUNK_SIZE+
            lz+
            CHUNK_SIZE/2-
            WORLD_SIZE/2;

        const h=
            getHeight(x,z);

        pos.setY(i,h);

        average+=h;
    }

    geo.computeVertexNormals();

    average/=pos.count;

    const biome =
        getBiome(
            cx*CHUNK_SIZE-
            WORLD_SIZE/2+
            CHUNK_SIZE/2,

            cz*CHUNK_SIZE-
            WORLD_SIZE/2+
            CHUNK_SIZE/2,

            average
        );

    let material=grassMat;

    if(biome==="forest")
        material=forestMat;

    if(biome==="rock")
        material=rockMat;

    if(biome==="snow")
        material=snowMat;

    if(biome==="sand")
        material=sandMat;

    const terrain =
        new THREE.Mesh(
            geo,
            material
        );

    terrain.receiveShadow=true;

    group.add(terrain);


    // --------------------------------------------------------
    // DETAILS
    // --------------------------------------------------------

    const count =
        12+
        Math.floor(
            hash(cx*51,cz*93)*16
        );

    for(
        let i=0;
        i<count;
        i++
    ){

        const r1=
            hash(
                cx*1000+i,
                cz*2000+i
            );

        const r2=
            hash(
                cx*3000+i,
                cz*4000+i
            );

        const x=
            cx*CHUNK_SIZE+
            r1*CHUNK_SIZE-
            WORLD_SIZE/2;

        const z=
            cz*CHUNK_SIZE+
            r2*CHUNK_SIZE-
            WORLD_SIZE/2;

        const y=
            getHeight(x,z);

        const b=
            getBiome(x,z,y);

        if(
            b==="grass" ||
            b==="forest"
        ){

            if(r1>.3)
                createTree(
                    group,
                    x,
                    y,
                    z,
                    r2
                );

        }else if(
            b==="rock"
        ){

            createRock(
                group,
                x,
                y,
                z,
                r2
            );
        }
    }

    world.add(group);

    chunks.set(
        k,
        group
    );
}


// ============================================================
// WASSER
// ============================================================

function createWater(){

    const waterGroup =
        new THREE.Group();

    // Seen
    for(let i=0;i<8;i++){

        const r1=
            hash(i*811,999+i);

        const r2=
            hash(i*311,555+i);

        const x=
            (r1-.5)*4800;

        const z=
            (r2-.5)*4800;

        const lake =
            new THREE.Mesh(
                new THREE.CircleGeometry(
                    70+r1*130,
                    40
                ),
                waterMat
            );

        lake.rotation.x=
            -Math.PI/2;

        lake.position.set(
            x,
            4,
            z
        );

        lake.scale.x=
            .6+r2*.6;

        waterGroup.add(lake);
    }

    world.add(waterGroup);
}


// ============================================================
// GENERIEREN
// ============================================================

function generate(){

    document.getElementById(
        "loading"
    ).style.display="flex";

    requestAnimationFrame(()=>{

        while(world.children.length)
            world.remove(
                world.children[0]
            );

        chunks.clear();

        // Welt in Chunks
        for(
            let cx=0;
            cx<WORLD_SIZE/CHUNK_SIZE;
            cx++
        ){

            for(
                let cz=0;
                cz<WORLD_SIZE/CHUNK_SIZE;
                cz++
            ){

                createChunk(
                    cx,
                    cz
                );

            }
        }

        createWater();

        document.getElementById(
            "seedText"
        ).innerText=seedValue;

        document.getElementById(
            "chunksText"
        ).innerText=chunks.size;

        camera.position.set(
            0,
            250,
            900
        );

        rotX=-.35;
        rotY=0;

        camera.rotation.x=rotX;
        cameraRig.rotation.y=rotY;

        document.getElementById(
            "loading"
        ).style.display="none";

    });
}


// ============================================================
// SEED
// ============================================================

document.getElementById(
    "generate"
).onclick=()=>{

    const text =
        document.getElementById(
            "seed"
        ).value.trim();

    if(text===""){

        seedValue=
            Math.floor(
                Math.random()*
                2147483647
            );

    }else{

        let n=0;

        for(
            let i=0;
            i<text.length;
            i++
        ){

            n=
                Math.imul(
                    n^text.charCodeAt(i),
                    16777619
                );

        }

        seedValue=
            Math.abs(n)||1;
    }

    generate();
};


// ============================================================
// GLB
// ============================================================

document.getElementById(
    "export"
).onclick=()=>{

    const exporter =
        new THREE.GLTFExporter();

    const button =
        document.getElementById(
            "export"
        );

    button.disabled=true;

    button.innerText=
        "GLB wird erstellt...";

    exporter.parse(
        world,

        result=>{

            const blob =
                new Blob(
                    [result],
                    {
                        type:
                        "model/gltf-binary"
                    }
                );

            const url =
                URL.createObjectURL(
                    blob
                );

            const a =
                document.createElement(
                    "a"
                );

            a.href=url;

            a.download=
                "ZEROPOINT_"+seedValue+".glb";

            a.click();

            URL.revokeObjectURL(url);

            button.disabled=false;

            button.innerText=
                "GLB herunterladen";
        },

        error=>{

            console.error(error);

            button.disabled=false;

            button.innerText=
                "GLB herunterladen";

            alert(
                "GLB-Export fehlgeschlagen."
            );
        },

        {
            binary:true
        }
    );
};


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


// ============================================================
// START
// ============================================================

generate();


// ============================================================
// LOOP
// ============================================================

function animate(){

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>

</body>
</html>
