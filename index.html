<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Lumora AI</title>

<style>

/* ======================================================
   RESET
====================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#0d0d0f;

    color:#fff;

    overflow:hidden;
}


/* ======================================================
   APP
====================================================== */

.app{
    width:100%;
    height:100vh;

    display:flex;
}


/* ======================================================
   SIDEBAR
====================================================== */

.sidebar{
    width:250px;

    height:100%;

    background:#121215;

    border-right:
        1px solid #29292e;

    padding:18px;

    display:flex;
    flex-direction:column;
}

.logo{
    display:flex;

    align-items:center;

    gap:10px;

    font-size:20px;

    font-weight:700;

    margin-bottom:30px;
}

.logoIcon{
    width:38px;
    height:38px;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #4285f4,
            #9b72cb,
            #d96570,
            #fbbc04,
            #34a853
        );

    background-size:
        400% 400%;

    animation:
        rainbow 7s linear infinite;

    display:flex;

    align-items:center;
    justify-content:center;
}

.newChat{
    width:100%;

    padding:13px;

    border:0;

    border-radius:14px;

    background:#242429;

    color:#fff;

    cursor:pointer;

    font-size:14px;
}

.newChat:hover{
    background:#303037;
}

.sidebarTitle{
    color:#77777f;

    font-size:11px;

    margin:
        28px 8px 10px;
}

.history{
    display:flex;

    flex-direction:column;

    gap:3px;
}

.historyItem{
    padding:11px;

    border-radius:10px;

    color:#c7c7cd;

    font-size:13px;

    cursor:pointer;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.historyItem:hover{
    background:#202025;
}


/* ======================================================
   MAIN
====================================================== */

.main{
    flex:1;

    min-width:0;

    height:100%;

    position:relative;

    display:flex;

    flex-direction:column;
}


/* ======================================================
   TOPBAR
====================================================== */

.topbar{
    height:65px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:flex-end;

    padding:
        0 25px;
}

.model{
    background:#1e1e22;

    border:
        1px solid #303036;

    border-radius:20px;

    padding:
        9px 15px;

    color:#d5d5da;

    font-size:13px;
}


/* ======================================================
   CHAT
====================================================== */

.chat{
    flex:1;

    overflow-y:auto;

    padding:
        20px 20px 190px;

    scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
    width:7px;
}

.chat::-webkit-scrollbar-thumb{
    background:#33333a;

    border-radius:10px;
}

.chatInner{
    width:
        min(900px,100%);

    margin:auto;
}


/* ======================================================
   START SCREEN
====================================================== */

.startScreen{
    min-height:
        calc(100vh - 180px);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;
}

.aiName{
    font-size:
        clamp(45px,7vw,72px);

    font-weight:700;

    letter-spacing:-4px;

    margin-bottom:8px;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #8e75d9,
            #d96570,
            #fbbc04,
            #34a853,
            #4285f4
        );

    background-size:
        500% 500%;

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color:transparent;

    animation:
        rainbow 7s linear infinite;
}

.subtitle{
    color:#77777f;

    font-size:14px;
}


/* ======================================================
   MESSAGES
====================================================== */

.message{
    width:100%;

    display:flex;

    margin-bottom:25px;
}

.message.user{
    justify-content:flex-end;
}

.message.ai{
    justify-content:flex-start;
}

.userBubble{
    max-width:
        min(720px,85%);

    background:#29292f;

    border-radius:
        22px 22px 5px 22px;

    padding:
        13px 17px;

    color:#f1f1f3;

    line-height:1.5;

    white-space:pre-wrap;

    word-break:break-word;
}

.aiMessage{
    width:
        min(850px,100%);

    padding:
        4px 0;
}

.aiHeader{
    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:10px;

    color:#dddde2;

    font-weight:600;
}

.aiSmallIcon{
    width:28px;
    height:28px;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            #4285f4,
            #9b72cb,
            #d96570,
            #fbbc04
        );

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:14px;
}

.aiText{
    color:#dddde1;

    line-height:1.6;

    font-size:15px;
}


/* ======================================================
   SEARCH RESULTS INSIDE MESSAGE
====================================================== */

.searchIntro{
    margin-bottom:14px;

    color:#d5d5da;

    font-size:15px;
}

.searchResults{
    display:flex;

    flex-direction:column;

    gap:10px;
}

.searchResult{
    display:block;

    text-decoration:none;

    background:#18181d;

    border:
        1px solid #2c2c32;

    border-radius:15px;

    padding:15px;

    transition:.2s;
}

.searchResult:hover{
    background:#202027;

    border-color:#44444c;

    transform:
        translateY(-1px);
}

.searchResultTitle{
    color:#8ab4f8;

    font-size:16px;

    font-weight:600;

    margin-bottom:7px;
}

.searchResultDescription{
    color:#c3c3ca;

    font-size:13px;

    line-height:1.5;
}

.searchResultUrl{
    color:#65b879;

    font-size:11px;

    margin-top:9px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.searchInfo{
    margin-top:13px;

    color:#77777f;

    font-size:12px;
}

.searchError{
    background:#1b1718;

    border:
        1px solid #4b2c30;

    border-radius:14px;

    padding:15px;

    color:#ddd;
}

.searchErrorTitle{
    color:#f28b82;

    font-weight:600;

    margin-bottom:7px;
}


/* ======================================================
   IMAGE
====================================================== */

.imageMessage{
    display:flex;

    gap:8px;

    flex-wrap:wrap;

    margin-top:10px;
}

.imageMessage img{
    width:100px;
    height:100px;

    object-fit:cover;

    border-radius:13px;

    border:
        1px solid #3b3b42;
}


/* ======================================================
   INPUT AREA
====================================================== */

.inputArea{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:50;

    padding:
        15px 20px 20px;

    background:
        linear-gradient(
            to top,
            #0d0d0f 68%,
            transparent
        );
}

.inputWrapper{
    width:
        min(850px,100%);

    margin:auto;
}

.inputBox{
    padding:5px;

    border-radius:30px;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #8e75d9,
            #d96570,
            #fbbc04,
            #34a853,
            #4285f4
        );

    background-size:
        500% 500%;

    animation:
        rainbow 7s linear infinite;
}

.inputInner{
    min-height:155px;

    border-radius:26px;

    background:#17171b;

    padding:20px;

    display:flex;

    flex-direction:column;
}

textarea{
    width:100%;

    min-height:70px;

    max-height:130px;

    resize:none;

    outline:none;

    border:0;

    background:transparent;

    color:#fff;

    font-family:inherit;

    font-size:17px;

    line-height:1.5;
}

textarea::placeholder{
    color:#77777f;
}

.inputBottom{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-top:12px;
}

.buttonGroup{
    display:flex;

    gap:8px;
}

.iconButton{
    width:40px;
    height:40px;

    border:0;

    border-radius:50%;

    background:#25252b;

    color:#fff;

    cursor:pointer;

    font-size:18px;

    display:flex;

    align-items:center;

    justify-content:center;
}

.iconButton:hover{
    background:#36363d;
}

.sendButton{
    width:44px;
    height:44px;

    border:0;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #4285f4,
            #9b72cb,
            #d96570
        );

    color:#fff;

    cursor:pointer;

    font-size:20px;

    display:flex;

    align-items:center;

    justify-content:center;
}

.sendButton:hover{
    transform:scale(1.07);
}

.sendButton:disabled{
    opacity:.5;

    cursor:wait;

    transform:none;
}

#imageInput{
    display:none;
}


/* ======================================================
   IMAGE PREVIEW
====================================================== */

.preview{
    display:none;

    gap:8px;

    margin-bottom:10px;

    overflow-x:auto;
}

.preview.show{
    display:flex;
}

.previewItem{
    flex-shrink:0;
}

.previewItem img{
    width:62px;
    height:62px;

    object-fit:cover;

    border-radius:11px;

    border:
        1px solid #444;
}


/* ======================================================
   STATUS
====================================================== */

.status{
    height:18px;

    margin-top:7px;

    text-align:center;

    color:#77777f;

    font-size:11px;
}

.footer{
    text-align:center;

    color:#55555c;

    font-size:10px;

    margin-top:7px;
}


/* ======================================================
   LOADING
====================================================== */

.loading{
    display:flex;

    align-items:center;

    gap:8px;

    color:#aaaab1;
}

.loadingDots{
    display:flex;

    gap:4px;
}

.dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#888;

    animation:
        pulse 1s infinite alternate;
}

.dot:nth-child(2){
    animation-delay:.2s;
}

.dot:nth-child(3){
    animation-delay:.4s;
}


/* ======================================================
   ANIMATION
====================================================== */

@keyframes rainbow{

    0%{
        background-position:0% 50%;
    }

    25%{
        background-position:50% 100%;
    }

    50%{
        background-position:100% 50%;
    }

    75%{
        background-position:50% 0%;
    }

    100%{
        background-position:0% 50%;
    }

}

@keyframes pulse{

    from{
        opacity:.3;
    }

    to{
        opacity:1;
    }

}


/* ======================================================
   MOBILE
====================================================== */

@media(max-width:700px){

    .sidebar{
        display:none;
    }

    .topbar{
        height:55px;

        padding:
            0 15px;
    }

    .chat{
        padding:
            15px 13px 190px;
    }

    .inputArea{
        padding:
            10px 10px 14px;
    }

    .inputInner{
        min-height:145px;

        padding:16px;
    }

    .aiName{
        font-size:50px;
    }

    .userBubble{
        max-width:90%;
    }

}

</style>

</head>

<body>

<div class="app">


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar">

    <div class="logo">

        <div class="logoIcon">
            ✦
        </div>

        <span>Lumora</span>

    </div>


    <button
        class="newChat"
        onclick="newChat()"
    >
        ＋ Neuer Chat
    </button>


    <div class="sidebarTitle">
        VERLAUF
    </div>


    <div
        id="history"
        class="history"
    >

        <div class="historyItem">
            Neuer Chat
        </div>

    </div>

</aside>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


<div class="topbar">

    <div class="model">
        Lumora 1.0 ▾
    </div>

</div>


<!-- =====================================================
     CHAT
===================================================== -->

<div
    id="chat"
    class="chat"
>

    <div
        id="chatInner"
        class="chatInner"
    >

        <div
            id="startScreen"
            class="startScreen"
        >

            <div class="aiName">
                Lumora
            </div>

            <div class="subtitle">
                Deine kreative KI
            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     INPUT
===================================================== -->

<div class="inputArea">

    <div class="inputWrapper">

        <div class="inputBox">

            <div class="inputInner">


                <div
                    id="preview"
                    class="preview"
                ></div>


                <textarea
                    id="message"
                    placeholder="Frag Lumora etwas …"
                    autocomplete="off"
                ></textarea>


                <div class="inputBottom">


                    <div class="buttonGroup">

                        <label
                            for="imageInput"
                            class="iconButton"
                            title="Bild hochladen"
                        >
                            ＋
                        </label>


                        <input
                            id="imageInput"
                            type="file"
                            accept="image/*"
                            multiple
                        >


                        <button
                            type="button"
                            class="iconButton"
                            onclick="openImagePicker()"
                            title="Bild hochladen"
                        >
                            🖼
                        </button>

                    </div>


                    <div class="buttonGroup">

                        <button
                            type="button"
                            class="iconButton"
                            title="Mikrofon"
                        >
                            🎤
                        </button>


                        <button
                            id="sendButton"
                            type="button"
                            class="sendButton"
                            title="Suchen"
                        >
                            ↑
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <div
            id="status"
            class="status"
        ></div>


        <div class="footer">
            Lumora kann Fehler machen. Überprüfe wichtige Informationen.
        </div>

    </div>

</div>


</main>

</div>


<script>

/* ======================================================
   ELEMENTE
====================================================== */

const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const messageInput =
    document.getElementById("message");

const sendButton =
    document.getElementById("sendButton");

const imageInput =
    document.getElementById("imageInput");

const preview =
    document.getElementById("preview");

const status =
    document.getElementById("status");


let selectedImages = [];


/* ======================================================
   BILDER
====================================================== */

imageInput.addEventListener(
    "change",
    () => {

        selectedImages =
            Array.from(
                imageInput.files
            ).filter(
                file =>
                    file.type.startsWith("image/")
            );

        renderPreview();

    }
);


function renderPreview(){

    preview.innerHTML = "";

    if(
        selectedImages.length === 0
    ){

        preview.classList.remove(
            "show"
        );

        return;
    }


    preview.classList.add(
        "show"
    );


    selectedImages.forEach(
        file => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "previewItem";


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                URL.createObjectURL(
                    file
                );


            item.appendChild(
                image
            );


            preview.appendChild(
                item
            );

        }
    );

}


function openImagePicker(){

    imageInput.click();

}


/* ======================================================
   USER-NACHRICHT
====================================================== */

function addUserMessage(
    text,
    images
){

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message user";


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "userBubble";


    if(text){

        bubble.textContent =
            text;

    }


    if(
        images &&
        images.length
    ){

        const imageContainer =
            document.createElement(
                "div"
            );

        imageContainer.className =
            "imageMessage";


        images.forEach(
            file => {

                const image =
                    document.createElement(
                        "img"
                    );


                image.src =
                    URL.createObjectURL(
                        file
                    );


                imageContainer.appendChild(
                    image
                );

            }
        );


        bubble.appendChild(
            imageContainer
        );

    }


    wrapper.appendChild(
        bubble
    );

    chatInner.appendChild(
        wrapper
    );


    scrollChat();

}


/* ======================================================
   AI NACHRICHT
====================================================== */

function createAIMessage(){

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message ai";


    const box =
        document.createElement(
            "div"
        );

    box.className =
        "aiMessage";


    const header =
        document.createElement(
            "div"
        );

    header.className =
        "aiHeader";


    const icon =
        document.createElement(
            "div"
        );

    icon.className =
        "aiSmallIcon";

    icon.textContent =
        "✦";


    const name =
        document.createElement(
            "span"
        );

    name.textContent =
        "Lumora";


    header.appendChild(
        icon
    );

    header.appendChild(
        name
    );


    const content =
        document.createElement(
            "div"
        );

    content.className =
        "aiText";


    box.appendChild(
        header
    );

    box.appendChild(
        content
    );


    wrapper.appendChild(
        box
    );

    chatInner.appendChild(
        wrapper
    );


    return content;

}


/* ======================================================
   LOADING
====================================================== */

function showLoading(){

    const content =
        createAIMessage();


    content.innerHTML = `

        <div class="loading">

            <span>Ich suche im Web</span>

            <div class="loadingDots">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

        </div>

    `;


    scrollChat();


    return content;

}


/* ======================================================
   SUCHERGEBNISSE RENDERN
====================================================== */

function renderSearchResults(
    container,
    data
){

    container.innerHTML = "";


    const intro =
        document.createElement(
            "div"
        );

    intro.className =
        "searchIntro";


    intro.textContent =
        `🔎 Ich habe nach „${data.query}“ gesucht.`;

    container.appendChild(
        intro
    );


    const results =
        document.createElement(
            "div"
        );

    results.className =
        "searchResults";


    if(
        !data.results ||
        data.results.length === 0
    ){

        const empty =
            document.createElement(
                "div"
            );

        empty.style.color =
            "#888890";

        empty.textContent =
            "Keine Suchergebnisse gefunden.";


        results.appendChild(
            empty
        );

    } else {

        data.results.forEach(
            item => {

                const card =
                    document.createElement(
                        "a"
                    );


                card.className =
                    "searchResult";


                card.href =
                    item.url;


                card.target =
                    "_blank";


                card.rel =
                    "noopener noreferrer";


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "searchResultTitle";

                title.textContent =
                    item.title;


                const description =
                    document.createElement(
                        "div"
                    );

                description.className =
                    "searchResultDescription";

                description.textContent =
                    item.description ||
                    "Keine Beschreibung verfügbar.";


                const url =
                    document.createElement(
                        "div"
                    );

                url.className =
                    "searchResultUrl";

                url.textContent =
                    item.url;


                card.appendChild(
                    title
                );

                card.appendChild(
                    description
                );

                card.appendChild(
                    url
                );


                results.appendChild(
                    card
                );

            }
        );

    }


    container.appendChild(
        results
    );


    const info =
        document.createElement(
            "div"
        );

    info.className =
        "searchInfo";


    info.textContent =
        `${data.count || 0} Ergebnisse`;


    container.appendChild(
        info
    );

}


/* ======================================================
   FEHLER
====================================================== */

function renderSearchError(
    container,
    message
){

    container.innerHTML = "";


    const error =
        document.createElement(
            "div"
        );

    error.className =
        "searchError";


    const title =
        document.createElement(
            "div"
        );

    title.className =
        "searchErrorTitle";

    title.textContent =
        "Websuche beendet";


    const text =
        document.createElement(
            "div"
        );

    text.textContent =
        message;


    error.appendChild(
        title
    );

    error.appendChild(
        text
    );


    container.appendChild(
        error
    );

}


/* ======================================================
   WEB-SUCHE
====================================================== */

async function searchWeb(
    query,
    aiContainer
){

    try {

        const response =
            await fetch(
                "/api/search?q=" +
                encodeURIComponent(query)
            );


        let data;


        try {

            data =
                await response.json();

        } catch {

            throw new Error(
                "Der Server hat keine gültige Antwort zurückgegeben."
            );

        }


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.error ||
                "Die Suche ist fehlgeschlagen."
            );

        }


        renderSearchResults(
            aiContainer,
            data
        );


        status.textContent =
            `${data.count} Treffer gefunden`;


    } catch(error){

        console.error(
            error
        );


        renderSearchError(
            aiContainer,
            error.message
        );


        status.textContent =
            "Suche beendet";

    } finally {

        sendButton.disabled =
            false;

    }


    scrollChat();

}


/* ======================================================
   SENDEN
====================================================== */

async function sendMessage(){

    const text =
        messageInput.value.trim();


    const images =
        [...selectedImages];


    if(
        !text &&
        images.length === 0
    ){

        messageInput.focus();

        return;

    }


    const start =
        document.getElementById(
            "startScreen"
        );


    if(start){

        start.style.display =
            "none";

    }


    /*
      Benutzer-Nachricht anzeigen
    */

    addUserMessage(
        text,
        images
    );


    /*
      Eingabe leeren
    */

    messageInput.value = "";

    selectedImages = [];

    imageInput.value = "";

    renderPreview();


    /*
      Bei Text IMMER suchen
    */

    if(text){

        sendButton.disabled =
            true;

        status.textContent =
            "Suche im Web …";


        const aiContainer =
            showLoading();


        await searchWeb(
            text,
            aiContainer
        );


    } else {

        /*
          Nur Bild
        */

        const aiContainer =
            createAIMessage();


        aiContainer.textContent =
            "🖼️ Bild empfangen. Die Bildanalyse ist noch nicht angeschlossen.";

    }


    messageInput.focus();

}


/* ======================================================
   ENTER
====================================================== */

messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ======================================================
   BUTTON
====================================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* ======================================================
   SCROLL
====================================================== */

function scrollChat(){

    setTimeout(
        () => {

            chat.scrollTop =
                chat.scrollHeight;

        },
        50
    );

}


/* ======================================================
   NEUER CHAT
====================================================== */

function newChat(){

    chatInner.innerHTML = `

        <div
            id="startScreen"
            class="startScreen"
        >

            <div class="aiName">
                Lumora
            </div>

            <div class="subtitle">
                Deine kreative KI
            </div>

        </div>

    `;


    messageInput.value = "";

    selectedImages = [];

    imageInput.value = "";

    renderPreview();

    status.textContent = "";

    chat.scrollTop = 0;

    messageInput.focus();

}

</script>
