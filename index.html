<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GHOST Voice Studio</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#08080f;
    color:white;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.app{
    width:min(900px,95vw);
    background:#12121e;
    border:1px solid #303049;
    border-radius:24px;
    padding:25px;
    box-shadow:0 30px 100px #000b;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#8b78ff;
}

.status{
    color:#9292a8;
    font-size:13px;
}

.recordArea{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:25px;
    border-radius:20px;
    background:#0d0d17;
    border:1px solid #28283e;
}

.recordButton{
    width:120px;
    height:120px;
    border-radius:50%;
    border:8px solid #25253a;
    background:#8b78ff;
    color:white;
    font-size:35px;
    cursor:pointer;
    transition:.15s;
    box-shadow:0 0 0 0 #8b78ff55;
}

.recordButton:hover{
    transform:scale(1.04);
}

.recordButton.recording{
    background:#ff4f6d;
    box-shadow:0 0 0 15px #ff4f6d22;
}

.timer{
    margin-top:15px;
    font-size:22px;
    font-weight:bold;
    font-variant-numeric:tabular-nums;
}

.visualizer{
    width:100%;
    height:100px;
    margin-top:20px;
    border-radius:12px;
    background:#08080f;
    overflow:hidden;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.controls{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:18px;
}

.box{
    background:#191927;
    border:1px solid #303049;
    border-radius:15px;
    padding:15px;
}

.boxTitle{
    font-size:12px;
    color:#88889e;
    margin-bottom:8px;
}

.boxValue{
    font-size:20px;
    font-weight:bold;
}

.meter{
    height:7px;
    background:#08080e;
    border-radius:10px;
    margin-top:10px;
    overflow:hidden;
}

.meterFill{
    height:100%;
    width:0%;
    background:#8b78ff;
    transition:width .04s linear;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:18px;
}

button.action{
    border:0;
    border-radius:13px;
    padding:14px;
    background:#29293d;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button.action:hover{
    background:#383850;
}

button.action:disabled{
    opacity:.35;
    cursor:not-allowed;
}

audio{
    width:100%;
    margin-top:18px;
}

@media(max-width:650px){
    .controls{
        grid-template-columns:1fr;
    }

    .app{
        padding:16px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">
        GHOST <span>VOICE STUDIO</span>
    </div>

    <div class="status" id="status">
        Bereit
    </div>
</header>

<div class="recordArea">

    <button
        class="recordButton"
        id="recordButton">
        ●
    </button>

    <div class="timer" id="timer">
        00:00
    </div>

    <div class="visualizer">
        <canvas id="visualizer"></canvas>
    </div>

</div>

<div class="controls">

    <div class="box">
        <div class="boxTitle">STIMME</div>
        <div class="boxValue" id="voiceLevel">0%</div>

        <div class="meter">
            <div class="meterFill" id="voiceMeter"></div>
        </div>
    </div>

    <div class="box">
        <div class="boxTitle">MUSIK</div>
        <div class="boxValue" id="musicLevel">18%</div>

        <div class="meter">
            <div class="meterFill" id="musicMeter"></div>
        </div>
    </div>

    <div class="box">
        <div class="boxTitle">DUCKING</div>
        <div class="boxValue" id="duckLevel">AUTO</div>

        <div class="meter">
            <div class="meterFill" id="duckMeter"></div>
        </div>
    </div>

</div>

<div class="buttons">

    <button
        class="action"
        id="preview"
        disabled>
        ▶ VORSCHAU
    </button>

    <button
        class="action"
        id="stop"
        disabled>
        ■ STOP
    </button>

</div>

<audio id="player" controls></audio>

</div>

<script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>

<script>

let micStream=null;
let micSource=null;
let micAnalyser=null;

let voiceGain=null;
let musicGain=null;

let musicSynth=null;
let bassSynth=null;
let padSynth=null;

let limiter=null;

let recorder=null;
let recordedChunks=[];

let recording=false;
let startTime=0;
let timerInterval=null;

let animationFrame=null;

let outputStream=null;
let mediaDestination=null;

const recordButton=
    document.getElementById("recordButton");

const previewButton=
    document.getElementById("preview");

const stopButton=
    document.getElementById("stop");

const status=
    document.getElementById("status");

const timer=
    document.getElementById("timer");

const player=
    document.getElementById("player");

const canvas=
    document.getElementById("visualizer");

const ctx=
    canvas.getContext("2d");

const voiceLevel=
    document.getElementById("voiceLevel");

const musicLevel=
    document.getElementById("musicLevel");

const duckLevel=
    document.getElementById("duckLevel");

const voiceMeter=
    document.getElementById("voiceMeter");

const musicMeter=
    document.getElementById("musicMeter");

const duckMeter=
    document.getElementById("duckMeter");

async function setupAudio(){

    await Tone.start();

    if(micStream)
        return;

    micStream=
        await navigator.mediaDevices.getUserMedia({
            audio:{
                echoCancellation:true,
                noiseSuppression:true,
                autoGainControl:true
            }
        });

    const rawContext=
        Tone.getContext().rawContext;

    micSource=
        rawContext.createMediaStreamSource(
            micStream
        );

    micAnalyser=
        rawContext.createAnalyser();

    micAnalyser.fftSize=256;

    micSource.connect(micAnalyser);

    const micTone=
        new Tone.UserMedia();

    voiceGain=
        new Tone.Gain(1);

    musicGain=
        new Tone.Gain(0.18);

    limiter=
        new Tone.Limiter(-1)
            .toDestination();

    /*
        Die Stimme wird über UserMedia
        direkt in Tone.js eingespeist.
    */

    await micTone.open();

    micTone
        .connect(voiceGain);

    voiceGain
        .connect(limiter);

    /*
        Echter Tone.js Hintergrund:
        kein einzelner Piepton,
        sondern Akkorde + Bass + Melodie
        mit verschiedenen Synthesizern.
    */

    musicSynth=
        new Tone.PolySynth(
            Tone.Synth,
            {
                oscillator:{
                    type:"triangle"
                },
                envelope:{
                    attack:.08,
                    decay:.25,
                    sustain:.55,
                    release:1.2
                }
            }
        );

    musicSynth.volume.value=-8;

    bassSynth=
        new Tone.MonoSynth({
            oscillator:{
                type:"sine"
            },
            envelope:{
                attack:.03,
                decay:.25,
                sustain:.7,
                release:.8
            },
            filterEnvelope:{
                attack:.01,
                decay:.2,
                sustain:.5,
                release:.8,
                baseFrequency:80,
                octaves:2
            }
        });

    bassSynth.volume.value=-8;

    padSynth=
        new Tone.PolySynth(
            Tone.AMSynth,
            {
                envelope:{
                    attack:.8,
                    decay:.5,
                    sustain:.7,
                    release:2
                }
            }
        );

    padSynth.volume.value=-18;

    musicSynth.connect(musicGain);
    bassSynth.connect(musicGain);
    padSynth.connect(musicGain);

    musicGain.connect(limiter);

    /*
        Alles was an limiter geht wird
        zusätzlich aufgenommen.
    */

    const destination=
        Tone.getContext()
            .rawContext
            .createMediaStreamDestination();

    mediaDestination=destination;

    limiter.connect(destination);

    outputStream=
        destination.stream;

    createMusic();

    status.textContent=
        "Mikrofon bereit";

    previewButton.disabled=false;

    animate();
}

function createMusic(){

    Tone.getTransport().bpm.value=92;

    const chords=[
        ["C4","E4","G4"],
        ["A3","C4","E4"],
        ["F3","A3","C4"],
        ["G3","B3","D4"]
    ];

    const bass=[
        "C2",
        "A1",
        "F1",
        "G1"
    ];

    const melody=[
        ["G4","E4","C5","E4"],
        ["A4","E4","C5","E4"],
        ["A4","F4","C5","F4"],
        ["B4","G4","D5","G4"]
    ];

    let step=0;

    Tone.getTransport().scheduleRepeat(
        time=>{

            const chord=
                chords[
                    Math.floor(step/4)%chords.length
                ];

            musicSynth.triggerAttackRelease(
                chord,
                "2n",
                time,
                .35
            );

            bassSynth.triggerAttackRelease(
                bass[
                    Math.floor(step/4)%bass.length
                ],
                "2n",
                time,
                .42
            );

            const notes=
                melody[
                    Math.floor(step/4)%melody.length
                ];

            padSynth.triggerAttackRelease(
                notes,
                "1m",
                time,
                .18
            );

            step++;

        },
        "2n"
    );
}

async function startRecording(){

    await setupAudio();

    if(recording)
        return;

    await Tone.start();

    Tone.getTransport().start();

    recordedChunks=[];

    recorder=
        new MediaRecorder(
            outputStream,
            {
                mimeType:"audio/webm;codecs=opus"
            }
        );

    recorder.ondataavailable=e=>{
        if(e.data.size>0)
            recordedChunks.push(e.data);
    };

    recorder.onstop=()=>{

        const blob=
            new Blob(
                recordedChunks,
                {
                    type:"audio/webm"
                }
            );

        player.src=
            URL.createObjectURL(blob);

        status.textContent=
            "Aufnahme fertig";

    };

    recorder.start(250);

    recording=true;

    startTime=Date.now();

    recordButton.classList.add(
        "recording"
    );

    recordButton.textContent="■";

    stopButton.disabled=false;

    status.textContent=
        "Aufnahme läuft";

    timerInterval=
        setInterval(updateTimer,100);

}

function stopRecording(){

    if(!recording)
        return;

    recording=false;

    if(recorder &&
       recorder.state!=="inactive"){

        recorder.stop();
    }

    Tone.getTransport().stop();

    recordButton.classList.remove(
        "recording"
    );

    recordButton.textContent="●";

    stopButton.disabled=true;

    clearInterval(
        timerInterval
    );

    status.textContent=
        "Aufnahme beendet";
}

function updateTimer(){

    const elapsed=
        Math.floor(
            (Date.now()-startTime)/1000
        );

    const minutes=
        Math.floor(elapsed/60);

    const seconds=
        elapsed%60;

    timer.textContent=
        String(minutes).padStart(2,"0")+
        ":"+
        String(seconds).padStart(2,"0");
}

function animate(){

    if(!micAnalyser){
        animationFrame=
            requestAnimationFrame(
                animate
            );
        return;
    }

    const data=
        new Uint8Array(
            micAnalyser.fftSize
        );

    micAnalyser.getByteTimeDomainData(
        data
    );

    let sum=0;

    for(let i=0;i<data.length;i++){

        const value=
            (data[i]-128)/128;

        sum+=value*value;
    }

    const rms=
        Math.sqrt(
            sum/data.length
        );

    let voice=
        Math.min(
            1,
            rms*5
        );

    voice=
        Math.pow(voice,.7);

    /*
        Automatisches Ducking:

        Stimme ruhig:
        Musik ca. 18%

        Stimme normal:
        Musik wird kleiner

        Stimme laut:
        Musik fast komplett heruntergeregelt
    */

    const duck=
        Math.max(
            .025,
            .18-(voice*.155)
        );

    if(musicGain){

        musicGain.gain.rampTo(
            duck,
            .04
        );
    }

    voiceLevel.textContent=
        Math.round(voice*100)+"%";

    musicLevel.textContent=
        Math.round(
            duck/.18*100
        )+"%";

    duckLevel.textContent=
        voice>0.55 ?
        "STARK":
        voice>0.2 ?
        "MITTEL":
        "LEICHT";

    voiceMeter.style.width=
        Math.round(voice*100)+"%";

    musicMeter.style.width=
        Math.round(
            duck/.18*100
        )+"%";

    duckMeter.style.width=
        Math.round(
            voice*100
        )+"%";

    drawVisualizer(data);

    animationFrame=
        requestAnimationFrame(
            animate
        );
}

function drawVisualizer(data){

    const width=
        canvas.width=
        canvas.clientWidth*
        devicePixelRatio;

    const height=
        canvas.height=
        canvas.clientHeight*
        devicePixelRatio;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    ctx.beginPath();

    for(
        let i=0;
        i<data.length;
        i++
    ){

        const x=
            i/(data.length-1)*
            width;

        const y=
            data[i]/255*
            height;

        if(i===0)
            ctx.moveTo(x,y);
        else
            ctx.lineTo(x,y);
    }

    ctx.lineWidth=
        2*devicePixelRatio;

    ctx.strokeStyle=
        "#8b78ff";

    ctx.stroke();
}

recordButton.onclick=
    startRecording;

stopButton.onclick=
    stopRecording;

previewButton.onclick=
    async()=>{

        await setupAudio();

        if(
            Tone.getTransport().state===
            "started"
        ){

            Tone.getTransport().stop();

            previewButton.textContent=
                "▶ VORSCHAU";

        }else{

            await Tone.start();

            Tone.getTransport().start();

            previewButton.textContent=
                "■ VORSCHAU STOPPEN";
        }
    };

window.addEventListener(
    "beforeunload",
    ()=>{
        if(micStream){

            micStream
                .getTracks()
                .forEach(
                    track=>track.stop()
                );
        }
    }
);

</script>

</body>
</html>
