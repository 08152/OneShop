<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHOST Island</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#75caff;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    color:white;
    text-shadow:0 2px 5px #000;
    z-index:5;
    pointer-events:none;
}

#hud b{
    font-size:22px;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:25px;
    text-shadow:0 0 5px #000;
    z-index:5;
    pointer-events:none;
}

#menu{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:20;
}

.panel{
    width:min(430px,90%);
    padding:35px;
    border-radius:20px;
    background:rgba(20,25,30,.96);
    color:white;
    text-align:center;
    box-shadow:0 15px 60px #000;
}

.panel h1{
    font-size:42px;
    margin:0 0 10px;
}

.panel p{
    color:#ddd;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#play{
    background:#42c957;
}

#newWorld{
    background:#e5a52b;
}

#seed{
    margin-top:15px;
    padding:10px;
    border-radius:8px;
    background:#111;
    font-family:monospace;
}
</style>
</head>

<body>

<div id="hud">
    <b>GHOST ISLAND</b><br>
    Seed: <span id="seedHud">...</span><br>
    Position: <span id="pos">0 / 0</span>
</div>

<div id="crosshair">+</div>

<div id="menu">
    <div class="panel">
        <h1>GHOST ISLAND</h1>

        <p>
            Riesige zufällig generierte 3D-Insel.
        </p>

        <p>
            Die Welt wird dauerhaft in diesem Browser gespeichert.
        </p>

        <div id="seed">Seed: ...</div>

        <button id="play">
            SPIEL STARTEN
        </button>

        <button id="newWorld">
            NEUE WELT GENERIEREN
        </button>
    </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";

import {
    PointerLockControls
} from
"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/PointerLockControls.js";


// =====================================================
// WELT-SEED
// =====================================================

let savedSeed =
    localStorage.getItem("ghostIslandSeed");

if(!savedSeed){

    savedSeed =
        Math.floor(
            Math.random()*2147483647
        ).toString();

    localStorage.setItem(
        "ghostIslandSeed",
        savedSeed
    );
}

let seed =
    Number(savedSeed);

document.getElementById("seed").textContent =
    "Seed: " + savedSeed;

document.getElementById("seedHud").textContent =
    savedSeed;


// =====================================================
// SEEDED RANDOM
// =====================================================

function random(){

    seed =
        (seed * 1664525 + 1013904223)
        >>> 0;

    return seed / 4294967296;
}


// =====================================================
// THREE.JS
// =====================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x79caff);

scene.fog =
    new THREE.Fog(
        0x79caff,
        900,
        5500
    );


const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.1,
        10000
    );


const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
    renderer.domElement
);


// =====================================================
// LICHT
// =====================================================

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x446644,
        2
    )
);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    1500,
    3000,
    1000
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

scene.add(sun);


// =====================================================
// TERRAIN
// =====================================================

const WORLD = 12000;
const SEGMENTS = 220;
const WATER = 8;

function height(x,z){

    const distance =
        Math.sqrt(x*x + z*z);

    const island =
        Math.max(
            0,
            1 - distance/5700
        );

    let h = 20;

    h +=
        Math.sin(
            x * 0.0018
        ) *
        Math.cos(
            z * 0.0016
        ) * 100;

    h +=
        Math.sin(
            x * 0.0047 +
            z * 0.003
        ) * 35;

    h +=
        Math.cos(
            x * 0.011 -
            z * 0.008
        ) * 12;

    // Berge
    const mountain =
        Math.max(
            0,
            Math.sin(x*0.0009) *
            Math.cos(z*0.0011)
        );

    h += mountain * 180;

    h *= island;

    return h;
}


const terrainGeometry =
    new THREE.PlaneGeometry(
        WORLD,
        WORLD,
        SEGMENTS,
        SEGMENTS
    );

terrainGeometry.rotateX(-Math.PI/2);

const vertices =
    terrainGeometry.attributes.position;

for(let i=0;i<vertices.count;i++){

    const x =
        vertices.getX(i);

    const z =
        vertices.getZ(i);

    vertices.setY(
        i,
        Math.max(
            height(x,z),
            WATER-5
        )
    );
}

terrainGeometry.computeVertexNormals();


const terrain =
    new THREE.Mesh(
        terrainGeometry,
        new THREE.MeshStandardMaterial({
            color:0x4fa447,
            roughness:1
        })
    );

terrain.receiveShadow = true;

scene.add(terrain);


// =====================================================
// WASSER
// =====================================================

const water =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            15000,
            15000
        ),
        new THREE.MeshStandardMaterial({
            color:0x198bd0,
            transparent:true,
            opacity:.72,
            roughness:.15
        })
    );

water.rotation.x =
    -Math.PI/2;

water.position.y =
    WATER;

scene.add(water);


// =====================================================
// BÄUME
// =====================================================

function tree(x,z){

    const y =
        height(x,z);

    if(y < WATER+5)
        return;

    const group =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                2,
                3,
                20,
                7
            ),
            new THREE.MeshStandardMaterial({
                color:0x69452c
            })
        );

    trunk.position.y=10;

    trunk.castShadow=true;

    group.add(trunk);


    const crown =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                16,
                40,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x237936
            })
        );

    crown.position.y=38;

    crown.castShadow=true;

    group.add(crown);


    group.position.set(
        x,
        y,
        z
    );

    scene.add(group);
}


for(let i=0;i<1100;i++){

    tree(
        (random()-.5)*10500,
        (random()-.5)*10500
    );
}


// =====================================================
// HÄUSER
// =====================================================

function building(x,z){

    const y =
        height(x,z);

    if(y < WATER+5)
        return;

    const w =
        30 + random()*50;

    const d =
        30 + random()*50;

    const h =
        20 + random()*55;


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,h,d
            ),
            new THREE.MeshStandardMaterial({
                color:
                    new THREE.Color(
                        .25+random()*.4,
                        .25+random()*.4,
                        .3+random()*.35
                    )
            })
        );

    body.position.set(
        x,
        y+h/2,
        z
    );

    body.rotation.y =
        random()*Math.PI;

    body.castShadow=true;
    body.receiveShadow=true;

    scene.add(body);


    const roof =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                Math.max(w,d)*.75,
                15,
                4
            ),
            new THREE.MeshStandardMaterial({
                color:0x34383c
            })
        );

    roof.position.set(
        x,
        y+h+7,
        z
    );

    roof.rotation.y =
        Math.PI/4;

    roof.castShadow=true;

    scene.add(roof);
}


for(let i=0;i<100;i++){

    building(
        (random()-.5)*8500,
        (random()-.5)*8500
    );
}


// =====================================================
// FELSEN
// =====================================================

function rock(x,z){

    const y =
        height(x,z);

    if(y < WATER+3)
        return;

    const size =
        5+random()*22;

    const r =
        new THREE.Mesh(
            new THREE.DodecahedronGeometry(
                size,
                1
            ),
            new THREE.MeshStandardMaterial({
                color:0x777777,
                roughness:1
            })
        );

    r.position.set(
        x,
        y+size*.5,
        z
    );

    r.rotation.set(
        random()*3,
        random()*3,
        random()*3
    );

    r.castShadow=true;

    scene.add(r);
}


for(let i=0;i<500;i++){

    rock(
        (random()-.5)*11000,
        (random()-.5)*11000
    );
}


// =====================================================
// SPIELER
// =====================================================

const controls =
    new PointerLockControls(
        camera,
        document.body
    );

scene.add(
    controls.getObject()
);


// Spawnpunkt
controls.getObject().position.set(
    0,
    height(0,0)+80,
    0
);


const keys={};

let velocityY=0;
let grounded=false;

document.addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;

        if(
            e.code==="Space" &&
            grounded
        ){

            velocityY=300;
            grounded=false;
        }
    }
);

document.addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);


// =====================================================
// START
// =====================================================

document.getElementById("play")
.addEventListener(
    "click",
    ()=>{
        controls.lock();
    }
);

controls.addEventListener(
    "lock",
    ()=>{
        document.getElementById("menu")
        .style.display="none";
    }
);

controls.addEventListener(
    "unlock",
    ()=>{
        document.getElementById("menu")
        .style.display="flex";
    }
);


// =====================================================
// NEUE WELT
// =====================================================

document.getElementById("newWorld")
.addEventListener(
    "click",
    ()=>{

        const newSeed =
            Math.floor(
                Math.random()*2147483647
            ).toString();

        localStorage.setItem(
            "ghostIslandSeed",
            newSeed
        );

        location.reload();
    }
);


// =====================================================
// SPIELLOOP
// =====================================================

const clock =
    new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    if(controls.isLocked){

        let speed =
            keys["ShiftLeft"] ||
            keys["ShiftRight"]
            ? 420
            : 250;


        if(keys["KeyW"])
            controls.moveForward(
                speed*dt
            );

        if(keys["KeyS"])
            controls.moveForward(
                -speed*dt
            );

        if(keys["KeyA"])
            controls.moveRight(
                -speed*dt
            );

        if(keys["KeyD"])
            controls.moveRight(
                speed*dt
            );


        // Schwerkraft
        velocityY -=
            850*dt;

        controls.getObject()
        .position.y +=
            velocityY*dt;


        const p =
            controls.getObject()
            .position;

        const ground =
            height(p.x,p.z)+70;


        if(p.y <= ground){

            p.y=ground;

            velocityY=0;

            grounded=true;
        }


        document.getElementById("pos")
        .textContent =
            Math.round(p.x) +
            " / " +
            Math.round(p.z);
    }


    renderer.render(
        scene,
        camera
    );
}

animate();


// =====================================================
// RESIZE
// =====================================================

addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
