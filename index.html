<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lumora AI</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:#0d0d10;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}


/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
}


/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:245px;
    background:#121216;
    border-right:1px solid #29292e;
    padding:18px;
    flex-shrink:0;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
    font-weight:bold;
    margin-bottom:28px;
}

.logoIcon{
    width:38px;
    height:38px;
    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #4285f4,
            #9b72cb,
            #d96570,
            #fbbc04,
            #34a853
        );

    background-size:400% 400%;

    animation:rainbow 7s linear infinite;
}

.newChat{
    width:100%;
    border:0;
    border-radius:14px;
    padding:13px;

    background:#242429;
    color:#fff;

    cursor:pointer;
}

.newChat:hover{
    background:#303036;
}

.sidebarTitle{
    color:#77777f;
    font-size:11px;
    margin:28px 8px 10px;
}

.historyItem{
    padding:11px;
    border-radius:10px;
    color:#c8c8ce;
    font-size:13px;
}

.historyItem:hover{
    background:#202025;
}


/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-width:0;
    height:100%;

    display:flex;
    flex-direction:column;

    position:relative;
}


/* =========================
   TOPBAR
========================= */

.topbar{
    height:65px;

    display:flex;
    align-items:center;
    justify-content:flex-end;

    padding:0 24px;
}


/* =========================
   MODE SELECTOR
========================= */

.modelSelector{
    position:relative;
}

.modelButton{
    border:1px solid #303037;

    background:#1e1e23;
    color:#ddd;

    padding:10px 15px;

    border-radius:20px;

    cursor:pointer;

    display:flex;
    align-items:center;

    gap:12px;

    font-size:13px;
}

.modelButton:hover{
    background:#29292f;
}

.modelMenu{
    position:absolute;

    right:0;
    top:48px;

    width:230px;

    background:#18181d;

    border:1px solid #303037;

    border-radius:16px;

    padding:7px;

    display:none;

    box-shadow:
        0 15px 40px rgba(0,0,0,.45);

    z-index:100;
}

.modelMenu.open{
    display:block;
}

.modelMenu button{
    width:100%;

    border:0;

    background:transparent;

    color:white;

    text-align:left;

    padding:12px;

    border-radius:11px;

    cursor:pointer;

    display:flex;
    flex-direction:column;

    gap:4px;
}

.modelMenu button:hover{
    background:#29292f;
}

.modelMenu strong{
    font-size:14px;
}

.modelMenu small{
    color:#85858d;
    font-size:11px;
}


/* =========================
   CHAT
========================= */

.chat{
    flex:1;

    overflow-y:auto;

    padding:
        20px
        20px
        200px;
}

.chatInner{
    width:min(900px,100%);
    margin:auto;
}


/* =========================
   START
========================= */

.start{
    min-height:
        calc(100vh - 200px);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;
}

.lumora{
    font-size:
        clamp(52px,8vw,76px);

    font-weight:bold;

    letter-spacing:-4px;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #9b72cb,
            #d96570,
            #fbbc04,
            #34a853,
            #4285f4
        );

    background-size:500% 500%;

    animation:
        rainbow 7s linear infinite;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.startText{
    color:#77777f;
    margin-top:8px;
}


/* =========================
   MESSAGES
========================= */

.message{
    margin-bottom:28px;
}

.user{
    display:flex;
    justify-content:flex-end;
}

.userBubble{
    max-width:80%;

    padding:
        13px 17px;

    border-radius:
        22px 22px 5px 22px;

    background:#29292f;

    white-space:pre-wrap;

    line-height:1.5;
}

.aiHeader{
    display:flex;
    align-items:center;

    gap:9px;

    margin-bottom:10px;

    font-weight:bold;
}

.aiIcon{
    width:29px;
    height:29px;

    border-radius:9px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #4285f4,
            #9b72cb,
            #d96570
        );
}

.aiContent{
    color:#dedee3;
    line-height:1.7;

    font-size:15px;
}


/* =========================
   LUMORA ANSWER
========================= */

.answer{
    background:#17171b;

    border:
        1px solid #292930;

    border-radius:18px;

    padding:18px;

    margin-top:5px;
}

.answerTitle{
    font-size:17px;
    font-weight:bold;

    margin-bottom:10px;
}

.answerText{
    color:#dedee3;

    line-height:1.7;
}

.answerSource{
    display:inline-block;

    margin-top:14px;

    color:#8ab4f8;

    text-decoration:none;

    font-size:12px;
}

.answerSource:hover{
    text-decoration:underline;
}


/* =========================
   THINKING
========================= */

.loading{
    color:#a0a0a8;

    display:flex;

    align-items:center;

    gap:10px;
}

.dots{
    display:flex;
    gap:4px;
}

.dot{
    width:6px;
    height:6px;

    background:#999;

    border-radius:50%;

    animation:
        pulse 1s infinite alternate;
}

.dot:nth-child(2){
    animation-delay:.2s;
}

.dot:nth-child(3){
    animation-delay:.4s;
}


/* =========================
   ERROR
========================= */

.error{
    background:#21191b;

    border:
        1px solid #503136;

    border-radius:15px;

    padding:15px;

    color:#ddd;
}

.errorTitle{
    color:#f28b82;

    font-weight:bold;

    margin-bottom:6px;
}


/* =========================
   INPUT
========================= */

.inputArea{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:
        15px
        20px
        20px;

    background:
        linear-gradient(
            to top,
            #0d0d10 70%,
            transparent
        );
}

.inputWrapper{
    width:min(850px,100%);
    margin:auto;
}

.inputBox{
    padding:5px;

    border-radius:30px;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #9b72cb,
            #d96570,
            #fbbc04,
            #34a853,
            #4285f4
        );

    background-size:500% 500%;

    animation:
        rainbow 7s linear infinite;
}

.inputInner{
    background:#17171b;

    border-radius:26px;

    padding:19px;

    min-height:150px;
}

textarea{
    width:100%;

    min-height:70px;
    max-height:130px;

    resize:none;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:17px;

    font-family:inherit;
}

textarea::placeholder{
    color:#77777f;
}

.inputBottom{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-top:12px;
}

.buttons{
    display:flex;
    gap:8px;
}

.iconButton,
.sendButton{
    width:42px;
    height:42px;

    border:0;

    border-radius:50%;

    cursor:pointer;

    color:#fff;

    display:flex;

    align-items:center;
    justify-content:center;
}

.iconButton{
    background:#27272d;
}

.iconButton:hover{
    background:#36363d;
}

.sendButton{
    background:
        linear-gradient(
            135deg,
            #4285f4,
            #9b72cb,
            #d96570
        );

    font-size:19px;
}

.sendButton:disabled{
    opacity:.5;
    cursor:wait;
}

#imageInput{
    display:none;
}

.status{
    height:18px;

    text-align:center;

    color:#77777f;

    font-size:11px;

    margin-top:7px;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes rainbow{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}

@keyframes pulse{

    from{
        opacity:.3;
    }

    to{
        opacity:1;
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .sidebar{
        display:none;
    }

    .chat{
        padding:
            15px
            12px
            195px;
    }

    .inputArea{
        padding:10px;
    }

    .userBubble{
        max-width:90%;
    }

}

</style>
</head>

<body>

<div class="app">


<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">

        <div class="logoIcon">
            ✦
        </div>

        Lumora

    </div>


    <button
        class="newChat"
        onclick="newChat()"
    >
        ＋ Neuer Chat
    </button>


    <div class="sidebarTitle">
        VERLAUF
    </div>


    <div id="history">

        <div class="historyItem">
            Neuer Chat
        </div>

    </div>

</aside>


<!-- MAIN -->

<main class="main">


    <div class="topbar">

        <div class="modelSelector">

            <button
                class="modelButton"
                id="modelButton"
                onclick="toggleModelMenu()"
            >

                <span id="modeName">
                    Normal
                </span>

                <span>
                    ⌄
                </span>

            </button>


            <div
                class="modelMenu"
                id="modelMenu"
            >

                <button
                    onclick="selectMode('normal')"
                >

                    <strong>
                        Normal
                    </strong>

                    <small>
                        Normales Denken
                    </small>

                </button>


                <button
                    onclick="selectMode('long')"
                >

                    <strong>
                        Länger Denken
                    </strong>

                    <small>
                        Mehr Zeit zum Nachdenken
                    </small>

                </button>


                <button
                    onclick="selectMode('instant')"
                >

                    <strong>
                        Instant
                    </strong>

                    <small>
                        Schnelle Antwort
                    </small>

                </button>

            </div>

        </div>

    </div>


    <!-- CHAT -->

    <div
        id="chat"
        class="chat"
    >

        <div
            id="chatInner"
            class="chatInner"
        >

            <div
                id="start"
                class="start"
            >

                <div class="lumora">
                    Lumora
                </div>

                <div class="startText">
                    Deine kreative KI
                </div>

            </div>

        </div>

    </div>


    <!-- INPUT -->

    <div class="inputArea">

        <div class="inputWrapper">

            <div class="inputBox">

                <div class="inputInner">

                    <textarea
                        id="message"
                        placeholder="Frag Lumora etwas …"
                    ></textarea>


                    <div class="inputBottom">

                        <div class="buttons">

                            <label
                                class="iconButton"
                                for="imageInput"
                            >
                                🖼
                            </label>

                            <input
                                id="imageInput"
                                type="file"
                                accept="image/*"
                                multiple
                            >

                        </div>


                        <div class="buttons">

                            <button
                                class="sendButton"
                                id="sendButton"
                            >
                                ↑
                            </button>

                        </div>

                    </div>

                </div>

            </div>


            <div
                id="status"
                class="status"
            ></div>

        </div>

    </div>

</main>

</div>


<script>

/* =====================================================
   ELEMENTE
===================================================== */

const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const input =
    document.getElementById("message");

const send =
    document.getElementById("sendButton");

const status =
    document.getElementById("status");

const imageInput =
    document.getElementById("imageInput");


/* =====================================================
   MODI
===================================================== */

let selectedMode = "normal";


const modes = {

    normal:{
        name:"Normal",
        text:"Denke nach",
        delay:700
    },

    long:{
        name:"Länger Denken",
        text:"Denke gründlicher nach",
        delay:1800
    },

    instant:{
        name:"Instant",
        text:"Denke nach",
        delay:100
    }

};


/* =====================================================
   MENÜ
===================================================== */

function toggleModelMenu(){

    document
        .getElementById("modelMenu")
        .classList.toggle("open");

}


function selectMode(mode){

    selectedMode = mode;

    document
        .getElementById("modeName")
        .textContent =
            modes[mode].name;

    document
        .getElementById("modelMenu")
        .classList.remove("open");

}


document.addEventListener(
    "click",
    event => {

        const selector =
            document.querySelector(
                ".modelSelector"
            );

        if(
            selector &&
            !selector.contains(
                event.target
            )
        ){

            document
                .getElementById(
                    "modelMenu"
                )
                .classList.remove(
                    "open"
                );

        }

    }
);


/* =====================================================
   USER-NACHRICHT
===================================================== */

function addUserMessage(text){

    const message =
        document.createElement("div");

    message.className =
        "message user";


    const bubble =
        document.createElement("div");

    bubble.className =
        "userBubble";

    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );


    chatInner.appendChild(
        message
    );


    scrollDown();

}


/* =====================================================
   AI-NACHRICHT
===================================================== */

function addAIMessage(){

    const message =
        document.createElement("div");

    message.className =
        "message";


    const header =
        document.createElement("div");

    header.className =
        "aiHeader";


    const icon =
        document.createElement("div");

    icon.className =
        "aiIcon";

    icon.textContent =
        "✦";


    const name =
        document.createElement("span");

    name.textContent =
        "Lumora";


    header.appendChild(icon);
    header.appendChild(name);


    const content =
        document.createElement("div");

    content.className =
        "aiContent";


    message.appendChild(header);
    message.appendChild(content);


    chatInner.appendChild(message);


    return content;

}


/* =====================================================
   DENKEN
===================================================== */

function showThinking(){

    const content =
        addAIMessage();


    const mode =
        modes[selectedMode];


    content.innerHTML = `

        <div class="loading">

            <span>
                ${mode.text}
            </span>

            <div class="dots">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

        </div>

    `;


    scrollDown();


    return content;

}


/* =====================================================
   EIGENE ANTWORT ERSTELLEN
===================================================== */

function createOwnAnswer(
    query,
    data
){

    /*
       Wir nehmen nur das relevanteste
       gefundene Ergebnis.

       Keine riesige Ergebnisliste.
    */

    let best = null;


    if(
        data.results &&
        data.results.length
    ){

        best =
            data.results.find(
                item =>
                    item.type === "abstract"
            ) ||

            data.results.find(
                item =>
                    item.type === "answer"
            ) ||

            data.results.find(
                item =>
                    item.type === "topic"
            );

    }


    if(!best){

        return {

            title:"Keine passende Information gefunden",

            text:
                "Ich konnte zu deiner Frage keine passende Information von DuckDuckGo erhalten.",

            source:""

        };

    }


    let text =
        best.text || "";


    /*
       Kleine sprachliche Umwandlung.
       Dadurch wird nicht einfach eine rohe
       Trefferliste angezeigt.
    */

    text =
        text
            .replace(
                /^according to/i,
                "Nach den verfügbaren Informationen"
            )
            .trim();


    if(
        !text.endsWith(".") &&
        !text.endsWith("!") &&
        !text.endsWith("?")
    ){

        text += ".";

    }


    return {

        title:
            data.heading ||
            best.title ||
            "Antwort",

        text:
            text,

        source:
            best.source || ""

    };

}


/* =====================================================
   ANTWORT DARSTELLEN
===================================================== */

function renderAnswer(
    content,
    query,
    data
){

    const answer =
        createOwnAnswer(
            query,
            data
        );


    content.innerHTML = "";


    const box =
        document.createElement("div");

    box.className =
        "answer";


    const title =
        document.createElement("div");

    title.className =
        "answerTitle";

    title.textContent =
        answer.title;


    const text =
        document.createElement("div");

    text.className =
        "answerText";

    text.textContent =
        answer.text;


    box.appendChild(title);
    box.appendChild(text);


    if(answer.source){

        const source =
            document.createElement("a");

        source.className =
            "answerSource";

        source.href =
            answer.source;

        source.target =
            "_blank";

        source.rel =
            "noopener noreferrer";

        source.textContent =
            "Quelle ansehen ↗";


        box.appendChild(source);

    }


    content.appendChild(box);


    scrollDown();

}


/* =====================================================
   FEHLER
===================================================== */

function renderError(
    content,
    message
){

    content.innerHTML = `

        <div class="error">

            <div class="errorTitle">
                Es ist ein Fehler aufgetreten
            </div>

            <div>
                ${escapeHTML(message)}
            </div>

        </div>

    `;

}


/* =====================================================
   HTML SICHER MACHEN
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   DUCKDUCKGO SUCHE
===================================================== */

async function search(
    query,
    content
){

    status.textContent =
        "Denke nach …";


    /*
       Je nach gewähltem Modus
       kurz warten.
    */

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                modes[selectedMode].delay
            )
    );


    try{

        /*
           Suche läuft weiterhin über
           unseren Server zu DuckDuckGo.
        */

        const response =
            await fetch(
                "/api/search?q=" +
                encodeURIComponent(
                    query
                )
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.error ||
                "Der Suchserver hat keine gültige Antwort geliefert."
            );

        }


        /*
           Nur EIN relevantes Ergebnis
           wird in eine Lumora-Nachricht
           umgewandelt.
        */

        renderAnswer(
            content,
            query,
            data
        );


        status.textContent =
            "Bereit";


    }catch(error){

        console.error(error);


        renderError(
            content,
            error.message
        );


        status.textContent =
            "Fehler";


    }finally{

        send.disabled =
            false;

    }


    scrollDown();

}


/* =====================================================
   SENDEN
===================================================== */

async function sendMessage(){

    const query =
        input.value.trim();


    if(!query){

        input.focus();

        return;

    }


    const start =
        document.getElementById(
            "start"
        );


    if(start){

        start.remove();

    }


    addUserMessage(query);


    input.value = "";


    send.disabled = true;


    const content =
        showThinking();


    await search(
        query,
        content
    );


    input.focus();

}


/* =====================================================
   ENTER
===================================================== */

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   SEND BUTTON
===================================================== */

send.addEventListener(
    "click",
    sendMessage
);


/* =====================================================
   BILDER
===================================================== */

imageInput.addEventListener(
    "change",
    () => {

        if(
            imageInput.files.length > 0
        ){

            const content =
                addAIMessage();


            content.innerHTML = `

                <div class="answer">

                    <div class="answerTitle">
                        Bild ausgewählt
                    </div>

                    <div class="answerText">
                        Das Bild wurde ausgewählt.
                        Eine echte Bildanalyse ist in dieser Version noch nicht angeschlossen.
                    </div>

                </div>

            `;

            scrollDown();

        }

    }
);


/* =====================================================
   NEUER CHAT
===================================================== */

function newChat(){

    chatInner.innerHTML = `

        <div
            id="start"
            class="start"
        >

            <div class="lumora">
                Lumora
            </div>

            <div class="startText">
                Deine kreative KI
            </div>

        </div>

    `;


    input.value = "";

    status.textContent = "";

    chat.scrollTop = 0;

    input.focus();

}


/* =====================================================
   SCROLL
===================================================== */

function scrollDown(){

    setTimeout(
        () => {

            chat.scrollTop =
                chat.scrollHeight;

        },
        50
    );

}

</script>

</body>
</html>
