<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZEROPOINT – Mapper Terrain</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#79caff;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    z-index:20;
    width:340px;
    padding:16px;
    border-radius:15px;
    background:rgba(20,24,28,.9);
    color:white;
}

#title{
    font-size:25px;
    font-weight:bold;
    margin-bottom:12px;
}

.row{
    display:flex;
    gap:8px;
}

input{
    flex:1;
    min-width:0;
    padding:11px;
    border:0;
    border-radius:8px;
    background:#101214;
    color:white;
    font-family:monospace;
}

button{
    border:0;
    border-radius:8px;
    padding:11px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#generate{
    background:#39a852;
}

#export{
    width:100%;
    margin-top:8px;
    background:#2874d8;
}

#info{
    margin-top:10px;
    font-size:13px;
    line-height:1.5;
}

#hint{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    color:white;
    background:#0008;
    padding:9px 14px;
    border-radius:9px;
    pointer-events:none;
}
</style>
</head>

<body>

<div id="ui">

<div id="title">
ZEROPOINT · TERRAIN MAPPER
</div>

<div class="row">
<input id="seed" placeholder="Seed...">
<button id="generate">
Neue Welt
</button>
</div>

<button id="export">
GLB herunterladen
</button>

<div id="info">
Seed: <b id="seedText">-</b><br>
Nur eine zusammenhängende Terrain-Fläche<br>
Keine Bäume · Kein Wasser · Keine Objekte
</div>

</div>

<div id="hint">
Linke Maustaste = 3-D drehen · Mausrad = Zoom · rechte Maustaste = verschieben
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/exporters/GLTFExporter.js"></script>

<script>

// ============================================================
// ZEROPOINT TERRAIN
// EINE EINZIGE GEOMETRIE
// ============================================================

const SIZE = 5000;
const SEGMENTS = 180;

let seed =
    Math.floor(
        Math.random()*2147483647
    );


// ============================================================
// SCENE
// ============================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x79caff
    );

scene.fog =
    new THREE.Fog(
        0x79caff,
        900,
        5000
    );


// ============================================================
// CAMERA
// AUS DEINEM ORIGINAL
// ============================================================

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth/innerHeight,
        .1,
        10000
    );

camera.position.set(
    0,
    500,
    900
);


// ============================================================
// RENDERER
// ============================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.5
    )
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
    renderer.domElement
);


// ============================================================
// LICHT
// ============================================================

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1
    )
);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        1.7
    );

sun.position.set(
    700,
    1200,
    500
);

sun.castShadow=true;

scene.add(sun);


// ============================================================
// CAMERA RIG
// ============================================================

const rig =
    new THREE.Object3D();

scene.add(rig);

rig.add(camera);


// ============================================================
// MAUS
// GENAU DAS 3-D-PRINZIP AUS DEINEM CODE
// ============================================================

let mouseDown=false;

let rotX=-.45;
let rotY=0;

renderer.domElement.addEventListener(
    "mousedown",
    e=>{

        if(e.button===0)
            mouseDown=true;

    }
);

window.addEventListener(
    "mouseup",
    ()=>{
        mouseDown=false;
    }
);

window.addEventListener(
    "mousemove",
    e=>{

        if(!mouseDown)
            return;

        rotY -=
            e.movementX*.003;

        rotX -=
            e.movementY*.003;

        rotX =
            Math.max(
                -1.5,
                Math.min(
                    1.5,
                    rotX
                )
            );

        camera.rotation.x=
            rotX;

        rig.rotation.y=
            rotY;

    }
);


// ============================================================
// ZOOM
// ============================================================

renderer.domElement.addEventListener(
    "wheel",
    e=>{

        e.preventDefault();

        camera.translateZ(
            e.deltaY*.7
        );

        camera.position.z=
            Math.max(
                100,
                Math.min(
                    5000,
                    camera.position.z
                )
            );

    },
    {
        passive:false
    }
);


// ============================================================
// SEED RANDOM
// ============================================================

function hash(x,z){

    let n =
        Math.imul(
            x|0,
            374761393
        ) ^
        Math.imul(
            z|0,
            668265263
        ) ^
        Math.imul(
            seed|0,
            1442695041
        );

    n ^= n>>>13;

    n =
        Math.imul(
            n,
            1274126177
        );

    n ^= n>>>16;

    return (
        n>>>0
    )/4294967295;
}


// ============================================================
// NOISE
// ============================================================

function smooth(t){

    return t*t*(3-2*t);

}

function noise(x,z){

    const x0 =
        Math.floor(x);

    const z0 =
        Math.floor(z);

    const x1=x0+1;
    const z1=z0+1;

    const sx=
        smooth(x-x0);

    const sz=
        smooth(z-z0);

    const a=
        hash(x0,z0);

    const b=
        hash(x1,z0);

    const c=
        hash(x0,z1);

    const d=
        hash(x1,z1);

    const ab=
        a+(b-a)*sx;

    const cd=
        c+(d-c)*sx;

    return (
        ab+(cd-ab)*sz
    );
}


// ============================================================
// FRACTAL NOISE
// ============================================================

function fbm(x,z){

    let value=0;

    let amplitude=.5;

    let frequency=1;

    for(let i=0;i<6;i++){

        value +=
            noise(
                x*frequency,
                z*frequency
            )*
            amplitude;

        frequency*=2;

        amplitude*=.5;
    }

    return value;
}


// ============================================================
// HÖHE
// ============================================================

function getHeight(x,z){

    let h=0;

    // große Berge
    h +=
        (fbm(
            x*.00065,
            z*.00065
        )-.5)
        *380;

    // Hügel
    h +=
        (fbm(
            x*.0018+100,
            z*.0018+200
        )-.5)
        *150;

    // kleine Unebenheiten
    h +=
        (fbm(
            x*.006,
            z*.006
        )-.5)
        *35;

    // zusätzliche Bergketten
    const mountain =
        Math.max(
            0,
            fbm(
                x*.0003+500,
                z*.0003+700
            )-.55
        );

    h +=
        mountain*
        mountain*
        700;

    return h;
}


// ============================================================
// TERRAIN
// WICHTIG:
// EINE EINZIGE PLANE-GEOMETRIE
// KEINE WÜRFEL
// KEINE EINZELNEN FLÄCHEN
// ============================================================

let terrain=null;

function createTerrain(){

    if(terrain){

        scene.remove(
            terrain
        );

        terrain.geometry.dispose();

    }

    const geometry =
        new THREE.PlaneGeometry(
            SIZE,
            SIZE,
            SEGMENTS,
            SEGMENTS
        );

    geometry.rotateX(
        -Math.PI/2
    );

    const positions =
        geometry.attributes.position;

    for(
        let i=0;
        i<positions.count;
        i++
    ){

        const x=
            positions.getX(i);

        const z=
            positions.getZ(i);

        positions.setY(
            i,
            getHeight(
                x,
                z
            )
        );

    }

    geometry.computeVertexNormals();


    // Eine einzige Terrain-Fläche
    const material =
        new THREE.MeshStandardMaterial({

            color:0x4f963f,

            roughness:1,

            metalness:0

        });


    terrain =
        new THREE.Mesh(
            geometry,
            material
        );

    terrain.receiveShadow=true;

    terrain.castShadow=false;

    scene.add(
        terrain
    );
}


// ============================================================
// GENERIEREN
// ============================================================

function generateWorld(){

    createTerrain();

    document.getElementById(
        "seedText"
    ).innerText=
        seed;

    camera.position.set(
        0,
        500,
        900
    );

    rotX=-.45;
    rotY=0;

    camera.rotation.x=
        rotX;

    rig.rotation.y=
        rotY;
}


// ============================================================
// NEUE WELT
// ============================================================

document.getElementById(
    "generate"
).onclick=()=>{

    const text =
        document.getElementById(
            "seed"
        ).value.trim();

    if(text===""){

        seed =
            Math.floor(
                Math.random()*
                2147483647
            );

    }else{

        let n=0;

        for(
            let i=0;
            i<text.length;
            i++
        ){

            n =
                Math.imul(
                    n^text.charCodeAt(i),
                    16777619
                );

        }

        seed =
            Math.abs(n)||1;

    }

    generateWorld();
};


// ============================================================
// GLB EXPORT
// ============================================================

document.getElementById(
    "export"
).onclick=()=>{

    if(!terrain)
        return;

    const exporter =
        new THREE.GLTFExporter();

    exporter.parse(

        terrain,

        result=>{

            const blob =
                new Blob(
                    [result],
                    {
                        type:
                        "model/gltf-binary"
                    }
                );

            const url =
                URL.createObjectURL(
                    blob
                );

            const a =
                document.createElement(
                    "a"
                );

            a.href=url;

            a.download=
                "ZEROPOINT_Terrain_"+
                seed+
                ".glb";

            document.body.appendChild(a);

            a.click();

            a.remove();

            URL.revokeObjectURL(
                url
            );

        },

        error=>{

            console.error(
                error
            );

            alert(
                "GLB-Export fehlgeschlagen."
            );

        },

        {
            binary:true
        }

    );

};


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


// ============================================================
// START
// ============================================================

generateWorld();


// ============================================================
// LOOP
// ============================================================

function animate(){

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>
