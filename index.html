<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kostenloser Tokenizer (Render Web Service)</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f4f8; margin: 0; padding: 40px; color: #2d3748; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin: 0 auto; }
        h1 { margin-top: 0; color: #1a202c; }
        .file-area { border: 2px dashed #cbd5e0; padding: 30px; text-align: center; border-radius: 8px; background: #f7fafc; cursor: pointer; margin-bottom: 20px; }
        .file-area:hover { border-color: #4a5568; background: #edf2f7; }
        input[type="file"] { display: none; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 25px 0; }
        .card { background: #e2e8f0; padding: 20px; border-radius: 8px; text-align: center; }
        .card-val { font-size: 28px; font-weight: bold; color: #2b6cb0; }
        pre { background: #1a202c; color: #e2e8f0; padding: 15px; border-radius: 8px; overflow-x: auto; max-height: 200px; font-size: 13px; }
        .hidden { display: none; }
        .error { color: #e53e3e; font-weight: bold; }
        .status { color: #4a5568; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>Datei Tokenizer</h1>
    <p>Wählen Sie eine <strong>.txt Datei</strong> aus. Die Verarbeitung läuft komplett kostenlos.</p>
    
    <div class="file-area" onclick="document.getElementById('fileInput').click()">
        <span id="fileLabel">Hier klicken, um eine .txt Datei auszuwählen</span>
        <input type="file" id="fileInput" accept=".txt" onchange="handleFile(this)">
    </div>

    <div id="statusMsg" class="status hidden">Datei wird verarbeitet... Bitte warten...</div>
    <div id="errorMsg" class="error hidden"></div>

    <div id="results" class="hidden">
        <div class="stats">
            <div class="card">
                <label>Zeichenanzahl</label>
                <div id="charCount" class="card-val">0</div>
            </div>
            <div class="card">
                <label>Gesamt-Tokens</label>
                <div id="tokenCount" class="card-val">0</div>
            </div>
        </div>

        <h3>Text-Inhalt (Vorschau)</h3>
        <pre id="textView"></pre>

        <h3>Token-Fragmente</h3>
        <pre id="tokenView"></pre>
    </div>
</div>

<script>
    function handleFile(input) {
        const file = input.files[0];
        if (!file) return;

        document.getElementById('fileLabel').textContent = `Ausgewählt: ${file.name}`;
        
        const reader = new FileReader();
        reader.onload = async function(e) {
            await sendToTokenizer(e.target.result);
        };
        reader.readAsText(file);
    }

    async function sendToTokenizer(rawText) {
        const statusMsg = document.getElementById('statusMsg');
        const errorMsg = document.getElementById('errorMsg');
        const results = document.getElementById('results');

        statusMsg.classList.remove('hidden');
        errorMsg.classList.add('hidden');
        results.classList.add('hidden');

        try {
            const response = await fetch('/api/tokenize-text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: rawText })
            });

            const data = await response.json();
            if (!data.success) throw new Error(data.error || 'Fehler beim Tokenisieren.');

            document.getElementById('charCount').textContent = data.characterCount;
            document.getElementById('tokenCount').textContent = data.tokenCount;
            document.getElementById('textView').textContent = data.previewText;
            
            const cleanTokens = data.tokens.map(t => typeof t === 'string' ? t.replace('Ġ', ' ') : t);
            document.getElementById('tokenView').textContent = JSON.stringify(cleanTokens, null, 2);

            results.classList.remove('hidden');
        } catch (err) {
            errorMsg.textContent = "Fehler: " + err.message;
            errorMsg.classList.remove('hidden');
        } finally {
            statusMsg.classList.add('hidden');
        }
    }
</script>

</body>
</html>
