<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Ghost 3D Editor</title>


<style>

/* =====================================================
   GRUNDLAYOUT
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    margin:0;

    overflow:hidden;

    background:#101318;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =====================================================
   THREE.JS CANVAS
===================================================== */

canvas{

    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100%;

    display:block;

    z-index:0;

}


/* =====================================================
   TOPBAR
===================================================== */

#topbar{

    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:70px;

    display:flex;

    align-items:center;

    gap:8px;

    padding:10px 14px;

    background:
        rgba(15,18,24,.97);

    border-bottom:
        1px solid #303640;

    z-index:1000;

    pointer-events:auto;

}


.logo{

    color:white;

    font-size:19px;

    font-weight:bold;

    white-space:nowrap;

    margin-right:10px;

}


.shape-menu,
.transform-menu{

    display:flex;

    align-items:center;

    gap:6px;

}


button{

    font-family:inherit;

    cursor:pointer;

    user-select:none;

}


.shape-btn,
.mode-btn,
.normal-btn,
.plate-btn,
.download-btn{

    border:
        1px solid #3b424d;

    background:#20252d;

    color:#e8edf5;

    padding:
        9px 11px;

    border-radius:7px;

    transition:
        background .15s,
        border-color .15s,
        transform .08s;

}


.shape-btn:hover,
.mode-btn:hover,
.normal-btn:hover,
.plate-btn:hover,
.download-btn:hover{

    background:#303742;

    border-color:#687382;

}


button:active{

    transform:scale(.97);

}


.mode-btn.active{

    background:#315e93;

    border-color:#5a9ce7;

}


.negative{

    color:#ff6879;

}


.separator{

    width:1px;

    height:34px;

    background:#3b424d;

    margin:0 3px;

}


.plate-btn{

    margin-left:auto;

    background:#284c70;

}


.download-btn{

    background:#255b3b;

}


/* =====================================================
   RIGHT BAR
===================================================== */

#rightbar{

    position:fixed;

    right:0;

    top:70px;

    bottom:0;

    width:250px;

    padding:18px;

    background:
        rgba(18,22,28,.97);

    border-left:
        1px solid #303640;

    color:white;

    z-index:1000;

    overflow-y:auto;

    pointer-events:auto;

}


#rightbar h3{

    margin:
        3px 0 10px;

    color:#9da8b7;

    font-size:12px;

    letter-spacing:1px;

}


.brush,
.tool-btn,
.plate-list{

    width:100%;

    margin-bottom:7px;

    padding:10px;

    border:
        1px solid #3a414b;

    border-radius:7px;

    background:#20252d;

    color:white;

    text-align:left;

}


.brush:hover,
.tool-btn:hover,
.plate-list:hover{

    background:#303742;

}


.brush.active,
.plate-list.active{

    background:#315e93;

    border-color:#5797df;

}


.tool-btn.danger{

    color:#ff6978;

}


.separator-line{

    height:1px;

    background:#353b45;

    margin:16px 0;

}


.hint{

    color:#8f99a7;

    font-size:12px;

    line-height:1.5;

}


/* =====================================================
   DIMENSIONS
===================================================== */

#dimensions{

    position:fixed;

    left:15px;
    bottom:15px;

    min-width:315px;

    padding:13px;

    background:
        rgba(15,18,24,.94);

    border:
        1px solid #343b45;

    border-radius:9px;

    color:white;

    z-index:1000;

    pointer-events:none;

}


#objectName{

    font-weight:bold;

    margin-bottom:4px;

}


#plateName{

    color:#8e9aaa;

    font-size:12px;

    margin-bottom:12px;

}


.size-row{

    display:flex;

    gap:25px;

}


.size-row small{

    display:block;

    color:#7f8998;

    font-size:9px;

}


.size-row strong{

    display:block;

    margin-top:3px;

    font-size:13px;

}


#pointCount{

    margin-top:10px;

    color:#7f8998;

    font-size:11px;

}


/* =====================================================
   STATUS
===================================================== */

#status{

    position:fixed;

    left:50%;
    top:84px;

    transform:
        translateX(-50%);

    padding:
        8px 15px;

    background:
        rgba(0,0,0,.68);

    border-radius:20px;

    color:white;

    font-size:12px;

    z-index:1000;

    pointer-events:none;

}


/* =====================================================
   MOUSE CIRCLE
===================================================== */

#mouseCircle{

    position:fixed;

    width:22px;
    height:22px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border:
        2px solid #2495ff;

    border-radius:50%;

    display:none;

    z-index:3000;

    pointer-events:none;

}


#mouseCircle.visible{

    display:block;

}


/* =====================================================
   FEHLER
===================================================== */

#error{

    position:fixed;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:min(650px,90%);

    padding:20px;

    background:#28151a;

    border:
        1px solid #d34b5b;

    border-radius:10px;

    color:#ffb7bf;

    z-index:99999;

    display:none;

    white-space:pre-wrap;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    #topbar{

        height:auto;

        min-height:70px;

        flex-wrap:wrap;

        overflow-y:auto;

    }

    .logo{

        display:none;

    }

    #rightbar{

        width:210px;

    }

}

</style>

<script type="module">


/* =====================================================
   IMPORTS
===================================================== */

import * as THREE
    from "three";


import {
    OrbitControls
}
from
"three/addons/controls/OrbitControls.js";


import {
    TransformControls
}
from
"three/addons/controls/TransformControls.js";


import {
    GLTFExporter
}
from
"three/addons/exporters/GLTFExporter.js";



/* =====================================================
   VARIABLEN
===================================================== */

let scene;

let camera;

let renderer;

let orbit;

let transform;

let raycaster;

let mouse;


let selectedObject = null;

let selectedPlate = null;


let selectionHelper = null;


let mode =
    "translate";


let brushSize =
    0.08;


let sculptMode =
    "raise";


let sculpting =
    false;


const objects = [];

const plates = [];



/* =====================================================
   START
===================================================== */

try{

    init();

}
catch(error){

    console.error(error);

    showError(
        "3D-Editor konnte nicht gestartet werden.\n\n"
        + error.stack
    );

}



/* =====================================================
   INIT
===================================================== */

function init(){


    /* =================================================
       SCENE
    ================================================= */

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x101318
        );


    scene.fog =
        new THREE.Fog(
            0x101318,
            20,
            100
        );



    /* =================================================
       CAMERA
    ================================================= */

    camera =
        new THREE.PerspectiveCamera(

            55,

            innerWidth /
            innerHeight,

            0.01,

            300

        );


    camera.position.set(
        9,
        7,
        10
    );



    /* =================================================
       RENDERER
    ================================================= */

    renderer =
        new THREE.WebGLRenderer({

            antialias:true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(
            devicePixelRatio,
            2
        )

    );


    renderer.setSize(
        innerWidth,
        innerHeight
    );


    renderer.shadowMap.enabled =
        true;


    renderer.domElement.style.zIndex =
        "0";


    document.body.appendChild(
        renderer.domElement
    );



    /* =================================================
       ORBIT
    ================================================= */

    orbit =
        new OrbitControls(

            camera,

            renderer.domElement

        );


    orbit.enableDamping =
        true;


    orbit.dampingFactor =
        0.08;


    orbit.enablePan =
        true;


    orbit.enableZoom =
        true;


    orbit.zoomSpeed =
        0.5;


    orbit.minDistance =
        2;


    orbit.maxDistance =
        60;



    /* =================================================
       TRANSFORM
    ================================================= */

    transform =
        new TransformControls(

            camera,

            renderer.domElement

        );


    transform.setMode(
        "translate"
    );


    transform.setSize(
        1.15
    );


    /*
       WICHTIG:

       Kein getHelper().

       Bei Three.js 0.160.0
       wird das Control selbst
       zur Szene hinzugefügt.
    */

    scene.add(
        transform
    );


    transform.addEventListener(
        "mouseDown",
        function(){

            orbit.enabled =
                false;

        }
    );


    transform.addEventListener(
        "mouseUp",
        function(){

            orbit.enabled =
                true;

            updateInfo();

        }
    );


    transform.addEventListener(
        "objectChange",
        function(){

            updateInfo();

        }
    );



    /* =================================================
       RAYCASTER
    ================================================= */

    raycaster =
        new THREE.Raycaster();


    mouse =
        new THREE.Vector2();



    /* =================================================
       WELT
    ================================================= */

    createLights();

    createGround();

    createPlate();



    /* =================================================
       UI
    ================================================= */

    setupUI();



    /* =================================================
       MOUSE
    ================================================= */

    renderer.domElement.addEventListener(

        "pointerdown",

        canvasPointerDown

    );


    renderer.domElement.addEventListener(

        "pointermove",

        sculptMove

    );


    window.addEventListener(

        "pointerup",

        stopSculpt

    );


    window.addEventListener(

        "resize",

        resize

    );



    /* =================================================
       LOOP
    ================================================= */

    animate();

}



/* =====================================================
   LICHT
===================================================== */

function createLights(){


    const ambient =
        new THREE.HemisphereLight(

            0xffffff,

            0x303030,

            2.4

        );


    scene.add(
        ambient
    );



    const sun =
        new THREE.DirectionalLight(

            0xffffff,

            3

        );


    sun.position.set(
        7,
        12,
        7
    );


    sun.castShadow =
        true;


    scene.add(
        sun
    );

}



/* =====================================================
   BODEN
===================================================== */

function createGround(){


    const ground =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                100,
                100
            ),

            new THREE.MeshStandardMaterial({

                color:
                    0x11151b,

                roughness:
                    1

            })

        );


    ground.rotation.x =
        -Math.PI / 2;


    ground.position.y =
        -0.15;


    scene.add(
        ground
    );



    const grid =
        new THREE.GridHelper(

            100,

            100,

            0x555b64,

            0x292e35

        );


    grid.position.y =
        -0.14;


    scene.add(
        grid
    );

}



/* =====================================================
   PLATTE ERSTELLEN
===================================================== */

function createPlate(){


    const plate =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                8,
                0.2,
                8

            ),

            new THREE.MeshStandardMaterial({

                color:
                    0x252a31,

                roughness:
                    0.8

            })

        );


    const index =
        plates.length;


    plate.position.set(

        (index % 3) * 10 - 10,

        0,

        Math.floor(index / 3) * 10

    );


    plate.userData.isPlate =
        true;


    plate.userData.name =
        "Platte "
        +
        (index + 1);


    plate.userData.objects =
        [];


    plate.receiveShadow =
        true;


    scene.add(
        plate
    );


    plates.push(
        plate
    );


    selectPlate(
        plate
    );


    updatePlateList();


    setStatus(
        plate.userData.name
        +
        " erstellt"
    );

}



/* =====================================================
   OBJEKT ERSTELLEN
===================================================== */

function addObject(
    type,
    negative = false
){


    if(!selectedPlate){

        createPlate();

    }


    let geometry;



    if(type === "sphere"){

        geometry =
            new THREE.SphereGeometry(

                1.3,

                32,

                24

            );

    }



    if(type === "cube"){

        geometry =
            new THREE.BoxGeometry(

                2,
                2,
                2,

                20,
                20,
                20

            );

    }



    if(type === "cylinder"){

        geometry =
            new THREE.CylinderGeometry(

                1.1,

                1.1,

                2.5,

                32,

                20

            );

    }



    const material =
        new THREE.MeshStandardMaterial({

            color:

                negative
                ?
                0xff425b
                :
                0x6d7d91,

            roughness:
                0.55,

            metalness:
                0.12,

            transparent:
                negative,

            opacity:

                negative
                ?
                0.55
                :
                1

        });



    const mesh =
        new THREE.Mesh(

            geometry,

            material

        );



    mesh.position.set(

        selectedPlate.position.x,

        1.3,

        selectedPlate.position.z

    );



    mesh.castShadow =
        true;


    mesh.receiveShadow =
        true;



    mesh.userData.negative =
        negative;


    mesh.userData.plate =
        selectedPlate;


    mesh.userData.name =

        negative

        ?

        "Negativ "
        +
        type

        :

        type;



    scene.add(
        mesh
    );


    objects.push(
        mesh
    );


    selectedPlate
        .userData
        .objects
        .push(
            mesh
        );


    selectObject(
        mesh
    );


    setStatus(
        mesh.userData.name
        +
        " erstellt"
    );

}



/* =====================================================
   CANVAS POINTER
===================================================== */

function canvasPointerDown(
    event
){


    if(event.button !== 0)
        return;


    if(
        transform.dragging
    )
        return;


    if(
        event.shiftKey &&
        selectedObject
    ){

        startSculpt(
            event
        );

        return;

    }


    selectFromMouse(
        event
    );

}



/* =====================================================
   MOUSE AUSWERTEN
===================================================== */

function setMouse(
    event
){


    const rect =
        renderer
            .domElement
            .getBoundingClientRect();


    mouse.x =

        (
            event.clientX
            -
            rect.left
        )
        /
        rect.width
        *
        2
        -
        1;


    mouse.y =

        -(
            (
                event.clientY
                -
                rect.top
            )
            /
            rect.height
        )
        *
        2
        +
        1;

}



/* =====================================================
   OBJEKT AUSWÄHLEN
===================================================== */

function selectFromMouse(
    event
){


    setMouse(
        event
    );


    raycaster.setFromCamera(

        mouse,

        camera

    );



    const hits =
        raycaster.intersectObjects(

            objects,

            false

        );



    if(hits.length){


        const object =
            hits[0].object;


        selectPlate(

            object.userData.plate

        );


        selectObject(
            object
        );


        return;

    }



    const plateHits =
        raycaster.intersectObjects(

            plates,

            false

        );



    if(plateHits.length){


        selectPlate(

            plateHits[0].object

        );


        selectObject(
            null
        );


        return;

    }



    selectObject(
        null
    );

}



/* =====================================================
   OBJEKT AUSWAHL
===================================================== */

function selectObject(
    object
){


    selectedObject =
        object || null;


    transform.detach();



    if(selectionHelper){

        scene.remove(
            selectionHelper
        );

        selectionHelper =
            null;

    }



    if(selectedObject){


        transform.attach(
            selectedObject
        );


        transform.setMode(
            mode
        );



        /*
           GELBE UMrandung
        */

        selectionHelper =
            new THREE.BoxHelper(

                selectedObject,

                0xffff00

            );


        scene.add(
            selectionHelper
        );


        setStatus(
            "Objekt ausgewählt"
        );

    }
    else{

        setStatus(
            "Objekt auswählen"
        );

    }


    updateInfo();

}



/* =====================================================
   PLATTE AUSWÄHLEN
===================================================== */

function selectPlate(
    plate
){


    if(!plate)
        return;


    plates.forEach(

        function(p){

            p.material.color.set(

                p === plate

                ?

                0x315e93

                :

                0x252a31

            );

        }

    );


    selectedPlate =
        plate;


    updatePlateList();

    updateInfo();

}



/* =====================================================
   UI
===================================================== */

function setupUI(){


    addButton(
        "addSphere",
        function(){

            addObject(
                "sphere"
            );

        }
    );


    addButton(
        "addCube",
        function(){

            addObject(
                "cube"
            );

        }
    );


    addButton(
        "addCylinder",
        function(){

            addObject(
                "cylinder"
            );

        }
    );


    addButton(
        "addNegativeSphere",
        function(){

            addObject(
                "sphere",
                true
            );

        }
    );


    addButton(
        "addNegativeCube",
        function(){

            addObject(
                "cube",
                true
            );

        }
    );


    addButton(
        "addNegativeCylinder",
        function(){

            addObject(
                "cylinder",
                true
            );

        }
    );


    addButton(
        "plateBtn",
        createPlate
    );


    addButton(
        "moveMode",
        function(){

            setTransformMode(
                "translate"
            );

        }
    );


    addButton(
        "rotateMode",
        function(){

            setTransformMode(
                "rotate"
            );

        }
    );


    addButton(
        "scaleMode",
        function(){

            setTransformMode(
                "scale"
            );

        }
    );


    addButton(
        "homeBtn",
        focusSelected
    );


    addButton(
        "downloadBtn",
        downloadPlate
    );


    addButton(
        "raiseBtn",
        function(){

            sculptMode =
                "raise";

            setStatus(
                "Modellieren: Erhöhen"
            );

        }
    );


    addButton(
        "lowerBtn",
        function(){

            sculptMode =
                "lower";

            setStatus(
                "Modellieren: Senken"
            );

        }
    );


    addButton(
        "smoothBtn",
        function(){

            sculptMode =
                "smooth";

            setStatus(
                "Modellieren: Glätten"
            );

        }
    );


    addButton(
        "deleteObject",
        deleteObject
    );


    addButton(
        "deletePlate",
        deletePlate
    );



    document
        .querySelectorAll(
            ".brush"
        )
        .forEach(

            function(button){

                button.addEventListener(

                    "click",

                    function(event){

                        event.stopPropagation();


                        document
                            .querySelectorAll(
                                ".brush"
                            )
                            .forEach(

                                function(b){

                                    b.classList
                                        .remove(
                                            "active"
                                        );

                                }

                            );


                        button.classList.add(
                            "active"
                        );


                        brushSize =
                            Number(
                                button.dataset.size
                            );


                        setStatus(

                            "Pinselgröße: "
                            +
                            brushSize

                        );

                    }

                );

            }

        );

}



/* =====================================================
   BUTTON HELPER
===================================================== */

function addButton(
    id,
    callback
){


    const button =
        document.getElementById(
            id
        );


    if(!button){

        console.error(
            "Button fehlt:",
            id
        );

        return;

    }


    button.addEventListener(

        "click",

        function(event){

            event.stopPropagation();

            callback();

        }

    );

}



/* =====================================================
   TRANSFORM MODE
===================================================== */

function setTransformMode(
    newMode
){


    mode =
        newMode;


    transform.setMode(
        newMode
    );


    document
        .querySelectorAll(
            ".mode-btn"
        )
        .forEach(

            function(button){

                button.classList.remove(
                    "active"
                );

            }

        );



    if(
        newMode ===
        "translate"
    ){

        document
            .getElementById(
                "moveMode"
            )
            .classList.add(
                "active"
            );

    }



    if(
        newMode ===
        "rotate"
    ){

        document
            .getElementById(
                "rotateMode"
            )
            .classList.add(
                "active"
            );

    }



    if(
        newMode ===
        "scale"
    ){

        document
            .getElementById(
                "scaleMode"
            )
            .classList.add(
                "active"
            );

    }



    if(selectedObject){

        transform.attach(
            selectedObject
        );

    }


    setStatus(
        newMode === "translate"
        ?
        "Move-Modus"
        :
        newMode === "rotate"
        ?
        "Rotate-Modus"
        :
        "Größe-Modus"
    );

}



/* =====================================================
   SCULPTING
===================================================== */

function startSculpt(
    event
){


    if(
        !selectedObject ||
        transform.dragging
    )
        return;


    if(!event.shiftKey)
        return;


    sculpting =
        true;


    orbit.enabled =
        false;


    transform.detach();


    sculptAt(
        event
    );

}



/* =====================================================
   SCULPT STOP
===================================================== */

function stopSculpt(){


    if(!sculpting)
        return;


    sculpting =
        false;


    orbit.enabled =
        true;


    if(selectedObject){

        transform.attach(
            selectedObject
        );

    }

}



/* =====================================================
   SCULPT MOVE
===================================================== */

function sculptMove(
    event
){


    if(!sculpting)
        return;


    sculptAt(
        event
    );

}



/* =====================================================
   SCULPT
===================================================== */

function sculptAt(
    event
){


    if(!selectedObject)
        return;


    setMouse(
        event
    );


    raycaster.setFromCamera(

        mouse,

        camera

    );


    const hit =
        raycaster.intersectObject(

            selectedObject,

            false

        );


    if(!hit.length)
        return;



    const localPoint =

        selectedObject.worldToLocal(

            hit[0]
                .point
                .clone()

        );



    const position =

        selectedObject
            .geometry
            .getAttribute(
                "position"
            );



    const normal =

        hit[0]
            .face
            .normal
            .clone();



    for(

        let i = 0;

        i < position.count;

        i++

    ){


        const vertex =
            new THREE.Vector3();


        vertex.fromBufferAttribute(

            position,

            i

        );



        const distance =

            vertex.distanceTo(

                localPoint

            );



        if(
            distance >
            brushSize
        )
            continue;



        const strength =

            1
            -
            distance /
            brushSize;



        const amount =

            strength
            *
            strength
            *
            0.025;



        if(
            sculptMode ===
            "raise"
        ){

            vertex.add(

                normal
                    .clone()
                    .multiplyScalar(
                        amount
                    )

            );

        }



        if(
            sculptMode ===
            "lower"
        ){

            vertex.add(

                normal
                    .clone()
                    .multiplyScalar(
                        -amount
                    )

            );

        }



        if(
            sculptMode ===
            "smooth"
        ){

            vertex.multiplyScalar(

                1
                -
                amount
                *
                0.2

            );

        }



        position.setXYZ(

            i,

            vertex.x,

            vertex.y,

            vertex.z

        );

    }



    position.needsUpdate =
        true;


    selectedObject
        .geometry
        .computeVertexNormals();


    selectedObject
        .geometry
        .computeBoundingSphere();



    if(selectionHelper){

        selectionHelper.update();

    }


    updateInfo();

}



/* =====================================================
   HOME
===================================================== */

function focusSelected(){


    let target;



    if(selectedObject){


        const box =

            new THREE.Box3()
                .setFromObject(
                    selectedObject
                );


        target =

            box.getCenter(
                new THREE.Vector3()
            );

    }
    else if(selectedPlate){

        target =
            selectedPlate
                .position
                .clone();

    }
    else{

        target =
            new THREE.Vector3();

    }



    const direction =

        new THREE.Vector3(
            1,
            .65,
            1
        ).normalize();



    camera.position.copy(

        target
            .clone()
            .add(

                direction.multiplyScalar(

                    selectedObject
                    ?
                    5
                    :
                    9

                )

            )

    );


    orbit.target.copy(
        target
    );


    orbit.update();


    setStatus(
        "Kamera fokussiert"
    );

}



/* =====================================================
   INFO
===================================================== */

function updateInfo(){


    document.getElementById(
        "plateName"
    ).textContent =

        selectedPlate

        ?

        selectedPlate
            .userData
            .name

        :

        "Keine Platte";



    if(!selectedObject){


        document.getElementById(
            "objectName"
        ).textContent =
            "Kein Objekt ausgewählt";


        document.getElementById(
            "width"
        ).textContent =
            "0 mm";


        document.getElementById(
            "height"
        ).textContent =
            "0 mm";


        document.getElementById(
            "depth"
        ).textContent =
            "0 mm";


        document.getElementById(
            "pointCount"
        ).textContent =
            "0 Punkte";


        return;

    }



    selectedObject.updateMatrixWorld(
        true
    );



    const box =

        new THREE.Box3()
            .setFromObject(
                selectedObject
            );



    const size =

        box.getSize(
            new THREE.Vector3()
        );



    const mm =
        10;



    document.getElementById(
        "objectName"
    ).textContent =

        selectedObject
            .userData
            .name;



    document.getElementById(
        "width"
    ).textContent =

        (
            size.x *
            mm
        ).toFixed(1)
        +
        " mm";



    document.getElementById(
        "height"
    ).textContent =

        (
            size.y *
            mm
        ).toFixed(1)
        +
        " mm";



    document.getElementById(
        "depth"
    ).textContent =

        (
            size.z *
            mm
        ).toFixed(1)
        +
        " mm";



    document.getElementById(
        "pointCount"
    ).textContent =

        selectedObject
            .geometry
            .getAttribute(
                "position"
            )
            .count
        +
        " Punkte";

}



/* =====================================================
   PLATTENLISTE
===================================================== */

function updatePlateList(){


    const list =
        document.getElementById(
            "plates"
        );


    list.innerHTML = "";



    plates.forEach(

        function(plate){


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "plate-list";



            if(
                plate ===
                selectedPlate
            ){

                button.classList.add(
                    "active"
                );

            }



            button.textContent =

                plate
                    .userData
                    .name;



            button.addEventListener(

                "click",

                function(event){

                    event.stopPropagation();


                    selectPlate(
                        plate
                    );


                    selectObject(
                        null
                    );


                    focusSelected();

                }

            );



            list.appendChild(
                button
            );

        }

    );

}



/* =====================================================
   OBJEKT LÖSCHEN
===================================================== */

function deleteObject(){


    if(!selectedObject)
        return;



    const object =
        selectedObject;



    const index =
        objects.indexOf(
            object
        );



    if(index >= 0){

        objects.splice(
            index,
            1
        );

    }



    const list =
        object
            .userData
            .plate
            .userData
            .objects;



    const objectIndex =
        list.indexOf(
            object
        );



    if(objectIndex >= 0){

        list.splice(
            objectIndex,
            1
        );

    }



    transform.detach();



    if(selectionHelper){

        scene.remove(
            selectionHelper
        );

        selectionHelper =
            null;

    }



    scene.remove(
        object
    );


    object.geometry.dispose();

    object.material.dispose();


    selectedObject =
        null;


    updateInfo();


    setStatus(
        "Objekt gelöscht"
    );

}



/* =====================================================
   PLATTE LÖSCHEN
===================================================== */

function deletePlate(){


    if(
        !selectedPlate ||
        plates.length <= 1
    ){

        setStatus(
            "Mindestens eine Platte muss bleiben"
        );

        return;

    }



    selectedPlate
        .userData
        .objects
        .slice()
        .forEach(

            function(object){


                const index =
                    objects.indexOf(
                        object
                    );


                if(index >= 0){

                    objects.splice(
                        index,
                        1
                    );

                }


                scene.remove(
                    object
                );


                object.geometry.dispose();

                object.material.dispose();

            }

        );



    const index =
        plates.indexOf(
            selectedPlate
        );


    if(index >= 0){

        plates.splice(
            index,
            1
        );

    }



    scene.remove(
        selectedPlate
    );


    selectedPlate.geometry.dispose();

    selectedPlate.material.dispose();



    selectedPlate =
        plates[0];


    selectPlate(
        selectedPlate
    );


    selectObject(
        null
    );


    setStatus(
        "Platte gelöscht"
    );

}



/* =====================================================
   GLB EXPORT
===================================================== */

async function downloadPlate(){


    if(!selectedPlate){

        alert(
            "Bitte zuerst eine Platte auswählen."
        );

        return;

    }



    const exportScene =
        new THREE.Scene();


    const group =
        new THREE.Group();


    group.name =
        selectedPlate
            .userData
            .name;



    const plate =
        selectedPlate.clone(
            true
        );


    plate.material =
        new THREE.MeshStandardMaterial({

            color:
                0x777777,

            roughness:
                0.8

        });


    group.add(
        plate
    );



    selectedPlate
        .userData
        .objects
        .forEach(

            function(object){


                const clone =
                    object.clone(
                        true
                    );


                clone.material =

                    new THREE.MeshStandardMaterial({

                        color:

                            object
                                .userData
                                .negative

                            ?

                            0xff4055

                            :

                            0x7188aa,

                        roughness:
                            0.55

                    });


                group.add(
                    clone
                );

            }

        );



    exportScene.add(
        group
    );



    const exporter =
        new GLTFExporter();



    try{


        const data =
            await exporter.parseAsync(

                exportScene,

                {

                    binary:
                        true,

                    onlyVisible:
                        true

                }

            );



        const blob =
            new Blob(

                [data],

                {

                    type:
                        "model/gltf-binary"

                }

            );



        const url =
            URL.createObjectURL(
                blob
            );



        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;


        a.download =

            selectedPlate
                .userData
                .name
                .replace(
                    /[^a-z0-9]/gi,
                    "_"
                )
            +
            ".glb";



        document.body.appendChild(
            a
        );


        a.click();


        a.remove();



        setTimeout(

            function(){

                URL.revokeObjectURL(
                    url
                );

            },

            1000

        );



        setStatus(
            "GLB exportiert"
        );


    }
    catch(error){


        console.error(
            error
        );


        alert(
            "GLB-Export fehlgeschlagen."
        );

    }

}



/* =====================================================
   RESIZE
===================================================== */

function resize(){


    camera.aspect =

        innerWidth /
        innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        innerWidth,

        innerHeight

    );

}



/* =====================================================
   STATUS
===================================================== */

function setStatus(
    text
){


    document.getElementById(
        "status"
    ).textContent =
        text;

}



/* =====================================================
   ERROR
===================================================== */

function showError(
    text
){


    const element =
        document.getElementById(
            "error"
        );


    element.textContent =
        text;


    element.style.display =
        "block";

}



/* =====================================================
   ANIMATION
===================================================== */

function animate(){


    requestAnimationFrame(
        animate
    );


    orbit.update();



    if(selectionHelper){

        selectionHelper.update();

    }



    renderer.render(

        scene,

        camera

    );

}
