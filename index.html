<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Video zu MP3</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #303078,
            #15152d 45%,
            #080810
        );

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

}

.app {

    width: min(
        700px,
        94vw
    );

    padding: 25px;

}

h1 {

    text-align: center;

    font-size: 42px;

    margin-bottom: 8px;

}

.subtitle {

    text-align: center;

    color: #b5b5d0;

    margin-bottom: 30px;

}

.card {

    background:
        rgba(
            25,
            25,
            45,
            .9
        );

    border:

        1px solid
        rgba(
            255,
            255,
            255,
            .1
        );

    border-radius: 25px;

    padding: 25px;

    box-shadow:

        0 25px 80px
        rgba(
            0,
            0,
            0,
            .5
        );

}

.dropzone {

    min-height: 270px;

    border:

        3px dashed
        #7777ff;

    border-radius: 20px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    cursor: pointer;

    transition: .2s;

    padding: 20px;

}

.dropzone:hover {

    border-color: #b0b0ff;

    background:
        rgba(
            100,
            100,
            255,
            .08
        );

}

.dropzone.drag {

    border-color: white;

    background:
        rgba(
            120,
            100,
            255,
            .2
        );

}

.icon {

    font-size: 70px;

}

.dropzone h2 {

    text-align: center;

}

.dropzone p {

    color: #aaaac5;

    text-align: center;

}

input {

    display: none;

}

.fileInfo {

    display: none;

    margin-top: 20px;

    padding: 18px;

    border-radius: 15px;

    background:
        rgba(
            0,
            0,
            0,
            .3
        );

}

.fileName {

    font-weight: bold;

    word-break: break-word;

}

.fileSize {

    color: #aaaac5;

    margin-top: 8px;

}

button {

    width: 100%;

    margin-top: 20px;

    padding: 18px;

    border: none;

    border-radius: 15px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    color: white;

    background:

        linear-gradient(
            90deg,
            #635bff,
            #a35bff
        );

    transition: .2s;

}

button:hover {

    transform:
        translateY(-2px);

    filter:
        brightness(1.15);

}

button:disabled {

    opacity: .5;

    cursor: not-allowed;

    transform: none;

}

.status {

    display: none;

    margin-top: 20px;

    padding: 15px;

    text-align: center;

    border-radius: 12px;

}

.status.loading {

    display: block;

    background:
        rgba(
            100,
            100,
            255,
            .15
        );

}

.status.error {

    display: block;

    background:
        rgba(
            255,
            60,
            60,
            .2
        );

}

.status.success {

    display: block;

    background:
        rgba(
            50,
            255,
            130,
            .15
        );

}

.spinner {

    display: inline-block;

    width: 18px;

    height: 18px;

    border:

        3px solid
        rgba(
            255,
            255,
            255,
            .3
        );

    border-top-color: white;

    border-radius: 50%;

    animation:
        spin .8s linear infinite;

    vertical-align: middle;

    margin-right: 8px;

}

@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}

.footer {

    text-align: center;

    color: #777790;

    margin-top: 20px;

    font-size: 13px;

}

</style>

</head>


<body>

<div class="app">

    <h1>
        🎵 Video zu MP3
    </h1>

    <div class="subtitle">

        Lade ein Video hoch und
        konvertiere die Audiospur
        in eine MP3-Datei.

    </div>


    <div class="card">


        <div
            class="dropzone"
            id="dropzone"
        >

            <div class="icon">
                🎬
            </div>

            <h2>
                Video auswählen
            </h2>

            <p>

                Klicke hier oder ziehe
                eine Videodatei hier hinein

            </p>

            <input
                type="file"
                id="fileInput"
                accept="video/*"
            >

        </div>


        <div
            class="fileInfo"
            id="fileInfo"
        >

            <div
                class="fileName"
                id="fileName"
            ></div>

            <div
                class="fileSize"
                id="fileSize"
            ></div>

        </div>


        <button
            id="convertButton"
            disabled
        >

            🎵 In MP3 konvertieren

        </button>


        <div
            class="status"
            id="status"
        ></div>


    </div>


    <div class="footer">

        Video → Audio → MP3

    </div>

</div>


<script>

const dropzone =
    document.getElementById(
        "dropzone"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );

const fileInfo =
    document.getElementById(
        "fileInfo"
    );

const fileName =
    document.getElementById(
        "fileName"
    );

const fileSize =
    document.getElementById(
        "fileSize"
    );

const convertButton =
    document.getElementById(
        "convertButton"
    );

const status =
    document.getElementById(
        "status"
    );


let selectedFile = null;


// Datei auswählen

dropzone.addEventListener(
    "click",
    () => {

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    () => {

        if (
            fileInput.files.length
        ) {

            selectFile(
                fileInput.files[0]
            );

        }

    }
);


// Drag & Drop

dropzone.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

        dropzone.classList.add(
            "drag"
        );

    }
);


dropzone.addEventListener(
    "dragleave",
    () => {

        dropzone.classList.remove(
            "drag"
        );

    }
);


dropzone.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        dropzone.classList.remove(
            "drag"
        );

        const file =
            event.dataTransfer.files[0];

        if (file) {

            selectFile(file);

        }

    }
);


// Datei setzen

function selectFile(file) {

    selectedFile = file;

    fileName.textContent =
        "📁 " + file.name;

    fileSize.textContent =
        formatSize(file.size);

    fileInfo.style.display =
        "block";

    convertButton.disabled =
        false;

    status.className =
        "status";

    status.innerHTML =
        "";

}


// Größe

function formatSize(bytes) {

    if (
        bytes < 1024
    ) {
        return bytes + " Bytes";
    }

    if (
        bytes < 1024 * 1024
    ) {
        return (
            bytes / 1024
        ).toFixed(1)
        + " KB";
    }

    return (
        bytes /
        (1024 * 1024)
    ).toFixed(1)
    + " MB";

}


// Konvertierung

convertButton.addEventListener(
    "click",
    async () => {

        if (
            !selectedFile
        ) {
            return;
        }


        convertButton.disabled =
            true;


        status.className =
            "status loading";


        status.innerHTML =
            '<span class="spinner"></span>' +
            "Video wird hochgeladen und konvertiert...";


        const formData =
            new FormData();


        formData.append(
            "video",
            selectedFile
        );


        try {


            const response =
                await fetch(
                    "/convert",
                    {
                        method:
                            "POST",

                        body:
                            formData
                    }
                );


            if (
                !response.ok
            ) {

                let message =
                    "Konvertierung fehlgeschlagen.";

                try {

                    const data =
                        await response.json();

                    if (
                        data.error
                    ) {
                        message =
                            data.error;
                    }

                } catch (error) {}

                throw new Error(
                    message
                );

            }


            const blob =
                await response.blob();


            const url =
                URL.createObjectURL(
                    blob
                );


            const a =
                document.createElement(
                    "a"
                );


            const originalName =
                selectedFile.name.replace(
                    /\.[^/.]+$/,
                    ""
                );


            a.href =
                url;


            a.download =
                originalName +
                ".mp3";


            document.body.appendChild(
                a
            );


            a.click();


            a.remove();


            URL.revokeObjectURL(
                url
            );


            status.className =
                "status success";


            status.innerHTML =
                "✅ Fertig! Die MP3-Datei wurde heruntergeladen.";


        } catch (error) {


            console.error(
                error
            );


            status.className =
                "status error";


            status.innerHTML =
                "❌ " +
                error.message;


        } finally {


            convertButton.disabled =
                false;


        }

    }
);

</script>

</body>
</html>
