<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet-Scraper KI</title>
    <style>
        body { font-family: sans-serif; background: #121214; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #202024; padding: 30px; border-radius: 10px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); width: 350px; }
        input[type="text"] { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #444; background: #121214; color: white; box-sizing: border-box; }
        button { border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; margin-bottom: 10px; color: white; }
        .btn-predict { background: #8257e5; }
        .btn-predict:hover { background: #9466ff; }
        .btn-download { background: #20b2aa; }
        .btn-download:hover { background: #1c9690; }
        .btn-scrape { background: #007acd; }
        .btn-scrape:hover { background: #0098ff; }
        .upload-section { margin-top: 15px; padding-top: 15px; border-top: 1px solid #444; }
        #output { margin-top: 20px; font-weight: bold; color: #04d361; min-height: 40px; white-space: pre-line; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Internet KI-Scraper</h1>
        <input type="text" id="userInput" value="ki " placeholder="Satzanfang eingeben...">
        
        <button onclick="fragKI()" class="btn-predict">Satz vervollständigen</button>
        <button onclick="starteInternetSuche()" class="btn-scrape">🌐 Internet durchsuchen & lernen</button>
        <button onclick="downloadKI()" class="btn-download">KI-Daten herunterladen (1.json)</button>
        
        <div id="output">Die KI sucht beim Start automatisch nach echten Internet-Daten!</div>
    </div>

    <script>
        async function fragKI() {
            const inputFeld = document.getElementById('userInput').value;
            const status = document.getElementById('output');
            status.innerText = 'KI denkt nach...';
            try {
                const response = await fetch(`/api/predict?text=${encodeURIComponent(inputFeld)}`);
                const data = await response.json();
                status.innerText = `KI ergänzt: "${data.vorhersage}"`;
            } catch (error) {
                status.innerText = 'Fehler beim Abrufen der KI-Daten.';
            }
        }

        async function starteInternetSuche() {
            const status = document.getElementById('output');
            status.innerText = 'Durchsuche das Web nach echten Daten und trainiere das Modell...\n(Das kann 30-60 Sek. dauern)';
            try {
                const response = await fetch('/api/auto-learn', { method: 'POST' });
                const data = await response.json();
                status.innerText = `🎉 Fertig gelernt!\n\nAktuelle Lerndaten:\n- ` + data.daten.slice(0, 3).join('\n- ') + '\n... und mehr!';
            } catch (error) {
                status.innerText = 'Fehler beim automatischen Online-Lernen.';
            }
        }

        function downloadKI() {
            window.location.href = '/api/download-ki';
        }
    </script>
</body>
</html>
