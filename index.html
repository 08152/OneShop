<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokale Musik-KI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 400px;
        }
        button {
            background: #1db954;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #1ed760;
            transform: scale(1.05);
        }
        .playlist {
            margin-top: 20px;
            text-align: left;
            background: #282828;
            border-radius: 8px;
            padding: 10px;
        }
        .song-item {
            padding: 8px;
            border-bottom: 1px solid #3e3e3e;
            font-size: 14px;
        }
        .song-item.active {
            color: #1db954;
            font-weight: bold;
        }
        audio {
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Musik-KI</h1>
    <p>Generiere Playlists aus deinen lokalen MP3s</p>
    <button onclick="generateAIPlaylist()">KI-Playlist generieren</button>
    
    <audio id="audioPlayer" controls></audio>
    
    <div class="playlist" id="playlistContainer" style="display: none;">
        <h3>KI Vorhersage-Reihenfolge:</h3>
        <div id="tracksList"></div>
    </div>
</div>

<script>
    let currentPlaylist = [];
    let currentTrackIndex = 0;
    const player = document.getElementById('audioPlayer');

    async function generateAIPlaylist() {
        const response = await fetch('/api/generate-playlist');
        const data = await response.json();

        if (data.error) {
            alert(data.error);
            return;
        }

        currentPlaylist = data;
        currentTrackIndex = 0;
        
        renderPlaylist();
        playTrack(currentTrackIndex);
    }

    function renderPlaylist() {
        const container = document.getElementById('playlistContainer');
        const list = document.getElementById('tracksList');
        container.style.display = 'block';
        list.innerHTML = '';

        currentPlaylist.forEach((track, index) => {
            const div = document.createElement('div');
            div.className = `song-item ${index === currentTrackIndex ? 'active' : ''}`;
            div.innerText = `${index + 1}. ${track.artist} - ${track.title} (${track.genre})`;
            list.appendChild(div);
        });
    }

    function playTrack(index) {
        if (index >= currentPlaylist.length) return;
        
        currentTrackIndex = index;
        renderPlaylist();
        
        player.src = `/tracks/${encodeURIComponent(currentPlaylist[index].filename)}`;
        player.play();
    }

    // Automatisch nächsten KI-Song spielen, wenn der aktuelle endet
    player.onended = () => {
        if (currentTrackIndex + 1 < currentPlaylist.length) {
            playTrack(currentTrackIndex + 1);
        } else {
            // Wenn Playlist vorbei, neue generieren
            generateAIPlaylist();
        }
    };
</script>

</body>
</html>
