<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost 3D Modeler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="topbar">
        <div class="logo">GHOST 3D</div>

        <div class="object-buttons">
            <button class="object-btn" id="addSphere" title="Kugel">
                <span class="sphere-icon"></span>
            </button>

            <button class="object-btn" id="addCube" title="Quadrat / Würfel">
                <span class="cube-icon"></span>
            </button>

            <button class="object-btn" id="addCylinder" title="Zylinder">
                <span class="cylinder-icon"></span>
            </button>
        </div>

        <div class="mode-buttons">
            <button id="moveMode" class="mode active">↔ Bewegen</button>
            <button id="rotateMode" class="mode">⟳ Drehen</button>
            <button id="scaleMode" class="mode">↗ Skalieren</button>
        </div>
    </div>

    <div id="rightbar">
        <h3>PINSEL</h3>

        <button class="brush active" data-size="0.15">
            <span class="brush-dot tiny"></span>
            Fein
        </button>

        <button class="brush" data-size="0.45">
            <span class="brush-dot medium"></span>
            Kleiner
        </button>

        <button class="brush" data-size="0.9">
            <span class="brush-dot large"></span>
            Groß
        </button>

        <hr>

        <h3>MODELLIEREN</h3>

        <button id="raiseBrush" class="sculpt">
            ⬆ Erhöhen
        </button>

        <button id="lowerBrush" class="sculpt">
            ⬇ Senken
        </button>

        <button id="smoothBrush" class="sculpt">
            ≈ Glätten
        </button>

        <hr>

        <button id="deleteObject" class="danger">
            🗑 Löschen
        </button>

        <button id="clearScene">
            Szene leeren
        </button>
    </div>

    <div id="bottom-info">
        <span id="selectedInfo">Kein Objekt ausgewählt</span>
        <span id="vertexInfo">0 Punkte</span>
    </div>

    <div id="help">
        <b>Steuerung</b><br>
        Linksklick = Objekt auswählen<br>
        Ziehen = aktuelles Werkzeug<br>
        Rechtsklick = Kamera drehen<br>
        Mausrad = Zoom
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
