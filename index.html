<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Kugel Plattform - Render</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 100;
        }
    </style>
    <!-- Three.js und Socket.io über CDN laden -->
    <script src="https://cloudflare.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="info">
        <strong>Steuerung:</strong><br>
        W, A, S, D = Bewegen<br>
        Maus bewegen = Kamera drehen<br>
        Klick ins Fenster = Maus sperren
    </div>

    <script>
        // Automatische Verbindung zur Render-Domain herstellen
        const socket = io(window.location.origin);

        // 1. Szene, Kamera und Renderer aufsetzen
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.FogExp2(0x1a1a2e, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Licht hinzufügen
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // 3. Große runde Plattform erstellen
        const platformRadius = 50;
        const floorGeo = new THREE.CylinderGeometry(platformRadius, platformRadius, 2, 64);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x222831, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = -1; // Oberfläche auf Höhe 0 bringen
        floor.receiveShadow = true;
        scene.add(floor);

        // Raster für Geschwindigkeitsgefühl
        const grid = new THREE.GridHelper(platformRadius * 2, 50, 0x00adb5, 0x393e46);
        grid.position.y = 0.01;
        scene.add(grid);

        // 4. Spieler (Kugel) erstellen
        const playerRadius = 1;
        const playerGeo = new THREE.SphereGeometry(playerRadius, 32, 32);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x00adb5, roughness: 0.2, metalness: 0.5 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, playerRadius, 0); 
        player.castShadow = true;
        scene.add(player);

        // 5. Steuerung & Kamera-Variablen
        const keys = { w: false, a: false, s: false, d: false };
        const moveSpeed = 0.15;
        
        let cameraYaw = 0;
        let cameraPitch = -0.3; 
        const cameraDistance = 8;

        // Tastatur-Events
        window.addEventListener('keydown', (e) => {
            if(e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', (e) => {
            if(e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
        });

        // Maussteuerung aktivieren
        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        window.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                cameraYaw -= e.movementX * 0.002;
                cameraPitch -= e.movementY * 0.002;
                cameraPitch = Math.max(-Math.PI/3, Math.min(Math.PI/6, cameraPitch));
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 6. Game Loop
        function animate() {
            requestAnimationFrame(animate);

            let moveX = 0;
            let moveZ = 0;

            if (keys.w) { moveX += Math.sin(cameraYaw); moveZ += Math.cos(cameraYaw); }
            if (keys.s) { moveX -= Math.sin(cameraYaw); moveZ -= Math.cos(cameraYaw); }
            if (keys.a) { moveX += Math.sin(cameraYaw + Math.PI / 2); moveZ += Math.cos(cameraYaw + Math.PI / 2); }
            if (keys.d) { moveX -= Math.sin(cameraYaw + Math.PI / 2); moveZ -= Math.cos(cameraYaw + Math.PI / 2); }

            // Bewegung und echtes 3D-Rollen berechnen
            if (moveX !== 0 || moveZ !== 0) {
                const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
                player.position.x += (moveX / length) * moveSpeed;
                player.position.z += (moveZ / length) * moveSpeed;

                player.rotation.z -= (moveX / length) * moveSpeed / playerRadius;
                player.rotation.x += (moveZ / length) * moveSpeed / playerRadius;
            }

            // Runde Plattform-Grenze einhalten
            const distanceFromCenter = Math.sqrt(player.position.x ** 2 + player.position.z ** 2);
            if (distanceFromCenter > platformRadius - playerRadius) {
                const angle = Math.atan2(player.position.z, player.position.x);
                player.position.x = Math.cos(angle) * (platformRadius - playerRadius);
                player.position.z = Math.sin(angle) * (platformRadius - playerRadius);
            }

            // Third-Person Kamera hinter Spieler positionieren
            const targetCamX = player.position.x + cameraDistance * Math.sin(cameraYaw) * Math.cos(cameraPitch);
            const targetCamY = player.position.y - cameraDistance * Math.sin(cameraPitch) + 1;
            const targetCamZ = player.position.z + cameraDistance * Math.cos(cameraYaw) * Math.cos(cameraPitch);

            camera.position.x += (targetCamX - camera.position.x) * 0.1;
            camera.position.y += (targetCamY - camera.position.y) * 0.1;
            camera.position.z += (targetCamZ - camera.position.z) * 0.1;
            
            camera.lookAt(player.position.x, player.position.y + 0.5, player.position.z);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
